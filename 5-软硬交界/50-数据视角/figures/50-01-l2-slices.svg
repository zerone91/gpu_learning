<text x="480" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold" >L2 切成许多 slice：普通访问被哈希撒开，同一地址的原子操作只能在一个 slice 排队</text>
<text x="480" y="54" font-size="15" text-anchor="middle" fill="#666666" font-weight="normal" >示意：画 8 个 SM、16 个 slice（H100 实际有 132 个 SM、几十个 slice）</text>
<text x="40" y="90" font-size="16" text-anchor="start" fill="#222222" font-weight="bold" >A. 普通读写：连续地址经过哈希，散到所有 slice，16 个 slice 一起干活（下排小方框 = slice）</text>
