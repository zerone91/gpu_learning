<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" font-family="sans-serif">
<rect x="0" y="0" width="960" height="850" fill="#ffffff"/>
<defs><marker id="ah-1f6fb2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker><marker id="ahs-1f6fb2" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker><marker id="ah-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahs-c0392b" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<text x="480" y="30" font-size="19" text-anchor="middle" fill="#222222" font-weight="bold" >一批训练数据从磁盘到显存：五跳，其中三跳是 CPU 在干活</text>
<line x1="40" y1="60" x2="70" y2="60" stroke="#1f6fb2" stroke-width="4"/>
<text x="78" y="65" font-size="15" text-anchor="start" fill="#666666" font-weight="normal" >硬件 DMA 引擎搬运（不占 CPU）</text>
<line x1="340" y1="60" x2="370" y2="60" stroke="#c0392b" stroke-width="4"/>
<text x="378" y="65" font-size="15" text-anchor="start" fill="#666666" font-weight="normal" >CPU 亲自干的活</text>
<line x1="530" y1="60" x2="560" y2="60" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/>
<text x="568" y="65" font-size="15" text-anchor="start" fill="#666666" font-weight="normal" >可以省掉的 CPU 拷贝</text>
<rect x="120" y="198" width="330" height="467" rx="4" fill="#fbfbfb" stroke="#666666" stroke-width="1.5" stroke-dasharray="8 4" />
<text x="128" y="214" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >主机内存</text>
<rect x="150" y="95" width="270" height="56" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="285.0" y="119" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold" >NVMe 固态盘</text>
<text x="285.0" y="140" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >文件（例如压缩的原始视频）</text>
<rect x="150" y="220" width="270" height="56" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="285.0" y="244" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold" >页缓存（内核）</text>
<text x="285.0" y="265" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >操作系统的文件缓存</text>
<rect x="150" y="345" width="270" height="56" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="285.0" y="369" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold" >用户态缓冲</text>
<text x="285.0" y="390" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >DataLoader worker 的内存</text>
<rect x="150" y="470" width="270" height="56" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="285.0" y="494" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold" >张量（可分页内存）</text>
<text x="285.0" y="515" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >解码、分词之后的结果</text>
<rect x="150" y="595" width="270" height="56" rx="4" fill="#e0f2e7" stroke="#444444" stroke-width="1.5" />
<text x="285.0" y="619" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold" >锁页缓冲</text>
<text x="285.0" y="640" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >物理地址固定，DMA 可以直接搬</text>
<rect x="150" y="720" width="270" height="56" rx="4" fill="#e3eef9" stroke="#444444" stroke-width="1.5" />
<text x="285.0" y="744" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold" >显存 HBM</text>
<text x="285.0" y="765" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >从这里接上本模块第 1 节</text>
<line x1="285.0" y1="153" x2="285.0" y2="218" stroke="#1f6fb2" stroke-width="4" marker-end="url(#ah-1f6fb2)"/>
<text x="470" y="179" font-size="16" text-anchor="start" fill="#1f6fb2" font-weight="bold" >① 盘的 DMA 引擎经 PCIe 写进内存（第 1 次跨 PCIe）</text>
<text x="470" y="203" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >搬运者：NVMe 控制器，不占 CPU</text>
<line x1="285.0" y1="278" x2="285.0" y2="343" stroke="#c0392b" stroke-width="4" marker-end="url(#ah-c0392b)"/>
<text x="470" y="304" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold" >② read 系统调用：CPU 拷贝一次</text>
<text x="470" y="328" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >搬运者：CPU</text>
<line x1="285.0" y1="403" x2="285.0" y2="468" stroke="#c0392b" stroke-width="4" marker-end="url(#ah-c0392b)"/>
<text x="470" y="429" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold" >③ 预处理：解压、解码、分词、数据增强、拼成张量</text>
<text x="470" y="453" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >搬运者：CPU。解一批 JPEG 或视频帧可以吃掉几十个核，常是最慢的一步</text>
<line x1="285.0" y1="528" x2="285.0" y2="593" stroke="#c0392b" stroke-width="4" stroke-dasharray="6 4" marker-end="url(#ah-c0392b)"/>
<text x="470" y="554" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold" >④ 驱动先把它拷进内部的锁页缓冲（CPU 拷贝）</text>
<text x="470" y="578" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >pin_memory=True 让 ③ 直接写进锁页内存，这一跳就没有了</text>
<line x1="285.0" y1="653" x2="285.0" y2="718" stroke="#1f6fb2" stroke-width="4" marker-end="url(#ah-1f6fb2)"/>
<text x="470" y="679" font-size="16" text-anchor="start" fill="#1f6fb2" font-weight="bold" >⑤ GPU 的 copy engine 经 PCIe 搬进显存（第 2 次跨 PCIe）</text>
<text x="470" y="703" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >搬运者：copy engine，可以和 kernel 同时进行</text>
<text x="480" y="816" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal" >数据在主机内存里至少落地一次，还要过两次 PCIe；GPUDirect Storage 省掉的就是中间这一段（见图 3-7）。</text>
</svg>
