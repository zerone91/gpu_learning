<text x="480" y="30" font-size="19" text-anchor="middle" fill="#222222" font-weight="bold" >paged KV cache：逻辑上连续的序列，物理上散落在各页，靠一张页表翻译</text>
<text x="40" y="72" font-size="16" text-anchor="start" fill="#222222" font-weight="bold" >① 请求 A 已生成 700 个 token，按每页 16 个切成 ⌈700/16⌉ = 44 页（逻辑上连续）</text>
