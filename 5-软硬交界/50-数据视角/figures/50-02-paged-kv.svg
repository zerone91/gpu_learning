<text x="380" y="495" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >橙色 = 请求 A 的页（A0 即 A 的逻辑页 0），蓝色 = 其他请求 B、C 的页。</text>
<text x="380" y="515" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >A 的第 0、1、2 页分别在 #7、#2、#13，物理上互不相邻。</text>
<text x="40" y="565" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >读 KV 时，attention kernel 先查页表“逻辑页 0 → 物理页 7”，再去 #7 取数：多一次间接寻址。</text>
<text x="40" y="591" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >换来的是：请求生成一页才占一页，结束就还回去，不用为最长可能长度预留一整段连续显存。</text>
