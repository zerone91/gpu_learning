<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5451b"/></marker><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
<text x="500" y="30" font-size="18" text-anchor="middle" fill="#111" font-weight="bold" >CXL 内存扩展：一次读要两次穿过串行 PHY</text>
<rect x="20" y="60" width="330" height="220" rx="4" fill="#fafafa" stroke="#666" stroke-width="1.8" stroke-dasharray="7 5" />
<text x="36" y="84" font-size="15" text-anchor="start" fill="#444" font-weight="normal" >主机 CPU</text>
<rect x="560" y="60" width="330" height="220" rx="4" fill="#fafafa" stroke="#666" stroke-width="1.8" stroke-dasharray="7 5" />
<text x="576" y="84" font-size="15" text-anchor="start" fill="#444" font-weight="normal" >CXL 内存扩展设备里的控制器芯片</text>
<rect x="36" y="110" width="80" height="120" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.8" />
<text x="76.0" y="165.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >核心</text>
<text x="76.0" y="184.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >与缓存</text>
<rect x="136" y="110" width="90" height="120" rx="4" fill="#e8f0fa" stroke="#222" stroke-width="1.8" />
<text x="181.0" y="165.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >CXL</text>
<text x="181.0" y="184.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >协议逻辑</text>
<rect x="246" y="110" width="90" height="120" rx="4" fill="#fdeee6" stroke="#222" stroke-width="1.8" />
<text x="291.0" y="165.54" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >PCIe</text>
<text x="291.0" y="184.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >PHY</text>
<rect x="574" y="110" width="90" height="120" rx="4" fill="#fdeee6" stroke="#222" stroke-width="1.8" />
<text x="619.0" y="165.54" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >PCIe</text>
<text x="619.0" y="184.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >PHY</text>
<rect x="684" y="110" width="90" height="120" rx="4" fill="#e8f0fa" stroke="#222" stroke-width="1.8" />
<text x="729.0" y="165.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >CXL</text>
<text x="729.0" y="184.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >控制器</text>
<rect x="794" y="110" width="84" height="120" rx="4" fill="#fdeee6" stroke="#222" stroke-width="1.8" />
<text x="836.0" y="165.54" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >DDR 控制</text>
<text x="836.0" y="184.54" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >器 + PHY</text>
<rect x="915" y="110" width="70" height="120" rx="4" fill="#eaf5e9" stroke="#222" stroke-width="1.8" />
<text x="950.0" y="175.04" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >DRAM</text>
<line x1="116" y1="150" x2="136" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="136" y1="195" x2="116" y2="195" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="226" y1="150" x2="246" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="246" y1="195" x2="226" y2="195" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="664" y1="150" x2="684" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="684" y1="195" x2="664" y2="195" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="774" y1="150" x2="794" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="794" y1="195" x2="774" y2="195" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="336" y1="150" x2="574" y2="150" stroke="#1f5fa8" stroke-width="2.6" marker-end="url(#ab)"/>
<line x1="574" y1="195" x2="336" y2="195" stroke="#1f5fa8" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="455" y="138" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="normal" >请求：8 条串行通路</text>
<text x="455" y="215" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="normal" >应答：64 字节数据</text>
<text x="455" y="176" font-size="13" text-anchor="middle" fill="#555" font-weight="normal" >走线约 30 cm</text>
<line x1="878" y1="150" x2="915" y2="150" stroke="#b5451b" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="915" y1="195" x2="878" y2="195" stroke="#b5451b" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="900" y="302" font-size="13" text-anchor="middle" fill="#b5451b" font-weight="normal" >DDR 并行总线</text>
<line x1="897" y1="288" x2="897" y2="205" stroke="#b5451b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="30" y="330" font-size="14" text-anchor="start" fill="#111" font-weight="bold" >去程各段耗时（纳秒，量级估计）</text>
<line x1="181" y1="342" x2="181" y2="358" stroke="#777" stroke-width="1.5"/>
<text x="181" y="378" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >① 约 5</text>
<line x1="291" y1="342" x2="291" y2="358" stroke="#777" stroke-width="1.5"/>
<text x="291" y="378" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >② 10~15</text>
<line x1="455" y1="342" x2="455" y2="358" stroke="#777" stroke-width="1.5"/>
<text x="455" y="378" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >③ 约 2</text>
<line x1="619" y1="342" x2="619" y2="358" stroke="#777" stroke-width="1.5"/>
<text x="619" y="378" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >④ 10~15</text>
<line x1="729" y1="342" x2="729" y2="358" stroke="#777" stroke-width="1.5"/>
<text x="729" y="378" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >⑤ 5~10</text>
<line x1="880" y1="342" x2="880" y2="358" stroke="#777" stroke-width="1.5"/>
<text x="880" y="378" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >⑥ 17~35</text>
<text x="30" y="420" font-size="14" text-anchor="start" fill="#111" font-weight="bold" >返程</text>
<text x="455" y="420" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >⑦ 反方向再走一遍 ②③④，约 22~32；⑧ 主机匹配应答，约 5</text>
<rect x="30" y="440" width="940" height="60" rx="4" fill="#fff" stroke="#666" stroke-width="1.8" stroke-dasharray="3 3" />
<text x="500" y="465" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >直连内存只有第 ⑥ 段。CXL 多出来的部分取中间值合计约 70 纳秒，</text>
<text x="500" y="488" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >其中大部分花在两次穿过 PCIe PHY（②④ 及其返程）上</text>
</svg>
