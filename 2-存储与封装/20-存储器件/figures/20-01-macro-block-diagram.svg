<text x="490.0" y="268.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">被选中的一根字线：这一行 256 个单元同时接上各自的位线</text>
<text x="490.0" y="395.0" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">竖线：位线对（共 256 对）</text>
<rect x="710.0" y="70.0" width="56.0" height="344.0" rx="0" fill="#f8ddd8" stroke="#222" stroke-width="2"/>
<text x="743.0" y="242.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle" transform="rotate(90 743.0 242.0)">复制位线（一列不存数据的单元）</text>
<rect x="50.0" y="124.0" width="190.0" height="290.0" rx="0" fill="#dbe9f7" stroke="#222" stroke-width="2"/>
<text x="145.0" y="160.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">行译码器</text>
<text x="145.0" y="184.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">9 位 → 3 组预译码</text>
<text x="145.0" y="204.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">→ 每行一个 3 输入与门</text>
<line x1="60.0" y1="225.0" x2="230.0" y2="225.0" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="145.0" y="255.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">字线驱动器</text>
<text x="145.0" y="279.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">512 个，逐级放大</text>
<text x="145.0" y="299.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">驱动约 38 fF 的字线</text>
<line x1="240.0" y1="263.0" x2="280.0" y2="263.0" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="280.0" y="424.0" width="420.0" height="40.0" rx="0" fill="#dbe9f7" stroke="#222" stroke-width="2"/>
<text x="490.0" y="449.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle">列选择器（A[2:0] 控制）：每 8 列选 1 列</text>
<rect x="280.0" y="474.0" width="205.0" height="44.0" rx="0" fill="#f8ddd8" stroke="#222" stroke-width="2"/>
<text x="382.0" y="501.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle">灵敏放大器 × 32</text>
<rect x="495.0" y="474.0" width="205.0" height="44.0" rx="0" fill="#dcefdc" stroke="#222" stroke-width="2"/>
<text x="597.0" y="501.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle">写驱动器 × 32</text>
<rect x="280.0" y="528.0" width="205.0" height="40.0" rx="0" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="382.0" y="553.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle">输出锁存 → Q[31:0]</text>
<rect x="495.0" y="528.0" width="205.0" height="40.0" rx="0" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="597.0" y="553.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle">D[31:0]、位写掩码 →</text>
<rect x="50.0" y="424.0" width="190.0" height="144.0" rx="0" fill="#fff3cd" stroke="#222" stroke-width="2"/>
<text x="145.0" y="452.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">控制与自定时</text>
<text x="145.0" y="478.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">时钟上升沿启动</text>
<text x="145.0" y="498.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">产生字线脉冲、</text>
<text x="145.0" y="518.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">放大器使能、预充电</text>
<text x="145.0" y="552.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">输入：CLK、CEN、WEN</text>
<text x="145.0" y="340.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">输入：地址高 9 位</text>
<text x="145.0" y="360.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">A[11:3]</text>
<line x1="240.0" y1="496.0" x2="280.0" y2="496.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="243.0" y="488.0" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="start">使能</text>
<polyline points="738.0,414.0 738.0,600.0 145.0,600.0 145.0,570.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/>
<line x1="145.0" y1="572.0" x2="145.0" y2="569.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="440.0" y="622.0" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">复制位线放电到预定值 → 通知控制电路 → 启动灵敏放大器（自定时）</text>
</svg>
