<text x="250" y="345" font-size="15" text-anchor="middle" fill="#222">整层的电子都会流向缺陷点并漏走</text>
<text x="250" y="368" font-size="15" text-anchor="middle" fill="#222">一个缺陷使整个单元的数据丢失</text>
<text x="710" y="32" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">电荷陷阱：存储层是绝缘的氮化硅</text>
<text x="710" y="56" font-size="14" text-anchor="middle" fill="#222">电子被固定在各自的陷阱里</text>
