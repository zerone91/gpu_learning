<text x="710" y="345" font-size="15" text-anchor="middle" fill="#222">只有缺陷点正上方的电子漏走（空心圆）</text>
<text x="710" y="368" font-size="15" text-anchor="middle" fill="#222">其余电子留在原处，阈值电压只降低一点</text>
