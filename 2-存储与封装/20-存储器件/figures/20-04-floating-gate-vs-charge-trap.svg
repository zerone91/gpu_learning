<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="sans-serif">
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<text x="250" y="32" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">浮栅：存储层是导体</text>
<text x="250" y="56" font-size="14" text-anchor="middle" fill="#222">电子可以在层内自由移动</text>
<rect x="40" y="80" width="420" height="40" fill="#9a9a9a" stroke="#222" stroke-width="2"/>
