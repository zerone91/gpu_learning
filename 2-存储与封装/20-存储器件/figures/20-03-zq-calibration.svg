<text x="712" y="278" font-size="14" text-anchor="start" fill="#111" font-weight="normal" >引脚电压 > 0.55 V：</text>
<text x="712" y="300" font-size="14" text-anchor="start" fill="#111" font-weight="normal" >支路阻值低于 240 Ω，该位清零</text>
