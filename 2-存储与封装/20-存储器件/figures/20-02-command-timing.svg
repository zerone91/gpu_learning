<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" font-family="sans-serif" font-size="16">
<rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<text x="470.0" y="28.0" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">DDR5-4800 CL40-39-39：对同一个 bank 的一次"激活 → 读 → 预充电 → 再激活"</text>
<line x1="80.0" y1="200.0" x2="890.0" y2="200.0" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
