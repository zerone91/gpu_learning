<text x="20" y="590" font-size="14" fill="#555">图例：橙色为有效数据；打叉的灰色格为已无效的页（下半部分即被删除的日志 L）；虚线格为空白页。</text>
<text x="20" y="612" font-size="14" fill="#555">ZNS 把“只能顺序写”的约束交给主机处理；FDP 保留随机读写接口，主机只需在写命令里多带一个句柄。</text>
