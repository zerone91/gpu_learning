<text x="500" y="204" font-size="14">状态：打开。A 的新版本只能整体写到这里，</text><text x="500" y="224" font-size="14">由主机自己记录“A 现在在区 1”</text>
<text x="500" y="256" font-size="14">区 0 里的 A 全部作废后，主机对区 0 发“复位”，</text><text x="500" y="276" font-size="14">设备整区擦除，不需要搬运任何数据</text>
