<text x="68.0" y="403" font-size="12" fill="#fff">1 厘米</text>
<text x="30" y="440" font-size="14" fill="#222">黑色小方块：每颗是一个 FBGA 封装的独立器件，</text>
<text x="30" y="462" font-size="14" fill="#222">SMT 焊在 PCB 上；黄线：在 PCB 上走几厘米</text>
<text x="30" y="484" font-size="14" fill="#222"></text>
<text x="30" y="506" font-size="14" fill="#222" font-weight="bold">每颗 32 根数据线 × 约 32 Gbps ÷ 8 ≈ 128 GB/s</text>
<text x="30" y="528" font-size="14" fill="#222" font-weight="bold">16 颗拼成 512 位总线 ≈ 1.8 TB/s（RTX 5090）</text>
<text x="30" y="550" font-size="14" fill="#222">线长，所以每根线都配强驱动、均衡和训练</text>
<text x="720" y="64" font-size="16" text-anchor="middle" font-weight="bold">（b）HBM4：同一封装里的 8 个堆叠</text>
