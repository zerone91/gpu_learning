<rect x="640" y="70" width="286.0" height="363.0" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8,5"/>
<text x="783.0" y="241.5" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">一次曝光的上限</text>
<text x="783.0" y="263.5" font-size="14" text-anchor="middle" fill="#c0392b">26 × 33 ≈ 858 平方毫米</text>
<text x="783.0" y="285.5" font-size="13" text-anchor="middle" fill="#555">（同一比例）</text>
<text x="620" y="475.0" font-size="14" fill="#c0392b" font-weight="bold">墙一：光罩极限（面积）</text>
<text x="620" y="496.0" font-size="14" fill="#222">中介层约为这个框的 2.5 倍，一次印不出来：</text>
<text x="620" y="517.0" font-size="14" fill="#222">只能拼接曝光，或换 RDL / 局部硅桥</text>
<text x="620" y="544.0" font-size="14" fill="#8b2f24" font-weight="bold">墙二：岸线（边长）</text>
<text x="620" y="565.0" font-size="14" fill="#222">每套 HBM 的 PHY（红块）沿边占 8 毫米，</text>
<text x="620" y="586.0" font-size="14" fill="#222">一条 33 毫米长边排 33 ÷ 8 ≈ 4 套，</text>
<text x="620" y="607.0" font-size="14" fill="#222">两条长边共 8 套：所以是 8 颗 HBM</text>
