<text x="40" y="520" font-size="14" fill="#111">每个比较器：35 位逐位比较，再汇总“是否全部相同”，约 6 级门。4 个结果最多一个为 1；全为 0 就是缺失，请求转去下一级。</text>
<text x="40" y="544" font-size="14" fill="#111">路数加倍 → 比较器加倍、选择器多一级，而且每次访问都要把整组的 tag 全读出来：这就是路数停在 4～16 的原因。</text>
<rect x="40" y="566" width="880" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="480" y="589" font-size="14" text-anchor="middle" fill="#111">被划成 shared memory 的那部分 SRAM：地址直接选行，不经过 tag 阵列和比较器——所以没有缺失，也少几拍</text>
</svg>