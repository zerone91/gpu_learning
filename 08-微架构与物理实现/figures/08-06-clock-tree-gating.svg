<text x="780" y="392" font-size="14" text-anchor="middle" fill="#2e7d32">这 4 拍下游一次都不翻转</text>
<text x="460" y="430" font-size="14" fill="#111">为什么时钟这么贵：它接到每一个触发器，每拍必翻两次，</text>
<text x="460" y="451" font-size="14" fill="#111">活动因子 α = 1；普通逻辑只有 0.05～0.3。</text>
<text x="460" y="472" font-size="14" fill="#111">若时钟网占总电容 10%、翻转率是普通逻辑的 5 倍，</text>
<text x="460" y="493" font-size="14" fill="#111">它的功耗就是普通逻辑的一半，约占动态功耗三分之一。</text>
<text x="460" y="514" font-size="14" fill="#b5451b">门控的三个粒度：一个执行单元（这拍没指令）、</text>
<text x="460" y="535" font-size="14" fill="#b5451b">整个 Tensor Core（跑纯访存 kernel）、整个 SM（没有线程块）。</text>
</svg>