<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">特殊函数单元怎样算 rsqrt(x)：指数单独处理，尾数“查表取系数 + 两次乘加”</text>
<text x="30" y="70" font-size="15" font-weight="bold" fill="#111">输入 x = 2^e × m（m 在 1 到 2 之间）</text>
<rect x="30" y="84" width="110" height="40" fill="#e0b0e0" stroke="#222" stroke-width="1.5"/><text x="85" y="109" font-size="14" text-anchor="middle" fill="#111">指数 e</text>
<rect x="140" y="84" width="130" height="40" fill="#f5c79b" stroke="#222" stroke-width="1.5"/><text x="205" y="109" font-size="14" text-anchor="middle" fill="#111">m 的高 6 位</text>
<rect x="270" y="84" width="170" height="40" fill="#d6e4f5" stroke="#222" stroke-width="1.5"/><text x="355" y="109" font-size="14" text-anchor="middle" fill="#111">m 的其余低位</text>
<line x1="85" y1="124" x2="85" y2="178" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="180" width="110" height="60" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="85" y="205" font-size="14" text-anchor="middle" fill="#111">算 −e/2</text>
<text x="85" y="226" font-size="14" text-anchor="middle" fill="#555">移位+取负</text>
<line x1="205" y1="124" x2="205" y2="178" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="212" y="156" font-size="14" fill="#555">段号 0～63</text>
<rect x="160" y="180" width="130" height="120" fill="#fdf3e3" stroke="#222" stroke-width="1.8"/>
<text x="225" y="200" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">系数表（ROM）</text>
<text x="225" y="224" font-size="14" text-anchor="middle" fill="#111">段 0：c₀ c₁ c₂</text>
<text x="225" y="244" font-size="14" text-anchor="middle" fill="#111">段 1：c₀ c₁ c₂</text>
<text x="225" y="264" font-size="14" text-anchor="middle" fill="#111">……</text>
<text x="225" y="284" font-size="14" text-anchor="middle" fill="#111">段 63：c₀ c₁ c₂</text>
<line x1="355" y1="124" x2="355" y2="320" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="362" y="200" font-size="14" fill="#555">段内偏移 d</text>
<line x1="225" y1="300" x2="225" y2="320" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="232" y="316" font-size="14" fill="#555">c₀ c₁ c₂</text>
<rect x="160" y="322" width="280" height="64" fill="#eaf5e9" stroke="#222" stroke-width="1.8"/>
<text x="300" y="348" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">c₀ + c₁·d + c₂·d²</text>
<text x="300" y="372" font-size="14" text-anchor="middle" fill="#111">小的定点乘加器，两次乘加</text>
<line x1="85" y1="240" x2="85" y2="420" stroke="#222" stroke-width="1.8"/>
<line x1="300" y1="386" x2="300" y2="420" stroke="#222" stroke-width="1.8"/>
<polyline points="85,420 300,420" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="192" y1="420" x2="192" y2="446" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="100" y="448" width="184" height="36" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
<text x="192" y="472" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">拼出 rsqrt(x)</text>
<text x="715" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">表里存的是什么：把 1/√m 切成很多小段</text>
<line x1="530" y1="400" x2="910" y2="400" stroke="#222" stroke-width="1.5"/>
<line x1="530" y1="400" x2="530" y2="100" stroke="#222" stroke-width="1.5"/>
<text x="530" y="420" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="622.5" y="420" font-size="14" text-anchor="middle" fill="#111">1.25</text>
<text x="715.0" y="420" font-size="14" text-anchor="middle" fill="#111">1.5</text>
<text x="807.5" y="420" font-size="14" text-anchor="middle" fill="#111">1.75</text>
<text x="900" y="420" font-size="14" text-anchor="middle" fill="#111">2</text>
<text x="715.0" y="442" font-size="14" text-anchor="middle" fill="#111">m</text>
<text x="522" y="405.0" font-size="14" text-anchor="end" fill="#111">0.7</text>
<text x="522" y="308.33333333333326" font-size="14" text-anchor="end" fill="#111">0.8</text>
<text x="522" y="211.66666666666657" font-size="14" text-anchor="end" fill="#111">0.9</text>
<text x="522" y="114.99999999999994" font-size="14" text-anchor="end" fill="#111">1.0</text>
<line x1="530.0" y1="400" x2="530.0" y2="110" stroke="#ddd" stroke-width="1"/>
<line x1="576.25" y1="400" x2="576.25" y2="110" stroke="#ddd" stroke-width="1"/>
<line x1="622.5" y1="400" x2="622.5" y2="110" stroke="#ddd" stroke-width="1"/>
<line x1="668.75" y1="400" x2="668.75" y2="110" stroke="#ddd" stroke-width="1"/>
<line x1="715.0" y1="400" x2="715.0" y2="110" stroke="#ddd" stroke-width="1"/>
<line x1="761.25" y1="400" x2="761.25" y2="110" stroke="#ddd" stroke-width="1"/>
