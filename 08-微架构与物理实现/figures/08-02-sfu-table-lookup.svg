<text x="645.625" y="106" font-size="14" text-anchor="middle" fill="#b5451b">其中一段</text>
<text x="733.5" y="177.66666666666654" font-size="14" fill="#111">段内曲线很平，</text>
<text x="733.5" y="197.66666666666654" font-size="14" fill="#111">一条抛物线就能贴得很准：</text>
<text x="733.5" y="217.66666666666654" font-size="14" fill="#111">每段只存 c₀、c₁、c₂ 三个数</text>
<text x="530" y="480" font-size="14" fill="#111">例：m = 1.3 → 高 6 位给出段号 19（1.2969～1.3125）</text>
<text x="530" y="502" font-size="14" fill="#111">d = 1.3 − 1.2969 ≈ 0.0031 → 算出 1/√1.3 ≈ 0.877</text>
<text x="30" y="530" font-size="14" fill="#555">示意：右图只画了 8 段，正文举例按 64 段；各段系数、表的位宽为示意。整条通路比一个 FP32 FMA 小，但每个子分区只配 4 条这样的通道。</text>
</svg>