<text x="198" y="423" font-size="14" text-anchor="end" fill="#111">修版与量产准备</text>
<rect x="780.4" y="405" width="138.8" height="26" rx="4" fill="#f4f4f4" stroke="#555" stroke-width="1.6"/>
<line x1="695.625" y1="73" x2="695.625" y2="447" stroke="#b5451b" stroke-width="2.5"/>
<text x="695.625" y="67" font-size="15" text-anchor="middle" font-weight="bold" fill="#b5451b">流片</text>
<line x1="348.75" y1="73" x2="348.75" y2="447" stroke="#6a3d9a" stroke-width="2" stroke-dasharray="6,4"/>
<text x="348.75" y="67" font-size="15" text-anchor="middle" font-weight="bold" fill="#6a3d9a">架构定案</text>
<text x="919.1666666666666" y="67" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">出货</text>
<line x1="919.1666666666666" y1="73" x2="919.1666666666666" y2="447" stroke="#111" stroke-width="2" stroke-dasharray="3,3"/>
<text x="40" y="517" font-size="14" fill="#111">架构定案之后还要约三年才出货：2026 年出货的芯片，SM 数量、矩阵单元形状、片上存储容量、支持哪些数据格式，是 2022～2023 年定的。</text>
<text x="40" y="539" font-size="14" fill="#b5451b">流片之后发现的硬 bug：重新流片要几千万美元加三到六个月。</text>
</svg>