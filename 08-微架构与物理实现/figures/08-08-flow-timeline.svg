<line x1="487.5" y1="85" x2="487.5" y2="447" stroke="#e5e5e5" stroke-width="1"/>
<text x="487.5" y="467" font-size="14" text-anchor="middle" fill="#111">18</text>
<line x1="580.0" y1="85" x2="580.0" y2="447" stroke="#e5e5e5" stroke-width="1"/>
<text x="580.0" y="467" font-size="14" text-anchor="middle" fill="#111">24</text>
<line x1="672.5" y1="85" x2="672.5" y2="447" stroke="#e5e5e5" stroke-width="1"/>
<text x="672.5" y="467" font-size="14" text-anchor="middle" fill="#111">30</text>
<line x1="765.0" y1="85" x2="765.0" y2="447" stroke="#e5e5e5" stroke-width="1"/>
<text x="765.0" y="467" font-size="14" text-anchor="middle" fill="#111">36</text>
<line x1="857.5" y1="85" x2="857.5" y2="447" stroke="#e5e5e5" stroke-width="1"/>
<text x="857.5" y="467" font-size="14" text-anchor="middle" fill="#111">42</text>
<line x1="950.0" y1="85" x2="950.0" y2="447" stroke="#e5e5e5" stroke-width="1"/>
<text x="950.0" y="467" font-size="14" text-anchor="middle" fill="#111">48</text>
<text x="580.0" y="489" font-size="14" text-anchor="middle" fill="#111">从架构探索开始算的月数（典型值，各家有出入）</text>
<text x="198" y="115" font-size="14" text-anchor="end" fill="#111">架构探索</text>
<rect x="210.0" y="97" width="138.8" height="26" rx="4" fill="#e6dcf0" stroke="#6a3d9a" stroke-width="1.6"/>
<text x="356.8" y="115" font-size="13" fill="#555">性能模型、周期精确模拟器</text>
<text x="198" y="159" font-size="14" text-anchor="end" fill="#111">微架构与 RTL</text>
<rect x="317.9" y="141" width="185.0" height="26" rx="4" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="510.9" y="159" font-size="13" fill="#555">写成可综合的代码</text>
<text x="198" y="203" font-size="14" text-anchor="end" fill="#111">功能验证</text>
<rect x="333.3" y="185" width="339.2" height="26" rx="4" fill="#f9d9c8" stroke="#b5451b" stroke-width="1.6"/>
<text x="502.9" y="203" font-size="13" text-anchor="middle" fill="#333">贯穿 18～24 个月，工作量最大</text>
<text x="198" y="247" font-size="14" text-anchor="end" fill="#111">综合与物理实现</text>
<rect x="487.5" y="229" width="169.6" height="26" rx="4" fill="#d6ecd2" stroke="#2e7d32" stroke-width="1.6"/>
<text x="572.3" y="247" font-size="13" text-anchor="middle" fill="#333">布局、时钟树、布线</text>
<text x="198" y="291" font-size="14" text-anchor="end" fill="#111">签核</text>
<rect x="657.1" y="273" width="38.5" height="26" rx="4" fill="#fff4d6" stroke="#9a6b00" stroke-width="1.6"/>
<text x="198" y="335" font-size="14" text-anchor="end" fill="#111">制造</text>
<rect x="695.6" y="317" width="46.2" height="26" rx="4" fill="#eeeeee" stroke="#555" stroke-width="1.6"/>
<text x="749.9" y="335" font-size="13" fill="#555">2.5～3 个月，什么都做不了</text>
<text x="198" y="379" font-size="14" text-anchor="end" fill="#111">bring-up</text>
<rect x="741.9" y="361" width="38.5" height="26" rx="4" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
