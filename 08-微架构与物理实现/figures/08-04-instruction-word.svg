<text x="400" y="380" font-size="14" text-anchor="middle" fill="#1f5fa8">蓝线：寄存器号字段的 8 根线</text>
<text x="400" y="400" font-size="14" text-anchor="middle" fill="#1f5fa8">直接接到地址端口，中间没有一个门</text>
<text x="400" y="420" font-size="14" text-anchor="middle" fill="#555">（每个字段画 3 根代表 8 根）</text>
<line x1="695.625" y1="130" x2="695.625" y2="298" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="585.625" y="300" width="220" height="56" rx="5" fill="#f7dada" stroke="#b5451b" stroke-width="1.6"/>
<text x="695.625" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">调度逻辑</text>
<text x="695.625" y="344" font-size="14" text-anchor="middle" fill="#111">停顿计数、屏障、复用（§4）</text>
<text x="695.625" y="380" font-size="14" text-anchor="middle" fill="#555">CPU 指令里这一项是 0 位</text>
<text x="30" y="470" font-size="14" fill="#111">“执行一条指令”= 让这几百根控制线在这一拍取一组特定的值，在早已存在的数据通路上选通出一条路径。</text>
<text x="30" y="494" font-size="14" fill="#111">定长、定位置的代价是空位（右端“未用”，以及很多指令用不上的立即数和修饰符字段）；换来的是译码几乎不花逻辑、一拍能并行译多条。</text>
<text x="30" y="530" font-size="14" fill="#555">字段宽度按正文 §3 预算表取量级；NVIDIA 不公开编码格式，字段顺序与位置为示意，谓词字段、修饰符细节各代不同。</text>
</svg>