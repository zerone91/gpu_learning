<text x="380.0" y="122" font-size="14" text-anchor="middle" fill="#555">32</text>
<rect x="480.0" y="60" width="50.0" height="44" fill="#d6e4f5" stroke="#222" stroke-width="1.4"/>
<text x="505.0" y="87" font-size="14" text-anchor="middle" fill="#111">Rc</text>
<text x="505.0" y="122" font-size="14" text-anchor="middle" fill="#555">8</text>
<rect x="530.0" y="60" width="100.0" height="44" fill="#e6e6e6" stroke="#222" stroke-width="1.4"/>
