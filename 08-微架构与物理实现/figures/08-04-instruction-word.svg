<line x1="151" y1="250" x2="151" y2="300" stroke="#b5451b" stroke-width="1.5"/>
<line x1="164" y1="250" x2="164" y2="300" stroke="#b5451b" stroke-width="1.5"/>
<line x1="177" y1="250" x2="177" y2="300" stroke="#b5451b" stroke-width="1.5"/>
<text x="110" y="320" font-size="14" text-anchor="middle" fill="#b5451b">展开成几百根控制线：</text>
<text x="40" y="344" font-size="14" fill="#111">· 哪个执行管线使能</text>
<text x="40" y="364" font-size="14" fill="#111">· 多路选择器选哪一路</text>
<text x="40" y="384" font-size="14" fill="#111">· 要不要写回、写回宽度</text>
<text x="40" y="404" font-size="14" fill="#111">· 各级流水的有效位</text>
<rect x="250" y="300" width="300" height="56" rx="5" fill="#d6e4f5" stroke="#1f5fa8" stroke-width="2"/>
<text x="400" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">寄存器堆的地址端口</text>
<text x="400" y="344" font-size="14" text-anchor="middle" fill="#111">写 D ／ 读 A ／ 读 B ／ 读 C</text>
<polyline points="199.0,130 199.0,230 284,230 284,300" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
