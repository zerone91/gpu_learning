<text x="888" y="182" font-size="14" text-anchor="middle" fill="#555">t7</text>
<text x="550" y="214" font-size="14" fill="#111">调度器可以这拍推进 A 组（t0～t2），</text>
<text x="550" y="234" font-size="14" fill="#111">下拍推进 B 组（t3～t7），来回切换</text>
<text x="550" y="276" font-size="14" fill="#111" font-weight="bold">收敛屏障寄存器（BSSY 建立）</text>
<rect x="560" y="288" width="18" height="22" fill="#f5c79b" stroke="#555" stroke-width="1"/>
<text x="569" y="304" font-size="14" text-anchor="middle" fill="#111">1</text>
<rect x="578" y="288" width="18" height="22" fill="#f5c79b" stroke="#555" stroke-width="1"/>
<text x="587" y="304" font-size="14" text-anchor="middle" fill="#111">1</text>
