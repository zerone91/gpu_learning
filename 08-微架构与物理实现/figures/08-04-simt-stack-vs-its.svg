<rect x="275" y="138" width="18" height="22" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="284" y="154" font-size="14" text-anchor="middle" fill="#111">0</text>
<rect x="293" y="138" width="18" height="22" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="302" y="154" font-size="14" text-anchor="middle" fill="#111">0</text>
<rect x="311" y="138" width="18" height="22" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="320" y="154" font-size="14" text-anchor="middle" fill="#111">0</text>
<text x="345" y="154" font-size="14" fill="#555">栈：</text>
<rect x="378" y="138" width="72" height="22" fill="#eef3fb" stroke="#555"/><text x="414" y="154" font-size="14" text-anchor="middle" fill="#111">合流 C</text>
<rect x="450" y="138" width="56" height="22" fill="#eef3fb" stroke="#555"/><text x="478" y="154" font-size="14" text-anchor="middle" fill="#111">下条 B</text>
<rect x="378" y="164" width="72" height="22" fill="#eef3fb" stroke="#555"/><text x="414" y="180" font-size="14" text-anchor="middle" fill="#111">合流 C</text>
<rect x="450" y="164" width="56" height="22" fill="#eef3fb" stroke="#555"/><text x="478" y="180" font-size="14" text-anchor="middle" fill="#111">下条 C</text>
