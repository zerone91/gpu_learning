<text x="302" y="390" font-size="14" text-anchor="middle" fill="#111">1</text>
<rect x="311" y="374" width="18" height="22" fill="#8fcf8f" stroke="#555" stroke-width="1"/>
<text x="320" y="390" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="345" y="390" font-size="14" fill="#555">栈：</text>
<text x="380" y="390" font-size="14" fill="#555">空</text>
<text x="30" y="470" font-size="14" fill="#111">硬件：1 个 PC、1 个掩码、一小块栈（几十个条目）</text>
<text x="30" y="492" font-size="14" fill="#b5451b">栈是后进先出：if 那半边没走到 C，else 那半边</text>
<text x="30" y="514" font-size="14" fill="#b5451b">就被压在栈里，物理上无法推进 → 互等锁会死锁</text>
<text x="378" y="208" font-size="14" fill="#555">（条目里的掩码略）</text>
<line x1="530" y1="76" x2="530" y2="530" stroke="#ccc" stroke-width="1.5"/>
<text x="745" y="90" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">② Volta 起：每线程一个 PC + 收敛屏障</text>
<text x="550" y="124" font-size="14" fill="#111" font-weight="bold">8 个线程各自的 PC（执行到一半时）</text>
<rect x="560" y="136" width="40" height="30" fill="#fdf3e3" stroke="#222" stroke-width="1.3"/>
<text x="580" y="156" font-size="14" text-anchor="middle" fill="#111">A</text>
<text x="580" y="182" font-size="14" text-anchor="middle" fill="#555">t0</text>
<rect x="604" y="136" width="40" height="30" fill="#fdf3e3" stroke="#222" stroke-width="1.3"/>
<text x="624" y="156" font-size="14" text-anchor="middle" fill="#111">A</text>
<text x="624" y="182" font-size="14" text-anchor="middle" fill="#555">t1</text>
<rect x="648" y="136" width="40" height="30" fill="#fdf3e3" stroke="#222" stroke-width="1.3"/>
<text x="668" y="156" font-size="14" text-anchor="middle" fill="#111">A</text>
<text x="668" y="182" font-size="14" text-anchor="middle" fill="#555">t2</text>
<rect x="692" y="136" width="40" height="30" fill="#d6e4f5" stroke="#222" stroke-width="1.3"/>
