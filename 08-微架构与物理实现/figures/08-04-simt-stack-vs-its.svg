<rect x="257" y="256" width="18" height="22" fill="#8fcf8f" stroke="#555" stroke-width="1"/>
<text x="266" y="272" font-size="14" text-anchor="middle" fill="#111">1</text>
<rect x="275" y="256" width="18" height="22" fill="#8fcf8f" stroke="#555" stroke-width="1"/>
<text x="284" y="272" font-size="14" text-anchor="middle" fill="#111">1</text>
<rect x="293" y="256" width="18" height="22" fill="#8fcf8f" stroke="#555" stroke-width="1"/>
<text x="302" y="272" font-size="14" text-anchor="middle" fill="#111">1</text>
