<rect x="668" y="288" width="18" height="22" fill="#f5c79b" stroke="#555" stroke-width="1"/>
<text x="677" y="304" font-size="14" text-anchor="middle" fill="#111">1</text>
<rect x="686" y="288" width="18" height="22" fill="#f5c79b" stroke="#555" stroke-width="1"/>
<text x="695" y="304" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="720" y="304" font-size="14" fill="#555">这些线程要在 C 会合</text>
<text x="550" y="344" font-size="14" fill="#111">BSYNC 放在 C 前：先到的线程在这里等，</text>
<text x="550" y="364" font-size="14" fill="#111">8 个都到了才一起继续——合流由指令显式完成</text>
<text x="550" y="410" font-size="14" fill="#111">代价：每 warp 存 32 个 PC 而不是 1 个。</text>
<text x="550" y="432" font-size="14" fill="#111">按 PC 宽 32 位、每 SM 64 个 warp 算：</text>
<text x="550" y="454" font-size="14" fill="#111" font-weight="bold">64 × 32 × 32 = 65536 个触发器</text>
<text x="550" y="492" font-size="14" fill="#2e7d32">if 那半边卡住时，调度器能去推 else 那半边 → 不再死锁</text>
<text x="550" y="514" font-size="14" fill="#b5451b">编译器不插 BSSY/BSYNC，就不保证自动合流</text>
<text x="480" y="570" font-size="14" text-anchor="middle" fill="#555">两种方式下，同一拍都只有一组线程真正在算；被掩码关掉的 lane 照样在耗电，只是结果不写回</text>
</svg>