<text x="800" y="182" font-size="14" text-anchor="middle" fill="#555">t5</text>
<rect x="824" y="136" width="40" height="30" fill="#d6e4f5" stroke="#222" stroke-width="1.3"/>
<text x="844" y="156" font-size="14" text-anchor="middle" fill="#111">B</text>
<text x="844" y="182" font-size="14" text-anchor="middle" fill="#555">t6</text>
<rect x="868" y="136" width="40" height="30" fill="#d6e4f5" stroke="#222" stroke-width="1.3"/>
