<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">分支发散在硬件上存在哪：Volta 之前是一个栈，Volta 起是每线程一个 PC 加收敛屏障</text>
<text x="480" y="54" font-size="14" text-anchor="middle" fill="#555">例子：if (tid &lt; 3) { A } else { B }  C —— 为了画得下，warp 只画 8 个线程，掩码第 k 位 = 线程 k 是否执行</text>
<text x="230" y="90" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">① Volta 之前：每 warp 一个 PC + SIMT 栈</text>
<text x="30" y="126" font-size="14" fill="#111" font-weight="bold">第 1 段：执行 if 分支</text>
<text x="30" y="154" font-size="14" fill="#111">当前 PC = A，掩码</text>
