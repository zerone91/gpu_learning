<text x="320" y="272" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="345" y="272" font-size="14" fill="#555">栈：</text>
<rect x="378" y="256" width="72" height="22" fill="#eef3fb" stroke="#555"/><text x="414" y="272" font-size="14" text-anchor="middle" fill="#111">合流 C</text>
<rect x="450" y="256" width="56" height="22" fill="#eef3fb" stroke="#555"/><text x="478" y="272" font-size="14" text-anchor="middle" fill="#111">下条 C</text>
<text x="30" y="362" font-size="14" fill="#111" font-weight="bold">第 3 段：再走到 C，弹栈，重新合流</text>
<text x="30" y="390" font-size="14" fill="#111">当前 PC = C，掩码</text>
