<text x="712" y="182" font-size="14" text-anchor="middle" fill="#555">t3</text>
<rect x="736" y="136" width="40" height="30" fill="#d6e4f5" stroke="#222" stroke-width="1.3"/>
<text x="756" y="156" font-size="14" text-anchor="middle" fill="#111">B</text>
<text x="756" y="182" font-size="14" text-anchor="middle" fill="#555">t4</text>
<rect x="780" y="136" width="40" height="30" fill="#d6e4f5" stroke="#222" stroke-width="1.3"/>
