<text x="490" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">长线为什么要切段：不切，延迟随长度的平方涨；切开插缓冲器，变成随长度线性涨</text>
<text x="30" y="72" font-size="15" font-weight="bold" fill="#111">① 一根 4 mm 的线不切：一端推，另一端等</text>
