<text x="470" y="140" font-size="14" text-anchor="middle" fill="#555">线越长，电阻越大、要充的电容也越多：两者都正比于长度，延迟正比于两者之积 = 长度²</text>
<text x="30" y="182" font-size="15" font-weight="bold" fill="#111">② 同一根线切成 4 段，每段前面放一个缓冲器（三角形）重新推一次</text>
