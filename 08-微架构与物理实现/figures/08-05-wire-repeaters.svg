<text x="700" y="320" font-size="14" fill="#111">读图：</text>
<text x="700" y="341" font-size="14" fill="#111">横轴线长，纵轴信号从一端</text>
<text x="700" y="362" font-size="14" fill="#111">到另一端要多久。</text>
<text x="700" y="383" font-size="14" fill="#b5451b">红线：不切，长度翻倍延迟四倍。</text>
<text x="700" y="404" font-size="14" fill="#2e7d32">绿线：插满缓冲器，长度翻倍</text>
<text x="700" y="425" font-size="14" fill="#2e7d32">延迟翻倍。</text>
<text x="700" y="446" font-size="14" fill="#1f5fa8">蓝虚线：一个时钟周期 500 ps。</text>
<text x="700" y="467" font-size="14" fill="#1f5fa8">绿线在约 8 mm 处碰到它：更长</text>
<text x="700" y="488" font-size="14" fill="#1f5fa8">的线一拍走不完，只能在中间</text>
<text x="700" y="509" font-size="14" fill="#1f5fa8">加触发器，多出一级纯走线的</text>
<text x="700" y="530" font-size="14" fill="#1f5fa8">流水级。</text>
<text x="700" y="551" font-size="14" fill="#555">数值为示意：不切 25 ps×长度²，</text>
<text x="700" y="572" font-size="14" fill="#555">插缓冲器 60 ps/毫米。</text>
