<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<text x="490" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">一条 SerDes 链路：发送端把比特串起来并预先加强跳变，接收端先补高频、再减拖尾、自己找时钟</text>
<text x="200" y="54" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">发送端（芯片 A）</text>
<text x="790" y="54" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">接收端（芯片 B）</text>
<rect x="15" y="80" width="95" height="56" rx="5" fill="#f4f4f4" stroke="#222" stroke-width="1.8"/>
<text x="62.5" y="104.0" font-size="14" text-anchor="middle" fill="#111">并行数据</text>
<text x="62.5" y="123.0" font-size="14" text-anchor="middle" fill="#555">64 位/拍</text>
<rect x="130" y="80" width="100" height="56" rx="5" fill="#f4f4f4" stroke="#222" stroke-width="1.8"/>
<text x="180.0" y="104.0" font-size="14" text-anchor="middle" fill="#111">串行器</text>
<text x="180.0" y="123.0" font-size="14" text-anchor="middle" fill="#555">排成一列</text>
<rect x="250" y="80" width="110" height="56" rx="5" fill="#f4f4f4" stroke="#222" stroke-width="1.8"/>
<text x="305.0" y="104.0" font-size="14" text-anchor="middle" fill="#111">预加重+驱动</text>
<text x="305.0" y="123.0" font-size="14" text-anchor="middle" fill="#555">FFE</text>
<rect x="380" y="88" width="200" height="40" fill="#e6e6e6" stroke="#777" stroke-width="1.5"/>
<text x="480" y="106" font-size="14" text-anchor="middle" fill="#111">封装→PCB→连接器</text>
<text x="480" y="124" font-size="14" text-anchor="middle" fill="#555">几十厘米，一对差分线</text>
<rect x="600" y="80" width="95" height="56" rx="5" fill="#eef3fb" stroke="#1f5fa8" stroke-width="1.8"/>
<text x="647.5" y="104.0" font-size="14" text-anchor="middle" fill="#111">CTLE</text>
<text x="647.5" y="123.0" font-size="14" text-anchor="middle" fill="#555">补回高频</text>
<rect x="715" y="80" width="115" height="56" rx="5" fill="#eef3fb" stroke="#1f5fa8" stroke-width="1.8"/>
<text x="772.5" y="104.0" font-size="14" text-anchor="middle" fill="#111">DFE + 判决器</text>
<text x="772.5" y="123.0" font-size="14" text-anchor="middle" fill="#555">减拖尾，判 0/1</text>
<rect x="850" y="80" width="115" height="56" rx="5" fill="#f4f4f4" stroke="#222" stroke-width="1.8"/>
<text x="907.5" y="104.0" font-size="14" text-anchor="middle" fill="#111">解串器</text>
<text x="907.5" y="123.0" font-size="14" text-anchor="middle" fill="#555">拼回 64 位</text>
