<text x="880" y="364" font-size="14" text-anchor="middle" fill="#111">⑤ DFE 判决出来</text>
<text x="880" y="383" font-size="14" text-anchor="middle" fill="#2e7d32">比特原样还原</text>
<text x="240" y="74" font-size="14" text-anchor="middle" fill="#b5451b">①</text>
<text x="370" y="74" font-size="14" text-anchor="middle" fill="#b5451b">②</text>
<text x="590" y="74" font-size="14" text-anchor="middle" fill="#b5451b">③</text>
<text x="705" y="74" font-size="14" text-anchor="middle" fill="#b5451b">④</text>
<text x="840" y="74" font-size="14" text-anchor="middle" fill="#b5451b">⑤</text>
<text x="20" y="445" font-size="14" fill="#111">在信道里，高频（快速跳变）比低频衰减得多：单独一个 1 夹在 0 中间，到接收端只剩一个小鼓包（③ 里第 2 位）。</text>
<text x="20" y="471" font-size="14" fill="#111">预加重（FFE）在发送端先把每次跳变抬高，CTLE 在接收端再把高频放大，两者都是在抵消信道的这种偏心衰减。</text>
<text x="20" y="497" font-size="14" fill="#111">DFE 用刚判出的前几位估算它们留在当前位上的拖尾并减掉；CDR 用一个锁相环跟住数据跳变的节奏，决定何时采样。</text>
<text x="20" y="523" font-size="14" fill="#111">整套电路是模拟电路，功耗大、面积大，还要贴着 die 边缘放在引脚旁边：这就是 SerDes 每比特 2～6 pJ 的来源。</text>
</svg>