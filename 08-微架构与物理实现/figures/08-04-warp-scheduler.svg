<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">warp 调度器的电路：16 个五输入与门算出就绪位，再用优先编码器挑一个，全程要在一拍里跑完</text>
<text x="50" y="70" font-size="14" fill="#111" transform="rotate(-35 50 70)"></text>
<text x="106" y="70" font-size="14" fill="#111" transform="rotate(-35 106 70)"></text>
<text x="162" y="70" font-size="14" fill="#111" transform="rotate(-35 162 70)"></text>
<text x="218" y="70" font-size="14" fill="#111" transform="rotate(-35 218 70)"></text>
<text x="274" y="70" font-size="14" fill="#111" transform="rotate(-35 274 70)"></text>
<text x="40" y="62" font-size="14" fill="#111">输入 1：缓冲非空</text>
<text x="40" y="80" font-size="14" fill="#111">输入 2：stall 数到 0</text>
<text x="40" y="98" font-size="14" fill="#111">输入 3：所等屏障已清</text>
<text x="40" y="116" font-size="14" fill="#111">输入 4：目标管线空闲</text>
<text x="40" y="134" font-size="14" fill="#111">输入 5：不在等同步</text>
<text x="40" y="175" font-size="14" fill="#111">w0</text>
