<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="sans-serif">
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">三条指令的逐拍跟踪：固定延迟由倒计数器放行，访存延迟由屏障计数放行</text>
<text x="30" y="62" font-size="14" fill="#111" font-family="monospace">① LDG.E R4,[R2]   屏障 0 登记，stall=1</text>
<text x="30" y="82" font-size="14" fill="#111" font-family="monospace">② FFMA R7,R5,R6,R7  与①无关，stall=4</text>
<text x="30" y="102" font-size="14" fill="#111" font-family="monospace">③ FADD R8,R4,R7   等待掩码 = {屏障 0}</text>
<text x="560" y="72" font-size="14" fill="#555">stall = 发射后本 warp 强制歇几拍（编译器写死）</text>
<text x="560" y="94" font-size="14" fill="#555">屏障 0 = 硬件计数器：登记 +1，数据回来 −1</text>
<text x="224.0" y="128" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">0</text>
