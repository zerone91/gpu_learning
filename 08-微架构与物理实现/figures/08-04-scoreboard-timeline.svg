<text x="30" y="374" font-size="14" fill="#111">调度器在第 2～4 拍、第 5～400 拍发的是<tspan font-weight="bold">别的 warp</tspan>的指令：短空窗靠 ILP 或别的 warp 填，长空窗只能靠别的 warp 填。</text>
<text x="30" y="398" font-size="14" fill="#111">第 5 拍：stall 已数到 0，但③的等待掩码要求屏障 0 为 0，它还是 1 → 不许发射，warp 挂起，调度器从此不再看它。</text>
<text x="30" y="422" font-size="14" fill="#111">第 401 拍：显存数据写进 R4，硬件把屏障 0 减到 0 → 就绪位置 1；第 402 拍发射③。R7 由②的 stall=4 保证早已算好。</text>
<text x="30" y="454" font-size="14" fill="#555">“第 401 拍数据回来”是示意（约 400 拍的显存延迟）；stall 计数的显示方式为示意：②发射后置 4，每拍减 1，减到 0 才放行下一条。</text>
