<text x="740" y="62" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">② 凑出一套可用的 800 mm² 算力，平均要耗多少硅</text>
<text x="530" y="100" font-size="14" fill="#111">单片 800 mm²：良率 0.49，平均造 2.03 颗才得 1 颗好的</text>
