<text x="732.8" y="240" font-size="15" font-weight="bold" fill="#2e7d32">974 mm²</text>
<text x="530" y="296" font-size="14" fill="#2e7d32" font-weight="bold">同样的算力，少耗约 40% 的硅</text>
<text x="530" y="320" font-size="13" fill="#555">条长按面积比例画；蓝 = 用上的好 die，橙 = 平均要陪上的坏 die</text>
<text x="530" y="370" font-size="14" fill="#111">另一半账：4 颗 die 要用中介层或混合键合缝起来，</text>
<text x="530" y="392" font-size="14" fill="#111">封装更贵，封装本身也有良率——一颗坏了，另外 3 颗</text>
<text x="530" y="414" font-size="14" fill="#111">好 die 一起报废。所以 die 小时切开不划算，</text>
<text x="530" y="436" font-size="14" fill="#111">die 大时非切不可。</text>
<text x="490" y="530" font-size="14" text-anchor="middle" fill="#555">D₀：每平方厘米平均有几个会让芯片报废的缺陷；α：缺陷有多"扎堆"。0.1 个/cm² 是常见的教学值</text>
