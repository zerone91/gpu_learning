<text x="610.0" y="140" font-size="13" text-anchor="middle" fill="#111">好的那颗</text>
<text x="770.0" y="140" font-size="13" text-anchor="middle" fill="#b5451b">报废的</text>
<text x="862.8" y="140" font-size="15" font-weight="bold" fill="#b5451b">1626 mm²</text>
<text x="530" y="200" font-size="14" fill="#111">切成 4 × 200 mm²：良率 0.82，每颗平均造 1.22 颗，共 4.87 颗</text>
