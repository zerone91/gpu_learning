<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">TMA 是一台自己数循环、自己算地址的小状态机；mbarrier 数到位时，只是把一个就绪位置 1</text>
<rect x="30" y="56" width="260" height="140" rx="5" fill="#eef3fb" stroke="#222" stroke-width="1.6"/>
<text x="160" y="80" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">张量描述符（在显存里）</text>
<text x="46" y="104" font-size="14" fill="#111">· 基址</text>
<text x="46" y="124" font-size="14" fill="#111">· 各维尺寸：4096 × 4096</text>
<text x="46" y="144" font-size="14" fill="#111">· 行步长：8192 字节</text>
<text x="46" y="164" font-size="14" fill="#111">· 元素：bf16（2 字节）</text>
<text x="46" y="184" font-size="14" fill="#111">· tile 形状：64 行 × 64 列</text>
<rect x="30" y="210" width="260" height="56" rx="5" fill="#fdf3e3" stroke="#222" stroke-width="1.6"/>
<text x="160" y="234" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">一条指令（1 个线程发出）</text>
<text x="160" y="255" font-size="14" text-anchor="middle" fill="#111">tile 左上角坐标：行 256、列 128</text>
<line x1="290" y1="126" x2="336" y2="160" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="290" y1="238" x2="336" y2="206" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="338" y="56" width="330" height="210" rx="6" fill="#eaf5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="503" y="80" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">TMA 单元：嵌套的计数器</text>
<rect x="356" y="94" width="294" height="36" fill="#ffffff" stroke="#555"/>
<text x="368" y="117" font-size="14" fill="#111">行计数器 r：0 → 63</text>
<rect x="376" y="136" width="274" height="36" fill="#ffffff" stroke="#555"/>
<text x="388" y="159" font-size="14" fill="#111">（这一行 128 字节，一个请求搬完）</text>
<text x="356" y="196" font-size="14" fill="#111">地址 = 基址 + (256 + r) × 8192</text>
<text x="356" y="216" font-size="14" fill="#111">　　　　 + 128 × 2</text>
<text x="356" y="246" font-size="14" fill="#555">一个小乘加器 + 计数器，几千个门</text>
<line x1="668" y1="160" x2="714" y2="160" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="716" y="84" font-size="14" fill="#111" font-weight="bold">逐拍发出的请求</text>
<rect x="716" y="96" width="220" height="26" fill="#ffffff" stroke="#999"/>
<text x="726" y="114" font-size="14" fill="#111">r=0：基址+2097408</text>
<rect x="716" y="128" width="220" height="26" fill="#ffffff" stroke="#999"/>
<text x="726" y="146" font-size="14" fill="#111">r=1：基址+2105600</text>
<rect x="716" y="160" width="220" height="26" fill="#ffffff" stroke="#999"/>
<text x="726" y="178" font-size="14" fill="#111">r=2：基址+2113792</text>
<rect x="716" y="192" width="220" height="26" fill="#ffffff" stroke="#999"/>
<text x="726" y="210" font-size="14" fill="#111">……</text>
<rect x="716" y="224" width="220" height="26" fill="#ffffff" stroke="#999"/>
<text x="726" y="242" font-size="14" fill="#111">r=63：共 64 个</text>
<line x1="826" y1="256" x2="826" y2="292" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="836" y="282" font-size="14" fill="#555">L2 / 显存</text>
<rect x="338" y="296" width="598" height="120" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.6"/>
<text x="352" y="318" font-size="15" font-weight="bold" fill="#111">shared memory</text>
<rect x="700" y="330" width="220" height="70" fill="#d6e4f5" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="810" y="358" font-size="14" text-anchor="middle" fill="#111">tile 数据 8 KB</text>
<text x="810" y="380" font-size="14" text-anchor="middle" fill="#555">（64 行 × 128 字节）</text>
<rect x="360" y="330" width="290" height="70" fill="#fdf3e3" stroke="#b5451b" stroke-width="2"/>
<text x="505" y="354" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">mbarrier（一个 64 位对象）</text>
<text x="505" y="378" font-size="14" text-anchor="middle" fill="#111">期望 8192 字节 ｜ 已到达 8192 字节</text>
<line x1="700" y1="365" x2="652" y2="365" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="676" y="392" font-size="14" text-anchor="middle" fill="#555">到达</text>
<line x1="505" y1="400" x2="505" y2="446" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#ag)"/>
<text x="515" y="430" font-size="14" fill="#2e7d32">计数满足 → 硬件置位</text>
<rect x="338" y="448" width="330" height="70" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="503" y="472" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">warp 调度器里等待中的 warp</text>
<text x="420" y="500" font-size="14" fill="#111">就绪位：</text>
<rect x="480" y="484" width="26" height="24" fill="#f2c9c9" stroke="#222"/><text x="493" y="501" font-size="14" text-anchor="middle" fill="#111">0</text>
<text x="520" y="501" font-size="14" fill="#111">→</text>
<rect x="542" y="484" width="26" height="24" fill="#8fcf8f" stroke="#222"/><text x="555" y="501" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="578" y="501" font-size="14" fill="#111">下拍参加挑选</text>
<text x="30" y="320" font-size="14" fill="#111">对照普通访存：</text>
<text x="30" y="342" font-size="14" fill="#111">32 个线程各自用整数</text>
<text x="30" y="364" font-size="14" fill="#111">指令算好地址，再把</text>
<text x="30" y="386" font-size="14" fill="#111">32 个地址交给 LSU</text>
<text x="30" y="440" font-size="14" fill="#111">TMA：地址计算从</text>
<text x="30" y="462" font-size="14" fill="#111">指令流里消失，</text>
<text x="30" y="484" font-size="14" fill="#111">省下的是成百上千条</text>
<text x="30" y="506" font-size="14" fill="#111">指令的发射和执行</text>
<text x="30" y="556" font-size="14" fill="#555">等待期间 warp 的就绪位为 0，调度器每拍看它一眼就跳过：没有轮询、没有中断、没有上下文切换。</text>
<text x="30" y="580" font-size="14" fill="#555">数值为示意：第 r 个请求的偏移 = (256+r)×8192 + 256 字节；真实 TMA 按描述符支持最多五维，请求粒度由硬件决定。</text>
</svg>