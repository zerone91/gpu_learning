<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5451b"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">同样是一排全加器：进位串起来就是普通加法器，进位不串就是 3:2 压缩器</text>

<!-- 上：CPA -->
<text x="30" y="62" font-size="16" font-weight="bold" fill="#111">① 进位传播加法器（行波进位）：0111 + 0001，进位一位一位往左传</text>
<g font-size="14" text-anchor="middle" fill="#111">
<text x="250" y="92">a₃=0  b₃=0</text><text x="420" y="92">a₂=1  b₂=0</text><text x="590" y="92">a₁=1  b₁=0</text><text x="760" y="92">a₀=1  b₀=1</text>
</g>
<g stroke="#222" stroke-width="1.6">
<line x1="250" y1="98" x2="250" y2="118" marker-end="url(#a)"/><line x1="420" y1="98" x2="420" y2="118" marker-end="url(#a)"/><line x1="590" y1="98" x2="590" y2="118" marker-end="url(#a)"/><line x1="760" y1="98" x2="760" y2="118" marker-end="url(#a)"/>
</g>
<g fill="#fdf3e3" stroke="#222" stroke-width="1.8">
<rect x="200" y="120" width="100" height="56"/><rect x="370" y="120" width="100" height="56"/><rect x="540" y="120" width="100" height="56"/><rect x="710" y="120" width="100" height="56"/>
</g>
<g font-size="14" text-anchor="middle" fill="#111"><text x="250" y="153">全加器 3</text><text x="420" y="153">全加器 2</text><text x="590" y="153">全加器 1</text><text x="760" y="153">全加器 0</text></g>
<!-- 进位链 -->
<g stroke="#b5451b" stroke-width="2.4">
<line x1="710" y1="148" x2="642" y2="148" marker-end="url(#ar)"/>
<line x1="540" y1="148" x2="472" y2="148" marker-end="url(#ar)"/>
<line x1="370" y1="148" x2="302" y2="148" marker-end="url(#ar)"/>
<line x1="200" y1="148" x2="150" y2="148" marker-end="url(#ar)"/>
</g>
<g font-size="14" text-anchor="middle" fill="#b5451b" font-weight="bold"><text x="676" y="140">c₁=1</text><text x="506" y="140">c₂=1</text><text x="336" y="140">c₃=1</text><text x="160" y="140">c₄=0</text></g>
<line x1="860" y1="148" x2="812" y2="148" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<text x="880" y="153" font-size="14" fill="#111">c₀=0</text>
<g stroke="#222" stroke-width="1.6">
<line x1="250" y1="176" x2="250" y2="200" marker-end="url(#a)"/><line x1="420" y1="176" x2="420" y2="200" marker-end="url(#a)"/><line x1="590" y1="176" x2="590" y2="200" marker-end="url(#a)"/><line x1="760" y1="176" x2="760" y2="200" marker-end="url(#a)"/>
</g>
<g font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><text x="250" y="218">s₃=1</text><text x="420" y="218">s₂=0</text><text x="590" y="218">s₁=0</text><text x="760" y="218">s₀=0</text></g>
<text x="480" y="246" font-size="14" text-anchor="middle" fill="#b5451b">全加器 3 要等 c₃，c₃ 要等 c₂……红色进位链串成一条长路径：n 位就要等 n 级，32 位约 64 个门延迟</text>
<text x="480" y="268" font-size="14" text-anchor="middle" fill="#111">结果 1000 = 8 = 7 + 1：出来的是一个数</text>

<line x1="30" y1="288" x2="930" y2="288" stroke="#ccc" stroke-width="1.5"/>

<!-- 下：CSA -->
<text x="30" y="320" font-size="16" font-weight="bold" fill="#111">② 进位保留加法器（CSA）：X=0101、Y=0011、Z=0110 三个数，每位各算各的</text>
<g font-size="14" text-anchor="middle" fill="#111">
<text x="250" y="350">x₃ y₃ z₃ = 0 0 0</text><text x="420" y="350">x₂ y₂ z₂ = 1 0 1</text><text x="590" y="350">x₁ y₁ z₁ = 0 1 1</text><text x="760" y="350">x₀ y₀ z₀ = 1 1 0</text>
</g>
<g stroke="#222" stroke-width="1.6">
<line x1="250" y1="356" x2="250" y2="376" marker-end="url(#a)"/><line x1="420" y1="356" x2="420" y2="376" marker-end="url(#a)"/><line x1="590" y1="356" x2="590" y2="376" marker-end="url(#a)"/><line x1="760" y1="356" x2="760" y2="376" marker-end="url(#a)"/>
</g>
<g fill="#eaf5e9" stroke="#222" stroke-width="1.8">
<rect x="200" y="378" width="100" height="56"/><rect x="370" y="378" width="100" height="56"/><rect x="540" y="378" width="100" height="56"/><rect x="710" y="378" width="100" height="56"/>
</g>
<g font-size="14" text-anchor="middle" fill="#111"><text x="250" y="411">全加器 3</text><text x="420" y="411">全加器 2</text><text x="590" y="411">全加器 1</text><text x="760" y="411">全加器 0</text></g>
<!-- 和向量 -->
<g stroke="#222" stroke-width="1.6">
<line x1="265" y1="434" x2="265" y2="470" marker-end="url(#a)"/><line x1="435" y1="434" x2="435" y2="470" marker-end="url(#a)"/><line x1="605" y1="434" x2="605" y2="470" marker-end="url(#a)"/><line x1="775" y1="434" x2="775" y2="470" marker-end="url(#a)"/>
</g>
<!-- 进位向量：斜向左下 -->
<g stroke="#1f5fa8" stroke-width="1.8">
<line x1="215" y1="434" x2="100" y2="516" marker-end="url(#ab)"/><line x1="385" y1="434" x2="270" y2="516" marker-end="url(#ab)"/><line x1="555" y1="434" x2="440" y2="516" marker-end="url(#ab)"/><line x1="725" y1="434" x2="610" y2="516" marker-end="url(#ab)"/>
</g>
<text x="60" y="490" font-size="15" fill="#111" font-weight="bold">和 S</text>
<g font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><text x="265" y="490">0</text><text x="435" y="490">0</text><text x="605" y="490">0</text><text x="775" y="490">0</text></g>
<text x="30" y="535" font-size="15" fill="#1f5fa8" font-weight="bold">进位 C</text>
<g font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold"><text x="100" y="535">0</text><text x="270" y="535">1</text><text x="440" y="535">1</text><text x="610" y="535">1</text><text x="780" y="535">0</text></g>
<text x="830" y="490" font-size="14" fill="#111">= 0</text>
<text x="830" y="535" font-size="14" fill="#1f5fa8">= 01110 = 14</text>
<text x="480" y="568" font-size="14" text-anchor="middle" fill="#111">三个数压成两个数：S + C = 0 + 14 = 14 = 5 + 3 + 6。四个全加器互不等待，延迟只有一个全加器（约 2 个门），与位数无关</text>
<text x="480" y="590" font-size="14" text-anchor="middle" fill="#555">蓝色斜线：每位的进位不交给左边的全加器，而是往左挪一位、单独存成第二个数</text>
</svg>
