<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5451b"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<text x="490" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">crossbar = 每个输出端一个"N 选 1"，每条输入线要拉到每一个选择器</text>

<!-- 左：4x4 示意 -->
<text x="260" y="62" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">① 缩小成 4×4 来看（真实的是 32×32）</text>

<!-- 选择信号 -->
<text x="100" y="92" font-size="14" text-anchor="end" fill="#555">选择信号</text>
<g font-size="14" text-anchor="middle" fill="#1f5fa8">
<text x="170" y="92">选 2</text><text x="260" y="92">选 0</text><text x="350" y="92">选 3</text><text x="440" y="92">选 1</text>
</g>
<g stroke="#1f5fa8" stroke-width="1.5">
<line x1="170" y1="97" x2="170" y2="110" marker-end="url(#a)"/><line x1="260" y1="97" x2="260" y2="110" marker-end="url(#a)"/>
<line x1="350" y1="97" x2="350" y2="110" marker-end="url(#a)"/><line x1="440" y1="97" x2="440" y2="110" marker-end="url(#a)"/>
</g>

<!-- 输入线 -->
<g font-size="14" fill="#111" text-anchor="end">
<text x="80" y="140">bank 0</text><text x="80" y="185">bank 1</text><text x="80" y="230">bank 2</text><text x="80" y="275">bank 3</text>
</g>
<g stroke="#444" stroke-width="2">
<line x1="86" y1="135" x2="465" y2="135"/><line x1="86" y1="180" x2="465" y2="180"/>
<line x1="86" y1="225" x2="465" y2="225"/><line x1="86" y1="270" x2="465" y2="270"/>
</g>

<!-- 4 个 MUX -->
<g fill="#f4f4f4" fill-opacity="0.85" stroke="#222" stroke-width="1.8">
<polygon points="150,112 190,112 190,300 180,312 160,312 150,300"/>
<polygon points="240,112 280,112 280,300 270,312 250,312 240,300"/>
<polygon points="330,112 370,112 370,300 360,312 340,312 330,300"/>
<polygon points="420,112 460,112 460,300 450,312 430,312 420,300"/>
</g>
<!-- 输入引脚点 -->
<g fill="#444">
<circle cx="150" cy="135" r="3.5"/><circle cx="150" cy="180" r="3.5"/><circle cx="150" cy="225" r="3.5"/><circle cx="150" cy="270" r="3.5"/>
<circle cx="240" cy="135" r="3.5"/><circle cx="240" cy="180" r="3.5"/><circle cx="240" cy="225" r="3.5"/><circle cx="240" cy="270" r="3.5"/>
<circle cx="330" cy="135" r="3.5"/><circle cx="330" cy="180" r="3.5"/><circle cx="330" cy="225" r="3.5"/><circle cx="330" cy="270" r="3.5"/>
<circle cx="420" cy="135" r="3.5"/><circle cx="420" cy="180" r="3.5"/><circle cx="420" cy="225" r="3.5"/><circle cx="420" cy="270" r="3.5"/>
</g>
<!-- 被选中的通路 -->
<g fill="none" stroke="#b5451b" stroke-width="3">
<polyline points="150,225 170,225 170,312"/>
<polyline points="240,135 260,135 260,312"/>
<polyline points="330,270 350,270 350,312"/>
<polyline points="420,180 440,180 440,312"/>
</g>
<!-- 输出 -->
<g stroke="#b5451b" stroke-width="2">
<line x1="170" y1="312" x2="170" y2="342" marker-end="url(#ar)"/><line x1="260" y1="312" x2="260" y2="342" marker-end="url(#ar)"/>
<line x1="350" y1="312" x2="350" y2="342" marker-end="url(#ar)"/><line x1="440" y1="312" x2="440" y2="342" marker-end="url(#ar)"/>
</g>
<g font-size="14" text-anchor="middle" fill="#111">
<text x="170" y="362">线程 0</text><text x="260" y="362">线程 1</text><text x="350" y="362">线程 2</text><text x="440" y="362">线程 3</text>
</g>
<g font-size="14" text-anchor="middle" fill="#b5451b">
<text x="170" y="382">拿 bank 2</text><text x="260" y="382">拿 bank 0</text><text x="350" y="382">拿 bank 3</text><text x="440" y="382">拿 bank 1</text>
</g>
<text x="260" y="412" font-size="14" text-anchor="middle" fill="#111">灰色竖条 = 一个"4 选 1"多路选择器；圆点 = 它的输入引脚</text>
<text x="260" y="434" font-size="14" text-anchor="middle" fill="#111">4 条输入线 × 4 个选择器 = 16 个接点；32×32 就是 1024 个</text>
<text x="260" y="456" font-size="14" text-anchor="middle" fill="#111">每个接点还要乘上位宽 32：选择器的门和线都按 N × M × W 增长</text>

<line x1="520" y1="55" x2="520" y2="500" stroke="#ccc" stroke-width="1.5"/>

<!-- 右：平方律 -->
<text x="750" y="62" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">② 两端同时翻倍，面积变四倍</text>
<text x="750" y="84" font-size="14" text-anchor="middle" fill="#555">以 8×8 为 1，条长按同一比例</text>
<!-- bars: scale 1 unit = 1.3px; max 256 -> 333px -->
<g font-size="14" fill="#111" text-anchor="end">
<text x="620" y="130">8 × 8</text><text x="620" y="190">16 × 16</text><text x="620" y="250">32 × 32</text><text x="620" y="310">64 × 64</text><text x="620" y="370">128 × 128</text>
</g>
<line x1="630" y1="105" x2="630" y2="390" stroke="#222" stroke-width="1.5"/>
<rect x="630" y="115" width="1.5" height="22" fill="#666"/>
<rect x="630" y="175" width="5.2" height="22" fill="#999" stroke="#555" stroke-width="1"/>
<rect x="630" y="235" width="20.8" height="22" fill="#e9a07f" stroke="#b5451b" stroke-width="1.5"/>
<rect x="630" y="295" width="83.2" height="22" fill="#bbb" stroke="#555" stroke-width="1"/>
<rect x="630" y="355" width="332.8" height="22" fill="#ddd" stroke="#555" stroke-width="1.2"/>
<g font-size="14" fill="#111">
<text x="640" y="131">1×</text><text x="643" y="191">4×</text>
<text x="658" y="251" fill="#b5451b" font-weight="bold">16×</text>
<text x="721" y="311">64×</text>
<text x="880" y="348" text-anchor="middle">256×，已不可行</text>
</g>
<text x="672" y="268" font-size="14" fill="#b5451b">↑ shared memory 读网络：约 9.3 万门</text>
<text x="690" y="288" font-size="14" fill="#b5451b">≈ 六七个 FP32 FMA 单元</text>

<g font-size="14" fill="#111">
<text x="545" y="422">为什么 warp 是 32 不是 128：128 宽的 warp 要 128×128，</text>
<text x="545" y="442">面积是现在的 16 倍。</text>
<text x="545" y="470">为什么上百个 SM 连 L2 不用一个大 crossbar：</text>
<text x="545" y="490">拆成"小 crossbar + 网络"，用多跳延迟换面积。</text>
</g>
<text x="490" y="535" font-size="14" text-anchor="middle" fill="#555">门数按"32 选 1 × 32 位 × 32 个输出 ≈ 90 门 × 32 × 32"估算；未计写方向、地址分发和仲裁逻辑</text>
</svg>
