<line x1="380" y1="225" x2="448" y2="225" stroke="#2e6fb7" stroke-width="3" marker-end="url(#mb)"/>
<text x="325" y="155.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">约 60 GB/s 就够</text>
<text x="325" y="304.9" font-size="14" text-anchor="middle" fill="#777">每个数只搬一次</text>
<line x1="650" y1="225" x2="755" y2="225" stroke="#2f8a4a" stroke-width="4" marker-end="url(#mg)"/>
<text x="703" y="203.2" font-size="15" text-anchor="middle" fill="#2f8a4a" font-weight="bold">0.5 TB/s</text>
<text x="703" y="256.9" font-size="14" text-anchor="middle" fill="#2f8a4a">边缘流量</text>
<text x="550" y="349.9" font-size="14" text-anchor="middle" fill="#222">同一个数在这里被反复送进阵列：</text>
<text x="550" y="371.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">DRAM 流量 = 边缘流量 ÷ 复用次数</text>
<path d="M115,300 C115,420 842,420 842,312" stroke="#c0392b" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#mr)"/>
<text x="480" y="436.9" font-size="14" text-anchor="middle" fill="#c0392b">如果不要 scratchpad、直接从 DRAM 喂：需要 0.5 TB/s，DRAM 只有几十 GB/s，阵列约九成时间在等数据</text>
<text x="480" y="74.9" font-size="14" text-anchor="middle" fill="#777">0.5 TB/s 的来历：每拍左边送进 128 个输入、底边收走 128 个部分和，共 256 个数 × 2 字节 = 512 字节，× 10⁹ 拍/秒</text>
<text x="480" y="98.9" font-size="14" text-anchor="middle" fill="#777">60 GB/s 的来历：切成 1024×1024 的块后，每 65 微秒的计算只需搬入约 4 MB 的下一块（§5）</text>
