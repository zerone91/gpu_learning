<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="sans-serif">
<rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6fb7"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fa0"/></marker></defs>
<text x="460" y="34.3" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">一个 PE 的内部（权重固定）：每一拍都做同一件事</text>
<rect x="150" y="110" width="440" height="340" rx="8" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="8 5" />
<text x="175" y="135.6" font-size="16" text-anchor="start" fill="#222" font-weight="bold">PE(k, n)</text>
<text x="75" y="181.5" font-size="15" text-anchor="middle" fill="#222">左邻居送来</text>
<text x="75" y="201.0" font-size="15" text-anchor="middle" fill="#222">输入 a</text>
<line x1="20" y1="225" x2="188" y2="225" stroke="#2e6fb7" stroke-width="2" marker-end="url(#mb)"/>
<rect x="190" y="200" width="100" height="50" rx="0" fill="#d6e6f7" stroke="#2e6fb7" stroke-width="2" />
<text x="240" y="230.2" font-size="15" text-anchor="middle" fill="#222">输入锁存</text>
<line x1="290" y1="225" x2="460" y2="225" stroke="#2e6fb7" stroke-width="2"/>
<path d="M460,225 A10,10 0 0 1 480,225" stroke="#2e6fb7" stroke-width="2" fill="none"/>
<line x1="480" y1="225" x2="700" y2="225" stroke="#2e6fb7" stroke-width="2" marker-end="url(#mb)"/>
<text x="760" y="217.2" font-size="15" text-anchor="middle" fill="#2e6fb7">原样传给右邻居</text>
<text x="760" y="242.9" font-size="14" text-anchor="middle" fill="#2e6fb7">（下一拍到达）</text>
<circle cx="340" cy="225" r="4" fill="#2e6fb7" stroke="#2e6fb7" stroke-width="1.5"/>
<line x1="340" y1="225" x2="340" y2="297" stroke="#2e6fb7" stroke-width="2" marker-end="url(#mb)"/>
<rect x="180" y="290" width="110" height="58" rx="0" fill="#fbe3c8" stroke="#d9822b" stroke-width="2" />
<text x="235" y="315.2" font-size="15" text-anchor="middle" fill="#222">权重 b[k][n]</text>
<text x="235" y="337.9" font-size="14" text-anchor="middle" fill="#777">装好后不动</text>
<line x1="290" y1="319" x2="318" y2="319" stroke="#d9822b" stroke-width="2" marker-end="url(#mo)"/>
<circle cx="340" cy="320" r="22" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="340" y="327.7" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">×</text>
<text x="340" y="366.9" font-size="14" text-anchor="middle" fill="#777">乘法器</text>
<line x1="362" y1="320" x2="448" y2="320" stroke="#222" stroke-width="2" marker-end="url(#mk)"/>
<text x="405" y="309.9" font-size="14" text-anchor="middle" fill="#222">a×b</text>
<text x="470" y="75.2" font-size="15" text-anchor="middle" fill="#c0392b">上邻居送来部分和 psum_in</text>
<line x1="470" y1="84" x2="470" y2="297" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<circle cx="470" cy="320" r="22" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="470" y="327.7" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">+</text>
<text x="525" y="324.9" font-size="14" text-anchor="middle" fill="#777">加法器</text>
<line x1="470" y1="342" x2="470" y2="383" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<rect x="420" y="385" width="100" height="44" rx="0" fill="#f6d5d1" stroke="#c0392b" stroke-width="2" />
<text x="470" y="412.2" font-size="15" text-anchor="middle" fill="#222">部分和锁存</text>
<line x1="470" y1="429" x2="470" y2="500" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<text x="470" y="525.2" font-size="15" text-anchor="middle" fill="#c0392b">传给下邻居：psum_in + a×b（下一拍到达）</text>
<text x="470" y="547.9" font-size="14" text-anchor="middle" fill="#777">乘法器 + 加法器 合起来就是一个 MAC（乘累加）电路</text>
<rect x="640" y="290" width="260" height="190" rx="6" fill="#fff" stroke="#777" stroke-width="1.5" />
<text x="770" y="317.2" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">PE 里刻意没有的东西</text>
<text x="662" y="350.6" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">✗</text>
<text x="682" y="350.2" font-size="15" text-anchor="start" fill="#222">取指令、译码</text>
<text x="662" y="378.6" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">✗</text>
<text x="682" y="378.2" font-size="15" text-anchor="start" fill="#222">调度器（决定这拍算谁）</text>
<text x="662" y="406.6" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">✗</text>
<text x="682" y="406.2" font-size="15" text-anchor="start" fill="#222">大寄存器堆</text>
<text x="662" y="434.6" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">✗</text>
<text x="682" y="434.2" font-size="15" text-anchor="start" fill="#222">缓存</text>
<text x="662" y="462.6" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">✗</text>
<text x="682" y="462.2" font-size="15" text-anchor="start" fill="#222">访存单元（算地址、发请求）</text>
</svg>
