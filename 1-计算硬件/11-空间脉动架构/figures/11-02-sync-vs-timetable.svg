<text x="480" y="31.9" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">同一件事的两种做法：GPU 在运行时反复“询问”，脉动阵列照着设计时写好的时刻表走</text>
<text x="40" y="69.6" font-size="16" text-anchor="start" fill="#222" font-weight="bold">GPU：三个 warp 各自读显存，再在屏障处会合（示意）</text>
