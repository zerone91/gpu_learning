<text x="480" y="606.9" font-size="14" text-anchor="middle" fill="#c0392b">PE(3,0) 第 6 拍处理的必定是第 6 − 3 − 0 = 3 行输入：设计时就知道，运行时不用问</text>
<text x="480" y="642.9" font-size="14" text-anchor="middle" fill="#777">所有 PE 共用一个时钟、每拍齐步走一格；没有长短不定的等待，也就没有需要确认的事</text>
