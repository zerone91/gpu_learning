<text x="710" y="114.9" font-size="14" text-anchor="start" fill="#7b4fa0">__syncthreads 屏障：</text>
<text x="710" y="136.9" font-size="14" text-anchor="start" fill="#7b4fa0">“都到齐了吗？”</text>
<text x="710" y="169.9" font-size="14" text-anchor="start" fill="#777">灰框“等数据”的长短每次运行都不同</text>
<text x="710" y="191.9" font-size="14" text-anchor="start" fill="#777">所以需要记分牌、屏障来确认</text>
<line x1="30" y1="282" x2="930" y2="282" stroke="#ccc" stroke-width="1.5"/>
