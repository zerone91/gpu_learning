<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif">
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6fb7"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fa0"/></marker></defs>
<text x="480" y="31.9" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">行驻留（Eyeriss）：3×3 卷积核、5 行输入 → 3 行输出，摊到 3×3 个 PE 上</text>
<rect x="25" y="60" width="330" height="250" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.2" />
<text x="190" y="87.2" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">每个 PE 的任务：一行 × 一行</text>
<text x="37" y="122.9" font-size="14" text-anchor="start" fill="#d9822b">卷积核一行</text>
<rect x="135" y="104" width="30" height="28" rx="0" fill="#fbe3c8" stroke="#d9822b" stroke-width="1.5" />
<text x="150" y="122.9" font-size="14" text-anchor="middle" fill="#222">w0</text>
<rect x="169" y="104" width="30" height="28" rx="0" fill="#fbe3c8" stroke="#d9822b" stroke-width="1.5" />
<text x="184" y="122.9" font-size="14" text-anchor="middle" fill="#222">w1</text>
<rect x="203" y="104" width="30" height="28" rx="0" fill="#fbe3c8" stroke="#d9822b" stroke-width="1.5" />
<text x="218" y="122.9" font-size="14" text-anchor="middle" fill="#222">w2</text>
<text x="37" y="174.9" font-size="14" text-anchor="start" fill="#2e6fb7">输入一行</text>
<rect x="105" y="156" width="30" height="28" rx="0" fill="#d6e6f7" stroke="#2e6fb7" stroke-width="1.5" />
<text x="120" y="174.9" font-size="14" text-anchor="middle" fill="#222">x0</text>
<rect x="139" y="156" width="30" height="28" rx="0" fill="#d6e6f7" stroke="#2e6fb7" stroke-width="1.5" />
<text x="154" y="174.9" font-size="14" text-anchor="middle" fill="#222">x1</text>
<rect x="173" y="156" width="30" height="28" rx="0" fill="#d6e6f7" stroke="#2e6fb7" stroke-width="1.5" />
<text x="188" y="174.9" font-size="14" text-anchor="middle" fill="#222">x2</text>
<rect x="207" y="156" width="30" height="28" rx="0" fill="#fff" stroke="#2e6fb7" stroke-width="1.5" />
<text x="222" y="174.9" font-size="14" text-anchor="middle" fill="#222">x3</text>
<rect x="241" y="156" width="30" height="28" rx="0" fill="#fff" stroke="#2e6fb7" stroke-width="1.5" />
<text x="256" y="174.9" font-size="14" text-anchor="middle" fill="#222">x4</text>
<rect x="275" y="156" width="30" height="28" rx="0" fill="#fff" stroke="#2e6fb7" stroke-width="1.5" />
<text x="290" y="174.9" font-size="14" text-anchor="middle" fill="#222">x5</text>
<rect x="309" y="156" width="30" height="28" rx="0" fill="#fff" stroke="#2e6fb7" stroke-width="1.5" />
<text x="324" y="174.9" font-size="14" text-anchor="middle" fill="#222">x6</text>
<text x="37" y="226.9" font-size="14" text-anchor="start" fill="#c0392b">部分和一行</text>
<rect x="139" y="208" width="30" height="28" rx="0" fill="#f6d5d1" stroke="#c0392b" stroke-width="1.5" />
<text x="154" y="226.9" font-size="14" text-anchor="middle" fill="#222">p0</text>
<rect x="173" y="208" width="30" height="28" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5" />
<text x="188" y="226.9" font-size="14" text-anchor="middle" fill="#222">p1</text>
<rect x="207" y="208" width="30" height="28" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5" />
<text x="222" y="226.9" font-size="14" text-anchor="middle" fill="#222">p2</text>
<rect x="241" y="208" width="30" height="28" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5" />
<text x="256" y="226.9" font-size="14" text-anchor="middle" fill="#222">p3</text>
<rect x="275" y="208" width="30" height="28" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5" />
<text x="290" y="226.9" font-size="14" text-anchor="middle" fill="#222">p4</text>
<text x="190" y="266.9" font-size="14" text-anchor="middle" fill="#222">p0 = w0·x0 + w1·x1 + w2·x2</text>
<text x="190" y="290.9" font-size="14" text-anchor="middle" fill="#777">核向右滑一格得 p1，依此类推</text>
<rect x="460" y="95" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="535.0" y="115.9" font-size="14" text-anchor="middle" fill="#777">PE(0,0)</text>
<text x="535.0" y="142.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 0 行</text>
<text x="535.0" y="166.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 0 行</text>
<line x1="535.0" y1="185" x2="535.0" y2="211" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<rect x="620" y="95" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="695.0" y="115.9" font-size="14" text-anchor="middle" fill="#777">PE(0,1)</text>
<text x="695.0" y="142.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 0 行</text>
<text x="695.0" y="166.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 1 行</text>
<line x1="695.0" y1="185" x2="695.0" y2="211" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<rect x="780" y="95" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="855.0" y="115.9" font-size="14" text-anchor="middle" fill="#777">PE(0,2)</text>
<text x="855.0" y="142.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 0 行</text>
<text x="855.0" y="166.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 2 行</text>
<line x1="855.0" y1="185" x2="855.0" y2="211" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<line x1="385" y1="137" x2="455" y2="137" stroke="#d9822b" stroke-width="2.2" marker-end="url(#mo)"/>
<text x="380" y="141.9" font-size="14" text-anchor="end" fill="#d9822b">核第 0 行</text>
<rect x="460" y="213" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="535.0" y="233.9" font-size="14" text-anchor="middle" fill="#777">PE(1,0)</text>
<text x="535.0" y="260.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 1 行</text>
<text x="535.0" y="284.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 1 行</text>
<line x1="535.0" y1="303" x2="535.0" y2="329" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<rect x="620" y="213" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="695.0" y="233.9" font-size="14" text-anchor="middle" fill="#777">PE(1,1)</text>
<text x="695.0" y="260.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 1 行</text>
<text x="695.0" y="284.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 2 行</text>
<line x1="695.0" y1="303" x2="695.0" y2="329" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<rect x="780" y="213" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="855.0" y="233.9" font-size="14" text-anchor="middle" fill="#777">PE(1,2)</text>
<text x="855.0" y="260.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 1 行</text>
<text x="855.0" y="284.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 3 行</text>
<line x1="855.0" y1="303" x2="855.0" y2="329" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>
<line x1="385" y1="255" x2="455" y2="255" stroke="#d9822b" stroke-width="2.2" marker-end="url(#mo)"/>
<text x="380" y="259.9" font-size="14" text-anchor="end" fill="#d9822b">核第 1 行</text>
<rect x="460" y="331" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="535.0" y="351.9" font-size="14" text-anchor="middle" fill="#777">PE(2,0)</text>
<text x="535.0" y="378.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 2 行</text>
<text x="535.0" y="402.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 2 行</text>
<rect x="620" y="331" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="695.0" y="351.9" font-size="14" text-anchor="middle" fill="#777">PE(2,1)</text>
<text x="695.0" y="378.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 2 行</text>
<text x="695.0" y="402.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 3 行</text>
<rect x="780" y="331" width="150" height="88" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" />
<text x="855.0" y="351.9" font-size="14" text-anchor="middle" fill="#777">PE(2,2)</text>
<text x="855.0" y="378.2" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">核第 2 行</text>
<text x="855.0" y="402.2" font-size="15" text-anchor="middle" fill="#2e6fb7" font-weight="bold">× 输入第 4 行</text>
<line x1="385" y1="373" x2="455" y2="373" stroke="#d9822b" stroke-width="2.2" marker-end="url(#mo)"/>
<text x="380" y="377.9" font-size="14" text-anchor="end" fill="#d9822b">核第 2 行</text>
<rect x="776" y="91" width="158" height="96" rx="7" fill="none" stroke="#2e6fb7" stroke-width="2.5" stroke-dasharray="7 4" />
<rect x="616" y="209" width="158" height="96" rx="7" fill="none" stroke="#2e6fb7" stroke-width="2.5" stroke-dasharray="7 4" />
<rect x="456" y="327" width="158" height="96" rx="7" fill="none" stroke="#2e6fb7" stroke-width="2.5" stroke-dasharray="7 4" />
<text x="930" y="77.9" font-size="14" text-anchor="end" fill="#2e6fb7">蓝虚线框：同一条斜线上的 3 个 PE 共用“输入第 2 行”</text>
<line x1="535.0" y1="421" x2="535.0" y2="455" stroke="#c0392b" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="535.0" y="476.2" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">输出第 0 行</text>
<line x1="695.0" y1="421" x2="695.0" y2="455" stroke="#c0392b" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="695.0" y="476.2" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">输出第 1 行</text>
<line x1="855.0" y1="421" x2="855.0" y2="455" stroke="#c0392b" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="855.0" y="476.2" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">输出第 2 行</text>
<text x="695.0" y="499.9" font-size="14" text-anchor="middle" fill="#c0392b">每一列从上到下把 3 行部分和加起来</text>
<text x="30" y="375.2" font-size="15" text-anchor="start" fill="#222" font-weight="bold">三类数据各在哪里被复用：</text>
<text x="30" y="406.9" font-size="14" text-anchor="start" fill="#d9822b">橙：核的同一行横着给一整行 PE 用</text>
<text x="30" y="434.9" font-size="14" text-anchor="start" fill="#2e6fb7">蓝：输入的同一行斜着给一条斜线上的 PE 用</text>
<text x="30" y="462.9" font-size="14" text-anchor="start" fill="#c0392b">红：部分和沿列竖着往下累加</text>
<text x="30" y="500.9" font-size="14" text-anchor="start" fill="#777">输出第 j 行 = 核第 0 行 ⊛ 输入第 j 行</text>
<text x="30" y="524.9" font-size="14" text-anchor="start" fill="#777">　　　　 + 核第 1 行 ⊛ 输入第 j+1 行</text>
<text x="30" y="548.9" font-size="14" text-anchor="start" fill="#777">　　　　 + 核第 2 行 ⊛ 输入第 j+2 行</text>
<text x="30" y="574.9" font-size="14" text-anchor="start" fill="#777">（⊛ 表示左上方框里的“一行 × 一行”）</text>
</svg>
