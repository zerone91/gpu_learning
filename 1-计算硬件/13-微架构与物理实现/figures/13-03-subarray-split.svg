<text x="200" y="500" font-size="14" text-anchor="middle" fill="#111">灵敏放大器</text>
<line x1="150" y1="300" x2="250" y2="300" stroke="#b5451b" stroke-width="2.5"/>
<text x="262" y="296" font-size="14" fill="#b5451b">一根字线</text>
<text x="262" y="120" font-size="14" fill="#1f5fa8">蓝色竖线 = 一根位线，</text>
<text x="262" y="140" font-size="14" fill="#1f5fa8">从顶到底挂了 4096 个单元</text>
<text x="262" y="180" font-size="14" fill="#111">位线电容 ∝ 4096 个单元，</text>
<text x="262" y="200" font-size="14" fill="#111">放电比挂 256 个时慢 16 倍</text>
<text x="262" y="380" font-size="14" fill="#111">每次读，整根长位线</text>
<text x="262" y="400" font-size="14" fill="#111">都要预充电、放电</text>
