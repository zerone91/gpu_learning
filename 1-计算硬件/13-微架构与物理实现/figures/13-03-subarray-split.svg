<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">同样 64 KB：做成一整块，位线太长；切成 16 块子阵列，每次只唤醒一块</text>
<text x="200" y="62" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">① 一整块：4096 行 × 128 列</text>
