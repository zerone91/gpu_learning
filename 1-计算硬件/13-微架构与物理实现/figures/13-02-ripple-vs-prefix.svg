<text x="510" y="310" font-size="14" fill="#1f5fa8">3 级之后，每一位都已知道“从位 0 到我”会不会进位</text>
<text x="510" y="334" font-size="14" fill="#1f5fa8">32 位只要 log₂32 = 5 级，延迟 ∝ log n</text>
<text x="510" y="366" font-size="14" fill="#111">代价：合并节点 17 个（行波只有 8 个），连线更多更长；</text>
<text x="510" y="388" font-size="14" fill="#111">位数越宽差距越大，面积大两三倍</text>
<text x="510" y="428" font-size="14" fill="#555">位 7 的数据来源：位 7、6（第 1 级）</text>
<text x="510" y="450" font-size="14" fill="#555">→ 再并上位 5～4（第 2 级）→ 再并上位 3～0（第 3 级）</text>
