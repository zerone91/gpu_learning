<text x="408" y="341" font-size="14" text-anchor="middle" fill="#111">s</text>
<text x="258.0" y="372" font-size="14" text-anchor="middle" fill="#1f5fa8">16 个 4 位元素 = 64 位</text>
<text x="434" y="334" font-size="14" fill="#b5451b">缩放因子 E4M3，8 位</text>
<text x="434" y="354" font-size="14" fill="#111">开销 8/64 = 12.5%</text>
<text x="434" y="374" font-size="14" fill="#555">块更小、缩放更细；整个张量另有 1 个 FP32 缩放</text>
<line x1="30" y1="400" x2="930" y2="400" stroke="#ccc" stroke-width="1.5"/>
<text x="30" y="430" font-size="16" font-weight="bold" fill="#111">③ 读出来时怎么还原：实际值 = s × 元素（MXFP4 的一块，示意取前 4 个元素）</text>
<rect x="60" y="448" width="90" height="36" fill="#f5c79b" stroke="#b5451b" stroke-width="1.5"/>
<text x="105" y="472" font-size="15" text-anchor="middle" fill="#111">s = 2⁻³</text>
<rect x="200" y="448" width="80" height="36" fill="#d6e4f5" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="240" y="472" font-size="15" text-anchor="middle" fill="#111">3</text>
<line x1="240" y1="484" x2="240" y2="510" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<text x="240" y="530" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">0.375</text>
<rect x="310" y="448" width="80" height="36" fill="#d6e4f5" stroke="#1f5fa8" stroke-width="1.2"/>
