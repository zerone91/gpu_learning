<line x1="350" y1="484" x2="350" y2="510" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<text x="350" y="530" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">−0.1875</text>
<rect x="420" y="448" width="80" height="36" fill="#d6e4f5" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="460" y="472" font-size="15" text-anchor="middle" fill="#111">0.5</text>
<line x1="460" y1="484" x2="460" y2="510" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<text x="460" y="530" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">0.0625</text>
<rect x="530" y="448" width="80" height="36" fill="#d6e4f5" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="570" y="472" font-size="15" text-anchor="middle" fill="#111">6</text>
<line x1="570" y1="484" x2="570" y2="510" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<text x="570" y="530" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">0.75</text>
<text x="660" y="462" font-size="14" fill="#111">……同一块其余 28 个元素</text>
<text x="660" y="484" font-size="14" fill="#111">共用这一个 s</text>
<text x="30" y="568" font-size="14" fill="#111">s 是 2 的幂，所以“乘 s”在电路上就是给每个结果的指数减 3：一次 8 位整数加法，整块只做一次。真正的乘法阵列只处理 4 位的元素。</text>
<text x="30" y="590" font-size="14" fill="#555">元素值和 s 为示意；NVFP4 的 s 带尾数（E4M3），不一定是 2 的幂，但同样整块只乘一次</text>
