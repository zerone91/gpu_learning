<text x="664" y="257" font-size="14" text-anchor="middle" fill="#111">s</text>
<text x="386.0" y="288" font-size="14" text-anchor="middle" fill="#1f5fa8">32 个 4 位元素 = 128 位</text>
<text x="690" y="250" font-size="14" fill="#b5451b">缩放因子 E8M0，8 位</text>
<text x="690" y="270" font-size="14" fill="#111">开销 8/128 = 6.25%</text>
<text x="690" y="290" font-size="14" fill="#555">只能表示 2 的整数次幂</text>
<text x="30" y="342" font-size="15" font-weight="bold" fill="#111">NVFP4</text>
<rect x="130" y="320" width="16" height="32" fill="#d6e4f5" stroke="#1f5fa8" stroke-width="1"/>
