<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">块缩放：4 位数只管“块内的相对大小”，量级交给整块共用的一个缩放因子</text>
<text x="30" y="64" font-size="16" font-weight="bold" fill="#111">① FP4（E2M1）能表示的全部正数：只有 7 个，外加 0</text>
