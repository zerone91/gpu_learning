<text x="886" y="480" font-size="13" text-anchor="middle" fill="#555">2.00 GHz</text>
<rect x="700" y="98" width="16" height="16" fill="#f3c9b5" stroke="#b5451b" stroke-width="1.5"/><text x="724" y="111" font-size="14" fill="#111">相对功耗 ∝ V²·f</text>
<rect x="700" y="122" width="16" height="16" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.5"/><text x="724" y="135" font-size="14" fill="#111">相对性能 ∝ f</text>
<rect x="700" y="146" width="16" height="16" fill="#d6ecd2" stroke="#2e7d32" stroke-width="1.5"/><text x="724" y="159" font-size="14" fill="#111">每瓦性能 = 性能 ÷ 功耗</text>
<text x="490" y="505" font-size="14" text-anchor="middle" fill="#555">数值为示意，按 f ∝ (V − 0.3 伏) 算出，量级与真实 GPU 相当；以高频档为 1</text>
<text x="490" y="527" font-size="14" text-anchor="middle" fill="#555">V 和 f 是运行时旋钮（由 DVFS 调）；α 和 C 是设计时旋钮（靠架构改）</text>
