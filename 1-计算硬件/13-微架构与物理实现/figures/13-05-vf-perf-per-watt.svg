<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="sans-serif">
<rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
<text x="490" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">电压和频率一起降：频率降一半，功耗只剩五分之一，每瓦性能翻 2.4 倍</text>
<text x="210" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">① 想跑多快，就得给多高电压</text>
