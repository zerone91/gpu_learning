<rect x="904" y="320.0" width="28" height="120.0" fill="#d6ecd2" stroke="#2e7d32" stroke-width="1.5"/>
<text x="918" y="314.0" font-size="13" text-anchor="middle" fill="#2e7d32">1.00</text>
