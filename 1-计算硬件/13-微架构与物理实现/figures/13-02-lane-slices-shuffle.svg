<text x="815" y="160" font-size="14" fill="#555">每片只存</text>
<text x="815" y="178" font-size="14" fill="#555">“第 i 号线程”</text>
<text x="815" y="196" font-size="14" fill="#555">的全部寄存器</text>
<text x="815" y="310" font-size="14" fill="#555">片与通路紧挨，</text>
<text x="815" y="328" font-size="14" fill="#555">中间全是短线</text>
<text x="480" y="366" font-size="14" text-anchor="middle" fill="#111">读一个 warp 的 R5：寄存器号“5”同时送到 32 片，每片在自己的 bank 1（R5 所在，橙色）里取值，交给正下方的 lane</text>
<rect x="60" y="410" width="840" height="70" rx="6" fill="#f7dada" stroke="#b5451b" stroke-width="2"/>
<text x="480" y="436" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">另配的跨 lane 交换网络（shuffle 专用管线）</text>
<text x="480" y="460" font-size="14" text-anchor="middle" fill="#111">只支持几种固定模式：按异或配对、整体上移、整体下移、一个 lane 广播给全体</text>
<path d="M140.0,406 C150.0,390 230.0,390 240.0,406" fill="none" stroke="#b5451b" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="190.0" y="392" font-size="14" text-anchor="middle" fill="#b5451b">xor 1：0 ↔ 1</text>
<path d="M400.0,406 C410.0,390 490.0,390 500.0,406" fill="none" stroke="#b5451b" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="450.0" y="392" font-size="14" text-anchor="middle" fill="#b5451b">2 ↔ 3</text>
<text x="480" y="512" font-size="14" text-anchor="middle" fill="#111">这张网络的接线只覆盖这 32 条 lane：warp 之间交换数据，只能写进 shared memory 再读回来</text>
<text x="480" y="540" font-size="14" text-anchor="middle" fill="#111">两个维度互不相干：lane 切片决定“数据在哪条通路旁边”，bank 决定“同一条通路一拍能取几个操作数”</text>
<text x="480" y="570" font-size="14" text-anchor="middle" fill="#555">示意：每片画 4 个 bank；R5 落在 bank 1 按“寄存器号除以 4 的余数”示意；真实 bank 数与映射规则各代不同</text>
</svg>