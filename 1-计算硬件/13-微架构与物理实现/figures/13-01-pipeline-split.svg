<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="480" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">(a + b) × c：在加法器和乘法器之间插一排触发器，最长一段从 210 ps 缩到 160 ps</text>

<!-- 切之前 -->
<text x="30" y="70" font-size="16" font-weight="bold" fill="#111">切之前：一段到底</text>
<rect x="40" y="90" width="44" height="120" fill="#eaf5e9" stroke="#222" stroke-width="1.8"/>
<text x="62" y="155" font-size="14" text-anchor="middle" fill="#111">FF</text>
<text x="62" y="228" font-size="14" text-anchor="middle" fill="#555">a b c</text>
<line x1="84" y1="120" x2="148" y2="120" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="84" y1="140" x2="148" y2="140" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="150" y="100" width="170" height="60" fill="#fdf3e3" stroke="#222" stroke-width="1.8"/>
<text x="235" y="126" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">32 位加法器</text>
<text x="235" y="148" font-size="14" text-anchor="middle" fill="#b5451b">约 50 ps</text>
<line x1="320" y1="130" x2="398" y2="130" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<polyline points="84,190 360,190 360,160 398,160" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="200" y="184" font-size="14" fill="#555">c 直接送过去</text>
<rect x="400" y="100" width="260" height="80" fill="#fdf3e3" stroke="#222" stroke-width="1.8"/>
<text x="530" y="132" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">32×32 乘法器</text>
<text x="530" y="156" font-size="14" text-anchor="middle" fill="#b5451b">约 100 ps</text>
<line x1="660" y1="140" x2="718" y2="140" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="720" y="90" width="44" height="120" fill="#eaf5e9" stroke="#222" stroke-width="1.8"/>
<text x="742" y="155" font-size="14" text-anchor="middle" fill="#111">FF</text>
<text x="790" y="110" font-size="14" fill="#111">一段 = 150 + 60</text>
<text x="790" y="130" font-size="14" fill="#111">= <tspan font-weight="bold">210 ps</tspan></text>
<text x="790" y="152" font-size="14" fill="#111">最高约 4.7 GHz</text>
<text x="790" y="174" font-size="14" fill="#111">1 拍出结果</text>
<text x="790" y="196" font-size="14" fill="#2e7d32">2 GHz 下余量 +290</text>

<!-- 切之后 -->
<line x1="30" y1="250" x2="930" y2="250" stroke="#ccc" stroke-width="1.5"/>
<text x="30" y="285" font-size="16" font-weight="bold" fill="#111">切之后：两段流水</text>
<rect x="40" y="305" width="44" height="120" fill="#eaf5e9" stroke="#222" stroke-width="1.8"/>
<text x="62" y="370" font-size="14" text-anchor="middle" fill="#111">FF</text>
<text x="62" y="443" font-size="14" text-anchor="middle" fill="#555">a b c</text>
<line x1="84" y1="335" x2="148" y2="335" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="84" y1="355" x2="148" y2="355" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="150" y="315" width="170" height="60" fill="#fdf3e3" stroke="#222" stroke-width="1.8"/>
<text x="235" y="341" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">32 位加法器</text>
<text x="235" y="363" font-size="14" text-anchor="middle" fill="#b5451b">约 50 ps</text>
<line x1="320" y1="345" x2="358" y2="345" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="84" y1="405" x2="358" y2="405" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="200" y="398" font-size="14" fill="#555">c 也要进这排 FF</text>
<rect x="360" y="305" width="44" height="120" fill="#f2c9c9" stroke="#b5451b" stroke-width="2.2"/>
<text x="382" y="370" font-size="14" text-anchor="middle" fill="#b5451b" font-weight="bold">FF</text>
<text x="382" y="443" font-size="14" text-anchor="middle" fill="#b5451b">新插的一排</text>
<line x1="404" y1="345" x2="438" y2="345" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="404" y1="385" x2="438" y2="385" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="440" y="315" width="220" height="80" fill="#fdf3e3" stroke="#222" stroke-width="1.8"/>
<text x="550" y="347" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">32×32 乘法器</text>
<text x="550" y="371" font-size="14" text-anchor="middle" fill="#b5451b">约 100 ps</text>
<line x1="660" y1="355" x2="718" y2="355" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="720" y="305" width="44" height="120" fill="#eaf5e9" stroke="#222" stroke-width="1.8"/>
<text x="742" y="370" font-size="14" text-anchor="middle" fill="#111">FF</text>
<text x="790" y="325" font-size="14" fill="#111">第 1 段 50 + 60 = 110</text>
<text x="790" y="347" font-size="14" fill="#111">第 2 段 100 + 60 = 160</text>
<text x="790" y="369" font-size="14" fill="#111">取最长：<tspan font-weight="bold">160 ps</tspan></text>
<text x="790" y="391" font-size="14" fill="#111">最高约 6.2 GHz</text>
<text x="790" y="413" font-size="14" fill="#b5451b">2 拍出结果</text>

<!-- 时间条 -->
<text x="30" y="478" font-size="14" fill="#111">每拍的时长（按比例）：</text>
<rect x="190" y="464" width="420" height="20" fill="#fdf3e3" stroke="#222" stroke-width="1.2"/>
<text x="620" y="479" font-size="14" fill="#111">切之前 210 ps</text>
<rect x="190" y="494" width="320" height="20" fill="#fdf3e3" stroke="#222" stroke-width="1.2"/>
<text x="520" y="509" font-size="14" fill="#111">切之后 160 ps（每拍仍吞进一组新的 a、b、c）</text>
<text x="480" y="534" font-size="14" text-anchor="middle" fill="#555">“+60”= 触发器开销 40 ps（t_cq 20 + 建立时间 20）+ 偏斜余量 20 ps；延迟数字取自正文 §4 的粗算</text>
</svg>
