<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="sans-serif">
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<text x="490" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">TPU v1 的面积去了哪里：存储最多，计算其次，控制只有 2%</text>
<text x="238" y="78" font-size="14" text-anchor="end" fill="#111">统一缓冲（24 MiB 便签存储）</text>
<rect x="250" y="60" width="599.3" height="26" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="857.3" y="78" font-size="14" fill="#1f5fa8">约 29%</text>
<text x="238" y="116" font-size="14" text-anchor="end" fill="#111">矩阵乘单元（256×256 int8）</text>
<rect x="250" y="98" width="496.0" height="26" fill="#f3c9b5" stroke="#b5451b" stroke-width="1.6"/>
<text x="754.0" y="116" font-size="14" fill="#b5451b">约 24%</text>
<text x="238" y="154" font-size="14" text-anchor="end" fill="#111">累加器存储（4 MiB）</text>
<rect x="250" y="136" width="124.0" height="26" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="382.0" y="154" font-size="14" fill="#1f5fa8">约 6%</text>
<text x="238" y="192" font-size="14" text-anchor="end" fill="#111">激活流水线（向量单元）</text>
<rect x="250" y="174" width="124.0" height="26" fill="#d6ecd2" stroke="#2e7d32" stroke-width="1.6"/>
<text x="382.0" y="192" font-size="14" fill="#2e7d32">约 6%</text>
<text x="238" y="230" font-size="14" text-anchor="end" fill="#111">显存接口</text>
<rect x="250" y="212" width="62.0" height="26" fill="#eeeeee" stroke="#555" stroke-width="1.6"/>
<text x="320.0" y="230" font-size="14" fill="#555">约 3%</text>
<text x="238" y="268" font-size="14" text-anchor="end" fill="#111">PCIe 接口</text>
<rect x="250" y="250" width="62.0" height="26" fill="#eeeeee" stroke="#555" stroke-width="1.6"/>
<text x="320.0" y="268" font-size="14" fill="#555">约 3%</text>
<text x="238" y="306" font-size="14" text-anchor="end" fill="#111">其它 I/O</text>
<rect x="250" y="288" width="20.7" height="26" fill="#eeeeee" stroke="#555" stroke-width="1.6"/>
<text x="278.7" y="306" font-size="14" fill="#555">约 1%</text>
<text x="238" y="344" font-size="14" text-anchor="end" fill="#111">控制逻辑</text>
<rect x="250" y="326" width="41.3" height="26" fill="#fff4d6" stroke="#9a6b00" stroke-width="1.6"/>
<text x="299.3" y="344" font-size="14" fill="#9a6b00" font-weight="bold">约 2%</text>
<text x="351.3" y="344" font-size="14" fill="#9a6b00">← 没有动态调度、没有依赖检查、地址由 AGU 生成、同步由软件发</text>
<line x1="20" y1="374" x2="960" y2="374" stroke="#ccc" stroke-width="1.5"/>
<text x="60" y="398" font-size="14" fill="#111">把上表合起来看（整颗 die = 100%）：</text>
<rect x="60.0" y="408" width="301.0" height="34" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.4"/>
<text x="210.5" y="430" font-size="13" text-anchor="middle" fill="#111">存储 35%</text>
<rect x="361.0" y="408" width="206.4" height="34" fill="#f3c9b5" stroke="#b5451b" stroke-width="1.4"/>
<text x="464.2" y="430" font-size="13" text-anchor="middle" fill="#111">计算阵列 24%</text>
<rect x="567.4" y="408" width="51.6" height="34" fill="#d6ecd2" stroke="#2e7d32" stroke-width="1.4"/>
<text x="593.2" y="430" font-size="13" text-anchor="middle" fill="#111">向量 6%</text>
<rect x="619.0" y="408" width="60.2" height="34" fill="#eeeeee" stroke="#555" stroke-width="1.4"/>
<text x="649.1" y="430" font-size="13" text-anchor="middle" fill="#111">接口 7%</text>
<rect x="679.2" y="408" width="17.2" height="34" fill="#fff4d6" stroke="#9a6b00" stroke-width="1.4"/>
<rect x="696.4" y="408" width="223.6" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="808.2" y="430" font-size="13" text-anchor="middle" fill="#111">正文表中未列出的其余部分 约 26%</text>
<text x="687.8" y="462" font-size="13" text-anchor="middle" fill="#9a6b00">控制 2%</text>
<text x="490" y="490" font-size="14" text-anchor="middle" fill="#111">存储（统一缓冲 + 累加器）35% 大于计算阵列 24%：脉动阵列的瓶颈是喂数，不是算力</text>
<text x="490" y="512" font-size="13" text-anchor="middle" fill="#555">占比取自 Google 2017 年 ISCA 论文公布的 die 面积构成，按正文 §7 的表</text>
</svg>