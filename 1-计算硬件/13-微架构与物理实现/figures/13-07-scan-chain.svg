<text x="490" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">扫描链：测试时把所有触发器串成一条长移位寄存器，从芯片外面直接写进、读出内部状态</text>
<ellipse cx="130" cy="95" rx="70" ry="28" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
<text x="130" y="100" font-size="14" text-anchor="middle" fill="#111">组合逻辑</text>
<line x1="130" y1="123" x2="130" y2="150" stroke="#222" stroke-width="1.6"/>
<text x="136" y="142" font-size="13" fill="#555">D</text>
<polygon points="108,150 152,150 144,196 116,196" fill="#fdf0e8" stroke="#b5451b" stroke-width="1.6"/>
<text x="130" y="178" font-size="13" text-anchor="middle" fill="#b5451b">选</text>
<line x1="130" y1="196" x2="130" y2="214" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="100" y="216" width="60" height="44" rx="3" fill="#fff4d6" stroke="#9a6b00" stroke-width="1.8"/>
