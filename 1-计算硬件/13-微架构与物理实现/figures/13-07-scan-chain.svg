<polyline points="380,238 420,238 420,160 552,160" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ab)"/>
<line x1="420" y1="238" x2="420" y2="238" />
<polyline points="420,238 420,270 450,270 450,95 500,95" fill="none" stroke="#222" stroke-width="1.3"/>
<ellipse cx="570" cy="95" rx="70" ry="28" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
<text x="570" y="100" font-size="14" text-anchor="middle" fill="#111">组合逻辑</text>
<line x1="570" y1="123" x2="570" y2="150" stroke="#222" stroke-width="1.6"/>
<text x="576" y="142" font-size="13" fill="#555">D</text>
<polygon points="548,150 592,150 584,196 556,196" fill="#fdf0e8" stroke="#b5451b" stroke-width="1.6"/>
