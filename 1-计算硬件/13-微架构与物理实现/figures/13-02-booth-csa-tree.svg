<rect x="50" y="395" width="78" height="12" fill="#f5c79b" stroke="#222" stroke-width="1"/>
<path d="M132,361 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="50" y="412" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
