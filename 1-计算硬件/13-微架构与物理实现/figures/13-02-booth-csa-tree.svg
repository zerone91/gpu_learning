<line x1="782" y1="370" x2="812" y2="370" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="797.0" y="362" font-size="14" text-anchor="middle" fill="#b5451b">CPA</text>
<rect x="818" y="310" width="78" height="12" fill="#8fcf8f" stroke="#222" stroke-width="1"/>
<text x="857.0" y="536" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 行</text>
<text x="857.0" y="558" font-size="14" text-anchor="middle" fill="#555">CPA 之后</text>
<text x="30" y="594" font-size="14" fill="#111">带括号的三行 = 送进同一排全加器的三个数，出来变两行；灰色的行这一级轮空，直接进下一级。行数按 12 → 8 → 6 → 4 → 3 → 2 递减。</text>
<text x="30" y="618" font-size="14" fill="#111">每级 CSA 约 2 个门延迟，5 级共约 10 个门；最后 48 位 CPA 用并行前缀结构约 6 级。加 12 个数的延迟从“线性”压到了“对数”。</text>
<text x="30" y="642" font-size="14" fill="#555">面积：全加器个数 ≈ 部分积的总位数 ≈ 12 行 × 24 位 = 288，按 n²/2 随尾数位宽平方增长。行的长短与错位未按比例画。</text>
</svg>