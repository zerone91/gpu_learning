<rect x="306" y="310" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="306" y="327" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="306" y="344" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<path d="M388,310 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="306" y="361" width="78" height="12" fill="#f5c79b" stroke="#222" stroke-width="1"/>
<rect x="306" y="378" width="78" height="12" fill="#f5c79b" stroke="#222" stroke-width="1"/>
<rect x="306" y="395" width="78" height="12" fill="#f5c79b" stroke="#222" stroke-width="1"/>
<path d="M388,361 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="345.0" y="536" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">6 行</text>
<text x="345.0" y="558" font-size="14" text-anchor="middle" fill="#555">第 2 级</text>
<line x1="398" y1="370" x2="428" y2="370" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="413.0" y="362" font-size="14" text-anchor="middle" fill="#1f5fa8">CSA</text>
<rect x="434" y="310" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="434" y="327" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="434" y="344" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<path d="M516,310 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="434" y="361" width="78" height="12" fill="#e6e6e6" stroke="#222" stroke-width="1"/>
<text x="473.0" y="536" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">4 行</text>
<text x="473.0" y="558" font-size="14" text-anchor="middle" fill="#555">第 3 级</text>
<line x1="526" y1="370" x2="556" y2="370" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
