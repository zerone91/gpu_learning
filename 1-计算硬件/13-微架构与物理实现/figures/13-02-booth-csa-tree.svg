<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">乘法器 = 生成一行行部分积 + 把很多行压成两行 + 最后加一次</text>
<text x="30" y="62" font-size="16" font-weight="bold" fill="#111">先看小例子：1011 × 1101（11 × 13）</text>
<text x="330" y="92" font-family="monospace" font-size="17" text-anchor="end" fill="#111" xml:space="preserve">1011</text>
<text x="330" y="114" font-family="monospace" font-size="17" text-anchor="end" fill="#111" xml:space="preserve">× 1101</text>
<line x1="200" y1="122" x2="334" y2="122" stroke="#222" stroke-width="1.5"/>
<text x="330" y="142" font-family="monospace" font-size="17" text-anchor="end" fill="#1f5fa8" xml:space="preserve">1011</text>
<text x="330" y="162" font-family="monospace" font-size="17" text-anchor="end" fill="#999" xml:space="preserve">0000 </text>
<text x="330" y="182" font-family="monospace" font-size="17" text-anchor="end" fill="#1f5fa8" xml:space="preserve">1011  </text>
<text x="330" y="202" font-family="monospace" font-size="17" text-anchor="end" fill="#1f5fa8" xml:space="preserve">1011   </text>
<line x1="200" y1="210" x2="334" y2="210" stroke="#222" stroke-width="1.5"/>
<text x="330" y="230" font-family="monospace" font-size="17" text-anchor="end" fill="#111" xml:space="preserve">10001111</text>
<text x="345" y="142" font-size="14" fill="#555">← 乘数最低位 1：抄一份被乘数</text>
<text x="345" y="162" font-size="14" fill="#555">← 这一位是 0：一行零</text>
<text x="345" y="182" font-size="14" fill="#555">← 每行比上一行左移一位</text>
<text x="345" y="230" font-size="14" fill="#555">= 143。蓝色这几行就是“部分积”，乘法就是把它们加起来</text>
<text x="660" y="100" font-size="15" fill="#111" font-weight="bold">放大到 FP32 的 24 位尾数：</text>
<text x="660" y="126" font-size="14" fill="#111">朴素做法：24 行部分积，要加 23 次</text>
<text x="660" y="150" font-size="14" fill="#111">Booth 编码：每次看乘数 2 位（外加 1 位</text>
<text x="660" y="170" font-size="14" fill="#111">重叠），换成 −2、−1、0、+1、+2 之一，</text>
<text x="660" y="190" font-size="14" fill="#111">每 2 位只出 1 行 → <tspan font-weight="bold">12 行</tspan></text>
<line x1="30" y1="252" x2="930" y2="252" stroke="#ccc" stroke-width="1.5"/>
<text x="30" y="282" font-size="16" font-weight="bold" fill="#111">再看 24 位：12 行部分积经过 5 级 3:2 压缩（CSA）变成 2 行，最后一次普通加法（CPA）得到 48 位乘积</text>
<rect x="50" y="310" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="50" y="327" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="50" y="344" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<path d="M132,310 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
