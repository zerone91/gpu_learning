<rect x="50" y="446" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<path d="M132,412 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="50" y="463" width="78" height="12" fill="#f5c79b" stroke="#222" stroke-width="1"/>
<rect x="50" y="480" width="78" height="12" fill="#f5c79b" stroke="#222" stroke-width="1"/>
<rect x="50" y="497" width="78" height="12" fill="#f5c79b" stroke="#222" stroke-width="1"/>
<path d="M132,463 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="89.0" y="536" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">12 行</text>
<text x="89.0" y="558" font-size="14" text-anchor="middle" fill="#555">Booth 之后</text>
<line x1="142" y1="370" x2="172" y2="370" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="157.0" y="362" font-size="14" text-anchor="middle" fill="#1f5fa8">CSA</text>
<rect x="178" y="310" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="178" y="327" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<rect x="178" y="344" width="78" height="12" fill="#9cc3ea" stroke="#222" stroke-width="1"/>
<path d="M260,310 h5 v46 h-5" fill="none" stroke="#222" stroke-width="1.5"/>
