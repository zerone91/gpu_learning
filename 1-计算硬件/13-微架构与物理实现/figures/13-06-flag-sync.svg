<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 485" width="980" height="485" font-family="sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5451b"/></marker></defs>
<rect x="0" y="0" width="980" height="485" fill="#ffffff"/>
<text x="490" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">没有记分牌时的乒乓：每一轮两个方向各要一对 set_flag / wait_flag</text>
<text x="118" y="87" font-size="15" text-anchor="end" font-weight="bold" fill="#111">MTE2</text><text x="118" y="105" font-size="13" text-anchor="end" fill="#555">搬运流水线</text>
<text x="118" y="187" font-size="15" text-anchor="end" font-weight="bold" fill="#111">Cube</text><text x="118" y="205" font-size="13" text-anchor="end" fill="#555">矩阵流水线</text>
<rect x="130.0" y="65" width="167.4" height="50" rx="4" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="213.7" y="95.0" font-size="14" text-anchor="middle" fill="#111">搬 tile0 → A</text>
<rect x="297.4" y="65" width="167.4" height="50" rx="4" fill="#e6dcf0" stroke="#6a3d9a" stroke-width="1.6"/>
<text x="381.0" y="95.0" font-size="14" text-anchor="middle" fill="#111">搬 tile1 → B</text>
<rect x="464.7" y="65" width="46.9" height="50" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="488.1" y="95.0" font-size="14" text-anchor="middle" fill="#111">等</text>
<rect x="511.6" y="65" width="167.4" height="50" rx="4" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="595.2" y="95.0" font-size="14" text-anchor="middle" fill="#111">搬 tile2 → A</text>
<rect x="678.9" y="65" width="46.9" height="50" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="702.4" y="95.0" font-size="14" text-anchor="middle" fill="#111">等</text>
<rect x="725.8" y="65" width="167.4" height="50" rx="4" fill="#e6dcf0" stroke="#6a3d9a" stroke-width="1.6"/>
<text x="809.5" y="95.0" font-size="14" text-anchor="middle" fill="#111">搬 tile3 → B</text>
<rect x="130.0" y="165" width="167.4" height="50" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="213.7" y="195.0" font-size="14" text-anchor="middle" fill="#111">wait_flag：挂起</text>
<rect x="297.4" y="165" width="214.2" height="50" rx="4" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="404.5" y="195.0" font-size="14" text-anchor="middle" fill="#111">算 tile0（读 A）</text>
<rect x="511.6" y="165" width="214.2" height="50" rx="4" fill="#e6dcf0" stroke="#6a3d9a" stroke-width="1.6"/>
<text x="618.7" y="195.0" font-size="14" text-anchor="middle" fill="#111">算 tile1（读 B）</text>
<rect x="725.8" y="165" width="214.2" height="50" rx="4" fill="#cfe2f3" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="832.9" y="195.0" font-size="14" text-anchor="middle" fill="#111">算 tile2（读 A）</text>
<line x1="297.4" y1="115" x2="297.4" y2="163" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<line x1="464.7" y1="115" x2="511.6" y2="163" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<line x1="678.9" y1="115" x2="678.9" y2="163" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<line x1="514.6" y1="165" x2="514.6" y2="117" stroke="#b5451b" stroke-width="2" marker-end="url(#ao)"/>
<line x1="728.8" y1="165" x2="728.8" y2="117" stroke="#b5451b" stroke-width="2" marker-end="url(#ao)"/>
<line x1="130" y1="237" x2="940.0" y2="237" stroke="#222" stroke-width="1.5"/>
<line x1="130.0" y1="237" x2="130.0" y2="242" stroke="#222"/><text x="130.0" y="258" font-size="13" text-anchor="middle" fill="#111">0</text>
<line x1="297.4" y1="237" x2="297.4" y2="242" stroke="#222"/><text x="297.4" y="258" font-size="13" text-anchor="middle" fill="#111">200</text>
<line x1="464.7" y1="237" x2="464.7" y2="242" stroke="#222"/><text x="464.7" y="258" font-size="13" text-anchor="middle" fill="#111">400</text>
<line x1="511.6" y1="237" x2="511.6" y2="242" stroke="#222"/><text x="511.6" y="258" font-size="13" text-anchor="middle" fill="#111">456</text>
<line x1="678.9" y1="237" x2="678.9" y2="242" stroke="#222"/><text x="678.9" y="258" font-size="13" text-anchor="middle" fill="#111">656</text>
<line x1="725.8" y1="237" x2="725.8" y2="242" stroke="#222"/><text x="725.8" y="258" font-size="13" text-anchor="middle" fill="#111">712</text>
<line x1="893.1" y1="237" x2="893.1" y2="242" stroke="#222"/><text x="893.1" y="258" font-size="13" text-anchor="middle" fill="#111">912</text>
<text x="940.0" y="258" font-size="13" text-anchor="end" fill="#111">拍</text>
<line x1="40" y1="287" x2="80" y2="287" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/><text x="88" y="292" font-size="14" fill="#2e7d32">MTE2 set_flag → Cube wait_flag：数据到了，可以读</text>
<line x1="520" y1="287" x2="560" y2="287" stroke="#b5451b" stroke-width="2" marker-end="url(#ao)"/><text x="568" y="292" font-size="14" fill="#b5451b">Cube set_flag → MTE2 wait_flag：这半 buffer 用完了</text>
<text x="40" y="317" font-size="14" fill="#111">搬一块 200 拍、算一块 256 拍：从 tile1 起搬运全被计算盖住，MTE2 每轮反而要"等" 56 拍，等 Cube 腾出那半 buffer。</text>
<line x1="20" y1="335" x2="960" y2="335" stroke="#ccc" stroke-width="1.5"/>
<text x="30" y="357" font-size="15" font-weight="bold" fill="#b5451b">少写任何一个 wait_flag，硬件都不会拦</text>
<text x="30" y="385" font-size="14" fill="#111">少了绿色那对：Cube 在第 100 拍就开始读 A，而 MTE2 才搬了一半 → 读到一半新一半旧的数据。</text>
<text x="30" y="409" font-size="14" fill="#111">少了橙色那对：MTE2 在第 400 拍就往 A 里写 tile2，而 Cube 读 A 要读到第 456 拍 → 最后 56 拍读到的是被覆盖的数据。</text>
<text x="30" y="437" font-size="14" fill="#555">两种错误都不报错、结果只是偶尔不对，而且取决于时序，极难复现。硬件代价则几乎为零：一组标志位寄存器。</text>
</svg>