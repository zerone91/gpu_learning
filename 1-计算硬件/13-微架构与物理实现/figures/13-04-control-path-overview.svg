<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5451b"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">控制通路全景：指令从三级指令缓存流进 16 个 warp 的缓冲，每拍被挑出一条送去执行</text>
<rect x="40" y="50" width="270" height="56" rx="5" fill="#eef3fb" stroke="#222" stroke-width="1.6"/>
<text x="175" y="73" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">指令 L1.5</text>
<text x="175" y="95" font-size="14" text-anchor="middle" fill="#555">若干 SM 共享，上百 KB</text>
<rect x="340" y="50" width="270" height="56" rx="5" fill="#eef3fb" stroke="#222" stroke-width="1.6"/>
<text x="475" y="73" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">L1 指令缓存</text>
<text x="475" y="95" font-size="14" text-anchor="middle" fill="#555">每个 SM 一份，十几～几十 KB</text>
<rect x="640" y="50" width="270" height="56" rx="5" fill="#eef3fb" stroke="#222" stroke-width="1.6"/>
<text x="775" y="73" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">L0 指令缓存</text>
<text x="775" y="95" font-size="14" text-anchor="middle" fill="#555">每个子分区一份，几 KB</text>
<line x1="310" y1="78" x2="338" y2="78" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="610" y1="78" x2="638" y2="78" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="40" y="126" font-size="14" fill="#555">越靠右越小、越快、离发射逻辑越近</text>
<rect x="20" y="140" width="920" height="345" rx="8" fill="#fafafa" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="924" y="164" font-size="15" text-anchor="end" font-weight="bold" fill="#111">一个 SM 子分区（每个 SM 有 4 个）</text>
<polyline points="775,106 775,134 90,134 90,196" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="198" width="100" height="60" rx="4" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="90" y="224" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">取指</text>
<text x="90" y="245" font-size="14" text-anchor="middle" fill="#555">按 PC 取</text>
<line x1="140" y1="228" x2="176" y2="228" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="298" y="176" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">16 个 warp 槽位</text>
<text x="196" y="205" font-size="14" text-anchor="middle" fill="#111">w0</text>
<rect x="216" y="188" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="250" y="188" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="284" y="188" width="30" height="22" fill="#ffffff" stroke="#8a6d3b" stroke-width="1"/>
<rect x="324" y="188" width="96" height="22" fill="#eaf5e9" stroke="#2e7d32" stroke-width="1"/>
<text x="372" y="204" font-size="14" text-anchor="middle" fill="#111">PC·计数·屏障</text>
<text x="196" y="235" font-size="14" text-anchor="middle" fill="#111">w1</text>
<rect x="216" y="218" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="250" y="218" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="284" y="218" width="30" height="22" fill="#ffffff" stroke="#8a6d3b" stroke-width="1"/>
<rect x="324" y="218" width="96" height="22" fill="#eaf5e9" stroke="#2e7d32" stroke-width="1"/>
<text x="372" y="234" font-size="14" text-anchor="middle" fill="#111">PC·计数·屏障</text>
<text x="196" y="265" font-size="14" text-anchor="middle" fill="#111">w2</text>
<rect x="216" y="248" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="250" y="248" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="284" y="248" width="30" height="22" fill="#ffffff" stroke="#8a6d3b" stroke-width="1"/>
<rect x="324" y="248" width="96" height="22" fill="#eaf5e9" stroke="#2e7d32" stroke-width="1"/>
<text x="372" y="264" font-size="14" text-anchor="middle" fill="#111">PC·计数·屏障</text>
<text x="196" y="295" font-size="14" text-anchor="middle" fill="#111">w3</text>
<rect x="216" y="278" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="250" y="278" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="284" y="278" width="30" height="22" fill="#ffffff" stroke="#8a6d3b" stroke-width="1"/>
<rect x="324" y="278" width="96" height="22" fill="#eaf5e9" stroke="#2e7d32" stroke-width="1"/>
<text x="372" y="294" font-size="14" text-anchor="middle" fill="#111">PC·计数·屏障</text>
<text x="196" y="325" font-size="14" text-anchor="middle" fill="#111">w4</text>
<rect x="216" y="308" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="250" y="308" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="284" y="308" width="30" height="22" fill="#ffffff" stroke="#8a6d3b" stroke-width="1"/>
<rect x="324" y="308" width="96" height="22" fill="#eaf5e9" stroke="#2e7d32" stroke-width="1"/>
<text x="372" y="324" font-size="14" text-anchor="middle" fill="#111">PC·计数·屏障</text>
<text x="196" y="355" font-size="14" text-anchor="middle" fill="#111">w5</text>
<rect x="216" y="338" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="250" y="338" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="284" y="338" width="30" height="22" fill="#ffffff" stroke="#8a6d3b" stroke-width="1"/>
<rect x="324" y="338" width="96" height="22" fill="#eaf5e9" stroke="#2e7d32" stroke-width="1"/>
<text x="372" y="354" font-size="14" text-anchor="middle" fill="#111">PC·计数·屏障</text>
<text x="196" y="385" font-size="14" text-anchor="middle" fill="#111">……</text>
<text x="196" y="415" font-size="14" text-anchor="middle" fill="#111">w15</text>
<rect x="216" y="398" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="250" y="398" width="30" height="22" fill="#fdf3e3" stroke="#8a6d3b" stroke-width="1"/>
<rect x="284" y="398" width="30" height="22" fill="#ffffff" stroke="#8a6d3b" stroke-width="1"/>
<rect x="324" y="398" width="96" height="22" fill="#eaf5e9" stroke="#2e7d32" stroke-width="1"/>
<text x="372" y="414" font-size="14" text-anchor="middle" fill="#111">PC·计数·屏障</text>
<text x="266" y="438" font-size="14" text-anchor="middle" fill="#8a6d3b">指令缓冲（几条）</text>
<text x="372" y="438" font-size="14" text-anchor="middle" fill="#2e7d32">每 warp 状态</text>
<line x1="422" y1="300" x2="448" y2="300" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="450" y="262" width="100" height="76" rx="4" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="500" y="292" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">译码</text>
<text x="500" y="314" font-size="14" text-anchor="middle" fill="#555">比特 → 几百</text>
<text x="500" y="332" font-size="14" text-anchor="middle" fill="#555">根控制线</text>
<line x1="550" y1="300" x2="576" y2="300" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="578" y="240" width="130" height="120" rx="4" fill="#fdf3e3" stroke="#b5451b" stroke-width="2"/>
<text x="643" y="266" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">warp 调度器</text>
<text x="643" y="290" font-size="14" text-anchor="middle" fill="#111">16 个就绪位</text>
<text x="643" y="310" font-size="14" text-anchor="middle" fill="#111">→ 每拍选 1 个</text>
<text x="643" y="340" font-size="14" text-anchor="middle" fill="#b5451b">（图 4-5）</text>
<line x1="708" y1="300" x2="734" y2="300" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="736" y="222" width="90" height="60" rx="4" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="781" y="248" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">操作数</text>
<text x="781" y="268" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">收集器</text>
<rect x="736" y="318" width="90" height="46" rx="4" fill="#d6e4f5" stroke="#222" stroke-width="1.6"/>
<text x="781" y="346" font-size="14" text-anchor="middle" fill="#111">寄存器堆</text>
<line x1="781" y1="318" x2="781" y2="284" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="826" y1="252" x2="848" y2="252" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="850" y="196" width="76" height="30" rx="3" fill="#eaf5e9" stroke="#222" stroke-width="1.3"/>
<text x="888" y="216" font-size="14" text-anchor="middle" fill="#111">FMA</text>
<rect x="850" y="232" width="76" height="30" rx="3" fill="#eaf5e9" stroke="#222" stroke-width="1.3"/>
<text x="888" y="252" font-size="14" text-anchor="middle" fill="#111">ALU</text>
<rect x="850" y="268" width="76" height="30" rx="3" fill="#eaf5e9" stroke="#222" stroke-width="1.3"/>
<text x="888" y="288" font-size="14" text-anchor="middle" fill="#111">访存</text>
<rect x="850" y="304" width="76" height="30" rx="3" fill="#eaf5e9" stroke="#222" stroke-width="1.3"/>
<text x="888" y="324" font-size="14" text-anchor="middle" fill="#111">Tensor</text>
<rect x="850" y="340" width="76" height="30" rx="3" fill="#eaf5e9" stroke="#222" stroke-width="1.3"/>
<text x="888" y="360" font-size="14" text-anchor="middle" fill="#111">SFU</text>
<text x="888" y="390" font-size="14" text-anchor="middle" fill="#555">执行管线</text>
<polyline points="888,400 888,452 440,452 440,409 424,409" fill="none" stroke="#b5451b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="660" y="474" font-size="14" text-anchor="middle" fill="#b5451b">访存等变长操作完成时，回头把对应 warp 的屏障计数减 1（§4）</text>
<text x="36" y="512" font-size="14" fill="#111">指令带宽：每个子分区每拍取 1 条 × 16 字节，2 GHz 下 32 GB/s；每个 SM 4 条即 128 GB/s；132 个 SM 合计约 17 TB/s，</text>
<text x="36" y="534" font-size="14" fill="#111">是 HBM3 带宽（约 3.35 TB/s）的五倍——所以指令几乎全靠片上的三级指令缓存供给。</text>
<text x="36" y="566" font-size="14" fill="#555">示意：指令缓冲只画了 3 格，16 个槽位只画了 7 个；各级容量为量级，不同代际有出入。</text>
</svg>