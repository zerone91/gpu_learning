  <text x="586" y="118" font-size="15" font-weight="bold" fill="#111">规则</text>
  <text x="586" y="144" font-size="13" fill="#333">线程 T 拿到第 ⌊T/4⌋ 行的</text>
  <text x="586" y="164" font-size="13" fill="#333">第 2·(T mod 4) 与 2·(T mod 4)+1 两列。</text>
  <text x="586" y="184" font-size="13" fill="#333"></text>
  <text x="586" y="204" font-size="13" fill="#333">例：T5 → 行 ⌊5/4⌋ = 1，</text>
  <text x="586" y="224" font-size="13" fill="#333">列 2×(5 mod 4) = 2 与 3。</text>
  <text x="586" y="244" font-size="13" fill="#333"></text>
  <text x="586" y="264" font-size="13" fill="#333">每 4 个线程分走一整行；</text>
  <text x="586" y="284" font-size="13" fill="#333">8 行 × 4 = 32 个线程，正好一个 warp。</text>
  <text x="586" y="320" font-size="15" font-weight="bold" fill="#111">收到的那 1 个 32 位寄存器</text>
  <rect x="586" y="334" width="110" height="34" fill="#e8f0fd" stroke="#333" stroke-width="1.5"/>
  <rect x="696" y="334" width="110" height="34" fill="#e8f0fd" stroke="#333" stroke-width="1.5"/>
  <text x="641" y="354" font-size="12.5" fill="#222" text-anchor="middle">高 16 位</text>
  <text x="751" y="354" font-size="12.5" fill="#222" text-anchor="middle">低 16 位</text>
  <text x="641" y="386" font-size="12.5" fill="#c0392b" text-anchor="middle">a[1][3]</text>
  <text x="751" y="386" font-size="12.5" fill="#c0392b" text-anchor="middle">a[1][2]</text>
  <text x="586" y="408" font-size="12.5" fill="#555">（T5 的例子；列号小的放在低位）</text>
  <text x="586" y="434" font-size="15" font-weight="bold" fill="#111">加上 .trans 之后</text>
  <text x="586" y="456" font-size="13" fill="#333">地址仍然指向内存里的 8 行行首，</text>
  <text x="586" y="476" font-size="13" fill="#333">但分发规则换成按列走：</text>
  <text x="586" y="496" font-size="13" fill="#333">线程 T 拿到第 ⌊T/4⌋ 列的</text>
  <text x="586" y="516" font-size="13" fill="#333">第 2·(T mod 4) 与 +1 两行。</text>
  <text x="586" y="536" font-size="13" fill="#333">例：T5 → 列 1 的第 2、3 行，</text>
  <text x="586" y="556" font-size="13" fill="#333">即 a[2][1] 与 a[3][1]。</text>
  <text x="586" y="576" font-size="13" fill="#333">整块矩阵被转置着交出来，</text>
  <text x="586" y="596" font-size="13" fill="#333">shared memory 里一个字节都没动。</text>
  <text x="20" y="626" font-size="13" fill="#444">这 8 个地址可以互不相邻：ldmatrix 只要求每行的 16 字节各自对齐，行与行之间怎么排由 shared memory 的布局说了算。</text>
  <text x="20" y="648" font-size="13" fill="#444">x2 改由 t0～t15 给 16 个地址、每线程收 2 个寄存器；x4 由 t0～t31 给 32 个地址、每线程收 4 个寄存器。</text>
</svg>