  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">ldmatrix.sync.aligned.m8n8.x1.shared.b16：谁给地址、谁拿到哪两个元素</text>
  <text x="20" y="52" font-size="14" fill="#444">一个 warp（32 个线程）执行一条指令，搬一个 8×8 的 16 位矩阵。只有前 8 个线程提供地址，32 个线程都收到数据。</text>
