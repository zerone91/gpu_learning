<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9771e"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <!-- row 1 -->
  <text x="20" y="30" font-size="16" font-weight="bold">上：CPU 代理下单（NCCL 的常规网络路径）</text>
  <rect x="40" y="56" width="180" height="84" rx="6" fill="#e6f4e8" stroke="#2e8b3e" stroke-width="2"/>
  <text x="130" y="86" font-size="15" text-anchor="middle" font-weight="bold">GPU</text>
  <text x="130" y="110" font-size="14" text-anchor="middle">kernel 写好数据</text>
  <text x="130" y="130" font-size="14" text-anchor="middle">显存：数据</text>
  <rect x="340" y="56" width="180" height="84" rx="6" fill="#fdf2e6" stroke="#d9771e" stroke-width="2"/>
  <text x="430" y="86" font-size="15" text-anchor="middle" font-weight="bold">CPU 代理线程</text>
  <text x="430" y="110" font-size="14" text-anchor="middle">主机内存：发送队列</text>
  <rect x="640" y="56" width="180" height="84" rx="6" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2"/>
  <text x="730" y="86" font-size="15" text-anchor="middle" font-weight="bold">网卡</text>
  <text x="730" y="110" font-size="14" text-anchor="middle">DMA 引擎</text>
  <line x1="220" y1="84" x2="336" y2="84" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  <text x="278" y="76" font-size="14" text-anchor="middle" fill="#d9771e">① 写标志</text>
  <text x="278" y="106" font-size="14" text-anchor="middle" fill="#d9771e">② 轮询到</text>
  <line x1="520" y1="84" x2="636" y2="84" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  <text x="578" y="76" font-size="14" text-anchor="middle" fill="#d9771e">③ 写 WQE</text>
  <text x="578" y="106" font-size="14" text-anchor="middle" fill="#d9771e">④ 按门铃</text>
  <path d="M130,140 L130,166 L730,166 L730,144" stroke="#1f5fbf" stroke-width="4" fill="none" marker-end="url(#ab)"/>
  <text x="430" y="186" font-size="14" text-anchor="middle" fill="#1f5fbf">⑤ 网卡读主机内存里的 WQE，再直接读显存里的数据（GPUDirect RDMA）</text>
  <line x1="820" y1="98" x2="930" y2="98" stroke="#1f5fbf" stroke-width="4" marker-end="url(#ab)"/>
  <text x="875" y="88" font-size="14" text-anchor="middle" fill="#1f5fbf">网络</text>
  <text x="430" y="36" font-size="14" text-anchor="middle" fill="#555"></text>
  <text x="940" y="30" font-size="14" text-anchor="end" fill="#555">①～④ 这一来回约几微秒</text>

  <line x1="20" y1="210" x2="940" y2="210" stroke="#ccc" stroke-width="1.5"/>

  <!-- row 2 -->
  <text x="20" y="240" font-size="16" font-weight="bold">下：GPU 自己下单（IBGDA / GDAKI），发送队列改放在显存里</text>
  <rect x="40" y="290" width="180" height="84" rx="6" fill="#e6f4e8" stroke="#2e8b3e" stroke-width="2"/>
  <text x="130" y="320" font-size="15" text-anchor="middle" font-weight="bold">GPU</text>
  <text x="130" y="342" font-size="13.5" text-anchor="middle">显存：数据 + 发送队列</text>
  <text x="130" y="362" font-size="13.5" text-anchor="middle">线程写 WQE、按门铃</text>
  <rect x="340" y="290" width="180" height="84" rx="6" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5"/>
  <text x="430" y="336" font-size="15" text-anchor="middle" fill="#999">CPU（不参与）</text>
  <rect x="640" y="290" width="180" height="84" rx="6" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2"/>
  <text x="730" y="320" font-size="15" text-anchor="middle" font-weight="bold">网卡</text>
  <text x="730" y="342" font-size="13.5" text-anchor="middle">门铃寄存器映射给 GPU</text>
  <text x="730" y="362" font-size="13.5" text-anchor="middle">DMA 引擎</text>
  <path d="M190,290 L220,262 L610,262 L660,288" stroke="#d9771e" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <text x="430" y="256" font-size="14" text-anchor="middle" fill="#d9771e">① 写 WQE 到显存里的发送队列　② 写网卡门铃（几条存储指令）</text>
  <path d="M130,374 L130,400 L730,400 L730,378" stroke="#1f5fbf" stroke-width="4" fill="none" marker-end="url(#ab)"/>
  <text x="430" y="424" font-size="14" text-anchor="middle" fill="#1f5fbf">③ 网卡经 PCIe 先读显存里的 WQE，再读显存里的数据，发到网络</text>
  <line x1="820" y1="332" x2="930" y2="332" stroke="#1f5fbf" stroke-width="4" marker-end="url(#ab)"/>
  <text x="875" y="322" font-size="14" text-anchor="middle" fill="#1f5fbf">网络</text>
</svg>
