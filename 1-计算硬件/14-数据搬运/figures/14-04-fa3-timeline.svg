<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="eg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2c7a3f"/>
    </marker>
    <marker id="er" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#b34a4a"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">FlashAttention-3 的稳态：一个 warpgroup 只发订单，两个只算，三种硬件同时在忙</text>
  <text x="20" y="52" font-family="sans-serif" font-size="14" fill="#555">一个线程块 384 线程 = 3 个 warpgroup（每组 128 线程）。S = 3 格 K/V 环形缓冲。每段长度为示意。</text>

  <!-- 列标题 -->
  <g font-family="sans-serif" font-size="13.5" fill="#666" text-anchor="middle">
    <text x="240" y="82">时间片 A</text><text x="420" y="82">时间片 B</text>
    <text x="600" y="82">时间片 C</text><text x="780" y="82">时间片 D</text>
  </g>

  <!-- 生产者 lane -->
  <text x="20" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">WG0 生产者</text>
  <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#666">只有 1 个线程在干活</text>
  <rect x="150" y="92" width="60" height="46" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="180" y="120" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">订 k+2</text>
  <rect x="210" y="92" width="120" height="46" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="270" y="120" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">等 empty</text>
  <rect x="330" y="92" width="60" height="46" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="360" y="120" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">订 k+3</text>
  <rect x="390" y="92" width="120" height="46" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="450" y="120" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">等 empty</text>
  <rect x="510" y="92" width="60" height="46" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="540" y="120" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">订 k+4</text>
  <rect x="570" y="92" width="120" height="46" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="630" y="120" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">等 empty</text>
  <rect x="690" y="92" width="60" height="46" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="720" y="120" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">订 k+5</text>
  <rect x="750" y="92" width="120" height="46" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="810" y="120" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">等 empty</text>
  <text x="884" y="120" font-family="sans-serif" font-size="12.5" fill="#8a4a10">几乎</text>
  <text x="884" y="136" font-family="sans-serif" font-size="12.5" fill="#8a4a10">一直闲着</text>

  <!-- TMA lane -->
  <text x="20" y="176" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">TMA 引擎</text>
  <text x="20" y="194" font-family="sans-serif" font-size="12" fill="#666">不占任何线程</text>
  <g fill="#e8f4ea" stroke="#2c7a3f" stroke-width="1.8">
    <rect x="150" y="156" width="180" height="46"/><rect x="330" y="156" width="180" height="46"/>
    <rect x="510" y="156" width="180" height="46"/><rect x="690" y="156" width="180" height="46"/>
  </g>
  <g font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="240" y="184">搬 K/V 第 k+2 块</text><text x="420" y="184">搬 K/V 第 k+3 块</text>
    <text x="600" y="184">搬 K/V 第 k+4 块</text><text x="780" y="184">搬 K/V 第 k+5 块</text>
  </g>

  <!-- 消费者甲 -->
  <text x="20" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">WG1 消费者甲</text>
  <g stroke-width="1.8">
    <rect x="150" y="220" width="180" height="46" fill="#e6eef8" stroke="#2a5c9a"/>
    <rect x="330" y="220" width="180" height="46" fill="#f5e6f0" stroke="#9a3f7a"/>
    <rect x="510" y="220" width="180" height="46" fill="#e6eef8" stroke="#2a5c9a"/>
    <rect x="690" y="220" width="180" height="46" fill="#f5e6f0" stroke="#9a3f7a"/>
  </g>
  <g font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="240" y="248">矩阵乘（块 k）</text><text x="420" y="248">softmax（块 k）</text>
    <text x="600" y="248">矩阵乘（块 k+2）</text><text x="780" y="248">softmax（块 k+2）</text>
  </g>

  <!-- 消费者乙 -->
  <text x="20" y="304" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">WG2 消费者乙</text>
  <g stroke-width="1.8">
    <rect x="150" y="284" width="180" height="46" fill="#f5e6f0" stroke="#9a3f7a"/>
    <rect x="330" y="284" width="180" height="46" fill="#e6eef8" stroke="#2a5c9a"/>
    <rect x="510" y="284" width="180" height="46" fill="#f5e6f0" stroke="#9a3f7a"/>
    <rect x="690" y="284" width="180" height="46" fill="#e6eef8" stroke="#2a5c9a"/>
  </g>
  <g font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="240" y="312">softmax（块 k−1）</text><text x="420" y="312">矩阵乘（块 k+1）</text>
    <text x="600" y="312">softmax（块 k+1）</text><text x="780" y="312">矩阵乘（块 k+3）</text>
  </g>

  <!-- 硬件占用 -->
  <text x="20" y="368" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">Tensor Core</text>
  <g fill="#e6eef8" stroke="#2a5c9a" stroke-width="1.8">
    <rect x="150" y="348" width="180" height="32"/><rect x="330" y="348" width="180" height="32"/>
    <rect x="510" y="348" width="180" height="32"/><rect x="690" y="348" width="180" height="32"/>
  </g>
  <g font-family="sans-serif" font-size="12.5" fill="#1b3f6b" text-anchor="middle">
    <text x="240" y="369">甲在用</text><text x="420" y="369">乙在用</text><text x="600" y="369">甲在用</text><text x="780" y="369">乙在用</text>
  </g>
  <text x="884" y="369" font-family="sans-serif" font-size="12.5" fill="#1b3f6b">从不空闲</text>

  <text x="20" y="410" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">特殊函数单元</text>
  <g fill="#f5e6f0" stroke="#9a3f7a" stroke-width="1.8">
    <rect x="150" y="390" width="180" height="32"/><rect x="330" y="390" width="180" height="32"/>
    <rect x="510" y="390" width="180" height="32"/><rect x="690" y="390" width="180" height="32"/>
  </g>
  <g font-family="sans-serif" font-size="12.5" fill="#6b2a55" text-anchor="middle">
    <text x="240" y="411">乙在用</text><text x="420" y="411">甲在用</text><text x="600" y="411">乙在用</text><text x="780" y="411">甲在用</text>
  </g>
  <text x="884" y="411" font-family="sans-serif" font-size="12.5" fill="#6b2a55">也不空闲</text>

  <!-- full 箭头 -->
  <line x1="330" y1="206" x2="330" y2="216" stroke="#2c7a3f" stroke-width="2.2" marker-end="url(#eg)"/>
  <line x1="510" y1="206" x2="510" y2="216" stroke="#2c7a3f" stroke-width="2.2" marker-end="url(#eg)"/>
  <text x="336" y="214" font-family="sans-serif" font-size="12" fill="#1d5c2d">full[s] 相位翻面，消费者被放行</text>

  <!-- empty 箭头 -->

  <line x1="20" y1="440" x2="960" y2="440" stroke="#ccc" stroke-width="1.5"/>
  <text x="20" y="468" font-family="sans-serif" font-size="14" fill="#333">任取一个时刻切一刀：TMA 在搬第 k+2 块，一组消费者在 Tensor Core 上算矩阵乘，另一组在特殊函数单元上做 softmax。</text>
  <text x="20" y="494" font-family="sans-serif" font-size="14" fill="#333">三件事用三套不同的硬件，互不抢占。而生产者多半什么都没做——它早就把订单发完了，正停在某个 empty 屏障上。</text>
  <text x="20" y="522" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">生产者只要约 24 个寄存器：因为用 TMA 发单只要 1 个线程、2 条指令、约 4 个（多半是统一）寄存器。</text>
  <text x="20" y="548" font-family="sans-serif" font-size="14" fill="#666">省下的配额由 setmaxnreg 转给两组消费者（各约 240 个/线程）去装输出累加器。</text>
  <text x="20" y="572" font-family="sans-serif" font-size="14" fill="#666">绿色箭头是 full[s]："这一格装满了"，放行消费者。反方向的 empty[s]（消费者用完一格、放行生产者）图中没画，交接过程见图 4-4。</text>
  <text x="20" y="594" font-family="sans-serif" font-size="14" fill="#666">expect_tx 写的是 K 块与 V 块的字节数之和，因为消费者要等的是"K 和 V 都到齐了"。两组消费者错开半拍由命名屏障强制，属于计算侧的编排。</text>
</svg>
