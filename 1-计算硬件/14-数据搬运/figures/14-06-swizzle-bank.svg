<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">ldmatrix 的 8 个行首地址落在哪些 bank 上：直排 vs 128B swizzle</text>
  <text x="20" y="52" font-size="14" fill="#444">tile 每行 128 字节（bf16，64 列）；每个线程一次取 16 字节 = 连续 4 个 bank。bank 号 = (字节地址 ÷ 4) mod 32。</text>

  <!-- ============ Panel A ============ -->
  <text x="20" y="90" font-size="16" font-weight="bold" fill="#111">A. 直排（不做 swizzle）：行 r 的第 0 个 16 字节块，字节偏移 = 128 r</text>

  <g>
    <text x="20" y="122" font-size="13" fill="#444">bank 号</text>
    <g font-size="11" fill="#555" text-anchor="middle">
      <text x="160" y="122">0</text><text x="214" y="122">8</text><text x="268" y="122">16</text>
      <text x="322" y="122">24</text><text x="376" y="122">31</text>
    </g>
    <rect x="160" y="128" width="216" height="18" fill="none" stroke="#999" stroke-width="1.2"/>
  </g>

  <g font-size="12.5">
    <g>
      <text x="20" y="170" fill="#333">线程 t0（行 0）</text>
      <rect x="160" y="158" width="27" height="16" fill="#e05252" stroke="#7a1f1f" stroke-width="1.2"/>
      <text x="400" y="170" fill="#555">偏移 0 → bank 0–3</text>
    </g>
    <g>
      <text x="20" y="192" fill="#333">线程 t1（行 1）</text>
      <rect x="160" y="180" width="27" height="16" fill="#e05252" stroke="#7a1f1f" stroke-width="1.2"/>
      <text x="400" y="192" fill="#555">偏移 128 → (128 ÷ 4) mod 32 = 0 → bank 0–3</text>
    </g>
    <g>
      <text x="20" y="214" fill="#333">线程 t2（行 2）</text>
      <rect x="160" y="202" width="27" height="16" fill="#e05252" stroke="#7a1f1f" stroke-width="1.2"/>
      <text x="400" y="214" fill="#555">偏移 256 → bank 0–3</text>
    </g>
    <g>
      <text x="20" y="236" fill="#333">线程 t3 ～ t7</text>
      <rect x="160" y="224" width="27" height="16" fill="#e05252" stroke="#7a1f1f" stroke-width="1.2"/>
      <text x="400" y="236" fill="#555">偏移 384、512、640、768、896 → 也全在 bank 0–3</text>
    </g>
  </g>
  <rect x="160" y="252" width="216" height="26" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="268" y="270" font-size="13" text-anchor="middle" fill="#7a1f1f">只用到 4 个 bank，其余 28 个闲着</text>
  <text x="400" y="270" font-size="14.5" font-weight="bold" fill="#c0392b">8 路冲突 → 8 拍</text>

  <!-- ============ Panel B ============ -->
  <text x="20" y="322" font-size="16" font-weight="bold" fill="#111">B. Swizzle&lt;3,4,3&gt;（128B 模式）：物理块列 = 逻辑块列 0 异或行号 r，偏移 = 128 r + 16 (0 ⊕ r)</text>

  <g>
    <text x="20" y="354" font-size="13" fill="#444">bank 号</text>
    <g font-size="11" fill="#555" text-anchor="middle">
      <text x="160" y="354">0</text><text x="214" y="354">8</text><text x="268" y="354">16</text>
      <text x="322" y="354">24</text><text x="376" y="354">31</text>
    </g>
    <rect x="160" y="360" width="216" height="18" fill="none" stroke="#999" stroke-width="1.2"/>
  </g>

  <g font-size="12.5">
    <g>
      <text x="20" y="402" fill="#333">线程 t0（行 0）</text>
      <rect x="160" y="390" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="402" fill="#555">块列 0 ⊕ 0 = 0，偏移 0 → bank 0–3</text>
    </g>
    <g>
      <text x="20" y="424" fill="#333">线程 t1（行 1）</text>
      <rect x="187" y="412" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="424" fill="#555">块列 0 ⊕ 1 = 1，偏移 128 + 16 = 144 → bank 4–7</text>
    </g>
    <g>
      <text x="20" y="446" fill="#333">线程 t2（行 2）</text>
      <rect x="214" y="434" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="446" fill="#555">块列 0 ⊕ 2 = 2，偏移 256 + 32 = 288 → bank 8–11</text>
    </g>
    <g>
      <text x="20" y="468" fill="#333">线程 t3（行 3）</text>
      <rect x="241" y="456" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="468" fill="#555">块列 3，偏移 384 + 48 = 432 → bank 12–15</text>
    </g>
    <g>
      <text x="20" y="490" fill="#333">线程 t4（行 4）</text>
      <rect x="268" y="478" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="490" fill="#555">块列 4，偏移 512 + 64 = 576 → bank 16–19</text>
    </g>
    <g>
      <text x="20" y="512" fill="#333">线程 t5（行 5）</text>
      <rect x="295" y="500" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="512" fill="#555">块列 5，偏移 640 + 80 = 720 → bank 20–23</text>
    </g>
    <g>
      <text x="20" y="534" fill="#333">线程 t6（行 6）</text>
      <rect x="322" y="522" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="534" fill="#555">块列 6，偏移 768 + 96 = 864 → bank 24–27</text>
    </g>
    <g>
      <text x="20" y="556" fill="#333">线程 t7（行 7）</text>
      <rect x="349" y="544" width="27" height="16" fill="#2e7d32" stroke="#14431a" stroke-width="1.2"/>
      <text x="400" y="556" fill="#555">块列 7，偏移 896 + 112 = 1008 → bank 28–31</text>
    </g>
  </g>

  <rect x="160" y="572" width="216" height="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="268" y="590" font-size="13" text-anchor="middle" fill="#14431a">32 个 bank 恰好各被占一次</text>
  <text x="400" y="590" font-size="14.5" font-weight="bold" fill="#2e7d32">无冲突 → 1 拍</text>

  <text x="20" y="624" font-size="13" fill="#444">数据没有换到别的行去，只是在本行内部换了一个 16 字节块的位置；读的时候再算一次同样的异或就能找回来。</text>
</svg>
