<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="sans-serif">
<rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb7"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker></defs>
<text x="500" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">两种搬法用同一组记分牌计数器：左边数读取笔数，右边数拷贝组数</text>
<line x1="498" y1="50" x2="498" y2="486" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="28" y="70" font-size="15" text-anchor="start" fill="#2c6fb7" font-weight="bold">① LDG：计数器由指令自己登记，调度器自动检查</text>
<rect x="36" y="88" width="190" height="34" fill="#cfe0f3" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="131.0" y="109.68" font-size="13" text-anchor="middle" fill="#222222">LDG.E  R2, [R0]</text>
<text x="234" y="104" font-size="12" text-anchor="start" fill="#2c6fb7">写登记号 = 2 号</text>
<text x="234" y="120" font-size="12" text-anchor="start" fill="#777777">（它要写目的寄存器 R2）</text>
<line x1="128" y1="122" x2="128" y2="154" stroke="#2c6fb7" stroke-width="2" marker-end="url(#ab)"/>
<text x="139" y="144" font-size="12" text-anchor="start" fill="#2c6fb7">发射时 2 号加一</text>
<rect x="36" y="158" width="200" height="38" fill="#f7f7f7" stroke="#222222" stroke-width="1.5" rx="3"/>
<rect x="40" y="162" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="54" y="182" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="54" y="210" font-size="11" text-anchor="middle" fill="#777777">SB0</text>
<rect x="72" y="162" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="86" y="182" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="86" y="210" font-size="11" text-anchor="middle" fill="#777777">SB1</text>
<rect x="104" y="162" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="118" y="182" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">1</text>
<text x="112" y="210" font-size="11" text-anchor="middle" fill="#777777">SB2</text>
<rect x="136" y="162" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="150" y="182" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="150" y="210" font-size="11" text-anchor="middle" fill="#777777">SB3</text>
<rect x="168" y="162" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="182" y="182" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="182" y="210" font-size="11" text-anchor="middle" fill="#777777">SB4</text>
<rect x="200" y="162" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="214" y="182" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="214" y="210" font-size="11" text-anchor="middle" fill="#777777">SB5</text>
<text x="246" y="176" font-size="12" text-anchor="start" fill="#222222">一个 warp 的 6 个计数器。</text>
<text x="246" y="192" font-size="12" text-anchor="start" fill="#222222">格子里是当前的值。</text>
<rect x="36" y="232" width="190" height="34" fill="#f8e3e0" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="131.0" y="253.68" font-size="13" text-anchor="middle" fill="#222222">数据写进寄存器 R2</text>
<line x1="128" y1="232" x2="128" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="234" y="252" font-size="12" text-anchor="start" fill="#c0392b">这一刻 2 号减一</text>
<rect x="36" y="300" width="190" height="34" fill="#fde6c8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="131.0" y="321.68" font-size="13" text-anchor="middle" fill="#222222">FFMA R7, R2, R8, R9</text>
<text x="234" y="320" font-size="12" text-anchor="start" fill="#1f7a4d">等待掩码 = 2 号</text>
<line x1="128" y1="300" x2="128" y2="270" stroke="#1f7a4d" stroke-width="2" marker-end="url(#ag)" stroke-dasharray="5 4"/>
<text x="36" y="366" font-size="13" text-anchor="start" fill="#222222">加一、减一、检查三件事都由编译器安排在控制</text>
<text x="36" y="386" font-size="13" text-anchor="start" fill="#222222">位里。程序员看不见，也管不着。减一的事件只</text>
<text x="36" y="406" font-size="13" text-anchor="start" fill="#222222">有一个：目的寄存器被写入。</text>
<text x="524" y="70" font-size="15" text-anchor="start" fill="#1f7a4d" font-weight="bold">② cp.async：加一由 commit 指令做，检查由程序员插</text>
<rect x="530" y="88" width="176" height="28" fill="#d7ede1" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="618.0" y="105.96" font-size="11" text-anchor="middle" fill="#222222">LDGSTS.E.BYPASS.128</text>
<text x="712" y="107" font-size="11" text-anchor="start" fill="#777777">写登记号：无</text>
<rect x="530" y="119" width="176" height="28" fill="#b9dcc8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="618.0" y="137.32" font-size="12" text-anchor="middle" fill="#222222">LDGDEPBAR</text>
<text x="712" y="138" font-size="11" text-anchor="start" fill="#1f7a4d">写登记号：SB0   →   SB0 = 1</text>
<rect x="530" y="154" width="176" height="28" fill="#d7ede1" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="618.0" y="171.96" font-size="11" text-anchor="middle" fill="#222222">LDGSTS.E.BYPASS.128</text>
<text x="712" y="173" font-size="11" text-anchor="start" fill="#777777">写登记号：无</text>
<rect x="530" y="185" width="176" height="28" fill="#b9dcc8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="618.0" y="203.32" font-size="12" text-anchor="middle" fill="#222222">LDGDEPBAR</text>
<text x="712" y="204" font-size="11" text-anchor="start" fill="#1f7a4d">写登记号：SB0   →   SB0 = 2</text>
<rect x="530" y="220" width="176" height="28" fill="#d7ede1" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="618.0" y="237.96" font-size="11" text-anchor="middle" fill="#222222">LDGSTS.E.BYPASS.128</text>
<text x="712" y="239" font-size="11" text-anchor="start" fill="#777777">写登记号：无</text>
<rect x="530" y="251" width="176" height="28" fill="#b9dcc8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="618.0" y="269.32" font-size="12" text-anchor="middle" fill="#222222">LDGDEPBAR</text>
<text x="712" y="270" font-size="11" text-anchor="start" fill="#1f7a4d">写登记号：SB0   →   SB0 = 3</text>
<text x="530" y="302" font-size="12" text-anchor="start" fill="#c0392b">第 0 组的数据全部写进 shared memory，SB0 减一：</text>
<rect x="530" y="312" width="200" height="38" fill="#f7f7f7" stroke="#222222" stroke-width="1.5" rx="3"/>
<rect x="534" y="316" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="548" y="336" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">2</text>
<text x="548" y="364" font-size="11" text-anchor="middle" fill="#777777">SB0</text>
<rect x="566" y="316" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="580" y="336" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="580" y="364" font-size="11" text-anchor="middle" fill="#777777">SB1</text>
<rect x="598" y="316" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="612" y="336" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="612" y="364" font-size="11" text-anchor="middle" fill="#777777">SB2</text>
<rect x="630" y="316" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="644" y="336" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="644" y="364" font-size="11" text-anchor="middle" fill="#777777">SB3</text>
<rect x="662" y="316" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="676" y="336" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="676" y="364" font-size="11" text-anchor="middle" fill="#777777">SB4</text>
<rect x="694" y="316" width="28" height="30" fill="#ffffff" stroke="#999999" stroke-width="1" rx="3"/>
<text x="708" y="336" font-size="14" text-anchor="middle" fill="#444444">0</text>
<text x="708" y="364" font-size="11" text-anchor="middle" fill="#777777">SB5</text>
<text x="742" y="330" font-size="12" text-anchor="start" fill="#222222">SB0 的值就是还没到货的组数。</text>
<text x="742" y="346" font-size="12" text-anchor="start" fill="#c0392b">3 组提交过，1 组已到货，剩 2 组。</text>
<rect x="530" y="380" width="196" height="32" fill="#b9dcc8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="628.0" y="400.68" font-size="13" text-anchor="middle" fill="#222222">DEPBAR.LE SB0, 0x1</text>
<text x="736" y="394" font-size="12" text-anchor="start" fill="#1f7a4d">要求 SB0 ≤ 1。此刻是 2，</text>
<text x="736" y="410" font-size="12" text-anchor="start" fill="#1f7a4d">所以这个 warp 停下等第 1 组。</text>
<text x="524" y="444" font-size="13" text-anchor="start" fill="#222222">加一由一条独立的指令 LDGDEPBAR 做，检查由程序员插入的</text>
<text x="524" y="464" font-size="13" text-anchor="start" fill="#222222">DEPBAR 做。减一的事件是：这一组的数据全部写进了 shared</text>
<text x="524" y="484" font-size="13" text-anchor="start" fill="#222222">memory。</text>
<text x="500" y="520" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">计数的单位从“一笔读取”变成了“一组拷贝”，计数器本身还是那 6 个。</text>
</svg>
