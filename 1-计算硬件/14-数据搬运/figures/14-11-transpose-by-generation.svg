<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="sans-serif">
<rect x="0" y="0" width="1100" height="520" fill="#ffffff"/>
<defs>
  <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#333"/>
  </marker>
</defs>

<text x="24" y="32" font-size="20" font-weight="bold" fill="#111">转置一代比一代往里挪：从一条独立的取数指令，挪成矩阵指令里的一位开关</text>
<text x="24" y="56" font-size="14" fill="#555">三代都一样的一点：显存到片上缓冲这一段永远做不到转置。橙色是搬运引擎，蓝色是取数指令，绿色是矩阵指令。</text>

<!-- column headers -->
<text x="40" y="92" font-size="13" fill="#555">代际</text>
<text x="200" y="92" font-size="13" fill="#555">显存 → shared memory</text>
<text x="470" y="92" font-size="13" fill="#555">shared memory → 计算侧</text>
<text x="760" y="92" font-size="13" fill="#555">矩阵指令</text>
<text x="950" y="92" font-size="13" fill="#555">转置的代价</text>
<line x1="34" y1="100" x2="1066" y2="100" stroke="#999" stroke-width="1.2"/>

<!-- ===== row 1: Turing / Ampere ===== -->
<text x="40" y="150" font-size="15" font-weight="bold" fill="#111">Turing</text>
<text x="40" y="170" font-size="15" font-weight="bold" fill="#111">Ampere</text>

<rect x="150" y="122" width="220" height="60" fill="#fae3c8" stroke="#c06000" stroke-width="1.6"/>
<text x="260" y="146" font-size="14" fill="#111" text-anchor="middle">cp.async（Ampere）</text>
<text x="260" y="168" font-size="14" fill="#111" text-anchor="middle">或 TMA（Hopper 起）</text>

<line x1="374" y1="152" x2="414" y2="152" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>

<rect x="418" y="122" width="250" height="60" fill="#d7e3f4" stroke="#2a5080" stroke-width="1.6"/>
<text x="543" y="146" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">ldmatrix.trans</text>
<text x="543" y="168" font-size="12.5" fill="#333" text-anchor="middle">独立的取数指令，数据先进寄存器</text>

<line x1="672" y1="152" x2="712" y2="152" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>

<rect x="716" y="122" width="180" height="60" fill="#dce8dc" stroke="#2f6b2f" stroke-width="1.6"/>
<text x="806" y="146" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">mma</text>
<text x="806" y="168" font-size="12.5" fill="#333" text-anchor="middle">从寄存器取操作数</text>

<text x="916" y="148" font-size="13" fill="#111">一条 warp 级指令，</text>
<text x="916" y="168" font-size="13" fill="#111">占一次发射</text>

<!-- ===== row 2: Hopper ===== -->
<text x="40" y="256" font-size="15" font-weight="bold" fill="#111">Hopper</text>

<rect x="150" y="228" width="220" height="60" fill="#fae3c8" stroke="#c06000" stroke-width="1.6"/>
<text x="260" y="256" font-size="14" fill="#111" text-anchor="middle">TMA</text>
<text x="260" y="276" font-size="12.5" fill="#333" text-anchor="middle">按描述符搬一个分块进片上</text>

<line x1="374" y1="258" x2="712" y2="258" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
<rect x="430" y="244" width="226" height="28" fill="#ffffff" stroke="none"/>
<text x="543" y="252" font-size="12.5" fill="#888" text-anchor="middle">这一格没有了：</text>
<text x="543" y="270" font-size="12.5" fill="#888" text-anchor="middle">矩阵指令直接从片上缓冲读操作数</text>

<rect x="716" y="228" width="180" height="60" fill="#dce8dc" stroke="#2f6b2f" stroke-width="1.6"/>
<text x="806" y="252" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">wgmma.mma_async</text>
<text x="806" y="274" font-size="12.5" fill="#333" text-anchor="middle">imm-trans-a / imm-trans-b</text>

<text x="916" y="248" font-size="13" fill="#111">一个立即数，</text>
<text x="916" y="268" font-size="13" fill="#111">不额外占发射</text>

<!-- ===== row 3: Blackwell ===== -->
<text x="40" y="362" font-size="15" font-weight="bold" fill="#111">Blackwell</text>

<rect x="150" y="334" width="220" height="60" fill="#fae3c8" stroke="#c06000" stroke-width="1.6"/>
<text x="260" y="362" font-size="14" fill="#111" text-anchor="middle">TMA</text>
<text x="260" y="382" font-size="12.5" fill="#333" text-anchor="middle">按描述符搬一个分块进片上</text>

<line x1="374" y1="364" x2="712" y2="364" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
<rect x="430" y="350" width="226" height="28" fill="#ffffff" stroke="none"/>
<text x="543" y="358" font-size="12.5" fill="#888" text-anchor="middle">这一格也没有</text>
<text x="543" y="376" font-size="12.5" fill="#888" text-anchor="middle">（搬进 TMEM 由 tcgen05.cp 另做）</text>

<rect x="716" y="334" width="180" height="60" fill="#dce8dc" stroke="#2f6b2f" stroke-width="1.6"/>
<text x="806" y="358" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">tcgen05.mma</text>
<text x="806" y="380" font-size="12.5" fill="#333" text-anchor="middle">指令描述符第 15、16 位</text>

<text x="916" y="354" font-size="13" fill="#111">描述符里的一位，</text>
<text x="916" y="374" font-size="13" fill="#111">不额外占发射</text>

<!-- red note under the left column -->
<line x1="150" y1="404" x2="370" y2="404" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="260" y="424" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">三代都一样：描述符表达不了转置</text>
<text x="260" y="444" font-size="12" fill="#c0392b" text-anchor="middle">描述符只给出除最内维之外各维的步长，</text>
<text x="260" y="462" font-size="12" fill="#c0392b" text-anchor="middle">最内维必须连续，没有地方写"换一个维度当最内维"</text>

<!-- bottom conclusion -->
<rect x="420" y="408" width="646" height="74" fill="#f0f4f8" stroke="#4a6b8a" stroke-width="1.5"/>
<text x="436" y="432" font-size="14" font-weight="bold" fill="#111">往里挪的结果是代价越来越小</text>
<text x="436" y="454" font-size="13" fill="#111">转置必须由一个按元素重新分发数据的部件来做。TMA 只按块搬运，没有这个部件。</text>
<text x="436" y="474" font-size="13" fill="#111">所以转置只能落在更靠内的那一段，由取数的一方负责。</text>
</svg>
