<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="bold" fill="#111">同一个 A 分块走到矩阵单元，三种硬件各要几跳，其中几跳要在运行时对账</text>
  <text x="36" y="58" font-size="14" fill="#555">实心方块表示这一跳有自己的完成记录，空心方块表示没有。跳数多不等于对账多。</text>

  <!-- legend -->
  <rect x="640" y="76" width="18" height="18" fill="#a94442"/>
  <text x="666" y="91" font-size="13" fill="#333">有完成记录</text>
  <rect x="760" y="76" width="18" height="18" fill="#ffffff" stroke="#a94442" stroke-width="2"/>
  <text x="786" y="91" font-size="13" fill="#333">没有完成记录</text>

  <!-- row 1: Hopper -->
  <text x="36" y="134" font-size="16" font-weight="bold" fill="#1a3a66">Hopper</text>
  <rect x="36" y="146" width="112" height="52" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="92" y="170" font-size="14" fill="#6b1f1f" text-anchor="middle">显存</text>
  <text x="92" y="188" font-size="12" fill="#6b1f1f" text-anchor="middle">HBM</text>

  <line x1="148" y1="172" x2="230" y2="172" stroke="#2c5aa0" stroke-width="3"/>
  <polygon points="244,172 226,164 226,180" fill="#2c5aa0"/>
  <rect x="180" y="146" width="16" height="16" fill="#a94442"/>
  <text x="196" y="202" font-size="12" fill="#1a3a66" text-anchor="middle">TMA 引擎</text>

  <rect x="250" y="146" width="150" height="52" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="325" y="170" font-size="14" fill="#1a3a66" text-anchor="middle">shared memory</text>
  <text x="325" y="188" font-size="12" fill="#1a3a66" text-anchor="middle">每 SM 最多 228 KB</text>

  <line x1="400" y1="172" x2="482" y2="172" stroke="#2f6b2f" stroke-width="3"/>
  <polygon points="496,172 478,164 478,180" fill="#2f6b2f"/>
  <rect x="432" y="146" width="16" height="16" fill="#a94442"/>
  <text x="448" y="218" font-size="12" fill="#1b4620" text-anchor="middle">128 个线程发 wgmma</text>

  <rect x="502" y="146" width="112" height="52" fill="#dff0d8" stroke="#2f6b2f" stroke-width="2"/>
  <text x="558" y="176" font-size="14" fill="#1b4620" text-anchor="middle">矩阵单元</text>

  <rect x="650" y="140" width="314" height="64" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="664" y="160" font-size="13" fill="#222">2 跳，2 处要在运行时对账。</text>
  <text x="664" y="180" font-size="13" fill="#222">完成记录：跳 ① 在 shared memory 的 mbarrier 上，</text>
  <text x="664" y="196" font-size="13" fill="#222">跳 ② 在那个 warpgroup 自己的计数器上。</text>

  <!-- row 2: Ascend -->
  <text x="36" y="254" font-size="16" font-weight="bold" fill="#6b1f1f">昇腾</text>
  <rect x="36" y="266" width="92" height="52" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="82" y="290" font-size="14" fill="#6b1f1f" text-anchor="middle">GM</text>
  <text x="82" y="308" font-size="12" fill="#6b1f1f" text-anchor="middle">片外显存</text>

  <line x1="128" y1="292" x2="180" y2="292" stroke="#2c5aa0" stroke-width="3"/>
  <polygon points="194,292 176,284 176,300" fill="#2c5aa0"/>
  <rect x="145" y="266" width="16" height="16" fill="#a94442"/>
  <text x="156" y="322" font-size="12" fill="#1a3a66" text-anchor="middle">MTE2</text>

  <rect x="200" y="266" width="110" height="52" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="255" y="290" font-size="14" fill="#1a3a66" text-anchor="middle">L1 Buffer</text>
  <text x="255" y="308" font-size="12" fill="#1a3a66" text-anchor="middle">1 MB</text>

  <line x1="310" y1="292" x2="362" y2="292" stroke="#2c5aa0" stroke-width="3"/>
  <polygon points="376,292 358,284 358,300" fill="#2c5aa0"/>
  <rect x="327" y="266" width="16" height="16" fill="#a94442"/>
  <text x="338" y="322" font-size="12" fill="#1a3a66" text-anchor="middle">MTE1</text>

  <rect x="382" y="266" width="110" height="52" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="437" y="290" font-size="14" fill="#1a3a66" text-anchor="middle">L0A</text>
  <text x="437" y="308" font-size="12" fill="#1a3a66" text-anchor="middle">64 KB</text>

  <line x1="492" y1="292" x2="544" y2="292" stroke="#2f6b2f" stroke-width="3"/>
  <polygon points="558,292 540,284 540,300" fill="#2f6b2f"/>
  <rect x="509" y="266" width="16" height="16" fill="#ffffff" stroke="#a94442" stroke-width="2"/>
  <text x="520" y="322" font-size="12" fill="#1b4620" text-anchor="middle">阵列自取</text>

  <rect x="564" y="266" width="76" height="52" fill="#dff0d8" stroke="#2f6b2f" stroke-width="2"/>
  <text x="602" y="296" font-size="14" fill="#1b4620" text-anchor="middle">Cube</text>

  <rect x="650" y="260" width="314" height="64" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="664" y="280" font-size="13" fill="#222">3 跳，2 处要在运行时对账。</text>
  <text x="664" y="300" font-size="13" fill="#222">完成记录：两跳各占核内标志表的一格。</text>
  <text x="664" y="316" font-size="13" fill="#222">跳 ③ 没有自己的记录，它跟着跳 ② 的那一格走。</text>

  <!-- row 3: TPU -->
  <text x="36" y="374" font-size="16" font-weight="bold" fill="#5a4400">TPU</text>
  <rect x="36" y="386" width="92" height="52" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="82" y="410" font-size="14" fill="#6b1f1f" text-anchor="middle">HBM</text>
  <text x="82" y="428" font-size="12" fill="#6b1f1f" text-anchor="middle">片外显存</text>

  <line x1="128" y1="412" x2="180" y2="412" stroke="#2c5aa0" stroke-width="3"/>
  <polygon points="194,412 176,404 176,420" fill="#2c5aa0"/>
  <rect x="145" y="386" width="16" height="16" fill="#a94442"/>
  <text x="160" y="442" font-size="12" fill="#1a3a66" text-anchor="middle">DMA 引擎</text>

  <rect x="200" y="386" width="110" height="52" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="255" y="410" font-size="14" fill="#1a3a66" text-anchor="middle">VMEM</text>
  <text x="255" y="428" font-size="12" fill="#1a3a66" text-anchor="middle">16～128 MiB</text>

  <line x1="310" y1="412" x2="362" y2="412" stroke="#2c5aa0" stroke-width="3"/>
  <polygon points="376,412 358,404 358,420" fill="#2c5aa0"/>
  <rect x="327" y="386" width="16" height="16" fill="#ffffff" stroke="#a94442" stroke-width="2"/>
  <text x="338" y="442" font-size="12" fill="#1a3a66" text-anchor="middle">向量读取</text>

  <rect x="382" y="386" width="110" height="52" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="437" y="410" font-size="14" fill="#1a3a66" text-anchor="middle">向量寄存器</text>
  <text x="437" y="428" font-size="12" fill="#1a3a66" text-anchor="middle">8 × 128 个 32 位数</text>

  <line x1="492" y1="412" x2="544" y2="412" stroke="#2f6b2f" stroke-width="3"/>
  <polygon points="558,412 540,404 540,420" fill="#2f6b2f"/>
  <rect x="509" y="386" width="16" height="16" fill="#ffffff" stroke="#a94442" stroke-width="2"/>
  <text x="520" y="442" font-size="12" fill="#1b4620" text-anchor="middle">推入</text>

  <rect x="564" y="386" width="76" height="52" fill="#dff0d8" stroke="#2f6b2f" stroke-width="2"/>
  <text x="602" y="416" font-size="14" fill="#1b4620" text-anchor="middle">MXU</text>

  <rect x="650" y="380" width="314" height="64" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="664" y="400" font-size="13" fill="#222">3 跳，只有 1 处要在运行时对账。</text>
  <text x="664" y="420" font-size="13" fill="#222">完成记录：跳 ① 在信号量存储里的一个计数器上。</text>
  <text x="664" y="436" font-size="13" fill="#222">后两跳的延迟是固定拍数，由编译器直接排。</text>

  <!-- bottom -->
  <rect x="36" y="466" width="928" height="78" fill="#fffdf2" stroke="#b8860b" stroke-width="2"/>
  <text x="56" y="490" font-size="16" font-weight="bold" fill="#5a4400">一跳要不要完成记录，看的是它花多少拍能不能事先算出来。</text>
  <text x="56" y="514" font-size="14" fill="#333">片外一跳三家都算不出来，因为显存要排队、要刷新，别的核也在抢它，所以三家都要对账。片上的几跳，昇腾和</text>
  <text x="56" y="536" font-size="14" fill="#333">TPU 的缓冲没有标签、不会未命中，拍数固定，所以能省掉记录。</text>
</svg>
