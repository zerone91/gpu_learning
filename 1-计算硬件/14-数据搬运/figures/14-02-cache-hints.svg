<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold">缓存提示改变的不是"取哪个数"，而是"取回来之后留不留、留多久"</text>
  <text x="20" y="52" font-size="14" fill="#444">四种提示都读同一个地址、得到同一个值。差别只在于这一段数据在 L1 和 L2 里占不占位子、排在淘汰队列的哪一头。</text>

  <!-- four hint rows -->
  <g font-size="13">
    <rect x="20" y="78" width="120" height="30" fill="#ddd" stroke="#666"/><text x="30" y="98" font-weight="bold">写法</text>
    <rect x="140" y="78" width="180" height="30" fill="#ddd" stroke="#666"/><text x="150" y="98" font-weight="bold">在 L1 里</text>
    <rect x="320" y="78" width="200" height="30" fill="#ddd" stroke="#666"/><text x="330" y="98" font-weight="bold">在 L2 里</text>
    <rect x="520" y="78" width="440" height="30" fill="#ddd" stroke="#666"/><text x="530" y="98" font-weight="bold">什么时候用它</text>

    <rect x="20" y="108" width="120" height="34" fill="#fff" stroke="#666"/><text x="30" y="130" font-family="monospace">ld.global.ca</text>
    <rect x="140" y="108" width="180" height="34" fill="#e6f2e6" stroke="#666"/><text x="150" y="130">留一份（默认）</text>
    <rect x="320" y="108" width="200" height="34" fill="#e6f2e6" stroke="#666"/><text x="330" y="130">留一份，正常淘汰顺序</text>
    <rect x="520" y="108" width="440" height="34" fill="#fff" stroke="#666"/><text x="530" y="130">这块数据同一个 SM 里还要再读——默认就是它，不用写</text>

    <rect x="20" y="142" width="120" height="34" fill="#fff" stroke="#666"/><text x="30" y="164" font-family="monospace">ld.global.cg</text>
    <rect x="140" y="142" width="180" height="34" fill="#fdecec" stroke="#666"/><text x="150" y="164">不留（绕过 L1）</text>
    <rect x="320" y="142" width="200" height="34" fill="#e6f2e6" stroke="#666"/><text x="330" y="164">留一份，正常淘汰顺序</text>
    <rect x="520" y="142" width="440" height="34" fill="#fff" stroke="#666"/><text x="530" y="164">本 SM 只读一次，但别的 SM 也要读——腾出 L1 给真正复用的数据</text>

    <rect x="20" y="176" width="120" height="34" fill="#fff" stroke="#666"/><text x="30" y="198" font-family="monospace">ld.global.cs</text>
    <rect x="140" y="176" width="180" height="34" fill="#fff6e6" stroke="#666"/><text x="150" y="198">留，但排在最先被扔</text>
    <rect x="320" y="176" width="200" height="34" fill="#fff6e6" stroke="#666"/><text x="330" y="198">留，但排在最先被扔</text>
    <rect x="520" y="176" width="440" height="34" fill="#fff" stroke="#666"/><text x="530" y="198">流水一样过一遍的数据（逐元素 kernel 的输入），别挤掉别人</text>

    <rect x="20" y="210" width="120" height="34" fill="#fff" stroke="#666"/><text x="30" y="232" font-family="monospace">ld.global.lu</text>
    <rect x="140" y="210" width="180" height="34" fill="#fff6e6" stroke="#666"/><text x="150" y="232">读完就当没用过</text>
    <rect x="320" y="210" width="200" height="34" fill="#fff6e6" stroke="#666"/><text x="330" y="232">同上（对显存地址等同 .cs）</text>
    <rect x="520" y="210" width="440" height="34" fill="#fff" stroke="#666"/><text x="530" y="232">"这是最后一次读它"，典型用途是把溢出到显存的寄存器读回来</text>
  </g>

  <!-- L2 residency -->
  <text x="20" y="284" font-size="16" font-weight="bold">另一种提示：把一段地址钉在 L2 里（L2 驻留控制）</text>
  <text x="20" y="306" font-size="13" fill="#444">上面四种是逐条指令的。下面这种是整个 kernel 一次性设定的：告诉硬件"这一段地址我会反复读，优先让它留在 L2"。</text>

  <rect x="20" y="322" width="330" height="150" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <text x="34" y="344" font-size="14" font-weight="bold">在程序里怎么写</text>
  <g font-size="12" font-family="monospace">
    <text x="34" y="368">// 先从 L2 划一块出来专用</text>
    <text x="34" y="386">cudaDeviceSetLimit(</text>
    <text x="34" y="404">  cudaLimitPersistingL2CacheSize, size);</text>
    <text x="34" y="426">// 再指定哪一段地址享受这块</text>
    <text x="34" y="444">w.base_ptr = ptr;  w.num_bytes = n;</text>
    <text x="34" y="462">w.hitProp  = cudaAccessPropertyPersisting;</text>
  </g>

  <rect x="370" y="322" width="590" height="150" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="384" y="344" font-size="14" font-weight="bold">硬件里发生了什么</text>

  <text x="384" y="372" font-size="12">L2 的容量被划成两部分：</text>
  <rect x="384" y="382" width="380" height="34" fill="#e6eefc" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="574" y="404" font-size="13" text-anchor="middle" fill="#2a5d9f">常规部分：谁都能用，先来后到</text>
  <rect x="764" y="382" width="180" height="34" fill="#fdf1e6" stroke="#b5651d" stroke-width="1.5"/>
  <text x="854" y="404" font-size="13" text-anchor="middle" fill="#b5651d">留出部分</text>

  <text x="384" y="436" font-size="12">被标成"常驻"的那段地址优先占用右边这块；别人只能在它空着的时候借用。</text>
  <text x="384" y="456" font-size="12" fill="#a33">标多了适得其反：留出的部分装不下，常规部分反被挤小，所以按数据实际大小来定。</text>

  <text x="20" y="504" font-size="13" fill="#444">这些提示的共同点：它们都不改变程序的结果，只改变数据在缓存里的命运。写错了不会算错，只会变慢——所以它们叫"提示"。</text>
  <text x="20" y="526" font-size="13" fill="#444">对应的判断依据也统一：这块数据接下来还有没有人读、读它的是不是同一个 SM。答不上来，就别加提示。</text>
</svg>
