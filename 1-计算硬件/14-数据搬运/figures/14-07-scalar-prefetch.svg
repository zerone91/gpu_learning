<rect x="416" y="114" width="48" height="32" fill="#cfe8cf" stroke="#2e7d32" stroke-width="1.5"/>
<text x="440.0" y="136" font-size="15" fill="#222" text-anchor="middle">1</text>
<rect x="464" y="114" width="48" height="32" fill="#e6d3f2" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="488.0" y="136" font-size="15" fill="#222" text-anchor="middle">3</text>
<rect x="512" y="114" width="48" height="32" fill="#f9e79f" stroke="#9a7d0a" stroke-width="1.5"/>
<text x="536.0" y="136" font-size="15" fill="#222" text-anchor="middle">3</text>
<text x="314" y="173" font-size="13" fill="#222" text-anchor="end">idxs_k</text>
<rect x="320" y="150" width="48" height="32" fill="#f6c89f" stroke="#b5651d" stroke-width="1.5"/>
<text x="344.0" y="172" font-size="15" fill="#222" text-anchor="middle">0</text>
<rect x="368" y="150" width="48" height="32" fill="#bcd7f0" stroke="#2c5aa0" stroke-width="1.5"/>
