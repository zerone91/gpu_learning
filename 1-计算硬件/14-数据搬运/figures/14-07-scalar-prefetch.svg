<text x="215.0" y="328" font-size="13" fill="#555" text-anchor="middle">3</text>
<rect x="43" y="226" width="84" height="20" fill="#ffffff"/>
<text x="46" y="241" font-size="13" fill="#999">第 2 行全零</text>
<text x="40" y="354" font-size="13" fill="#444">程序只存 5 个非零块，</text>
<text x="40" y="372" font-size="13" fill="#444">按行号分组排好</text>
<text x="320" y="82" font-size="15" font-weight="bold" fill="#222">SMEM（流水开始前搬进来）</text>
<text x="314" y="106" font-size="13" fill="#555" text-anchor="end">下标</text>
<text x="344.0" y="106" font-size="13" fill="#555" text-anchor="middle">0</text>
