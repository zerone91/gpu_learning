<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="sans-serif">
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb7"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f8d7d2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c0392b" stroke-width="1.6"/></pattern></defs>
<text x="480" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">commit_group 把已发出的拷贝打成一包，wait_group N 等到“未到货的包 ≤ N”</text>
<text x="480" y="52" font-size="13" text-anchor="middle" fill="#666666">（横轴是时间，长度示意；这本账每个线程各记一本）</text>
<line x1="160" y1="460" x2="920" y2="460" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="922" y="465" font-size="14" text-anchor="start" fill="#222222">时间</text>
<text x="160" y="92" font-size="14" text-anchor="end" fill="#222222" font-weight="bold">线程发出的指令</text>
<rect x="170" y="76" width="96" height="34" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="218.0" y="97.68" font-size="13" text-anchor="middle" fill="#222222">cp.async ×4</text>
<rect x="272" y="76" width="78" height="34" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="311.0" y="97.68" font-size="13" text-anchor="middle" fill="#222222">commit</text>
<rect x="356" y="76" width="96" height="34" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="404.0" y="97.68" font-size="13" text-anchor="middle" fill="#222222">cp.async ×4</text>
<rect x="458" y="76" width="78" height="34" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="497.0" y="97.68" font-size="13" text-anchor="middle" fill="#222222">commit</text>
<rect x="542" y="76" width="96" height="34" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="590.0" y="97.68" font-size="13" text-anchor="middle" fill="#222222">cp.async ×4</text>
<rect x="644" y="76" width="78" height="34" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="683.0" y="97.68" font-size="13" text-anchor="middle" fill="#222222">commit</text>
<rect x="728" y="76" width="120" height="34" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="3"/>
<text x="788.0" y="97.68" font-size="13" text-anchor="middle" fill="#222222">wait_group 1</text>
<text x="160" y="174" font-size="14" text-anchor="end" fill="#222222">第 0 组（块 0）</text>
<rect x="170" y="150" width="330" height="34" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="182" y="173" font-size="13" text-anchor="start" fill="#1f7a4d">数据在路上 → 已到货</text>
<text x="160" y="236" font-size="14" text-anchor="end" fill="#222222">第 1 组（块 1）</text>
<rect x="356" y="212" width="564" height="34" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="368" y="235" font-size="13" text-anchor="start" fill="#2c6fb7">数据在路上 → 还在飞</text>
<text x="160" y="298" font-size="14" text-anchor="end" fill="#222222">第 2 组（块 2）</text>
<rect x="542" y="274" width="378" height="34" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="554" y="297" font-size="13" text-anchor="start" fill="#2c6fb7">数据在路上 → 还在飞</text>
<line x1="848" y1="120" x2="848" y2="470" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="842" y="136" font-size="13" text-anchor="end" fill="#c0392b" font-weight="bold">wait_group 1 在这里放行</text>
<text x="842" y="154" font-size="13" text-anchor="end" fill="#c0392b">它只要求未到货的包 ≤ 1</text>
<text x="160" y="400" font-size="14" text-anchor="end" fill="#222222" font-weight="bold">未到货的包数</text>
<rect x="170" y="386" width="186" height="26" fill="#f2f2f2" stroke="#666666" stroke-width="1.2" rx="2"/>
<text x="263.0" y="404" font-size="14" text-anchor="middle" fill="#1f7a4d" font-weight="bold">1</text>
<rect x="356" y="386" width="186" height="26" fill="#fdeeea" stroke="#666666" stroke-width="1.2" rx="2"/>
<text x="449.0" y="404" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">2</text>
<rect x="542" y="386" width="306" height="26" fill="#fdeeea" stroke="#666666" stroke-width="1.2" rx="2"/>
<text x="695.0" y="404" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">3</text>
<rect x="848" y="386" width="52" height="26" fill="#f2f2f2" stroke="#666666" stroke-width="1.2" rx="2"/>
<text x="874.0" y="404" font-size="14" text-anchor="middle" fill="#1f7a4d" font-weight="bold">1</text>
<rect x="20" y="476" width="920" height="34" fill="#fbfbfb" stroke="#666666" stroke-width="1.5" rx="4"/>
<text x="36" y="498" font-size="13" text-anchor="start" fill="#222222">写成 wait_group 0：连第 1、2 组也要等，流水退回“搬一块算一块”。写成 wait_group 2：第 0 组可能还没到，就去读它——读到缓冲区里上一轮的旧数据。</text>
</svg>
