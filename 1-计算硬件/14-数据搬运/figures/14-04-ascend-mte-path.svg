<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="b1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2a5c9a"/>
    </marker>
    <marker id="b2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2c7a3f"/>
    </marker>
    <marker id="b3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#c2691a"/>
    </marker>
    <marker id="b4" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#7a3f9a"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">昇腾 AI Core：四个搬运单元，各管存储层级里的一段路</text>
  <text x="20" y="52" font-family="sans-serif" font-size="14" fill="#555">每条彩色箭头是一个搬运单元负责的路段。它们是和计算单元并列的、各自独立推进的指令流水线。</text>

  <!-- GM -->
  <rect x="20" y="80" width="130" height="380" rx="6" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <text x="85" y="108" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">GM</text>
  <text x="85" y="132" font-family="sans-serif" font-size="13.5" fill="#555" text-anchor="middle">Global Memory</text>
  <text x="85" y="152" font-family="sans-serif" font-size="13.5" fill="#555" text-anchor="middle">片外的 HBM</text>
  <text x="85" y="182" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">容量大</text>
  <text x="85" y="202" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">离计算远</text>

  <!-- AI Core 框 -->
  <rect x="200" y="80" width="760" height="380" rx="8" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="210" y="100" font-family="sans-serif" font-size="14" fill="#777">AI Core（片上，以下都是软件显式管理的 SRAM）</text>

  <!-- L1 -->
  <rect x="230" y="120" width="150" height="90" rx="6" fill="#e6eef8" stroke="#2a5c9a" stroke-width="2"/>
  <text x="305" y="146" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b3f6b" text-anchor="middle">L1 Buffer</text>
  <text x="305" y="170" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">大块中转区</text>
  <text x="305" y="190" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">同一份数据在这里被复用</text>

  <!-- L0A/L0B -->
  <rect x="440" y="120" width="140" height="90" rx="6" fill="#e6eef8" stroke="#2a5c9a" stroke-width="2"/>
  <text x="510" y="146" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b3f6b" text-anchor="middle">L0A / L0B</text>
  <text x="510" y="170" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Cube 的左 / 右操作数</text>
  <text x="510" y="190" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">贴着计算阵列</text>

  <!-- Cube -->
  <rect x="640" y="120" width="130" height="90" rx="6" fill="#e8f4ea" stroke="#2c7a3f" stroke-width="2.2"/>
  <text x="705" y="152" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1d5c2d" text-anchor="middle">Cube</text>
  <text x="705" y="176" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">矩阵计算单元</text>

  <!-- L0C -->
  <rect x="640" y="240" width="130" height="80" rx="6" fill="#e6eef8" stroke="#2a5c9a" stroke-width="2"/>
  <text x="705" y="268" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b3f6b" text-anchor="middle">L0C</text>
  <text x="705" y="292" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">矩阵结果（累加值）</text>

  <!-- UB -->
  <rect x="440" y="360" width="150" height="80" rx="6" fill="#e6eef8" stroke="#2a5c9a" stroke-width="2"/>
  <text x="515" y="388" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b3f6b" text-anchor="middle">UB</text>
  <text x="515" y="410" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Unified Buffer</text>
  <text x="515" y="430" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">向量单元的源和目标</text>

  <!-- Vector -->
  <rect x="650" y="360" width="120" height="80" rx="6" fill="#e8f4ea" stroke="#2c7a3f" stroke-width="2.2"/>
  <text x="710" y="392" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1d5c2d" text-anchor="middle">Vector</text>
  <text x="710" y="414" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">向量计算单元</text>

  <!-- MTE2: GM -> L1 -->
  <line x1="154" y1="150" x2="226" y2="150" stroke="#2a5c9a" stroke-width="3" marker-end="url(#b1)"/>
  <text x="158" y="142" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1b3f6b">MTE2</text>
  <!-- MTE2: GM -> UB -->
  <path d="M154,300 L200,300 L200,390 L436,390" fill="none" stroke="#2a5c9a" stroke-width="3" marker-end="url(#b1)"/>
  <text x="252" y="382" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1b3f6b">MTE2：GM → UB</text>
  <!-- MTE2: GM -> L0A/B 直达（虚线） -->
  <path d="M154,200 L190,200 L190,230 L410,230 L410,196 L436,196" fill="none" stroke="#2a5c9a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#b1)"/>
  <text x="222" y="248" font-family="sans-serif" font-size="12.5" fill="#1b3f6b">MTE2 也能 GM 直达 L0A/L0B</text>

  <!-- MTE1: L1 -> L0A/L0B -->
  <line x1="384" y1="160" x2="436" y2="160" stroke="#2c7a3f" stroke-width="3" marker-end="url(#b2)"/>
  <text x="378" y="146" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1d5c2d">MTE1</text>
  <!-- L0A/B -> Cube（不是搬运单元，是读取） -->
  <line x1="584" y1="160" x2="636" y2="160" stroke="#666" stroke-width="2" marker-end="url(#b1)"/>
  <text x="586" y="146" font-family="sans-serif" font-size="12" fill="#666">读操作数</text>
  <!-- Cube -> L0C -->
  <line x1="705" y1="214" x2="705" y2="236" stroke="#666" stroke-width="2" marker-end="url(#b1)"/>

  <!-- FixPipe: L0C -> GM / L1 -->
  <path d="M636,280 L200,280 L200,214 L154,214" fill="none" stroke="#7a3f9a" stroke-width="3" marker-end="url(#b4)"/>
  <text x="360" y="272" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#5c2d7a">FixPipe：L0C → GM / L1，可随路做格式与类型转换</text>

  <!-- MTE3: UB -> GM -->
  <path d="M436,420 L215,420 L215,330 L154,330" fill="none" stroke="#c2691a" stroke-width="3" marker-end="url(#b3)"/>
  <text x="252" y="440" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#8a4a10">MTE3：UB → GM</text>

  <!-- UB <-> Vector -->
  <line x1="594" y1="390" x2="646" y2="390" stroke="#666" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="646" y1="412" x2="594" y2="412" stroke="#666" stroke-width="2" marker-end="url(#b1)"/>

  <!-- 图例与说明 -->
  <line x1="20" y1="486" x2="960" y2="486" stroke="#ccc" stroke-width="1.5"/>
  <rect x="20" y="500" width="24" height="6" fill="#2a5c9a"/>
  <text x="54" y="510" font-family="sans-serif" font-size="14" fill="#333">MTE2：从片外往片内搬（GM → L1 / L0A、L0B / UB），整条数据流的入口</text>
  <rect x="20" y="524" width="24" height="6" fill="#2c7a3f"/>
  <text x="54" y="534" font-family="sans-serif" font-size="14" fill="#333">MTE1：片内的二次分发（L1 → L0A/L0B，L1 → BT Buffer）</text>
  <rect x="20" y="548" width="24" height="6" fill="#c2691a"/>
  <text x="54" y="558" font-family="sans-serif" font-size="14" fill="#333">MTE3：向量计算结果的出口（UB → GM）</text>
  <rect x="520" y="548" width="24" height="6" fill="#7a3f9a"/>
  <text x="554" y="558" font-family="sans-serif" font-size="14" fill="#333">FixPipe：矩阵结果的出口（L0C → GM / L1）</text>
  <text x="20" y="584" font-family="sans-serif" font-size="13.5" fill="#666">分工按昇腾社区 CANN 9.0 文档的 AI Core 架构页。不同 CANN 版本对 MTE3 覆盖范围的写法略有出入。灰色箭头是计算单元读写自己的缓冲，不属于搬运单元。</text>
</svg>
