<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="bold" fill="#111">缓存提示改的不是取哪个数，而是取回来之后在缓存里留不留、排在淘汰队列的哪一头</text>
  <text x="24" y="56" font-size="13.5" fill="#444">下面几种写法读同一个地址，得到同一个值。差别只在这段数据占不占 L1、L2 的位子。</text>

  <!-- table -->
  <rect x="24" y="72" width="932" height="248" rx="6" fill="#ffffff" stroke="#999"/>
  <line x1="24" y1="100" x2="956" y2="100" stroke="#999"/>
  <text x="38" y="92" font-size="12.5" font-weight="bold" fill="#111">PTX 写法</text>
  <text x="230" y="92" font-size="12.5" font-weight="bold" fill="#111">在 L1 里</text>
  <text x="352" y="92" font-size="12.5" font-weight="bold" fill="#111">在 L2 里</text>
  <text x="474" y="92" font-size="12.5" font-weight="bold" fill="#111">sm_90a 上编出的机器码</text>
  <text x="700" y="92" font-size="12.5" font-weight="bold" fill="#111">什么时候用它</text>

  <g font-size="12">
    <rect x="24" y="100" width="932" height="30" fill="#fafafa"/>
    <text x="38" y="120" fill="#333" font-family="monospace">ld.global.ca</text>
    <rect x="226" y="106" width="110" height="19" fill="#eaf6ec"/><text x="281" y="120" fill="#2e7d32" text-anchor="middle">留，正常顺序</text>
    <rect x="348" y="106" width="110" height="19" fill="#eaf6ec"/><text x="403" y="120" fill="#2e7d32" text-anchor="middle">留，正常顺序</text>
    <text x="474" y="120" fill="#111" font-family="monospace">LDG.E.STRONG.SM</text>
    <text x="700" y="120" fill="#444">默认值。本 SM 里还要再读</text>

    <text x="38" y="150" fill="#333" font-family="monospace">ld.global.cg</text>
    <rect x="226" y="136" width="110" height="19" fill="#fdecea"/><text x="281" y="150" fill="#c0392b" text-anchor="middle">不留，绕过 L1</text>
    <rect x="348" y="136" width="110" height="19" fill="#eaf6ec"/><text x="403" y="150" fill="#2e7d32" text-anchor="middle">留，正常顺序</text>
    <text x="474" y="150" fill="#111" font-family="monospace">LDG.E.STRONG.GPU</text>
    <text x="700" y="150" fill="#444">本 SM 只读一次，别的 SM 要读</text>

    <rect x="24" y="160" width="932" height="30" fill="#fafafa"/>
    <text x="38" y="180" fill="#333" font-family="monospace">ld.global.cs</text>
    <rect x="226" y="166" width="110" height="19" fill="#fff6e5"/><text x="281" y="180" fill="#b45309" text-anchor="middle">留，最先被淘汰</text>
    <rect x="348" y="166" width="110" height="19" fill="#fff6e5"/><text x="403" y="180" fill="#b45309" text-anchor="middle">留，最先被淘汰</text>
    <text x="474" y="180" fill="#111" font-family="monospace">LDG.E.EF</text>
    <text x="700" y="180" fill="#444">过一遍就不要的数据</text>

    <text x="38" y="210" fill="#333" font-family="monospace">ld.global.lu</text>
    <rect x="226" y="196" width="110" height="19" fill="#fff6e5"/><text x="281" y="210" fill="#b45309" text-anchor="middle">同 .cs</text>
    <rect x="348" y="196" width="110" height="19" fill="#fff6e5"/><text x="403" y="210" fill="#b45309" text-anchor="middle">同 .cs</text>
    <text x="474" y="210" fill="#111" font-family="monospace">LDG.E.LU</text>
    <text x="700" y="210" fill="#444">把溢出到显存的寄存器读回来</text>

    <rect x="24" y="220" width="932" height="30" fill="#fafafa"/>
    <text x="38" y="240" fill="#333" font-family="monospace">ld.global.L1::evict_last</text>
    <rect x="226" y="226" width="110" height="19" fill="#eaf6ec"/><text x="281" y="240" fill="#2e7d32" text-anchor="middle">留，最后被淘汰</text>
    <rect x="348" y="226" width="110" height="19" fill="#f2f2f2"/><text x="403" y="240" fill="#777" text-anchor="middle">不改</text>
    <text x="474" y="240" fill="#111" font-family="monospace">LDG.E.EL</text>
    <text x="700" y="240" fill="#444">最后被扔。小而反复读的表</text>

    <text x="38" y="270" fill="#333" font-family="monospace">ld.global.L1::no_allocate</text>
    <rect x="226" y="256" width="110" height="19" fill="#fdecea"/><text x="281" y="270" fill="#c0392b" text-anchor="middle">不分配</text>
    <rect x="348" y="256" width="110" height="19" fill="#f2f2f2"/><text x="403" y="270" fill="#777" text-anchor="middle">不改</text>
    <text x="474" y="270" fill="#111" font-family="monospace">LDG.E.NA</text>
    <text x="700" y="270" fill="#444">明确不占 L1 的位子</text>

    <rect x="24" y="280" width="932" height="30" fill="#fafafa"/>
    <text x="38" y="300" fill="#333" font-family="monospace">ld.global.nc</text>
    <rect x="226" y="286" width="110" height="19" fill="#eaf6ec"/><text x="281" y="300" fill="#2e7d32" text-anchor="middle">走只读通路</text>
    <rect x="348" y="286" width="110" height="19" fill="#eaf6ec"/><text x="403" y="300" fill="#2e7d32" text-anchor="middle">留</text>
    <text x="474" y="300" fill="#111" font-family="monospace">LDG.E.CONSTANT</text>
    <text x="700" y="300" fill="#444">本 kernel 内不会被写的数据</text>
  </g>

  <!-- policy object -->
  <rect x="24" y="336" width="452" height="146" rx="6" fill="#e8f6f4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="38" y="360" font-size="14" font-weight="bold" fill="#0f766e">第二种写法：先造一个策略对象，再挂在访问上</text>
  <text x="38" y="382" font-size="11.5" fill="#333" font-family="monospace">createpolicy.fractional.L2::evict_last.b64 pol, 0.5;</text>
  <text x="38" y="400" font-size="11.5" fill="#333" font-family="monospace">ld.global.L2::cache_hint.f32 %f, [a], pol;</text>
  <text x="38" y="424" font-size="12.5" fill="#333">本库实测：这条读取编出来仍是普通的 LDG.E，没有新后缀。</text>
  <text x="38" y="442" font-size="12.5" fill="#333">策略被算进一对统一寄存器，当作访存描述符一起发出去。</text>
  <text x="38" y="466" font-size="12" fill="#555">所以它不是指令的一个开关，而是一件随请求同行的附件。</text>

  <!-- set aside -->
  <rect x="504" y="336" width="452" height="146" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="518" y="360" font-size="14" font-weight="bold" fill="#111">第三种写法：从 L2 里划出一块专用区</text>
  <rect x="518" y="372" width="260" height="24" fill="#dbe8f7" stroke="#2c5aa0"/>
  <text x="648" y="389" font-size="12" fill="#111" text-anchor="middle">常规部分：谁都能用</text>
  <rect x="778" y="372" width="164" height="24" fill="#fde6c8" stroke="#d97706"/>
  <text x="860" y="389" font-size="12" fill="#111" text-anchor="middle">留出部分</text>
  <text x="518" y="416" font-size="12.5" fill="#333">被标成常驻的那段地址优先占右边这块。别人只能在它</text>
  <text x="518" y="434" font-size="12.5" fill="#333">空着时借用。计算能力 8.0 起支持，上限由设备属性给出。</text>
  <text x="518" y="458" font-size="12" fill="#555">这一项按整个 kernel 设定，不是逐条指令的。</text>

  <!-- hitRatio example -->
  <rect x="24" y="498" width="932" height="146" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/>
  <text x="38" y="522" font-size="14" font-weight="bold" fill="#b45309">官方文档给的算例：留出部分 16 KB，标出来的窗口却有 32 KB</text>
  <text x="38" y="546" font-size="12.5" fill="#333">hitRatio = 0.5：硬件随机挑窗口里的一半（16 KB）当常驻，正好装满留出部分。另一半按普通数据处理。</text>
  <text x="38" y="566" font-size="12.5" fill="#333">hitRatio = 1.0：硬件试图把 32 KB 全装进 16 KB 的留出部分。装不下，于是只留下最近用过的 16 KB，其余被挤出去。</text>
  <text x="38" y="592" font-size="12.5" fill="#333">两个并发的 kernel 各标 16 KB 且都写 1.0 时，它们可能互相挤掉对方的常驻行。各写 0.5 时，被挤掉的可能更小。</text>
  <text x="38" y="620" font-size="12.5" fill="#c0392b">用完要复位：常驻属性在 kernel 结束后继续有效，下一个 kernel 会发现 L2 少了一块。</text>
  <text x="38" y="638" font-size="12" fill="#555">这几种提示的共同点：都不改变程序算出来的结果，写错只会变慢。判断依据也是同一个问题：这块数据接下来还有谁读。</text>
</svg>
