<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="sans-serif">
  <rect x="0" y="0" width="1040" height="660" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="bold" fill="#111">第一根轴：用三个问题把四类搬运机制排成一条光谱</text>
  <text x="36" y="58" font-size="14" fill="#555">从左到右，搬运这件事一步步从计算单元身上挪走；代价是能表达的访问模式越来越窄。</text>

  <!-- headers -->
  <rect x="196" y="76" width="196" height="50" fill="#e8eef6" stroke="#2c5aa0" stroke-width="2"/>
  <text x="294" y="98" font-size="16" font-weight="bold" fill="#1a3a66" text-anchor="middle">load/store</text>
  <text x="294" y="118" font-size="13" fill="#444" text-anchor="middle">第 02 节</text>
  <rect x="400" y="76" width="196" height="50" fill="#e0ebf7" stroke="#2c5aa0" stroke-width="2"/>
  <text x="498" y="98" font-size="16" font-weight="bold" fill="#1a3a66" text-anchor="middle">异步拷贝</text>
  <text x="498" y="118" font-size="13" fill="#444" text-anchor="middle">第 03 节</text>
  <rect x="604" y="76" width="196" height="50" fill="#d3e3f3" stroke="#2c5aa0" stroke-width="2"/>
  <text x="702" y="98" font-size="16" font-weight="bold" fill="#1a3a66" text-anchor="middle">描述符 DMA</text>
  <text x="702" y="118" font-size="13" fill="#444" text-anchor="middle">第 04 节</text>
  <rect x="808" y="76" width="196" height="50" fill="#c3d8ee" stroke="#2c5aa0" stroke-width="2"/>
  <text x="906" y="98" font-size="16" font-weight="bold" fill="#1a3a66" text-anchor="middle">片外 DMA</text>
  <text x="906" y="118" font-size="13" fill="#444" text-anchor="middle">第 05 节</text>

  <!-- row 1 -->
  <rect x="36" y="132" width="150" height="66" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="111" y="171" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">谁发起</text>
  <rect x="196" y="132" width="196" height="66" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="294" y="160" font-size="14" fill="#222" text-anchor="middle">warp 里每个线程</text>
  <text x="294" y="180" font-size="14" fill="#222" text-anchor="middle">各发一条，发完就等</text>
  <rect x="400" y="132" width="196" height="66" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="498" y="160" font-size="14" fill="#222" text-anchor="middle">还是每个线程各发一条</text>
  <text x="498" y="180" font-size="14" fill="#222" text-anchor="middle">但发完不等</text>
  <rect x="604" y="132" width="196" height="66" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="702" y="160" font-size="14" fill="#222" text-anchor="middle">1 个线程提交一次请求</text>
  <text x="702" y="180" font-size="14" fill="#222" text-anchor="middle">引擎执行，其余线程不发</text>
  <rect x="808" y="132" width="196" height="66" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="906" y="160" font-size="14" fill="#222" text-anchor="middle">主机侧 API、驱动</text>
  <text x="906" y="180" font-size="14" fill="#222" text-anchor="middle">或网卡自己</text>

  <!-- row 2 -->
  <rect x="36" y="204" width="150" height="66" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="111" y="243" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">地址怎么来</text>
  <rect x="196" y="204" width="196" height="66" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="294" y="232" font-size="14" fill="#222" text-anchor="middle">每线程用整数指令</text>
  <text x="294" y="252" font-size="14" fill="#222" text-anchor="middle">自己算一个</text>
  <rect x="400" y="204" width="196" height="66" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="498" y="232" font-size="14" fill="#222" text-anchor="middle">同左：每线程</text>
  <text x="498" y="252" font-size="14" fill="#222" text-anchor="middle">自己算一个</text>
  <rect x="604" y="204" width="196" height="66" fill="#eaf5ea" stroke="#2f6b2f" stroke-width="2"/>
  <text x="702" y="232" font-size="14" fill="#1b4620" text-anchor="middle">一张张量描述符</text>
  <text x="702" y="252" font-size="14" fill="#1b4620" text-anchor="middle">＋这次要第几块的坐标</text>
  <rect x="808" y="204" width="196" height="66" fill="#eaf5ea" stroke="#2f6b2f" stroke-width="2"/>
  <text x="906" y="232" font-size="14" fill="#1b4620" text-anchor="middle">命令队列里的</text>
  <text x="906" y="252" font-size="14" fill="#1b4620" text-anchor="middle">一条描述符</text>

  <!-- row 3 -->
  <rect x="36" y="276" width="150" height="86" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="111" y="325" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">完成怎么知道</text>
  <rect x="196" y="276" width="196" height="86" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="294" y="304" font-size="14" fill="#222" text-anchor="middle">记分牌：用到那个</text>
  <text x="294" y="324" font-size="14" fill="#222" text-anchor="middle">寄存器时硬件自动挡住</text>
  <text x="294" y="346" font-size="13" fill="#2f6b2f" text-anchor="middle">软件不用写一个字</text>
  <rect x="400" y="276" width="196" height="86" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="498" y="304" font-size="14" fill="#222" text-anchor="middle">显式分组等待：</text>
  <text x="498" y="324" font-size="14" fill="#222" text-anchor="middle">commit_group 攒一组，</text>
  <text x="498" y="344" font-size="14" fill="#222" text-anchor="middle">wait_group(N) 等到只剩 N 组</text>
  <rect x="604" y="276" width="196" height="86" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="702" y="300" font-size="14" fill="#222" text-anchor="middle">mbarrier 按字节对账：</text>
  <text x="702" y="320" font-size="14" fill="#222" text-anchor="middle">先声明本轮共几字节，</text>
  <text x="702" y="340" font-size="14" fill="#222" text-anchor="middle">凑齐才放行</text>
  <text x="702" y="357" font-size="13" fill="#7a3d00" text-anchor="middle">昇腾：set_flag / wait_flag</text>
  <rect x="808" y="276" width="196" height="86" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="906" y="308" font-size="14" fill="#222" text-anchor="middle">事件、流的先后顺序、</text>
  <text x="906" y="330" font-size="14" fill="#222" text-anchor="middle">网卡的完成队列</text>

  <!-- row 4 -->
  <rect x="36" y="368" width="150" height="66" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="111" y="407" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">典型半径</text>
  <rect x="196" y="368" width="196" height="66" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="294" y="396" font-size="14" fill="#222" text-anchor="middle">寄存器 ↔ shared /</text>
  <text x="294" y="416" font-size="14" fill="#222" text-anchor="middle">L1 / L2 / 显存</text>
  <rect x="400" y="368" width="196" height="66" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="498" y="396" font-size="14" fill="#222" text-anchor="middle">显存 → shared</text>
  <text x="498" y="416" font-size="14" fill="#222" text-anchor="middle">绕过寄存器</text>
  <rect x="604" y="368" width="196" height="66" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="702" y="396" font-size="14" fill="#222" text-anchor="middle">显存 ↔ shared / 片上缓冲</text>
  <text x="702" y="416" font-size="14" fill="#222" text-anchor="middle">还能簇内多播</text>
  <rect x="808" y="368" width="196" height="66" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="906" y="396" font-size="14" fill="#222" text-anchor="middle">主机 ↔ 显存、卡 ↔ 卡</text>
  <text x="906" y="416" font-size="14" fill="#222" text-anchor="middle">节点 ↔ 节点</text>

  <!-- row 5 -->
  <rect x="36" y="440" width="150" height="66" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="111" y="472" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">代表指令</text>
  <text x="111" y="492" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">或部件</text>
  <rect x="196" y="440" width="196" height="66" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="294" y="468" font-size="14" fill="#5a4400" text-anchor="middle">ld.global / st.global</text>
  <text x="294" y="488" font-size="13" fill="#5a4400" text-anchor="middle">汇编里写作 LDG / STG</text>
  <rect x="400" y="440" width="196" height="66" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="498" y="468" font-size="14" fill="#5a4400" text-anchor="middle">cp.async</text>
  <text x="498" y="488" font-size="13" fill="#5a4400" text-anchor="middle">汇编里写作 LDGSTS</text>
  <rect x="604" y="440" width="196" height="66" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="702" y="468" font-size="14" fill="#5a4400" text-anchor="middle">cp.async.bulk.tensor（TMA）</text>
  <text x="702" y="488" font-size="13" fill="#5a4400" text-anchor="middle">昇腾：MTE1 / MTE2 / MTE3</text>
  <rect x="808" y="440" width="196" height="66" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="906" y="468" font-size="14" fill="#5a4400" text-anchor="middle">cudaMemcpyAsync</text>
  <text x="906" y="488" font-size="13" fill="#5a4400" text-anchor="middle">GPUDirect RDMA、昇腾 SDMA</text>

  <!-- trend arrow -->
  <line x1="196" y1="528" x2="990" y2="528" stroke="#2c5aa0" stroke-width="3"/>
  <polygon points="1004,528 988,521 988,535" fill="#2c5aa0"/>
  <text x="596" y="550" font-size="15" font-weight="bold" fill="#1a3a66" text-anchor="middle">越往右，搬运越不占计算单元的资源</text>

  <text x="36" y="580" font-size="14" fill="#222">参与搬运的线程数：</text>
  <text x="294" y="580" font-size="14" fill="#222" text-anchor="middle">128</text>
  <text x="498" y="580" font-size="14" fill="#222" text-anchor="middle">128</text>
  <text x="702" y="580" font-size="14" fill="#2f6b2f" text-anchor="middle">1</text>
  <text x="906" y="580" font-size="14" fill="#2f6b2f" text-anchor="middle">0（连 kernel 都不用跑）</text>

  <text x="36" y="606" font-size="14" fill="#222">数据经不经过寄存器：</text>
  <text x="294" y="606" font-size="14" fill="#a94442" text-anchor="middle">经过</text>
  <text x="498" y="606" font-size="14" fill="#2f6b2f" text-anchor="middle">不经过</text>
  <text x="702" y="606" font-size="14" fill="#2f6b2f" text-anchor="middle">不经过</text>
  <text x="906" y="606" font-size="14" fill="#2f6b2f" text-anchor="middle">不经过</text>

  <text x="36" y="636" font-size="14" fill="#a94442">代价（反方向）：</text>
  <text x="294" y="636" font-size="14" fill="#2f6b2f" text-anchor="middle">任意地址都能搬</text>
  <text x="498" y="636" font-size="14" fill="#555" text-anchor="middle">任意地址，但同步要自己写</text>
  <text x="702" y="636" font-size="14" fill="#a94442" text-anchor="middle">只搬规整的多维块</text>
  <text x="906" y="636" font-size="14" fill="#a94442" text-anchor="middle">粒度粗、下单本身要几微秒</text>
</svg>
