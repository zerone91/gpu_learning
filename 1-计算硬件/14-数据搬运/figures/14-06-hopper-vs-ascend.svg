<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 900" width="1020" height="900" font-family="sans-serif">
  <rect width="1020" height="900" fill="#ffffff"/>
  <defs><marker id="dn" markerWidth="10" markerHeight="10" refX="4" refY="9" orient="auto"><path d="M0,0 L8,0 L4,9 z" fill="#666"/></marker></defs>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">同一块数据走完全程：每一次变形发生在哪一跳、由哪个部件完成</text>
  <text x="20" y="52" font-size="14" fill="#444">左边是 Hopper 上一个 GEMM tile 的往返，右边是昇腾上一个卷积 tile 的往返。橙色标签就是「在这一跳顺手做掉的变形」。</text>
  <text x="250" y="86" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Hopper GPU：一个 GEMM tile</text>
  <rect x="40" y="104" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="250" y="126" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">显存（HBM）</text>
  <text x="250" y="145" font-size="11.5" fill="#555" text-anchor="middle">A、B 两个 tile，行主序</text>
  <line x1="250" y1="166" x2="250" y2="222" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="58" y="172" width="384" height="40" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.3" rx="4"/>
  <text x="250" y="188" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">TMA 引擎</text>
  <text x="250" y="203" font-size="11.5" fill="#333" text-anchor="middle">box 切块 + 128B swizzle + 越界填 0</text>
  <rect x="40" y="230" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="250" y="252" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">shared memory</text>
  <text x="250" y="271" font-size="11.5" fill="#555" text-anchor="middle">已经按 swizzle 摆好</text>
  <line x1="250" y1="292" x2="250" y2="348" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="58" y="298" width="384" height="40" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.3" rx="4"/>
  <text x="250" y="314" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">ldmatrix（整 warp 一条）</text>
  <text x="250" y="329" font-size="11.5" fill="#333" text-anchor="middle">按 fragment 分发；B 加 .trans 顺手转置</text>
  <rect x="40" y="356" width="420" height="40" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="250" y="381" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">寄存器里的 fragment</text>
  <line x1="250" y1="404" x2="250" y2="460" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="58" y="410" width="384" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  <text x="250" y="426" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">mma / wgmma</text>
  <text x="250" y="441" font-size="11.5" fill="#333" text-anchor="middle">不做任何变形</text>
  <rect x="40" y="468" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="250" y="490" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">累加器（寄存器）</text>
  <text x="250" y="509" font-size="11.5" fill="#555" text-anchor="middle">fp32</text>
  <line x1="250" y1="530" x2="250" y2="586" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="58" y="536" width="384" height="40" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.3" rx="4"/>
  <text x="250" y="552" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">stmatrix（整 warp 一条）</text>
  <text x="250" y="567" font-size="11.5" fill="#333" text-anchor="middle">按 shared 的摆法写回去</text>
  <rect x="40" y="594" width="420" height="40" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="250" y="619" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">shared memory</text>
  <line x1="250" y1="642" x2="250" y2="698" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="58" y="648" width="384" height="40" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.3" rx="4"/>
  <text x="250" y="664" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">TMA store</text>
  <text x="250" y="679" font-size="11.5" fill="#333" text-anchor="middle">按描述符摆回显存</text>
  <rect x="40" y="706" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="250" y="728" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">显存（HBM）</text>
  <text x="250" y="747" font-size="11.5" fill="#555" text-anchor="middle">结果 C</text>
  <text x="770" y="86" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">昇腾 NPU：一个卷积 tile</text>
  <rect x="560" y="104" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="770" y="126" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">显存（GM）</text>
  <text x="770" y="145" font-size="11.5" fill="#555" text-anchor="middle">feature map 与权重，ND</text>
  <line x1="770" y1="166" x2="770" y2="222" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="578" y="172" width="384" height="40" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.3" rx="4"/>
  <text x="770" y="188" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">MTE2</text>
  <text x="770" y="203" font-size="11.5" fill="#333" text-anchor="middle">整段搬入；矩阵路径上随路 ND → NZ</text>
  <rect x="560" y="230" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="770" y="252" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">L1 Buffer</text>
  <text x="770" y="271" font-size="11.5" fill="#555" text-anchor="middle">分形格式</text>
  <line x1="770" y1="292" x2="770" y2="348" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="578" y="298" width="384" height="40" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.3" rx="4"/>
  <text x="770" y="314" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">MTE1（Load3Dv2 / 带转置的 LoadData）</text>
  <text x="770" y="329" font-size="11.5" fill="#333" text-anchor="middle">img2col 展开卷积；需要时顺手转置</text>
  <rect x="560" y="356" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="770" y="378" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">L0A / L0B</text>
  <text x="770" y="397" font-size="11.5" fill="#555" text-anchor="middle">Cube 直接吃的分形</text>
  <line x1="770" y1="418" x2="770" y2="474" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="578" y="424" width="384" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  <text x="770" y="440" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">Cube 阵列</text>
  <text x="770" y="455" font-size="11.5" fill="#333" text-anchor="middle">不做任何变形</text>
  <rect x="560" y="482" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="770" y="504" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">L0C</text>
  <text x="770" y="523" font-size="11.5" fill="#555" text-anchor="middle">fp32 累加</text>
  <line x1="770" y1="544" x2="770" y2="600" stroke="#666" stroke-width="2.2" marker-end="url(#dn)"/>
  <rect x="578" y="550" width="384" height="40" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.3" rx="4"/>
  <text x="770" y="566" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">FixPipe</text>
  <text x="770" y="581" font-size="11.5" fill="#333" text-anchor="middle">NZ → ND ＋ 量化 ＋ 随路 ReLU</text>
  <rect x="560" y="608" width="420" height="54" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="770" y="630" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">显存（GM）</text>
  <text x="770" y="649" font-size="11.5" fill="#555" text-anchor="middle">结果，ND</text>
  <rect x="20" y="776" width="980" height="98" fill="#f7f9fc" stroke="#99a" stroke-width="1.2"/>
  <text x="36" y="800" font-size="14" font-weight="bold" fill="#111">把两列并排读出来的那件事</text>
  <text x="36" y="826" font-size="12.5" fill="#333">左边 5 次搬运里有 4 次带变形，做变形的部件有两类：TMA 引擎（两次）和 warp 指令 ldmatrix / stmatrix（两次）——后者要占 SM 的发射槽。</text>
  <text x="36" y="848" font-size="12.5" fill="#333">右边 4 次搬运里有 3 次带变形，做变形的全是搬运引擎 MTE2 / MTE1 / FixPipe——AI Core 的计算流水一条指令都不用为变形付出。</text>
</svg>