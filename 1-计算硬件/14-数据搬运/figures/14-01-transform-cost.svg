<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="bold" fill="#111">第二根轴为什么值钱：换个摆法，顺手做和单独做一趟，差三倍显存流量</text>
  <text x="36" y="58" font-size="14" fill="#555">例子：把一个 4096×4096 的 bf16 矩阵（32 MB）转置之后送进片上缓冲。</text>

  <!-- Path A -->
  <rect x="36" y="78" width="928" height="132" fill="#f4faf4" stroke="#2f6b2f" stroke-width="2"/>
  <text x="52" y="102" font-size="16" font-weight="bold" fill="#1b4620">甲路：搬运引擎在途中顺手转置（一趟）</text>

  <rect x="60" y="116" width="140" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="130" y="146" font-size="15" fill="#111" text-anchor="middle">显存</text>
  <text x="130" y="168" font-size="13" fill="#555" text-anchor="middle">原矩阵 32 MB</text>

  <line x1="200" y1="150" x2="286" y2="150" stroke="#2f6b2f" stroke-width="3"/>
  <polygon points="298,150 282,143 282,157" fill="#2f6b2f"/>
  <text x="246" y="140" font-size="13" fill="#1b4620" text-anchor="middle">读 32 MB</text>

  <rect x="302" y="116" width="200" height="68" fill="#dff0d8" stroke="#2f6b2f" stroke-width="2.5"/>
  <text x="402" y="142" font-size="15" fill="#1b4620" text-anchor="middle">搬运引擎</text>
  <text x="402" y="166" font-size="13" fill="#1b4620" text-anchor="middle">读地址按行、写地址按列</text>

  <line x1="502" y1="150" x2="588" y2="150" stroke="#2f6b2f" stroke-width="3"/>
  <polygon points="600,150 584,143 584,157" fill="#2f6b2f"/>
  <text x="548" y="140" font-size="13" fill="#1b4620" text-anchor="middle">写 32 MB</text>

  <rect x="604" y="116" width="140" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="674" y="146" font-size="15" fill="#111" text-anchor="middle">片上缓冲</text>
  <text x="674" y="168" font-size="13" fill="#555" text-anchor="middle">已经转置好</text>

  <text x="854" y="146" font-size="18" font-weight="bold" fill="#1b4620" text-anchor="middle">显存流量</text>
  <text x="854" y="172" font-size="18" font-weight="bold" fill="#1b4620" text-anchor="middle">32 MB</text>

  <!-- Path B -->
  <rect x="36" y="222" width="928" height="196" fill="#fdf5f5" stroke="#a94442" stroke-width="2"/>
  <text x="52" y="246" font-size="16" font-weight="bold" fill="#6b1f1f">乙路：先跑一个转置 kernel 落回显存，再搬进来（两趟）</text>

  <rect x="60" y="260" width="150" height="62" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="135" y="286" font-size="15" fill="#111" text-anchor="middle">显存</text>
  <text x="135" y="308" font-size="13" fill="#555" text-anchor="middle">原矩阵 32 MB</text>

  <line x1="210" y1="291" x2="300" y2="291" stroke="#a94442" stroke-width="3"/>
  <polygon points="312,291 296,284 296,298" fill="#a94442"/>
  <text x="256" y="281" font-size="13" fill="#6b1f1f" text-anchor="middle">读 32 MB</text>

  <rect x="316" y="260" width="150" height="62" fill="#f8d7da" stroke="#a94442" stroke-width="2.5"/>
  <text x="391" y="286" font-size="15" fill="#6b1f1f" text-anchor="middle">转置 kernel</text>
  <text x="391" y="308" font-size="13" fill="#6b1f1f" text-anchor="middle">线程一个个搬</text>

  <line x1="466" y1="291" x2="556" y2="291" stroke="#a94442" stroke-width="3"/>
  <polygon points="568,291 552,284 552,298" fill="#a94442"/>
  <text x="512" y="281" font-size="13" fill="#6b1f1f" text-anchor="middle">写 32 MB</text>

  <rect x="572" y="260" width="170" height="62" fill="#ffffff" stroke="#a94442" stroke-width="2"/>
  <text x="657" y="286" font-size="15" fill="#6b1f1f" text-anchor="middle">显存里的转置副本</text>
  <text x="657" y="308" font-size="13" fill="#6b1f1f" text-anchor="middle">还要多占 32 MB 容量</text>

  <line x1="742" y1="291" x2="820" y2="291" stroke="#a94442" stroke-width="3"/>
  <polygon points="832,291 816,284 816,298" fill="#a94442"/>
  <text x="787" y="281" font-size="13" fill="#6b1f1f" text-anchor="middle">再读 32 MB</text>

  <rect x="838" y="260" width="110" height="62" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="893" y="296" font-size="15" fill="#111" text-anchor="middle">片上缓冲</text>

  <text x="500" y="352" font-size="18" font-weight="bold" fill="#6b1f1f" text-anchor="middle">显存流量 32 + 32 + 32 = 96 MB，是甲路的三倍</text>
  <text x="500" y="380" font-size="15" fill="#6b1f1f" text-anchor="middle">按 H100 的 3.35 TB/s 折算：甲路约 9.6 微秒，乙路约 28.7 微秒</text>
  <text x="500" y="404" font-size="15" fill="#6b1f1f" text-anchor="middle">再加一次 kernel 启动（几微秒）和 32 MB 的临时显存占用</text>

  <!-- four hops strip -->
  <rect x="36" y="432" width="928" height="164" fill="#f7f7f7" stroke="#666" stroke-width="2"/>
  <text x="52" y="458" font-size="16" font-weight="bold" fill="#111">所以硬件把变换电路装在了每一跳上（细节见第 06 节）：</text>

  <rect x="56" y="470" width="214" height="110" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="163" y="492" font-size="14" font-weight="bold" fill="#1a3a66" text-anchor="middle">片外这一跳</text>
  <text x="163" y="516" font-size="13" fill="#333" text-anchor="middle">copy engine：</text>
  <text x="163" y="534" font-size="13" fill="#333" text-anchor="middle">2D / 3D 带步长拷贝</text>
  <text x="163" y="558" font-size="13" fill="#7a3d00" text-anchor="middle">昇腾：SDMA</text>

  <rect x="282" y="470" width="214" height="110" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="389" y="492" font-size="14" font-weight="bold" fill="#1a3a66" text-anchor="middle">显存 ↔ 片上缓冲</text>
  <text x="389" y="516" font-size="13" fill="#333" text-anchor="middle">TMA：错位摆放、im2col、</text>
  <text x="389" y="534" font-size="13" fill="#333" text-anchor="middle">按块切、越界填充</text>
  <text x="389" y="558" font-size="13" fill="#7a3d00" text-anchor="middle">昇腾：MTE2 的 ND → NZ</text>

  <rect x="508" y="470" width="214" height="110" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="615" y="492" font-size="14" font-weight="bold" fill="#1a3a66" text-anchor="middle">片上缓冲 → 计算侧</text>
  <text x="615" y="516" font-size="13" fill="#333" text-anchor="middle">ldmatrix / stmatrix，</text>
  <text x="615" y="534" font-size="13" fill="#333" text-anchor="middle">带 .trans 后缀可转置</text>
  <text x="615" y="558" font-size="13" fill="#7a3d00" text-anchor="middle">昇腾：MTE1 的 img2col、转置</text>

  <rect x="734" y="470" width="214" height="110" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="841" y="492" font-size="14" font-weight="bold" fill="#1a3a66" text-anchor="middle">寄存器内</text>
  <text x="841" y="516" font-size="13" fill="#333" text-anchor="middle">shfl（线程间换）、</text>
  <text x="841" y="534" font-size="13" fill="#333" text-anchor="middle">prmt、movmatrix</text>
  <text x="841" y="558" font-size="13" fill="#7a3d00" text-anchor="middle">昇腾：向量单元</text>
</svg>
