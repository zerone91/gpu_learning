<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" width="1040" height="670" font-family="sans-serif">
<rect x="0" y="0" width="1040" height="670" fill="#ffffff"/>
<defs>
<marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d35400"/></marker>
<marker id="o2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb7"/></marker>
</defs>

<text x="520" y="30" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">跨出显存这条边界：交给芯片边缘的拷贝引擎，还是让线程亲自去搬</text>
<text x="520" y="54" font-size="14" text-anchor="middle" fill="#555">本图只讲"跨出显存"的那一段；显存到 SM 内部小存储的那一段由 SM 里的搬运单元负责，不在这张图上</text>

<!-- GPU chip box -->
<rect x="300" y="80" width="470" height="330" rx="10" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<text x="535" y="104" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">这块 GPU 芯片</text>

<!-- HBM -->
<rect x="360" y="290" width="350" height="70" rx="8" fill="#fdf0f0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="535" y="320" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">显存（HBM）</text>
<text x="535" y="344" font-size="13" text-anchor="middle" fill="#c0392b">红色虚线就是"显存"这条边界</text>

<!-- SMs -->
<rect x="360" y="130" width="100" height="70" rx="6" fill="#eef2f7" stroke="#222" stroke-width="1.8"/>
<text x="410" y="160" font-size="15" text-anchor="middle" fill="#222">SM</text>
<text x="410" y="182" font-size="13" text-anchor="middle" fill="#555">计算中</text>
<rect x="480" y="130" width="100" height="70" rx="6" fill="#eef2f7" stroke="#222" stroke-width="1.8"/>
<text x="530" y="160" font-size="15" text-anchor="middle" fill="#222">SM</text>
<text x="530" y="182" font-size="13" text-anchor="middle" fill="#555">计算中</text>
<rect x="600" y="130" width="110" height="70" rx="6" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="2.5"/>
<text x="655" y="156" font-size="15" text-anchor="middle" fill="#2c6fb7" font-weight="bold">SM</text>
<text x="655" y="178" font-size="13" text-anchor="middle" fill="#2c6fb7">被占去搬数据</text>
<text x="655" y="196" font-size="13" text-anchor="middle" fill="#2c6fb7">这段时间不能算</text>

<!-- copy engine at chip edge -->
<rect x="306" y="220" width="120" height="56" rx="6" fill="#fbe3c4" stroke="#d35400" stroke-width="2.5"/>
<text x="366" y="244" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">copy engine</text>
<text x="366" y="265" font-size="13" text-anchor="middle" fill="#555">在芯片边缘</text>

<!-- host -->
<rect x="40" y="200" width="180" height="96" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="130" y="228" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">CPU 主机内存</text>
<text x="130" y="252" font-size="13" text-anchor="middle" fill="#555">要用锁页内存</text>
<text x="130" y="274" font-size="13" text-anchor="middle" fill="#555">（操作系统保证不换出）</text>

<!-- other GPU -->
<rect x="820" y="120" width="180" height="90" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="910" y="150" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">另一块 GPU</text>
<text x="910" y="176" font-size="13" text-anchor="middle" fill="#555">经 NVLink 直连</text>
<text x="910" y="196" font-size="13" text-anchor="middle" fill="#555">（GPU 之间的高速线）</text>

<!-- arrows: copy engine path -->
<line x1="222" y1="248" x2="300" y2="248" stroke="#d35400" stroke-width="3" marker-end="url(#o1)"/>
<text x="261" y="240" font-size="13" text-anchor="middle" fill="#d35400">PCIe</text>
<path d="M366,278 L366,320 L354,320" fill="none" stroke="#d35400" stroke-width="3" marker-end="url(#o1)"/>
<text x="300" y="316" font-size="13" text-anchor="end" fill="#d35400">直接进显存</text>
<text x="230" y="180" font-size="14" fill="#d35400" font-weight="bold">左路：拷贝引擎搬</text>
<text x="230" y="160" font-size="13" fill="#d35400">一路上不碰任何 SM</text>

<!-- arrows: SM path -->
<path d="M710,165 L790,165" fill="none" stroke="#2c6fb7" stroke-width="3" marker-end="url(#o2)"/>
<text x="750" y="157" font-size="13" text-anchor="middle" fill="#2c6fb7">NVLink</text>
<path d="M655,205 L655,286" fill="none" stroke="#2c6fb7" stroke-width="3" marker-end="url(#o2)"/>
<text x="668" y="250" font-size="13" fill="#2c6fb7">线程亲自读写</text>
<text x="790" y="240" font-size="14" fill="#2c6fb7" font-weight="bold">右路：SM 里的线程亲自搬</text>
<text x="790" y="262" font-size="13" fill="#2c6fb7">直接对另一块卡的地址</text>
<text x="790" y="282" font-size="13" fill="#2c6fb7">执行读写指令</text>

<!-- comparison table -->
<line x1="16" y1="432" x2="1024" y2="432" stroke="#bbb" stroke-width="1"/>
<text x="16" y="458" font-size="16" fill="#222" font-weight="bold">两条路的取舍</text>

<rect x="40" y="472" width="460" height="168" rx="8" fill="#fef6ec" stroke="#d35400" stroke-width="2"/>
<text x="270" y="498" font-size="16" text-anchor="middle" fill="#d35400" font-weight="bold">左路：copy engine</text>
<text x="56" y="524" font-size="14" fill="#222">✔ 一点计算资源都不占，和 kernel 完全并行</text>
<text x="56" y="548" font-size="14" fill="#222">✔ 传输时间可以被整整一轮计算盖住</text>
<text x="56" y="572" font-size="14" fill="#c0392b">✘ 下单要经过驱动和命令队列，微秒量级</text>
<text x="56" y="596" font-size="14" fill="#c0392b">✘ 它不认识 kernel 内部的数据依赖</text>
<text x="270" y="626" font-size="14" text-anchor="middle" fill="#d35400" font-weight="bold">→ 量大、能提前发起、不着急的传输</text>

<rect x="540" y="472" width="460" height="168" rx="8" fill="#eef4fb" stroke="#2c6fb7" stroke-width="2"/>
<text x="770" y="498" font-size="16" text-anchor="middle" fill="#2c6fb7" font-weight="bold">右路：SM 里的线程直接搬</text>
<text x="556" y="524" font-size="14" fill="#222">✔ 没有驱动参与，延迟几百纳秒量级</text>
<text x="556" y="548" font-size="14" fill="#222">✔ 能和计算写在同一个 kernel 里精确编排</text>
<text x="556" y="572" font-size="14" fill="#c0392b">✘ 搬运期间这些线程不能计算</text>
<text x="556" y="596" font-size="14" fill="#c0392b">✘ 搬得越多，被占住的计算资源越多</text>
<text x="770" y="626" font-size="14" text-anchor="middle" fill="#2c6fb7" font-weight="bold">→ 量小、延迟敏感、与计算细粒度交错</text>
</svg>
