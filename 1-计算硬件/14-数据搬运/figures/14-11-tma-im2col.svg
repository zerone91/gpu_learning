<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" width="1120" height="610" font-family="sans-serif">
<rect x="0" y="0" width="1120" height="610" fill="#ffffff"/>
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#333"/>
  </marker>
</defs>

<text x="24" y="32" font-size="20" font-weight="bold" fill="#111">卷积展开矩阵从不在显存里生成：引擎每发一条指令，现场填好它的一组列</text>
<text x="24" y="56" font-size="14" fill="#555">这一条指令负责第 (1, 1) 号抽头。坐标映射：输出像素 (p, q) 的第 (r, s) 号抽头，取自输入像素 (p + r, q + s)。</text>

<!-- ============ left: 5x5 input feature map ============ -->
<text x="40" y="92" font-size="16" font-weight="bold" fill="#111">① 显存里的输入特征图</text>
<text x="40" y="114" font-size="13" fill="#555">5 × 5 像素，每像素 4 个通道</text>
<text x="40" y="134" font-size="13" fill="#c06000">橙色是这条指令取走的 9 个像素</text>

<g font-size="12" fill="#111" text-anchor="middle">
  <rect x="40" y="146" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="68" y="172">0,0</text>
  <rect x="96" y="146" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="124" y="172">0,1</text>
  <rect x="152" y="146" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="180" y="172">0,2</text>
  <rect x="208" y="146" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="236" y="172">0,3</text>
  <rect x="264" y="146" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="292" y="172">0,4</text>

  <rect x="40" y="188" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="68" y="214">1,0</text>
  <rect x="96" y="188" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="124" y="214">1,1</text>
  <rect x="152" y="188" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="180" y="214">1,2</text>
  <rect x="208" y="188" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="236" y="214">1,3</text>
  <rect x="264" y="188" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="292" y="214">1,4</text>

  <rect x="40" y="230" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="68" y="256">2,0</text>
  <rect x="96" y="230" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="124" y="256">2,1</text>
  <rect x="152" y="230" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="180" y="256">2,2</text>
  <rect x="208" y="230" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="236" y="256">2,3</text>
  <rect x="264" y="230" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="292" y="256">2,4</text>

  <rect x="40" y="272" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="68" y="298">3,0</text>
  <rect x="96" y="272" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="124" y="298">3,1</text>
  <rect x="152" y="272" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="180" y="298">3,2</text>
  <rect x="208" y="272" width="56" height="42" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/><text x="236" y="298">3,3</text>
  <rect x="264" y="272" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="292" y="298">3,4</text>

  <rect x="40" y="314" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="68" y="340">4,0</text>
  <rect x="96" y="314" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="124" y="340">4,1</text>
  <rect x="152" y="314" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="180" y="340">4,2</text>
  <rect x="208" y="314" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="236" y="340">4,3</text>
  <rect x="264" y="314" width="56" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/><text x="292" y="340">4,4</text>
</g>
<text x="40" y="378" font-size="12" fill="#555">格里写的是像素坐标（行, 列）。</text>
<text x="40" y="396" font-size="12" fill="#555">每个格子背后还有 4 个通道，图上没有画。</text>

<!-- arrow 1 -->
<line x1="332" y1="250" x2="386" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="359" y="240" font-size="12" fill="#c06000" text-anchor="middle">引擎</text>

<!-- ============ middle: 9 rows x 4 channels in shared memory ============ -->
<text x="400" y="92" font-size="16" font-weight="bold" fill="#111">② 落进 shared memory</text>
<text x="400" y="114" font-size="13" fill="#555">9 行 × 4 个通道</text>

<text x="400" y="138" font-size="11" fill="#555">服务哪个输出</text>
<text x="570" y="138" font-size="11" fill="#555">取自哪个输入像素的 4 个通道</text>

<g font-size="11.5" fill="#111">
  <text x="400" y="178">输出 0,0</text><rect x="472" y="164" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="178" text-anchor="middle">输入 1,1　c0 c1 c2 c3</text>
  <text x="400" y="199">输出 0,1</text><rect x="472" y="185" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="199" text-anchor="middle">输入 1,2　c0 c1 c2 c3</text>
  <text x="400" y="220">输出 0,2</text><rect x="472" y="206" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="220" text-anchor="middle">输入 1,3　c0 c1 c2 c3</text>
  <text x="400" y="241">输出 1,0</text><rect x="472" y="227" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="241" text-anchor="middle">输入 2,1　c0 c1 c2 c3</text>
  <text x="400" y="262">输出 1,1</text><rect x="472" y="248" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="262" text-anchor="middle">输入 2,2　c0 c1 c2 c3</text>
  <text x="400" y="283">输出 1,2</text><rect x="472" y="269" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="283" text-anchor="middle">输入 2,3　c0 c1 c2 c3</text>
  <text x="400" y="304">输出 2,0</text><rect x="472" y="290" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="304" text-anchor="middle">输入 3,1　c0 c1 c2 c3</text>
  <text x="400" y="325">输出 2,1</text><rect x="472" y="311" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="325" text-anchor="middle">输入 3,2　c0 c1 c2 c3</text>
  <text x="400" y="346">输出 2,2</text><rect x="472" y="332" width="196" height="19" fill="#f6c89a" stroke="#c06000" stroke-width="1.2"/><text x="570" y="346" text-anchor="middle">输入 3,3　c0 c1 c2 c3</text>
</g>
<text x="400" y="378" font-size="12" fill="#555">同一个 3 × 3 窗口整体平移一格，</text>
<text x="400" y="396" font-size="12" fill="#555">就得到这 9 行。</text>

<!-- arrow 2 -->
<line x1="690" y1="250" x2="740" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

<!-- ============ right: position in the full 9x36 expanded matrix ============ -->
<text x="762" y="92" font-size="16" font-weight="bold" fill="#111">③ 它在整张展开矩阵里的位置</text>
<text x="762" y="114" font-size="13" fill="#555">整张是 9 行 × 36 列（9 个抽头 × 4 个通道）</text>

<line x1="800" y1="152" x2="1090" y2="152" stroke="#333" stroke-width="1.2"/>
<text x="945" y="146" font-size="12" fill="#333" text-anchor="middle">36 列</text>
<rect x="800" y="164" width="290" height="187" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
<rect x="929" y="164" width="32" height="187" fill="#f6c89a" stroke="#c06000" stroke-width="1.5"/>
<text x="792" y="180" font-size="11.5" fill="#555" text-anchor="end">输出 0,0</text>
<text x="792" y="262" font-size="11.5" fill="#555" text-anchor="end">……</text>
<text x="792" y="345" font-size="11.5" fill="#555" text-anchor="end">输出 2,2</text>
<g font-size="11" fill="#555" text-anchor="middle">
  <text x="816" y="368">抽头 0</text>
  <text x="945" y="368">抽头 4</text>
  <text x="1074" y="368">抽头 8</text>
  <text x="880" y="368">……</text>
  <text x="1010" y="368">……</text>
</g>
<text x="945" y="388" font-size="11.5" fill="#c06000" text-anchor="middle">这条指令填的 4 列（第 (1, 1) 号抽头，9 个抽头里排第 5）</text>

<text x="762" y="418" font-size="12.5" fill="#111">再发 8 条指令换 8 组抽头编号，整张矩阵就齐了。</text>
<text x="762" y="438" font-size="12.5" font-weight="bold" fill="#c06000">显存里始终只有原始的 5 × 5 特征图。</text>

<!-- bottom box: descriptor fields -->
<rect x="40" y="458" width="1050" height="134" fill="#f0f4f8" stroke="#4a6b8a" stroke-width="1.5"/>
<text x="56" y="482" font-size="15" font-weight="bold" fill="#111">描述符里对应的字段（由 cuTensorMapEncodeIm2col 生成）</text>
<g font-size="13" fill="#111">
  <text x="56" y="506">globalDim：特征图在显存里的原始形状。通道维必须在最内（NWC / NHWC / NDHWC）。</text>
  <text x="56" y="528">pixelBoxLowerCorner / UpperCorner：卷积窗口相对一个像素能伸到的下界和上界。</text>
  <text x="56" y="550">channelsPerPixel = 4：每像素取几个通道，不超过 256。　pixelsPerColumn = 9：一条指令取几个像素，不超过 1024。</text>
  <text x="56" y="576" font-weight="bold" fill="#c06000">im2colOffsets：这条指令取的是第几号抽头。9 条指令之间唯一不同的参数就是它，本图这一条是 (1, 1)。</text>
</g>
</svg>
