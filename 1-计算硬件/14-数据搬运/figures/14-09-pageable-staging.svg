<text x="435" y="82" font-size="15" text-anchor="middle">半区 0</text><text x="545" y="82" font-size="15" text-anchor="middle">半区 1</text>
<text x="490" y="30" font-size="14" text-anchor="middle">驱动的锁页中转缓冲</text>
<rect x="740" y="40" width="180" height="70" rx="6" fill="#dbe8fa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="830" y="82" font-size="15" text-anchor="middle" font-weight="bold">显存</text>
<line x1="240" y1="75" x2="376" y2="75" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/><text x="308" y="66" font-size="14" text-anchor="middle" fill="#c0392b">CPU 拷贝</text><text x="308" y="98" font-size="14" text-anchor="middle" fill="#c0392b">约 20 GB/s</text>
<line x1="600" y1="75" x2="736" y2="75" stroke="#1f5fbf" stroke-width="3" marker-end="url(#ab)"/><text x="668" y="66" font-size="14" text-anchor="middle" fill="#1f5fbf">DMA（PCIe）</text><text x="668" y="98" font-size="14" text-anchor="middle" fill="#1f5fbf">约 50 GB/s</text>
<text x="40" y="140" font-size="14" fill="#555">锁页内存时没有中间这一站：copy engine 直接从你的缓冲 DMA 到显存。下面三组时间线都是搬 1 GB，分 10 块画（示意）。</text>
<text x="20" y="164" font-size="15" font-weight="bold">A 锁页</text>
<text x="120" y="188" font-size="14" text-anchor="end">CPU</text>
<text x="120" y="220" font-size="14" text-anchor="end">copy engine</text>
<line x1="200" y1="194" x2="884.0" y2="194" stroke="#eee"/>
<line x1="200" y1="226" x2="884.0" y2="226" stroke="#eee"/>
