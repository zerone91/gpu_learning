<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<rect x="40" y="40" width="200" height="70" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.5"/>
<text x="140" y="70" font-size="15" text-anchor="middle" font-weight="bold">你的可分页缓冲</text><text x="140" y="94" font-size="14" text-anchor="middle">（malloc 得到）</text>
<rect x="380" y="40" width="220" height="70" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
