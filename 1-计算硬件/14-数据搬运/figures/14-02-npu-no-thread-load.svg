<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold">"线程自己去显存取数"这件事，昇腾的计算单元根本做不到</text>
  <text x="20" y="52" font-size="14" fill="#444">左边是 GPU：每个线程都能给出任意地址，硬件替它去取。右边是昇腾 AI Core：计算单元只认片上缓冲，去显存取数是搬运引擎的活。</text>

  <defs>
    <marker id="d1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2a5d9f"/></marker>
    <marker id="d2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#b5651d"/></marker>
  </defs>

  <!-- GPU -->
  <rect x="20" y="76" width="460" height="386" fill="#eef4fb" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="34" y="100" font-size="16" font-weight="bold" fill="#2a5d9f">GPU（SM 内）</text>

  <rect x="60" y="112" width="380" height="54" fill="#ffffff" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="250" y="133" font-size="14" text-anchor="middle" font-weight="bold">32 个线程，每个线程一个地址</text>
  <text x="250" y="153" font-size="12" text-anchor="middle">地址可以完全不规则：gather、查表、稀疏索引都行</text>

  <rect x="60" y="184" width="380" height="46" fill="#ffffff" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="250" y="204" font-size="14" text-anchor="middle" font-weight="bold">访存单元 LSU：合并、查缓存、登记缺失</text>
  <text x="250" y="222" font-size="12" text-anchor="middle">软件不用管数据在 L1 还是 L2 还是显存</text>

  <rect x="60" y="248" width="380" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="250" y="273" font-size="14" text-anchor="middle" font-weight="bold">L1 / L2 缓存（硬件自动决定留什么）</text>

  <rect x="60" y="306" width="380" height="40" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="250" y="331" font-size="14" text-anchor="middle" font-weight="bold">显存 HBM</text>

  <rect x="60" y="374" width="380" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="250" y="399" font-size="14" text-anchor="middle" font-weight="bold">寄存器 → 算术单元 / Tensor Core</text>

  <g stroke="#2a5d9f" stroke-width="2" marker-end="url(#d1)">
    <line x1="250" y1="166" x2="250" y2="180"/>
    <line x1="250" y1="230" x2="250" y2="244"/>
    <line x1="250" y1="288" x2="250" y2="302"/>
    <line x1="140" y1="346" x2="140" y2="370"/>
  </g>
  <text x="34" y="436" font-size="12" fill="#2a5d9f">一条指令走完全程：线程亲自发起，也亲自等。</text>
  <text x="34" y="454" font-size="12" fill="#2a5d9f">代价是地址算术、寄存器和发射槽都要线程出。</text>

  <!-- Ascend -->
  <rect x="500" y="76" width="460" height="386" fill="#fdf1e6" stroke="#b5651d" stroke-width="1.5"/>
  <text x="514" y="100" font-size="16" font-weight="bold" fill="#b5651d">昇腾 AI Core</text>

  <rect x="540" y="112" width="380" height="54" fill="#ffffff" stroke="#b5651d" stroke-width="1.5"/>
  <text x="730" y="133" font-size="14" text-anchor="middle" font-weight="bold">标量单元：发一条搬运订单（DataCopy）</text>
  <text x="730" y="153" font-size="12" text-anchor="middle">订单写的是"哪一块、多大、搬到哪块缓冲"，不是逐个地址</text>

  <rect x="540" y="184" width="380" height="46" fill="#ffffff" stroke="#b5651d" stroke-width="1.5"/>
  <text x="730" y="204" font-size="14" text-anchor="middle" font-weight="bold">搬运引擎 MTE：按订单去显存取整块</text>
  <text x="730" y="222" font-size="12" text-anchor="middle">顺手做格式转换；搬完置一个标志位</text>

  <rect x="540" y="248" width="380" height="52" fill="#ffffff" stroke="#b5651d" stroke-width="1.5"/>
  <text x="730" y="268" font-size="14" text-anchor="middle" font-weight="bold">片上缓冲：L1 / L0A / L0B / L0C / UB</text>
  <text x="730" y="288" font-size="12" text-anchor="middle">全部由编译器显式分配，没有"命中/未命中"这回事</text>

  <rect x="540" y="318" width="380" height="40" fill="#ffffff" stroke="#b5651d" stroke-width="1.5"/>
  <text x="730" y="343" font-size="14" text-anchor="middle" font-weight="bold">Cube 矩阵单元 / Vector 向量单元</text>

  <rect x="540" y="376" width="380" height="36" fill="#f2f2f2" stroke="#b5651d" stroke-width="1.5"/>
  <text x="730" y="399" font-size="14" text-anchor="middle" font-weight="bold">显存（片外）</text>

  <g stroke="#b5651d" stroke-width="2" marker-end="url(#d2)">
    <line x1="730" y1="166" x2="730" y2="180"/>
    <line x1="640" y1="230" x2="640" y2="244"/>
    <line x1="640" y1="300" x2="640" y2="314"/>
  </g>
  <path d="M 900 208 L 940 208 L 940 394 L 924 394" fill="none" stroke="#b5651d" stroke-width="2" marker-end="url(#d2)"/>
  <text x="946" y="300" font-size="12" fill="#b5651d" transform="rotate(-90 946 300)" text-anchor="middle">引擎自己去显存</text>

  <line x1="820" y1="358" x2="820" y2="374" stroke="#a33" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="820" cy="366" r="11" fill="none" stroke="#a33" stroke-width="2.5"/>
  <line x1="813" y1="359" x2="827" y2="373" stroke="#a33" stroke-width="2.5"/>
  <text x="836" y="370" font-size="12" fill="#a33">没有这条路</text>

  <text x="514" y="436" font-size="12" fill="#b5651d">计算单元读不到显存；发起和等待分开，谁下单、谁搬、谁等都写在程序里。</text>
  <text x="514" y="454" font-size="12" fill="#b5651d">代价是不规则访问表达不出来，得先在别处整理好。</text>

  <text x="20" y="500" font-size="13" fill="#444">一句话对照：GPU 把"取数"做成每个线程都能用的通用能力，昇腾把它做成一种专门的业务——这就是本模块那条光谱的两端。</text>
</svg>
