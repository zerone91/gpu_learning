<text x="62" y="122" font-size="13" fill="#777" text-anchor="end">0</text>
<text x="62" y="444" font-size="13" fill="#777" text-anchor="end">23</text>
<text x="62" y="220" font-size="14" fill="#b8860b" text-anchor="end" font-weight="bold">7</text>
<text x="62" y="150" font-size="14" fill="#2e7d32" text-anchor="end" font-weight="bold">2</text>
<text x="62" y="388" font-size="14" fill="#1f4e9a" text-anchor="end" font-weight="bold">19</text>
<text x="62" y="276" font-size="14" fill="#6a3d9a" text-anchor="end" font-weight="bold">11</text>
<line x1="240" y1="106" x2="240" y2="450" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="155.0" y="468" font-size="14" fill="#333" text-anchor="middle">每行取第 0～63 列 = 128 字节</text>
<rect x="400" y="150" width="240" height="210" rx="6" fill="#fbfbfb" stroke="#333" stroke-width="1.8"/>
<text x="520.0" y="178" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">一条 gather4 指令</text>
<text x="416" y="208" font-size="13" fill="#111" text-anchor="start" font-family="monospace">cp.async.bulk.tensor.2d</text>
<text x="416" y="228" font-size="13" fill="#111" text-anchor="start" font-family="monospace">  .tile::gather4</text>
<text x="416" y="260" font-size="14" fill="#111" text-anchor="start">坐标 {0, 7, 2, 19, 11}</text>
<text x="416" y="284" font-size="14" fill="#333" text-anchor="start">1 个列坐标：0</text>
<text x="416" y="306" font-size="14" fill="#333" text-anchor="start">4 个行坐标：7、2、19、11</text>
<text x="416" y="336" font-size="14" fill="#1f4e9a" text-anchor="start">地址由引擎按描述符算</text>
<line x1="242" y1="215.0" x2="396" y2="210" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arO)"/>
<line x1="242" y1="145.0" x2="396" y2="240" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arG)"/>
<line x1="242" y1="383.0" x2="396" y2="270" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#arB)"/>
<line x1="242" y1="271.0" x2="396" y2="300" stroke="#6a3d9a" stroke-width="1.8" marker-end="url(#arP)"/>
<text x="825.0" y="150" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">shared memory</text>
<text x="825.0" y="172" font-size="14" fill="#333" text-anchor="middle">连续 4 行，共 512 字节</text>
<rect x="700" y="190" width="250" height="32" rx="0" fill="#f6d3a3" stroke="#b8860b" stroke-width="1.8"/>
<text x="825.0" y="211" font-size="14" fill="#111" text-anchor="middle">第 0 行 ← 源第 7 行（128 字节）</text>
<rect x="700" y="222" width="250" height="32" rx="0" fill="#cfe8d1" stroke="#2e7d32" stroke-width="1.8"/>
<text x="825.0" y="243" font-size="14" fill="#111" text-anchor="middle">第 1 行 ← 源第 2 行（128 字节）</text>
<rect x="700" y="254" width="250" height="32" rx="0" fill="#c9dbf3" stroke="#1f4e9a" stroke-width="1.8"/>
<text x="825.0" y="275" font-size="14" fill="#111" text-anchor="middle">第 2 行 ← 源第 19 行（128 字节）</text>
<rect x="700" y="286" width="250" height="32" rx="0" fill="#e3d3f0" stroke="#6a3d9a" stroke-width="1.8"/>
<text x="825.0" y="307" font-size="14" fill="#111" text-anchor="middle">第 3 行 ← 源第 11 行（128 字节）</text>
<line x1="644" y1="255.0" x2="694" y2="254" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<text x="700" y="342" font-size="14" fill="#333" text-anchor="start">按坐标顺序排列；排列方式与普通</text>
<text x="700" y="362" font-size="14" fill="#333" text-anchor="start">tile 模式相同，可以带 swizzle</text>
<text x="700" y="388" font-size="14" fill="#1f4e9a" text-anchor="start">完成：按字节记在 mbarrier 上</text>
<rect x="20" y="490" width="940" height="92" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="1.6"/>
<text x="40" y="518" font-size="15" fill="#111" text-anchor="start" font-weight="bold">取 128 行（一个 128 × 64 的 bf16 分块，16 KB）：</text>
<text x="40" y="544" font-size="14" fill="#111" text-anchor="start">4 个 warp 各选出 1 个线程，每个线程发 8 条 → 共 32 条 gather4，每条 4 行 × 128 字节 = 512 字节</text>
<text x="40" y="568" font-size="14" fill="#111" text-anchor="start">32 × 512 = 16 384 字节，全部记在同一个 mbarrier 上（expect_tx 登记 16 384）</text>
</svg>
