  <line x1="680" y1="254" x2="950" y2="254" stroke="#bbb" stroke-width="0.8"/>
  <line x1="800" y1="164" x2="800" y2="434" stroke="#bbb" stroke-width="0.8"/>
  <line x1="680" y1="284" x2="950" y2="284" stroke="#bbb" stroke-width="0.8"/>
