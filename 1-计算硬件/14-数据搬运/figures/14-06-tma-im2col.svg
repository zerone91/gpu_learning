  <rect x="800" y="164" width="30" height="270" fill="#ffd9a0" stroke="#c0392b" stroke-width="2.5"/>
  <text x="666" y="299" font-size="12" fill="#444" transform="rotate(-90 666 299)" text-anchor="middle">9 行 = 9 个输出像素</text>
  <text x="815" y="456" font-size="12.5" fill="#c0392b" text-anchor="middle">↑ 第 (1,1) 号抽头这一列</text>
  <text x="640" y="492" font-size="13" fill="#444">再发 8 条指令换 8 组 (r, s)，整张矩阵就齐了。显存</text>
  <text x="640" y="514" font-size="13" fill="#444">里从没生成过这张矩阵，它只存在于 shared memory。</text>
  <rect x="40" y="542" width="940" height="128" fill="#f7f9fc" stroke="#99a" stroke-width="1.2"/>
  <text x="56" y="568" font-size="14.5" font-weight="bold" fill="#111">描述符里对应的字段（cuTensorMapEncodeIm2col）</text>
  <text x="56" y="594" font-size="13" fill="#333">globalDim = {C=4, W=5, H=5, N=1}：显存里张量本来的形状，通道 C 在最内。</text>
  <text x="56" y="614" font-size="13" fill="#333">pixelBoxLowerCorner / pixelBoxUpperCorner：卷积窗口相对像素能伸到的上下左右边界，决定输出像素的取值范围。</text>
  <text x="56" y="634" font-size="13" fill="#333">channelsPerPixel = 4：每个像素取几个通道。pixelsPerColumn = 9：一条指令取几个像素。</text>
  <text x="56" y="654" font-size="13" fill="#333">指令里的 im2colOffsets = (1, 1)：本条指令取的是第几号抽头——这是九条指令之间唯一不同的参数。</text>
</svg>