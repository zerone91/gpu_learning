  <rect x="420" y="164" width="168" height="270" fill="none" stroke="#333" stroke-width="2"/>
  <text x="330" y="462" font-size="13" fill="#444">坐标映射：输出 (p,q) 的第 (r,s) 号抽头</text>
  <text x="330" y="484" font-size="13" fill="#444">取自输入 (p+r, q+s)。这条指令 r=1、s=1。</text>
  <text x="640" y="118" font-size="15" font-weight="bold" fill="#111">③ 它在整张 im2col 矩阵里的位置</text>
  <text x="640" y="138" font-size="12.5" fill="#555">9 列 = 9 个抽头（每列代表该抽头的 4 个通道）</text>
  <rect x="680" y="164" width="270" height="270" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <line x1="710" y1="164" x2="710" y2="434" stroke="#bbb" stroke-width="0.8"/>
  <line x1="680" y1="194" x2="950" y2="194" stroke="#bbb" stroke-width="0.8"/>
