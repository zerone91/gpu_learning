  <text x="40" y="418" font-size="13" fill="#c0392b">橙色 3×3 是这条指令取走的 9 个像素，</text>
  <text x="40" y="440" font-size="13" fill="#c0392b">每个像素连它的 4 个通道一起取。</text>
  <line x1="292" y1="266" x2="322" y2="266" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="307" y="254" font-size="12" fill="#555" text-anchor="middle">TMA</text>
  <text x="330" y="118" font-size="15" font-weight="bold" fill="#111">② 落进 shared memory 的一块</text>
  <text x="330" y="138" font-size="12.5" fill="#555">9 行（每行一个输出像素）× 4 个通道</text>
