<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 690" width="1020" height="690" font-family="sans-serif">
  <rect width="1020" height="690" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#555"/></marker></defs>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">TMA 的 im2col 模式：一条指令固定一个卷积抽头，把 9 个输出像素要的那一个输入像素一次取齐</text>
  <text x="20" y="52" font-size="14" fill="#444">例子：输入 5×5 像素、每像素 4 个通道（NHWC 摆法，通道在最内），3×3 卷积、步长 1、不补边，输出 3×3。</text>
  <text x="40" y="118" font-size="15" font-weight="bold" fill="#111">① 输入特征图 5×5</text>
  <text x="40" y="138" font-size="12.5" fill="#555">格内是像素坐标 (h, w)</text>
  <rect x="40" y="150" width="48" height="48" fill="#f2f2f2" stroke="#666" stroke-width="1"/>
