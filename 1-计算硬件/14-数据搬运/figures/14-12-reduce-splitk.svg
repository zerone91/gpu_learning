<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="19" font-weight="bold" fill="#111">归约写回把加法做进搬运指令，省掉一整个回合</text>
  <text x="24" y="56" font-size="13.5" fill="#444">场景：K 很长，M、N 很小。把 K 切成 8 段交给 8 个线程块，每块算出一份部分和。一份是 128 × 128 个 fp32，即 64 KB。</text>

  <!-- old way -->
  <rect x="24" y="72" width="452" height="286" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="38" y="96" font-size="15" font-weight="bold" fill="#c0392b">没有归约写回：写进 8 块暂存区，再启动一个 kernel 相加</text>

  <g>
    <rect x="40" y="110" width="94" height="30" rx="4" fill="#ffffff" stroke="#c0392b"/>
    <text x="87" y="130" font-size="12" fill="#111" text-anchor="middle">线程块 0</text>
    <rect x="40" y="146" width="94" height="30" rx="4" fill="#ffffff" stroke="#c0392b"/>
    <text x="87" y="166" font-size="12" fill="#111" text-anchor="middle">线程块 1</text>
    <text x="87" y="190" font-size="12" fill="#555" text-anchor="middle">…</text>
    <rect x="40" y="198" width="94" height="30" rx="4" fill="#ffffff" stroke="#c0392b"/>
    <text x="87" y="218" font-size="12" fill="#111" text-anchor="middle">线程块 7</text>
  </g>

  <rect x="178" y="110" width="118" height="118" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="237" y="134" font-size="12.5" font-weight="bold" fill="#111" text-anchor="middle">显存里 8 块暂存区</text>
  <text x="237" y="156" font-size="12" fill="#444" text-anchor="middle">8 × 64 KB = 512 KB</text>
  <text x="237" y="178" font-size="12" fill="#444" text-anchor="middle">互不重叠</text>
  <text x="237" y="206" font-size="12" fill="#c0392b" text-anchor="middle">写 512 KB</text>

  <rect x="336" y="110" width="124" height="60" rx="4" fill="#fff0ee" stroke="#c0392b"/>
  <text x="398" y="132" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="middle">第二个 kernel</text>
  <text x="398" y="152" font-size="12" fill="#444" text-anchor="middle">读 8 份，相加</text>

  <rect x="336" y="186" width="124" height="42" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="398" y="212" font-size="12.5" fill="#111" text-anchor="middle">最终输出 64 KB</text>

  <line x1="134" y1="169" x2="172" y2="169" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="296" y1="140" x2="330" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="398" y1="170" x2="398" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>

  <text x="38" y="256" font-size="13" font-weight="bold" fill="#c0392b">SM 发出的流量：写 512 KB ＋ 读 512 KB ＋ 写 64 KB ≈ 1.06 MB</text>
  <text x="38" y="278" font-size="12.5" fill="#444">还要多一次 kernel 启动，以及 8 块暂存区的显存。</text>
  <text x="38" y="300" font-size="12.5" fill="#444">第二个 kernel 必须等第一个全部结束才能开始。</text>
  <text x="38" y="330" font-size="12.5" fill="#555">注：读写都按 fp32 的部分和算，暂存区不能用更短的类型，</text>
  <text x="38" y="348" font-size="12.5" fill="#555">否则 8 份相加之前就先损失了精度。</text>

  <!-- new way -->
  <rect x="500" y="72" width="456" height="286" rx="6" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="514" y="96" font-size="15" font-weight="bold" fill="#2e7d32">有归约写回：8 个线程块直接累加到同一块输出上</text>

  <g>
    <rect x="516" y="110" width="94" height="30" rx="4" fill="#ffffff" stroke="#2e7d32"/>
    <text x="563" y="130" font-size="12" fill="#111" text-anchor="middle">线程块 0</text>
    <rect x="516" y="146" width="94" height="30" rx="4" fill="#ffffff" stroke="#2e7d32"/>
    <text x="563" y="166" font-size="12" fill="#111" text-anchor="middle">线程块 1</text>
    <text x="563" y="190" font-size="12" fill="#555" text-anchor="middle">…</text>
    <rect x="516" y="198" width="94" height="30" rx="4" fill="#ffffff" stroke="#2e7d32"/>
    <text x="563" y="218" font-size="12" fill="#111" text-anchor="middle">线程块 7</text>
  </g>

  <rect x="654" y="124" width="140" height="90" rx="4" fill="#ffffff" stroke="#2e7d32"/>
  <text x="724" y="148" font-size="12.5" font-weight="bold" fill="#111" text-anchor="middle">L2 旁的归约单元</text>
  <text x="724" y="170" font-size="12" fill="#444" text-anchor="middle">读旧值、相加、写回</text>
  <text x="724" y="192" font-size="12" fill="#444" text-anchor="middle">每个元素是一次原子操作</text>

  <rect x="820" y="140" width="122" height="58" rx="4" fill="#ffffff" stroke="#2e7d32"/>
  <text x="881" y="164" font-size="12.5" font-weight="bold" fill="#111" text-anchor="middle">一块输出</text>
  <text x="881" y="186" font-size="12" fill="#444" text-anchor="middle">64 KB</text>

  <path d="M610,125 L636,125 L636,160 L648,160" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M610,161 L648,161" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M610,213 L636,213 L636,176 L648,176" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="794" y1="169" x2="814" y2="169" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>

  <text x="514" y="256" font-size="13" font-weight="bold" fill="#2e7d32">SM 发出的流量：写 512 KB，没有别的</text>
  <text x="514" y="278" font-size="12.5" fill="#444">读旧值与相加发生在 L2 一侧，不占 SM 到 L2 的带宽。</text>
  <text x="514" y="300" font-size="12.5" fill="#444">不需要第二个 kernel，也不需要 8 块暂存区。</text>
  <text x="514" y="330" font-size="12.5" fill="#c0392b">前提：这块输出在 kernel 开始前必须已经清零，</text>
  <text x="514" y="348" font-size="12.5" fill="#c0392b">因为每一笔都是加到目的地原有的值上。</text>

  <!-- bottom -->
  <rect x="24" y="374" width="932" height="206" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="38" y="398" font-size="13.5" font-weight="bold" fill="#111">指令、算子与机器码</text>
  <text x="38" y="420" font-size="11.5" fill="#333" font-family="monospace">cp.reduce.async.bulk.tensor.2d.global.shared::cta.add.tile.bulk_group  [tensorMap, {x, y}], [smem];</text>
  <text x="38" y="442" font-size="12.5" fill="#111">本库在 sm_90a 上编出的机器码：<tspan fill="#2e7d32" font-family="monospace">UTMAREDG.2D.ADD</tspan>。普通写出是 <tspan font-family="monospace">UTMASTG.2D</tspan>，两者只差一个后缀。</text>

  <line x1="38" y1="456" x2="942" y2="456" stroke="#bbb"/>
  <text x="46" y="476" font-size="12.5" font-weight="bold" fill="#111">归约算子</text>
  <text x="220" y="476" font-size="12.5" font-weight="bold" fill="#111">允许的元素类型（张量版，PTX ISA 9.4）</text>

  <text x="46" y="500" font-size="12.5" fill="#333" font-family="monospace">.add</text>
  <text x="220" y="500" font-size="12.5" fill="#333" font-family="monospace">.u32 .s32 .u64 .f32 .f16 .bf16</text>
  <text x="620" y="500" font-size="12" fill="#c0392b">没有 .f64：双精度的累加不走这条通路</text>

  <text x="46" y="522" font-size="12.5" fill="#333" font-family="monospace">.min .max</text>
  <text x="220" y="522" font-size="12.5" fill="#333" font-family="monospace">.u32 .s32 .u64 .s64 .f16 .bf16</text>

  <text x="46" y="544" font-size="12.5" fill="#333" font-family="monospace">.inc .dec</text>
  <text x="220" y="544" font-size="12.5" fill="#333" font-family="monospace">.u32</text>

  <text x="46" y="566" font-size="12.5" fill="#333" font-family="monospace">.and .or .xor</text>
  <text x="220" y="566" font-size="12.5" fill="#333" font-family="monospace">.b32 .b64</text>
  <text x="620" y="566" font-size="12" fill="#555">元素类型本身写在描述符里，指令只给算子</text>
</svg>
