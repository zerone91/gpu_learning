<text x="519" y="588" font-size="13" fill="#7a3f0c">⋮ 共 64 段，每段 8 KiB，相邻两段起点相隔 32 KiB，合计 512 KiB</text>
<path d="M615,440 L615,420 L560,420 L560,322" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arg)"/>
<text x="552" y="398" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="end">② 地址：标量单元给起点，</text>
