<text x="38" y="336" font-size="15" text-anchor="start" fill="#b86a0c" font-weight="bold">写法二：ignore-src = true</text>
<text x="38" y="360" font-size="13" text-anchor="start" fill="#222222">做法：指令照发，但告诉硬件“源数据不要了”</text>
