<text x="38" y="264" font-size="13" text-anchor="start" fill="#222222">做法：cp.async 前面加谓词，越界就不发这条指令</text>
<text x="38" y="286" font-size="13" text-anchor="start" fill="#222222">结果：shared 里这 16 字节保持原样，是上一轮块留下的旧数据，结果静默错</text>
