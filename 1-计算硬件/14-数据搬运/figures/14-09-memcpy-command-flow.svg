<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 620" width="970" height="620" font-family="sans-serif">
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9771e"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
  </defs>
  <rect x="0" y="0" width="970" height="620" fill="#ffffff"/>

  <!-- host box -->
  <rect x="20" y="20" width="380" height="540" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
  <text x="36" y="42" font-size="15" font-weight="bold">主机：CPU 与主机内存</text>
  <rect x="40" y="54" width="340" height="52" rx="6" fill="#fde7cf" stroke="#d9771e" stroke-width="1.5"/>
  <text x="210" y="86" font-size="15" text-anchor="middle">CPU 上的 CUDA 驱动</text>

  <!-- GPFIFO -->
  
  <g stroke="#555" stroke-width="1.5">
    <rect x="40" y="144" width="32" height="36" fill="#eee"/>
    <rect x="72" y="144" width="32" height="36" fill="#eee"/>
    <rect x="104" y="144" width="32" height="36" fill="#eee"/>
    <rect x="136" y="144" width="32" height="36" fill="#f6c89a"/>
    <rect x="168" y="144" width="32" height="36" fill="#fff"/>
    <rect x="200" y="144" width="32" height="36" fill="#fff"/>
  </g>
  <text x="152" y="168" font-size="14" text-anchor="middle">新</text><text x="40" y="204" font-size="14">GPFIFO（环形队列，实际在显存里）</text>
  
  <!-- GPFIFO entry pointer to pushbuffer -->
  <line x1="152" y1="212" x2="152" y2="262" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ak)"/>

  <!-- pushbuffer -->
  <text x="170" y="258" font-size="14">推送缓冲（命令一条接一条）</text>
  <rect x="40" y="266" width="340" height="150" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <g font-size="14">
    <rect x="40" y="266" width="340" height="30" fill="#f3f3f3" stroke="#bbb"/><text x="50" y="286">获取信号量（等 stream 里的前序工作）</text>
    <rect x="40" y="296" width="340" height="30" fill="#e3edfb" stroke="#bbb"/><text x="50" y="316">拷贝参数：源地址、目的地址、长度</text>
    <rect x="40" y="326" width="340" height="30" fill="#e3edfb" stroke="#bbb"/><text x="50" y="346">启动 DMA（LAUNCH_DMA）</text>
    <rect x="40" y="356" width="340" height="30" fill="#fbe1de" stroke="#bbb"/><text x="50" y="376">释放信号量：写入值 N（可带时间戳）</text>
    <text x="50" y="406" fill="#777">……</text>
  </g>

  <!-- pinned source -->
  <rect x="40" y="466" width="340" height="66" rx="6" fill="#dbe8fa" stroke="#1f5fbf" stroke-width="2"/>
  <text x="210" y="494" font-size="15" text-anchor="middle" font-weight="bold">锁页缓冲（源数据，64 MB）</text>
  <text x="210" y="518" font-size="14" text-anchor="middle">物理位置固定</text>

  <!-- PCIe band -->
  <rect x="404" y="20" width="32" height="540" fill="#e2e2e2"/>
  <text x="420" y="300" font-size="15" text-anchor="middle" transform="rotate(-90 420 300)">PCIe</text>

  <!-- GPU box -->
  <rect x="440" y="20" width="510" height="540" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
  <text x="456" y="42" font-size="15" font-weight="bold">GPU</text>
  <rect x="480" y="56" width="110" height="44" rx="6" fill="#fff" stroke="#d9771e" stroke-width="1.5"/>
  <text x="535" y="84" font-size="15" text-anchor="middle">门铃寄存器</text>
  <rect x="630" y="46" width="300" height="74" rx="6" fill="#fde7cf" stroke="#d9771e" stroke-width="2"/>
  <text x="780" y="76" font-size="16" text-anchor="middle" font-weight="bold">主机前端（PBDMA）</text>
  <text x="780" y="100" font-size="14" text-anchor="middle">取项、读命令、解析、分派</text>
  <line x1="590" y1="78" x2="628" y2="78" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>

  <rect x="800" y="150" width="130" height="62" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.5"/>
  <text x="865" y="176" font-size="14" text-anchor="middle">计算通道</text>
  <text x="865" y="198" font-size="14" text-anchor="middle">获取信号量 = N？</text>
  <line x1="865" y1="120" x2="865" y2="148" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  <rect x="800" y="250" width="130" height="62" rx="6" fill="#e6f4e8" stroke="#2e8b3e" stroke-width="1.5"/>
  <text x="865" y="276" font-size="14" text-anchor="middle">SM</text>
  <text x="865" y="298" font-size="14" text-anchor="middle">kernel K</text>
  <line x1="900" y1="212" x2="900" y2="248" stroke="#2e8b3e" stroke-width="2" marker-end="url(#ak)"/>
  <text x="894" y="236" font-size="14" text-anchor="end" fill="#2e8b3e">值到才放行</text>

  <rect x="560" y="250" width="190" height="70" rx="6" fill="#e3edfb" stroke="#1f5fbf" stroke-width="2"/>
  <text x="655" y="280" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f5fbf">copy engine</text>
  <text x="655" y="304" font-size="14" text-anchor="middle">拆成读写请求</text>
  <line x1="700" y1="120" x2="700" y2="248" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  <text x="708" y="200" font-size="14" fill="#d9771e">⑥ 分派</text>

  <!-- device memory -->
  <rect x="460" y="380" width="475" height="165" rx="6" fill="#efefef" stroke="#555" stroke-width="1.5"/>
  <text x="476" y="404" font-size="15" font-weight="bold">显存</text>
  <rect x="480" y="420" width="220" height="60" rx="4" fill="#dbe8fa" stroke="#1f5fbf" stroke-width="1.5"/>
  <text x="590" y="456" font-size="15" text-anchor="middle">目的缓冲（64 MB）</text>
  <rect x="725" y="420" width="190" height="60" rx="4" fill="#fbe1de" stroke="#c0392b" stroke-width="1.5"/>
  <text x="820" y="456" font-size="15" text-anchor="middle">信号量：值 N</text>

  <!-- ① ② ③ -->
  <line x1="152" y1="106" x2="152" y2="142" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  <text x="160" y="128" font-size="14" fill="#d9771e">② 追加一项</text>
  <line x1="366" y1="106" x2="366" y2="264" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  <text x="358" y="226" font-size="14" fill="#d9771e" text-anchor="end">① 写命令</text>
  <line x1="380" y1="72" x2="478" y2="72" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  
  <text x="232" y="128" font-size="14" fill="#d9771e"></text>
  <text x="420" y="64" font-size="14" fill="#d9771e" text-anchor="middle">③ 按门铃</text>

  <!-- ④ ⑤ reads by front end -->
  <line x1="234" y1="164" x2="640" y2="122" stroke="#d9771e" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ao)"/>
  <text x="520" y="126" font-size="14" fill="#d9771e" text-anchor="middle">④ 读 GPFIFO 项</text>
  <line x1="382" y1="310" x2="660" y2="124" stroke="#d9771e" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ao)"/>
  <text x="566" y="214" font-size="14" fill="#d9771e">⑤ 跨 PCIe</text><text x="566" y="234" font-size="14" fill="#d9771e">读命令</text>

  <!-- ⑦ data -->
  <path d="M382,500 L450,500 L450,290 L556,290" stroke="#1f5fbf" stroke-width="5" fill="none" marker-end="url(#ab)"/>
  <line x1="620" y1="320" x2="620" y2="416" stroke="#1f5fbf" stroke-width="5" marker-end="url(#ab)"/>
  <text x="628" y="364" font-size="14" fill="#1f5fbf"><tspan x="628">⑦ 读主机内存、</tspan><tspan x="628" dy="18">写显存</tspan></text>

  <!-- ⑧ semaphore -->
  <line x1="740" y1="320" x2="800" y2="416" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="776" y="352" font-size="14" fill="#c0392b">⑧ 写信号量</text>
  <path d="M915,450 L940,450 L940,181 L932,181" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,4" fill="none" marker-end="url(#ar)"/>

  <!-- legend -->
  <g font-size="14">
    <line x1="30" y1="592" x2="80" y2="592" stroke="#d9771e" stroke-width="2"/><text x="88" y="597">命令（实线：写；虚线：GPU 来取）</text>
    <line x1="380" y1="592" x2="430" y2="592" stroke="#1f5fbf" stroke-width="5"/><text x="438" y="597">数据</text>
    <line x1="500" y1="592" x2="550" y2="592" stroke="#c0392b" stroke-width="2.5"/><text x="558" y="597">完成通知（信号量）</text>
  </g>
</svg>
