<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="1150" height="620" font-family="sans-serif">
<rect x="0" y="0" width="1150" height="620" fill="#ffffff"/>

<text x="575" y="30" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">搬运占掉的寄存器，怎么变成"每个 SM 少放一个线程块"</text>
<text x="575" y="54" font-size="14" text-anchor="middle" fill="#555">H100：每个 SM 有 65536 个 32 位寄存器；本例每块 128 个线程（4 个 warp）</text>

<!-- upper: per-thread bars -->
<text x="16" y="82" font-size="16" fill="#222" font-weight="bold">一、每线程要多少寄存器</text>
<line x1="150" y1="330" x2="900" y2="330" stroke="#222" stroke-width="2"/>

<!-- bar 1: 120 compute + 32 staging + 6 addr + 2 round -->
<rect x="190" y="138" width="120" height="192" fill="#2c6fb7" stroke="#222" stroke-width="1.5"/>
<rect x="190" y="87" width="120" height="51" fill="#c0392b" stroke="#222" stroke-width="1.5"/>
<rect x="190" y="77" width="120" height="10" fill="#e8a7a0" stroke="#222" stroke-width="1.5"/>
<text x="250" y="240" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">计算 120</text>
<text x="250" y="118" font-size="14" text-anchor="middle" fill="#ffffff">中转数据 32</text>
<text x="322" y="85" font-size="13" fill="#222">地址 6（取整后共 160）</text>
<text x="250" y="352" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">load/store</text>
<text x="250" y="374" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">160 个/线程</text>

<!-- bar 2: 120 + 6 -->
<rect x="450" y="138" width="120" height="192" fill="#2c6fb7" stroke="#222" stroke-width="1.5"/>
<rect x="450" y="125" width="120" height="13" fill="#e8a7a0" stroke="#222" stroke-width="1.5"/>
<text x="510" y="240" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">计算 120</text>
<text x="582" y="133" font-size="13" fill="#222">地址 6（取整后共 128）</text>
<text x="510" y="352" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">cp.async</text>
<text x="510" y="374" font-size="15" text-anchor="middle" fill="#1f7a4d" font-weight="bold">128 个/线程</text>

<!-- bar 3: 120 -->
<rect x="710" y="138" width="120" height="192" fill="#2c6fb7" stroke="#222" stroke-width="1.5"/>
<text x="770" y="240" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">计算 120</text>
<text x="842" y="143" font-size="13" fill="#222">搬运 0</text>
<text x="770" y="352" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">TMA</text>
<text x="770" y="374" font-size="15" text-anchor="middle" fill="#1f7a4d" font-weight="bold">120 个/线程</text>

<text x="16" y="120" font-size="13" fill="#2c6fb7">蓝 = 计算本身要的</text>
<text x="16" y="142" font-size="13" fill="#2c6fb7">（其中 64 个是</text>
<text x="16" y="164" font-size="13" fill="#2c6fb7">矩阵乘的累加器）</text>
<text x="16" y="196" font-size="13" fill="#c0392b">红 = 搬运额外要的</text>
<text x="16" y="218" font-size="13" fill="#c0392b">深红：数据路过的落脚点</text>
<text x="16" y="240" font-size="13" fill="#c0392b">浅红：存地址</text>

<!-- lower: register file division -->
<line x1="16" y1="394" x2="1134" y2="394" stroke="#bbb" stroke-width="1"/>
<text x="16" y="420" font-size="16" fill="#222" font-weight="bold">二、65536 个寄存器能放下几个块（每块 128 线程，向下取整）</text>

<text x="16" y="452" font-size="14" fill="#222">load/store</text>
<text x="16" y="470" font-size="13" fill="#666">每块 20480 个</text>
<rect x="200" y="436" width="620" height="34" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
<rect x="200" y="436" width="194" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="394" y="436" width="194" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="588" y="436" width="194" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<text x="297" y="459" font-size="14" text-anchor="middle" fill="#222">块 1</text>
<text x="491" y="459" font-size="14" text-anchor="middle" fill="#222">块 2</text>
<text x="685" y="459" font-size="14" text-anchor="middle" fill="#222">块 3</text>
<rect x="782" y="436" width="38" height="34" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="828" y="459" font-size="13" fill="#c0392b">剩下的不够第 4 块</text>
<text x="828" y="478" font-size="15" fill="#c0392b" font-weight="bold">3 块 = 12 warp = 18.75%</text>

<text x="16" y="512" font-size="14" fill="#222">cp.async</text>
<text x="16" y="530" font-size="13" fill="#666">每块 16384 个</text>
<rect x="200" y="496" width="620" height="34" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
<rect x="200" y="496" width="155" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="355" y="496" width="155" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="510" y="496" width="155" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="665" y="496" width="155" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<text x="277" y="519" font-size="14" text-anchor="middle" fill="#222">块 1</text>
<text x="432" y="519" font-size="14" text-anchor="middle" fill="#222">块 2</text>
<text x="587" y="519" font-size="14" text-anchor="middle" fill="#222">块 3</text>
<text x="742" y="519" font-size="14" text-anchor="middle" fill="#222">块 4</text>
<text x="828" y="519" font-size="15" fill="#1f7a4d" font-weight="bold">4 块 = 16 warp = 25%</text>

<text x="16" y="572" font-size="14" fill="#222">TMA</text>
<text x="16" y="590" font-size="13" fill="#666">每块 15360 个</text>
<rect x="200" y="556" width="620" height="34" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
<rect x="200" y="556" width="145" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="345" y="556" width="145" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="490" y="556" width="145" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<rect x="635" y="556" width="145" height="34" fill="#cfe0f2" stroke="#2c6fb7" stroke-width="1.5"/>
<text x="272" y="579" font-size="14" text-anchor="middle" fill="#222">块 1</text>
<text x="417" y="579" font-size="14" text-anchor="middle" fill="#222">块 2</text>
<text x="562" y="579" font-size="14" text-anchor="middle" fill="#222">块 3</text>
<text x="707" y="579" font-size="14" text-anchor="middle" fill="#222">块 4</text>
<rect x="780" y="556" width="40" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="828" y="572" font-size="13" fill="#555">省得更多，但下一级台阶</text>
<text x="828" y="590" font-size="13" fill="#555">要每线程 102 个才够得着</text>

<line x1="200" y1="430" x2="200" y2="596" stroke="#222" stroke-width="1"/>
<line x1="820" y1="430" x2="820" y2="596" stroke="#222" stroke-width="1"/>
</svg>
