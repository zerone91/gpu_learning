<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="sans-serif">
<rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>
<defs>
  <marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#333"/>
  </marker>
</defs>

<text x="24" y="32" font-size="20" font-weight="bold" fill="#111">结果离开累加缓冲本来就要搬一趟，昇腾在这一趟里一次办完四件事</text>
<text x="24" y="56" font-size="14" fill="#555">GPU 没有这个部件，同样几件事要拆成三步，每步都占 SM 的发射机会或一次下单。</text>

<!-- left: L0C -->
<rect x="40" y="96" width="190" height="130" fill="#dce8dc" stroke="#2f6b2f" stroke-width="1.8"/>
<text x="135" y="124" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">L0C</text>
<text x="135" y="146" font-size="12.5" fill="#333" text-anchor="middle">接口里叫 CO1</text>
<text x="135" y="174" font-size="14" fill="#111" text-anchor="middle">矩阵乘的累加结果</text>
<text x="135" y="196" font-size="14" font-weight="bold" fill="#c06000" text-anchor="middle">fp32，NZ 排列</text>
<text x="135" y="216" font-size="11.5" fill="#555" text-anchor="middle">NZ：切成 512 字节的小方块</text>

<line x1="234" y1="160" x2="282" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#ah3)"/>

<!-- middle: FixPipe -->
<rect x="286" y="80" width="520" height="340" fill="#fae3c8" stroke="#c06000" stroke-width="2"/>
<text x="546" y="106" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">FixPipe（搬运途中，一趟办完）</text>

<rect x="304" y="120" width="484" height="80" fill="#ffffff" stroke="#c06000" stroke-width="1.2"/>
<text x="318" y="143" font-size="14" font-weight="bold" fill="#111">① 排列方式转换</text>
<text x="776" y="143" font-size="12.5" fill="#c06000" text-anchor="end">模板参数 config</text>
<text x="318" y="165" font-size="12.5" fill="#333">CFG_ROW_MAJOR（默认）转成 ND，也就是普通行主序</text>
<text x="318" y="185" font-size="12.5" fill="#333">CFG_NZ 保持 NZ　　CFG_COLUMN_MAJOR 转成 DN，也就是列主序</text>

<rect x="304" y="208" width="484" height="62" fill="#ffffff" stroke="#c06000" stroke-width="1.2"/>
<text x="318" y="231" font-size="14" font-weight="bold" fill="#111">② 量化与精度转换</text>
<text x="776" y="231" font-size="12.5" fill="#c06000" text-anchor="end">quantPre 字段</text>
<text x="318" y="255" font-size="12.5" fill="#333">本图用 REQ8：把 int32 按一个标量比例量化成 8 位，比例由 deqScalar 给出</text>

<rect x="304" y="278" width="484" height="50" fill="#ffffff" stroke="#c06000" stroke-width="1.2"/>
<text x="318" y="301" font-size="14" font-weight="bold" fill="#111">③ 激活函数</text>
<text x="776" y="301" font-size="12.5" fill="#c06000" text-anchor="end">reluEn 字段</text>
<text x="318" y="321" font-size="12.5" fill="#333">置 true 就在写出的路上过一遍 ReLU</text>

<rect x="304" y="336" width="484" height="50" fill="#ffffff" stroke="#c06000" stroke-width="1.2"/>
<text x="318" y="359" font-size="14" font-weight="bold" fill="#111">④ 裁掉多申请的数据</text>
<text x="776" y="359" font-size="12.5" fill="#c06000" text-anchor="end">自动，无参数</text>
<text x="318" y="379" font-size="12.5" fill="#333">为对齐分形尺寸多算的那些行列，在量化之后被删除，不写出去</text>

<text x="546" y="406" font-size="12.5" fill="#333" text-anchor="middle">这四件事不占 AI Core 计算流水的任何一条指令。</text>

<line x1="810" y1="160" x2="858" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#ah3)"/>

<!-- right: GM -->
<rect x="862" y="96" width="196" height="130" fill="#eeeeee" stroke="#555" stroke-width="1.8"/>
<text x="960" y="124" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">显存（GM）</text>
<text x="960" y="156" font-size="14" fill="#111" text-anchor="middle">下一层直接能用的结果</text>
<text x="960" y="182" font-size="14" font-weight="bold" fill="#c06000" text-anchor="middle">int8，ND 排列</text>
<text x="960" y="206" font-size="11.5" fill="#555" text-anchor="middle">ND：普通行主序</text>
<text x="960" y="222" font-size="11.5" fill="#555" text-anchor="middle">并且已经过了 ReLU</text>

<!-- bottom: GPU counterpart -->
<rect x="40" y="432" width="1018" height="186" fill="#f0f4f8" stroke="#4a6b8a" stroke-width="1.5"/>
<text x="56" y="458" font-size="16" font-weight="bold" fill="#111">GPU 上同样几件事，要拆成三步</text>

<rect x="60" y="474" width="290" height="86" fill="#d7e3f4" stroke="#2a5080" stroke-width="1.5"/>
<text x="205" y="498" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">第一步　stmatrix</text>
<text x="205" y="520" font-size="12.5" fill="#333" text-anchor="middle">把累加器写回 shared memory。</text>
<text x="205" y="540" font-size="12.5" fill="#333" text-anchor="middle">它写不了 fp32，所以之前要先转成 bf16。</text>
<text x="205" y="556" font-size="12" fill="#2a5080" text-anchor="middle">占一次发射</text>

<line x1="354" y1="517" x2="382" y2="517" stroke="#333" stroke-width="2" marker-end="url(#ah3)"/>

<rect x="386" y="474" width="290" height="86" fill="#d7e3f4" stroke="#2a5080" stroke-width="1.5"/>
<text x="531" y="498" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">第二步　线程发算术指令</text>
<text x="531" y="520" font-size="12.5" fill="#333" text-anchor="middle">量化和激活函数写在 kernel 的尾声里。</text>
<text x="531" y="540" font-size="12.5" fill="#333" text-anchor="middle">想加什么算什么。</text>
<text x="531" y="556" font-size="12" fill="#2a5080" text-anchor="middle">占发射机会</text>

<line x1="680" y1="517" x2="708" y2="517" stroke="#333" stroke-width="2" marker-end="url(#ah3)"/>

<rect x="712" y="474" width="290" height="86" fill="#fae3c8" stroke="#c06000" stroke-width="1.5"/>
<text x="857" y="498" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">第三步　TMA store</text>
<text x="857" y="520" font-size="12.5" fill="#333" text-anchor="middle">按描述符把分块写回显存，</text>
<text x="857" y="540" font-size="12.5" fill="#333" text-anchor="middle">也就是切块的逆操作。</text>
<text x="857" y="556" font-size="12" fill="#c06000" text-anchor="middle">一个线程下一次单</text>

<text x="56" y="588" font-size="13" fill="#111">差别不在能不能做，而在做它的部件是固定电路还是可编程的指令。昇腾省的是发射机会，GPU 换来的是想加什么算什么。</text>
<text x="56" y="608" font-size="12.5" fill="#555">参数名、取值和通路取自 Ascend C 的 Fixpipe 接口文档。REQ8 只是 quantPre 众多取值中的一个。</text>
</svg>
