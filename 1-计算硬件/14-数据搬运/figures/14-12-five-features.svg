<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" width="980" height="630" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="630" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#111">五项附加功能各挂在搬运路径的一段上</text>
  <text x="24" y="58" font-size="14" fill="#444">同一次搬运的数据，依次经过下面四站。每一站上，引擎都已经知道一些别人不知道的事，所以能顺手多做一件。</text>

  <!-- path boxes -->
  <rect x="24" y="86" width="150" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="99" y="116" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">显存与 L2</text>
  <text x="99" y="140" font-size="12.5" fill="#444" text-anchor="middle">数据的原始位置</text>
  <text x="99" y="160" font-size="12.5" fill="#444" text-anchor="middle">L2 全芯片共用</text>

  <rect x="214" y="86" width="330" height="96" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="379" y="110" font-size="15" font-weight="bold" fill="#2c5aa0" text-anchor="middle">搬运引擎（TMA）或访存单元</text>
  <rect x="226" y="124" width="95" height="46" rx="4" fill="#ffffff" stroke="#2c5aa0"/>
  <text x="273.5" y="143" font-size="12.5" fill="#111" text-anchor="middle">① 算地址</text>
  <text x="273.5" y="161" font-size="11.5" fill="#555" text-anchor="middle">也判边界</text>
  <rect x="331" y="124" width="95" height="46" rx="4" fill="#ffffff" stroke="#2c5aa0"/>
  <text x="378.5" y="143" font-size="12.5" fill="#111" text-anchor="middle">② 发请求</text>
  <text x="378.5" y="161" font-size="11.5" fill="#555" text-anchor="middle">收数据</text>
  <rect x="436" y="124" width="95" height="46" rx="4" fill="#ffffff" stroke="#2c5aa0"/>
  <text x="483.5" y="143" font-size="12.5" fill="#111" text-anchor="middle">③ 写目的地</text>
  <text x="483.5" y="161" font-size="11.5" fill="#555" text-anchor="middle">按份投递</text>

  <rect x="584" y="86" width="150" height="96" rx="6" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="659" y="116" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">shared memory</text>
  <text x="659" y="140" font-size="12.5" fill="#444" text-anchor="middle">一个 SM 内部</text>
  <text x="659" y="160" font-size="12.5" fill="#444" text-anchor="middle">由程序显式管理</text>

  <rect x="774" y="86" width="182" height="96" rx="6" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="865" y="116" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">计算单元</text>
  <text x="865" y="140" font-size="12.5" fill="#444" text-anchor="middle">矩阵指令与乘加</text>
  <text x="865" y="160" font-size="12.5" fill="#444" text-anchor="middle">只用片上操作数</text>

  <!-- arrows -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="174" y1="134" x2="208" y2="134" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="544" y1="134" x2="578" y2="134" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="734" y1="134" x2="768" y2="134" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>

  <!-- feature badges -->
  <!-- gather at stage 1 -->
  <line x1="273" y1="170" x2="273" y2="228" stroke="#8e44ad" stroke-width="1.6" stroke-dasharray="4,3"/>
  <rect x="150" y="228" width="250" height="92" rx="6" fill="#f6eefb" stroke="#8e44ad" stroke-width="1.6"/>
  <text x="162" y="250" font-size="14" font-weight="bold" fill="#8e44ad">gather：一条指令取四行</text>
  <text x="162" y="270" font-size="12.5" fill="#333">引擎掌握地址，所以坐标可以给四组。</text>
  <text x="162" y="289" font-size="12.5" fill="#333">行是散的、行内连续的访问也能走引擎。</text>
  <text x="388" y="313" font-size="12" font-weight="bold" fill="#8e44ad" text-anchor="end">Blackwell</text>

  <!-- oob fill at stage 1 -->
  <line x1="273" y1="124" x2="140" y2="124" stroke="#d97706" stroke-width="0" />
  <line x1="300" y1="124" x2="300" y2="330" stroke="#d97706" stroke-width="0"/>
  <rect x="150" y="334" width="250" height="92" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.6"/>
  <line x1="273" y1="320" x2="273" y2="334" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="162" y="356" font-size="14" font-weight="bold" fill="#b45309">越界填充：出界的部分不读，补常数</text>
  <text x="162" y="376" font-size="12.5" fill="#333">引擎比较坐标和张量长度，就知道哪里出界。</text>
  <text x="162" y="395" font-size="12.5" fill="#333">边界块与普通块用同一段代码计算。</text>
  <text x="388" y="419" font-size="12" font-weight="bold" fill="#b45309" text-anchor="end">Ampere / Hopper</text>

  <!-- cache hint at stage 2 -->
  <line x1="378" y1="124" x2="378" y2="112" stroke="#0f766e" stroke-width="0"/>
  <path d="M378,124 L378,100 L190,100 L190,86" fill="none" stroke="#0f766e" stroke-width="0"/>
  <rect x="430" y="228" width="250" height="92" rx="6" fill="#e8f6f4" stroke="#0f766e" stroke-width="1.6"/>
  <line x1="378" y1="170" x2="455" y2="228" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="442" y="250" font-size="14" font-weight="bold" fill="#0f766e">缓存提示：取回来之后留不留</text>
  <text x="442" y="270" font-size="12.5" fill="#333">请求经过缓存，顺路带一句话给缓存。</text>
  <text x="442" y="289" font-size="12.5" fill="#333">不改结果，只改这段数据被扔掉的先后。</text>
  <text x="668" y="313" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">Fermi 起，Ampere 扩充</text>

  <!-- multicast at stage 3 -->
  <rect x="430" y="334" width="250" height="92" rx="6" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.6"/>
  <line x1="483" y1="320" x2="483" y2="334" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="442" y="356" font-size="14" font-weight="bold" fill="#2e7d32">多播：读一次，几个线程块同时收</text>
  <text x="442" y="376" font-size="12.5" fill="#333">投递路径本来就要经过片上网络。</text>
  <text x="442" y="395" font-size="12.5" fill="#333">在路上复制成几份，省掉重复的读取。</text>
  <text x="668" y="419" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="end">Hopper</text>

  <!-- reduce at write-back -->
  <rect x="710" y="228" width="246" height="198" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="722" y="250" font-size="14" font-weight="bold" fill="#c0392b">归约写回：落地时做加法</text>
  <text x="722" y="270" font-size="12.5" fill="#333">写出方向的数据也要经过同一条路。</text>
  <text x="722" y="289" font-size="12.5" fill="#333">目的地的旧值和新值相加，逐元素原子。</text>
  <text x="722" y="308" font-size="12.5" fill="#333">几个线程块可以累加到同一块输出上。</text>
  <text x="722" y="333" font-size="12.5" fill="#555">方向与前四项相反：</text>
  <text x="722" y="352" font-size="12.5" fill="#555">shared memory → 显存。</text>
  <text x="944" y="419" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Hopper</text>

  <!-- bottom summary -->
  <rect x="24" y="454" width="932" height="150" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="38" y="478" font-size="14" font-weight="bold" fill="#111">共同前提：这五件事都不需要数据额外走一趟</text>
  <text x="38" y="502" font-size="13" fill="#333">1. 地址已经在引擎手里，所以引擎知道这笔数据出不出界、该送给谁、要不要换一组行坐标。</text>
  <text x="38" y="523" font-size="13" fill="#333">2. 数据本来就要流经引擎一次，所以复制成几份、与目的地的旧值相加，都在这一次流经时完成。</text>
  <text x="38" y="544" font-size="13" fill="#333">3. 请求本来就要穿过 L1 与 L2，所以"留不留、留多久"这句话可以搭在同一个请求上。</text>
  <text x="38" y="571" font-size="13" fill="#555">如果改用软件做同样的事：越界要加分支，多播要多读几次，归约要再启动一个 kernel，缓存去留则完全管不了。</text>
  <text x="38" y="592" font-size="13" fill="#555">每一项省下的，都是一趟本来要重新走的路。</text>
</svg>
