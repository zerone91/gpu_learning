<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="sans-serif">
<defs><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eeeeee"/><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
<text x="20" y="86" font-size="15" font-weight="bold">CPU</text>
<line x1="185" y1="100" x2="930" y2="100" stroke="#ddd" stroke-width="1"/>
<text x="20" y="156" font-size="15" font-weight="bold">主机前端</text>
<line x1="185" y1="170" x2="930" y2="170" stroke="#ddd" stroke-width="1"/>
<text x="20" y="226" font-size="15" font-weight="bold">copy engine</text>
<line x1="185" y1="240" x2="930" y2="240" stroke="#ddd" stroke-width="1"/>
<text x="20" y="296" font-size="15" font-weight="bold">SM</text>
<line x1="185" y1="310" x2="930" y2="310" stroke="#ddd" stroke-width="1"/>
<rect x="190.0" y="60" width="78.0" height="38" fill="#fde7cf" stroke="#d9771e" stroke-width="1.5"/>
<text x="229.0" y="84" font-size="14" text-anchor="middle" fill="#000">下单</text>
<rect x="268.0" y="60" width="41.6" height="38" fill="#fbd3ad" stroke="#d9771e" stroke-width="1.5"/>
<text x="315.6" y="84" font-size="14" fill="#555">返回</text>
<text x="555.0" y="84" font-size="14" text-anchor="middle" fill="#555">去做别的事</text>
<rect x="268.0" y="130" width="52.0" height="38" fill="#fde7cf" stroke="#d9771e" stroke-width="1.5"/>
<text x="294.0" y="154" font-size="14" text-anchor="middle" fill="#000">取</text>
<rect x="320.0" y="130" width="472.0" height="38" fill="url(#hat)" stroke="#999" stroke-width="1.5"/>
<text x="555.0" y="155" font-size="14" text-anchor="middle" fill="#333">计算通道在等信号量</text>
<rect x="792.0" y="130" width="33.0" height="38" fill="#fde7cf" stroke="#d9771e" stroke-width="1.5"/>
<text x="831.0" y="155" font-size="14" fill="#d9771e">放行 K</text>
<rect x="320.0" y="200" width="450.0" height="38" fill="#cfe0f7" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="555.0" y="224" font-size="15" text-anchor="middle" fill="#1f5fbf">搬 64 MB（约 1.34 ms）</text>
<rect x="770.0" y="200" width="22.0" height="38" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
<text x="781.0" y="256" font-size="14" text-anchor="middle" fill="#c0392b">写信号量</text>
<text x="555.0" y="295" font-size="14" text-anchor="middle" fill="#888">K 还不能开始</text>
<rect x="880.0" y="270" width="44.0" height="38" fill="#cdebd2" stroke="#2e8b3e" stroke-width="1.5"/>
<text x="902.0" y="294" font-size="14" text-anchor="middle" fill="#000">K</text>
<text x="928.0" y="295" font-size="14" fill="#2e8b3e">→</text>
<rect x="452" y="50" width="16" height="270" fill="#ffffff"/>
<line x1="452" y1="50" x2="452" y2="320" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="468" y1="50" x2="468" y2="320" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="642" y="50" width="16" height="270" fill="#ffffff"/>
<line x1="642" y1="50" x2="642" y2="320" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="658" y1="50" x2="658" y2="320" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="185" y1="335" x2="930" y2="335" stroke="#333" stroke-width="1.5"/>
<line x1="190.0" y1="330" x2="190.0" y2="340" stroke="#333" stroke-width="1.5"/><text x="190.0" y="358" font-size="14" text-anchor="middle">0</text>
<line x1="268.0" y1="330" x2="268.0" y2="340" stroke="#333" stroke-width="1.5"/><text x="268.0" y="358" font-size="14" text-anchor="middle">3</text>
<line x1="320.0" y1="330" x2="320.0" y2="340" stroke="#333" stroke-width="1.5"/><text x="320.0" y="358" font-size="14" text-anchor="middle">5</text>
<line x1="450.0" y1="330" x2="450.0" y2="340" stroke="#333" stroke-width="1.5"/><text x="450.0" y="358" font-size="14" text-anchor="middle">10</text>
<line x1="640.0" y1="330" x2="640.0" y2="340" stroke="#333" stroke-width="1.5"/><text x="640.0" y="358" font-size="14" text-anchor="middle">1340</text>
<line x1="770.0" y1="330" x2="770.0" y2="340" stroke="#333" stroke-width="1.5"/><text x="770.0" y="358" font-size="14" text-anchor="middle">1345</text>
<line x1="880.0" y1="330" x2="880.0" y2="340" stroke="#333" stroke-width="1.5"/><text x="880.0" y="358" font-size="14" text-anchor="middle">1350</text>
<text x="555.0" y="358" font-size="14" text-anchor="middle" fill="#555">（中段压缩）</text>
<text x="930" y="406" font-size="14" text-anchor="end">时间（微秒，示意）</text>
<text x="190" y="382" font-size="14">开头 0～10 μs 放大</text>
<text x="660" y="382" font-size="14">结尾 1340～1352 μs 放大</text>
<text x="20" y="436" font-size="14" fill="#555">灰色斜线：计算通道在等信号量；红块：copy engine 搬完后写信号量。数值为示意量级，传输时间按 64 MB ÷ 50 GB/s 计算。</text>
</svg>