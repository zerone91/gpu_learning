<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb7"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f8d7d2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c0392b" stroke-width="1.6"/></pattern></defs>
<text x="480" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">wait_group 只保证“我自己发的那几笔到了”，别人搬的那半块还要靠屏障</text>
<text x="20" y="80" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">① 只写 wait_group，不写 __syncthreads</text>
<text x="150" y="122" font-size="14" text-anchor="end" fill="#222222" font-weight="bold">warp 0</text>
<rect x="165" y="104" width="150" height="30" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="240.0" y="123.68" font-size="13" text-anchor="middle" fill="#222222">cp.async ×4</text>
<rect x="321" y="104" width="110" height="30" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="376.0" y="123.68" font-size="13" text-anchor="middle" fill="#222222">commit</text>
<rect x="437" y="104" width="140" height="30" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="3"/>
<text x="507.0" y="123.68" font-size="13" text-anchor="middle" fill="#222222">wait_group 0</text>
<rect x="583" y="104" width="286" height="30" fill="#f8d7d2" stroke="#c0392b" stroke-width="1.5" rx="3"/>
<text x="726.0" y="123.68" font-size="13" text-anchor="middle" fill="#222222">直接读整块 → 读到一半是旧数据</text>
<text x="150" y="168" font-size="14" text-anchor="end" fill="#222222" font-weight="bold">warp 1</text>
<rect x="165" y="150" width="220" height="30" fill="#e8e8e8" stroke="#666666" stroke-width="1.5" rx="3"/>
<text x="275.0" y="169.68" font-size="13" text-anchor="middle" fill="#222222">还在算地址（被调度得晚）</text>
<rect x="391" y="150" width="150" height="30" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="466.0" y="169.68" font-size="13" text-anchor="middle" fill="#222222">cp.async ×4</text>
<rect x="547" y="150" width="110" height="30" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="602.0" y="169.68" font-size="13" text-anchor="middle" fill="#222222">commit</text>
<rect x="663" y="150" width="206" height="30" fill="#f8d7d2" stroke="#c0392b" stroke-width="1.5" rx="3"/>
<text x="766.0" y="169.68" font-size="13" text-anchor="middle" fill="#222222">它那半块还在飞</text>
<text x="165" y="202" font-size="13" text-anchor="start" fill="#c0392b">warp 0 已经在读整块，而 warp 1 那半块还在飞 —— 它读到的是缓冲区里上一轮留下的旧数据。</text>
<text x="20" y="250" font-size="16" text-anchor="start" fill="#1f7a4d" font-weight="bold">② wait_group 之后补一次 __syncthreads</text>
<text x="150" y="292" font-size="14" text-anchor="end" fill="#222222" font-weight="bold">warp 0</text>
<rect x="165" y="274" width="150" height="30" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="240.0" y="293.68" font-size="13" text-anchor="middle" fill="#222222">cp.async ×4</text>
<rect x="321" y="274" width="110" height="30" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="376.0" y="293.68" font-size="13" text-anchor="middle" fill="#222222">commit</text>
<rect x="437" y="274" width="140" height="30" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="3"/>
<text x="507.0" y="293.68" font-size="13" text-anchor="middle" fill="#222222">wait_group 0</text>
<rect x="583" y="274" width="130" height="30" fill="#e8e8e8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="648.0" y="293.68" font-size="13" text-anchor="middle" fill="#222222">__syncthreads</text>
<rect x="719" y="274" width="150" height="30" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="794.0" y="293.68" font-size="13" text-anchor="middle" fill="#222222">读整块 → 对</text>
<text x="150" y="338" font-size="14" text-anchor="end" fill="#222222" font-weight="bold">warp 1</text>
<rect x="165" y="320" width="220" height="30" fill="#e8e8e8" stroke="#666666" stroke-width="1.5" rx="3"/>
<text x="275.0" y="339.68" font-size="13" text-anchor="middle" fill="#222222">还在算地址（被调度得晚）</text>
<rect x="391" y="320" width="150" height="30" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5" rx="3"/>
<text x="466.0" y="339.68" font-size="13" text-anchor="middle" fill="#222222">cp.async ×4</text>
<rect x="547" y="320" width="110" height="30" fill="#d7ede1" stroke="#1f7a4d" stroke-width="1.5" rx="3"/>
<text x="602.0" y="339.68" font-size="13" text-anchor="middle" fill="#222222">commit</text>
<rect x="663" y="320" width="206" height="30" fill="#e8e8e8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="766.0" y="339.68" font-size="13" text-anchor="middle" fill="#222222">到达屏障，数据才算齐</text>
<rect x="20" y="392" width="920" height="62" fill="#fbfbfb" stroke="#666666" stroke-width="1.5" rx="4"/>
<text x="36" y="416" font-size="13" text-anchor="start" fill="#222222">PTX 手册的原话是：cp.async 写入的数据，只有在“执行这条 cp.async 的那个线程”完成 wait 之后，才对它可见。</text>
<text x="36" y="438" font-size="13" text-anchor="start" fill="#222222">一个 tile 由整块的线程合搬，所以还要一次块内屏障，把“别人搬的部分也到了”这件事补上。</text>
</svg>
