<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="1020" height="500" font-family="sans-serif">
  <rect width="1020" height="500" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">多走一趟的账：单独开一个转置 kernel，比在搬运途中顺手转置多花多少时间</text>
  <text x="20" y="52" font-size="14" fill="#444">算例：4096×4096 的 bf16 矩阵 B（33.55 MB），在 H100 上做 4096³ 的矩阵乘。显存带宽按 3.35 TB/s，矩阵乘峰值按 990 TFLOP/s。</text>
  <text x="210" y="96" font-size="12.5" fill="#c0392b">多出来的这一趟：读 33.55 MB（10.0 µs）＋ 写 33.55 MB（10.0 µs）＋ 多启动一个 kernel（约 3 µs）＝ 23 µs</text>
  <path d="M210.0,118 L210.0,108 L302.0,108 L302.0,118" fill="none" stroke="#c0392b" stroke-width="1.4"/>
  <line x1="256.0" y1="108" x2="256.0" y2="102" stroke="#c0392b" stroke-width="1.4"/>
  <text x="20" y="144" font-size="14.5" font-weight="bold" fill="#c0392b">路线一</text>
  <text x="20" y="164" font-size="12.5" fill="#333">先开一个转置 kernel，</text>
  <text x="20" y="182" font-size="12.5" fill="#333">再做矩阵乘</text>
  <rect x="210.0" y="126" width="40.0" height="44" fill="#f8c9c9" stroke="#c0392b" stroke-width="1.4"/>
  <text x="230.0" y="148" font-size="12.5" fill="#111" text-anchor="middle">读</text>
  <rect x="250.0" y="126" width="40.0" height="44" fill="#f8c9c9" stroke="#c0392b" stroke-width="1.4"/>
  <text x="270.0" y="148" font-size="12.5" fill="#111" text-anchor="middle">写</text>
  <rect x="290.0" y="126" width="12.0" height="44" fill="#e0e0e0" stroke="#777" stroke-width="1.4"/>
  <rect x="302.0" y="126" width="556.0" height="44" fill="#cfe3f7" stroke="#1565c0" stroke-width="1.4"/>
  <text x="580.0" y="146" font-size="12.5" fill="#111" text-anchor="middle">矩阵乘本身：2 × 4096³ = 137.4 GFLOP ÷ 990 TFLOP/s</text>
  <text x="580.0" y="162" font-size="11.5" fill="#333" text-anchor="middle">139 µs</text>
  <text x="868.0" y="154" font-size="13.5" font-weight="bold" fill="#c0392b">合计 162 µs</text>
  <text x="20" y="244" font-size="14.5" font-weight="bold" fill="#2e7d32">路线二</text>
  <text x="20" y="264" font-size="12.5" fill="#333">转置交给 ldmatrix 的</text>
  <text x="20" y="282" font-size="12.5" fill="#333">.trans，途中顺手做</text>
  <rect x="210.0" y="226" width="556.0" height="44" fill="#cfe3f7" stroke="#1565c0" stroke-width="1.4"/>
  <text x="488.0" y="246" font-size="12.5" fill="#111" text-anchor="middle">矩阵乘本身（取数指令换成带 .trans 的那一条，指令条数不变）</text>
  <text x="488.0" y="262" font-size="11.5" fill="#333" text-anchor="middle">139 µs</text>
  <text x="776.0" y="254" font-size="13.5" font-weight="bold" fill="#2e7d32">合计 139 µs</text>
  <line x1="766.0" y1="272" x2="766.0" y2="302" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="858.0" y1="172" x2="858.0" y2="302" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="852.0" y="320" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">差 23 µs，多出 17%</text>
  <line x1="210" y1="342" x2="850.0" y2="342" stroke="#555" stroke-width="1.2"/>
  <line x1="210.0" y1="342" x2="210.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="210.0" y="362" font-size="11" fill="#555" text-anchor="middle">0</text>
  <line x1="290.0" y1="342" x2="290.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="290.0" y="362" font-size="11" fill="#555" text-anchor="middle">20</text>
  <line x1="370.0" y1="342" x2="370.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="370.0" y="362" font-size="11" fill="#555" text-anchor="middle">40</text>
  <line x1="450.0" y1="342" x2="450.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="450.0" y="362" font-size="11" fill="#555" text-anchor="middle">60</text>
  <line x1="530.0" y1="342" x2="530.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="530.0" y="362" font-size="11" fill="#555" text-anchor="middle">80</text>
  <line x1="610.0" y1="342" x2="610.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="610.0" y="362" font-size="11" fill="#555" text-anchor="middle">100</text>
  <line x1="690.0" y1="342" x2="690.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="690.0" y="362" font-size="11" fill="#555" text-anchor="middle">120</text>
  <line x1="770.0" y1="342" x2="770.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="770.0" y="362" font-size="11" fill="#555" text-anchor="middle">140</text>
  <line x1="850.0" y1="342" x2="850.0" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="850.0" y="362" font-size="11" fill="#555" text-anchor="middle">160</text>
  <text x="862.0" y="362" font-size="12" fill="#555">微秒</text>
  <rect x="20" y="378" width="980" height="108" fill="#f7f9fc" stroke="#99a" stroke-width="1.2"/>
  <text x="36" y="402" font-size="14" font-weight="bold" fill="#111">这 23 µs 是怎么来的，以及什么时候它更疼</text>
  <text x="36" y="428" font-size="12.5" fill="#333">多的那一趟必须把整个矩阵读出来再写回去，一读一写就是 2 × 33.55 MB ÷ 3.35 TB/s = 20 µs——这是带宽的硬账，写得再好也省不掉。</text>
  <text x="36" y="450" font-size="12.5" fill="#333">矩阵乘里 B 被复用 4096 次，所以 17% 已经是这笔账比较轻的情形。换成 attention 里每个 tile 只用一次的 K、V，转一趟的时间和用它算一趟的时间同量级。</text>
  <text x="36" y="472" font-size="12.5" fill="#333">路线二之所以不要钱，是因为转置发生在本来就要走的那一跳上：数据反正要从 shared memory 进寄存器，换一条带 .trans 的指令，不多读一个字节、不多花一拍。</text>
</svg>