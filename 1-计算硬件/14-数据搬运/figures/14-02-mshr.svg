<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold">L1 没命中之后：缺失登记表（MSHR）让几百个请求同时在路上</text>
  <text x="20" y="52" font-size="14" fill="#444">缺失登记表是一张小表，每行记着"我向下一级要过哪一段，谁在等它"。它决定了一个 SM 最多能有多少笔读取同时未归。</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#333"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1a7a3c"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#a33"/></marker>
  </defs>

  <!-- incoming requests -->
  <rect x="20" y="90" width="170" height="150" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="112" font-size="14" font-weight="bold" text-anchor="middle">合并后的段请求</text>
  <g font-size="12">
    <rect x="32" y="122" width="146" height="24" fill="#ffffff" stroke="#666"/><text x="40" y="139">warp 7 要 段 0x4A80</text>
    <rect x="32" y="150" width="146" height="24" fill="#ffffff" stroke="#666"/><text x="40" y="167">warp 7 要 段 0x4AA0</text>
    <rect x="32" y="178" width="146" height="24" fill="#ffffff" stroke="#666"/><text x="40" y="195">warp 9 要 段 0x4A80</text>
    <rect x="32" y="206" width="146" height="24" fill="#ffffff" stroke="#666"/><text x="40" y="223">warp 12 要 段 0x9C00</text>
  </g>

  <line x1="190" y1="165" x2="226" y2="165" stroke="#333" stroke-width="2" marker-end="url(#a1)"/>

  <!-- L1 tag -->
  <rect x="230" y="90" width="150" height="150" fill="#eef4fb" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="305" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#2a5d9f">L1 标签查找</text>
  <text x="242" y="138" font-size="12">这一段在不在 L1 里？</text>
  <text x="242" y="162" font-size="12" fill="#1a7a3c">在 → 直接给数据，</text>
  <text x="242" y="180" font-size="12" fill="#1a7a3c">　　约 40 拍结束</text>
  <text x="242" y="206" font-size="12" fill="#a33">不在 → 交给右边的</text>
  <text x="242" y="224" font-size="12" fill="#a33">　　　缺失登记表</text>

  <line x1="380" y1="165" x2="416" y2="165" stroke="#a33" stroke-width="2" marker-end="url(#a3)"/>

  <!-- MSHR table -->
  <rect x="420" y="80" width="360" height="200" fill="#fdf1e6" stroke="#b5651d" stroke-width="1.5"/>
  <text x="600" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#b5651d">缺失登记表（MSHR）</text>
  <g font-size="12">
    <rect x="434" y="112" width="120" height="24" fill="#ddd" stroke="#666"/><text x="440" y="129" font-weight="bold">正在要的段地址</text>
    <rect x="554" y="112" width="212" height="24" fill="#ddd" stroke="#666"/><text x="560" y="129" font-weight="bold">谁在等它（等回来要发给谁）</text>

    <rect x="434" y="136" width="120" height="26" fill="#ffffff" stroke="#666"/><text x="440" y="154">0x4A80</text>
    <rect x="554" y="136" width="212" height="26" fill="#ffffff" stroke="#666"/><text x="560" y="154">warp 7 的 R4 ＋ warp 9 的 R10</text>

    <rect x="434" y="162" width="120" height="26" fill="#ffffff" stroke="#666"/><text x="440" y="180">0x4AA0</text>
    <rect x="554" y="162" width="212" height="26" fill="#ffffff" stroke="#666"/><text x="560" y="180">warp 7 的 R5</text>

    <rect x="434" y="188" width="120" height="26" fill="#ffffff" stroke="#666"/><text x="440" y="206">0x9C00</text>
    <rect x="554" y="188" width="212" height="26" fill="#ffffff" stroke="#666"/><text x="560" y="206">warp 12 的 R2</text>

    <rect x="434" y="214" width="120" height="26" fill="#ffffff" stroke="#666" stroke-dasharray="4 3"/><text x="440" y="232" fill="#888">（空）</text>
    <rect x="554" y="214" width="212" height="26" fill="#ffffff" stroke="#666" stroke-dasharray="4 3"/><text x="560" y="232" fill="#888">表的行数有限，是一个 SM 的在途上限</text>
  </g>
  <text x="434" y="262" font-size="12" fill="#b5651d">第 1 行是"挂靠"：两个 warp 要的是同一段，只向 L2 发一次。</text>

  <line x1="780" y1="150" x2="830" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a1)"/>
  <text x="805" y="142" font-size="12" text-anchor="middle">发往 L2</text>
  <rect x="834" y="120" width="126" height="60" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="897" y="145" font-size="14" text-anchor="middle" font-weight="bold">L2 / 显存</text>
  <text x="897" y="166" font-size="12" text-anchor="middle">几百拍后回数据</text>

  <path d="M 897 182 L 897 312 L 600 312" fill="none" stroke="#1a7a3c" stroke-width="2" marker-end="url(#a2)"/>
  <text x="430" y="306" font-size="12" fill="#1a7a3c">数据回来后按这张表分发：同一段发给所有在等的人，然后划掉这一行</text>

  <!-- full case -->
  <rect x="20" y="330" width="940" height="120" fill="#fdecec" stroke="#a33" stroke-width="1.5"/>
  <text x="34" y="354" font-size="15" font-weight="bold" fill="#a33">表填满的时候会发生什么</text>
  <text x="34" y="378" font-size="13">新的未命中没有地方登记，访存单元只好把这条指令按在入口，等某一行被划掉才放行。</text>
  <text x="34" y="400" font-size="13">这时候增加 warp 数量没有用：卡住的不是"没有 warp 可发"，而是"发出去也没处记账"。</text>
  <text x="34" y="422" font-size="13">性能工具里这种停顿的名字是 <tspan font-family="monospace">LG Throttle</tspan> / <tspan font-family="monospace">MIO Throttle</tspan>，和"在等数据"（<tspan font-family="monospace">Long Scoreboard</tspan>）是两回事——前者是路堵住了，后者是货还没到。</text>

  <text x="20" y="484" font-size="13" fill="#444">一句话记住这张表的意义：显存带宽要跑满，靠的是"同时有很多笔读取在路上"，而"很多笔"的硬上限就写在这张表的行数里。</text>
  <text x="20" y="508" font-size="13" fill="#444">Volta 起 L1 改成了"流式"缓存：未命中不再要求先在缓存里占一个座位，只要登记表有空行就能发出去，在途笔数因此比老架构高出一大截。</text>
</svg>
