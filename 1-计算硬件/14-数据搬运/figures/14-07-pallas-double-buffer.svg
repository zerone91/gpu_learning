<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="sans-serif">
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#777"/></marker></defs>
<text x="20" y="32" font-size="20" font-weight="bold" fill="#111">Pallas 把 grid 展开成固定的"发出、等待、计算、写回"（M = N = K = 2048，b = 512）</text>
<rect x="20" y="46" width="20" height="14" fill="#f6c89f" stroke="#b5651d" stroke-width="1.5"/><text x="46" y="58" font-size="14" fill="#222">槽 0</text>
<rect x="100" y="46" width="20" height="14" fill="#bcd7f0" stroke="#2c5aa0" stroke-width="1.5"/><text x="126" y="58" font-size="14" fill="#222">槽 1</text>
<text x="180" y="58" font-size="14" fill="#444">A、B、输出各有两个槽（VMEM 中的两份缓冲），每个槽配一个信号量。灰色箭头：本步等的是上一步发出的 DMA。</text>
<text x="20" y="126" font-size="15" font-weight="bold" fill="#222">读入 DMA</text>
<text x="20" y="146" font-size="12.5" fill="#555">下一步的 A、B</text>
<line x1="20" y1="92" x2="979.0" y2="92" stroke="#e3e3e3" stroke-width="1.5"/>
<text x="20" y="216" font-size="15" font-weight="bold" fill="#222">等待</text>
<text x="20" y="236" font-size="12.5" fill="#555">本步分块所在槽</text>
