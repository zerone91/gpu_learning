<text x="20" y="510" font-size="14" fill="#444">规律：计算行的颜色总是和同一列读入行的颜色相反。MXU 读一个槽时，DMA 正在写另一个槽。</text>
<text x="20" y="534" font-size="14" fill="#444">第 3 步又发出 A(0,0)：相邻两步取的不是同一块，所以每一步都要搬 A 和 B。全程 64 步，读入 64 MiB，写回 8 MiB。</text>
