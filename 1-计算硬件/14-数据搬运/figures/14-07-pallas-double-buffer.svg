<text x="20" y="306" font-size="15" font-weight="bold" fill="#222">计算</text>
<text x="20" y="326" font-size="12.5" fill="#555">MXU 读本步的槽</text>
<line x1="20" y1="272" x2="979.0" y2="272" stroke="#e3e3e3" stroke-width="1.5"/>
<text x="20" y="396" font-size="15" font-weight="bold" fill="#222">输出</text>
<text x="20" y="416" font-size="12.5" fill="#555">只在 k 走完时</text>
<line x1="20" y1="362" x2="979.0" y2="362" stroke="#e3e3e3" stroke-width="1.5"/>
