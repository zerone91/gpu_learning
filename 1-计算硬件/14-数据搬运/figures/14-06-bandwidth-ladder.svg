<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="sans-serif">
<rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
<text x="20" y="30" font-size="19" font-weight="bold">片上每下一级，带宽就掉一个台阶：所以数据必须一级一级搬，而不是用到时再去取</text>
<text x="20" y="54" font-size="13" fill="#555">横条按对数长度画。数据取自华为在 Hot Chips 31 给出的全芯片带宽阶梯（达芬奇，2019）。标红的两行是计算单元能直接取数的层级。</text>
<text x="288" y="116" font-size="15" text-anchor="end" fill="#aa2222">执行单元（峰值 512 TOPS）</text>
<rect x="300" y="90" width="560.0" height="36" fill="#fbdcdc" stroke="#aa2222" stroke-width="2"/>
<text x="310" y="114" font-size="14" font-weight="bold">2048 TB/s</text>
<text x="890" y="114" font-size="14" fill="#555">1</text>
<text x="288" y="178" font-size="15" text-anchor="end" fill="#aa2222">L0A / L0B / L0C</text>
<rect x="300" y="152" width="560.0" height="36" fill="#d6ead6" stroke="#2a662a" stroke-width="2"/>
<text x="310" y="176" font-size="14" font-weight="bold">2048 TB/s</text>
<text x="890" y="176" font-size="14" fill="#555">1 : 1</text>
<text x="288" y="240" font-size="15" text-anchor="end" fill="#222">L1 Buffer</text>
<rect x="300" y="214" width="403.4" height="36" fill="#d6ead6" stroke="#2a662a" stroke-width="2"/>
<text x="310" y="238" font-size="14" font-weight="bold">200 TB/s</text>
<text x="890" y="238" font-size="14" fill="#555">1 : 10</text>
<text x="288" y="302" font-size="15" text-anchor="end" fill="#222">L2（全芯片共用）</text>
<rect x="300" y="276" width="248.4" height="36" fill="#cfe2f3" stroke="#1f5c99" stroke-width="2"/>
<text x="310" y="300" font-size="14" font-weight="bold">20 TB/s</text>
<text x="890" y="300" font-size="14" fill="#555">1 : 100</text>
<text x="288" y="364" font-size="15" text-anchor="end" fill="#222">HBM（GM）</text>
<rect x="300" y="338" width="46.7" height="36" fill="#e8e8e8" stroke="#555555" stroke-width="2"/>
<text x="356.7" y="362" font-size="14" font-weight="bold">1 TB/s</text>
<text x="890" y="362" font-size="14" fill="#555">1 : 2000</text>
<text x="890" y="78" font-size="13" fill="#555">相对比</text>
<rect x="20" y="406" width="955" height="86" fill="#f7f7f7" stroke="#999"/>
<text x="36" y="434" font-size="14">从 L0 到 HBM，带宽掉到两千分之一。Cube 每拍要 4096 次 fp16 乘加的操作数，只有 L0 供得上。</text>
<text x="36" y="458" font-size="14">L1 比 HBM 快 200 倍。同一份数据先搬进 L1，再从 L1 多次送进 L0，省下的是 HBM 的流量。</text>
<text x="36" y="480" font-size="13" fill="#555">同一张表里还有两档更低的：节点内互连 50 GB/s，节点间 10 GB/s。它们属于本模块第三部分。</text>
</svg>