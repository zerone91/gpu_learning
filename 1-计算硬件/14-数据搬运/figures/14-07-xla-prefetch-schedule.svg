<text x="20" y="556" font-size="14" fill="#444">每层算第 1 次矩阵乘时，后面的权重已在后台分片搬运。每片 8 MiB；一次矩阵乘约 26 万拍，搬一个 32 MiB 权重按带宽约 6.1 万拍。</text>
<text x="20" y="578" font-size="14" fill="#444">第 0 层第 1 次矩阵乘的输出留在 VMEM 中；第 2 次矩阵乘的输出写回 HBM。</text>
