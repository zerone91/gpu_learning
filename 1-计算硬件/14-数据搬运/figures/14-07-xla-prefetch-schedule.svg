<text x="20" y="32" font-size="20" font-weight="bold" fill="#111">XLA 为 v5e 排好的预取顺序：4 层前馈网络，8 个 32 MiB 权重，VMEM 128 MiB</text>
<text x="20" y="56" font-size="14" fill="#444">横轴是编译结果中指令的先后顺序，不是时间。每一行是一个权重：条从第一次 start 画到 done。</text>
<text x="20" y="76" font-size="14" fill="#444">▼ 是每一片的 start（×n 表示同一位置发出 n 片），● 是用到这个权重的矩阵乘。</text>
