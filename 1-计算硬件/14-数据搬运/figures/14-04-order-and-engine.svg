<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="aro" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c2691a"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2c7a3f"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">一次描述符驱动的搬运：订单的两半、引擎、回执</text>

  <!-- 主机侧描述符 -->
  <rect x="20" y="58" width="220" height="112" rx="6" fill="#f0f0f0" stroke="#666" stroke-width="1.8"/>
  <text x="32" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">不变的一半（主机侧编好）</text>
  <text x="32" y="102" font-family="sans-serif" font-size="14" fill="#333">tensor map · 128 字节</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555">基址 / 维度 4096×4096</text>
  <text x="32" y="140" font-family="sans-serif" font-size="14" fill="#555">行步长 8192 B / fp16</text>
  <text x="32" y="158" font-family="sans-serif" font-size="14" fill="#555">box 64×64 / swizzle 128B</text>
  <text x="32" y="186" font-family="sans-serif" font-size="13" fill="#888">编 1 次，被用 4096 次</text>

  <!-- kernel 里的线程 -->
  <rect x="20" y="212" width="220" height="118" rx="6" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="32" y="234" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a4a10">变的一半（kernel 里）</text>
  <text x="32" y="256" font-family="sans-serif" font-size="14" fill="#333">1 个线程，2 条指令：</text>
  <text x="32" y="278" font-family="sans-serif" font-size="13.5" fill="#333">① arrive.expect_tx 8192</text>
  <text x="32" y="298" font-family="sans-serif" font-size="13.5" fill="#333">② cp.async.bulk.tensor.2d</text>
  <text x="32" y="318" font-family="sans-serif" font-size="13.5" fill="#555">　 坐标 {128, 256}</text>

  <text x="24" y="352" font-family="sans-serif" font-size="13" fill="#8a4a10">其余 127 个线程：0 条指令</text>

  <!-- 引擎 -->
  <rect x="330" y="120" width="210" height="190" rx="8" fill="#e8f4ea" stroke="#2c7a3f" stroke-width="2.2"/>
  <text x="342" y="146" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d5c2d">TMA 单元（每个 SM 一个）</text>
  <text x="342" y="172" font-family="sans-serif" font-size="14" fill="#333">1. 读描述符</text>
  <text x="342" y="194" font-family="sans-serif" font-size="14" fill="#333">2. 循环计数器算 64 个地址</text>
  <text x="342" y="216" font-family="sans-serif" font-size="14" fill="#333">3. 越界的行不发请求</text>
  <text x="342" y="238" font-family="sans-serif" font-size="14" fill="#333">4. 发请求、收数据、重排</text>
  <text x="342" y="260" font-family="sans-serif" font-size="14" fill="#333">5. 按 swizzle 摆进 shared</text>
  <text x="342" y="282" font-family="sans-serif" font-size="14" fill="#333">6. 每段报一次字节数</text>
  <text x="342" y="302" font-family="sans-serif" font-size="13" fill="#888">地址算术指令：0 条</text>

  <line x1="242" y1="114" x2="326" y2="160" stroke="#666" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="242" y1="268" x2="326" y2="240" stroke="#c2691a" stroke-width="2" marker-end="url(#aro)"/>

  <!-- shared memory -->
  <rect x="620" y="120" width="180" height="96" rx="6" fill="#e6eef8" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="632" y="144" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b3f6b">shared memory</text>
  <text x="632" y="168" font-family="sans-serif" font-size="14" fill="#333">64 行 × 128 字节</text>
  <text x="632" y="190" font-family="sans-serif" font-size="14" fill="#333">= 8192 字节</text>
  <line x1="544" y1="170" x2="616" y2="170" stroke="#2c7a3f" stroke-width="2" marker-end="url(#arg)"/>

  <!-- mbarrier -->
  <rect x="620" y="238" width="180" height="96" rx="6" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="632" y="262" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a4a10">mbarrier（回执）</text>
  <text x="632" y="286" font-family="sans-serif" font-size="14" fill="#333">还差多少字节：8192 → 0</text>
  <text x="632" y="308" font-family="sans-serif" font-size="14" fill="#333">归零 → 相位 0 翻成 1</text>
  <line x1="544" y1="286" x2="616" y2="286" stroke="#c2691a" stroke-width="2" marker-end="url(#aro)"/>

  <!-- 等待的线程 -->
  <rect x="840" y="238" width="122" height="96" rx="6" fill="#f7f7f7" stroke="#666" stroke-width="1.8"/>
  <text x="852" y="262" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">全部 128 线程</text>
  <text x="852" y="284" font-family="sans-serif" font-size="13.5" fill="#555">在相位上等</text>
  <text x="852" y="304" font-family="sans-serif" font-size="13.5" fill="#555">就绪位 0 → 1</text>
  <text x="852" y="324" font-family="sans-serif" font-size="13" fill="#888">不占发射口</text>
  <line x1="804" y1="286" x2="836" y2="286" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 下半：三种搬法的指令条数 -->
  <line x1="20" y1="382" x2="960" y2="382" stroke="#ccc" stroke-width="1.5"/>
  <text x="20" y="408" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">同样搬这 8192 字节：流过发射口的指令条数</text>

  <text x="20" y="444" font-family="sans-serif" font-size="14" fill="#333">ld.global + st.shared</text>
  <rect x="210" y="430" width="400" height="20" fill="#b34a4a"/>
  <text x="624" y="445" font-family="sans-serif" font-size="14" fill="#333">约 2560 条 · 128 线程发 · 每线程 8～10 个寄存器</text>

  <text x="20" y="484" font-family="sans-serif" font-size="14" fill="#333">cp.async</text>
  <rect x="210" y="470" width="320" height="20" fill="#c2691a"/>
  <text x="624" y="485" font-family="sans-serif" font-size="14" fill="#333">约 2048 条 · 128 线程发 · 每线程 4～6 个寄存器</text>

  <text x="20" y="524" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">TMA</text>
  <rect x="210" y="510" width="3" height="20" fill="#2c7a3f"/>
  <text x="220" y="525" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">2 条</text>
  <text x="624" y="525" font-family="sans-serif" font-size="14" fill="#333">2 条 · 1 个线程发 · 约 4 个（多半是统一寄存器）</text>

  <text x="20" y="566" font-family="sans-serif" font-size="13.5" fill="#666">条形长度按指令条数等比绘制（400 像素对应 2560 条）。TMA 那一条不足 1 像素，用最细的一条加文字标出。</text>
  <text x="20" y="588" font-family="sans-serif" font-size="13.5" fill="#666">"发射口"指 SM 里每周期只能发出有限条指令的那个共享出口：搬运指令占了它，计算指令就少了机会。</text>
</svg>
