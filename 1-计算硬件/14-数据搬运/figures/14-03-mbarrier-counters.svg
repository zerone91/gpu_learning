<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
<text x="20" y="30" font-size="19" font-weight="bold" fill="#111">mbarrier：shared memory 里的一个 64 位对象，同时记三件事</text>

<defs><marker id="m4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker>
<marker id="m4g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 z" fill="#2e7d32"/></marker></defs>

<!-- 中间对象 -->
<rect x="360" y="60" width="280" height="186" fill="#fdf0e2" stroke="#c87c25" stroke-width="2.5" rx="4"/>
<text x="372" y="84" font-size="15" font-weight="bold" fill="#8a4f05">一个 mbarrier 对象（8 字节）</text>
<rect x="372" y="94" width="256" height="42" fill="#ffffff" stroke="#c87c25" stroke-width="1.5" rx="3"/>
<text x="382" y="112" font-size="14" fill="#222">① 到达计数</text>
<text x="382" y="130" font-size="13" fill="#666">还差几个线程没报到</text>
<rect x="372" y="142" width="256" height="42" fill="#ffffff" stroke="#c87c25" stroke-width="1.5" rx="3"/>
<text x="382" y="160" font-size="14" fill="#222">② tx-count（字节计数）</text>
<text x="382" y="178" font-size="13" fill="#666">还差多少字节没到货</text>
<rect x="372" y="190" width="256" height="42" fill="#ffffff" stroke="#c87c25" stroke-width="1.5" rx="3"/>
<text x="382" y="208" font-size="14" fill="#222">③ 相位</text>
<text x="382" y="226" font-size="13" fill="#666">0 或 1，每完成一轮翻转一次</text>

<!-- 左：谁改它 -->
<rect x="20" y="60" width="320" height="246" fill="#fbfbfb" stroke="#555" stroke-width="2" rx="4"/>
<text x="32" y="82" font-size="15" font-weight="bold" fill="#111">谁来改它</text>
<text x="32" y="108" font-size="14" fill="#222">线程执行 mbarrier.arrive：</text>
<text x="32" y="128" font-size="13.5" fill="#444">① 减一。机器码 SYNCS.ARRIVE.TRANS64.A1T0</text>
<text x="32" y="156" font-size="14" fill="#222">线程执行 arrive.expect_tx 32768：</text>
<text x="32" y="176" font-size="13.5" fill="#444">① 减一，同时 ② 加 32768。</text>
<text x="32" y="194" font-size="13.5" fill="#444">机器码 SYNCS.ARRIVE.TRANS64，</text>
<text x="32" y="212" font-size="13.5" fill="#444">字节数放在一个普通寄存器里</text>
<text x="32" y="240" font-size="14" fill="#1b5e20">TMA 引擎每完成一条拷贝：</text>
<text x="32" y="260" font-size="13.5" fill="#1b5e20">② 减去这条拷贝的字节数。</text>
<text x="32" y="278" font-size="13.5" fill="#1b5e20">引擎不执行指令，这一步没有机器码</text>
<text x="32" y="298" font-size="13" fill="#666">这就是把"等引擎"做成屏障的那一步</text>
<path d="M342,160 L354,160" stroke="#555" stroke-width="2" fill="none" marker-end="url(#m4)"/>

<!-- 右：谁读它 -->
<rect x="660" y="60" width="318" height="246" fill="#e8f0fb" stroke="#1f5fa9" stroke-width="2" rx="4"/>
<text x="672" y="82" font-size="15" font-weight="bold" fill="#14447a">谁来读它</text>
<text x="672" y="108" font-size="14" fill="#222">等数据的线程执行</text>
<text x="672" y="128" font-size="14" fill="#222">mbarrier.try_wait.parity [bar], 相位</text>
<text x="672" y="152" font-size="13.5" fill="#444">机器码 SYNCS.PHASECHK.TRANS64</text>
<text x="672" y="170" font-size="13.5" fill="#444">.TRYWAIT。名字里的 PHASECHK 就是</text>
<text x="672" y="188" font-size="13.5" fill="#444">"查相位"</text>
<text x="672" y="216" font-size="14" fill="#222">它问的不是"计数是不是 0"，</text>
<text x="672" y="236" font-size="14" font-weight="bold" fill="#14447a">而是"③ 和我手里的那一位不一样了吗"</text>
<text x="672" y="264" font-size="13.5" fill="#444">这一轮还没完成时，执行它的</text>
<text x="672" y="282" font-size="13.5" fill="#444">线程可能被挂起，挂起期间不占发射口。</text>
<path d="M646,160 L658,160" stroke="#555" stroke-width="2" fill="none" marker-end="url(#m4)"/>

<!-- 完成条件 -->
<rect x="360" y="256" width="280" height="50" fill="#eaf5ea" stroke="#2e7d32" stroke-width="2" rx="4"/>
<text x="372" y="278" font-size="14" font-weight="bold" fill="#1b5e20">本轮完成的条件：</text>
<text x="372" y="298" font-size="14" fill="#1b5e20">① 和 ② 同时归零</text>

<!-- 底部时间线 -->
<line x1="20" y1="328" x2="978" y2="328" stroke="#bbb" stroke-width="1.5"/>
<text x="20" y="354" font-size="16" font-weight="bold" fill="#111">搬 A、B 两个分块时，三个计数的变化</text>

<line x1="90" y1="580" x2="950" y2="580" stroke="#333" stroke-width="2"/>
<g font-size="13" fill="#333">
<line x1="130" y1="574" x2="130" y2="586" stroke="#333" stroke-width="2"/>
<line x1="300" y1="574" x2="300" y2="586" stroke="#333" stroke-width="2"/>
<line x1="500" y1="574" x2="500" y2="586" stroke="#333" stroke-width="2"/>
<line x1="700" y1="574" x2="700" y2="586" stroke="#333" stroke-width="2"/>
<line x1="880" y1="574" x2="880" y2="586" stroke="#333" stroke-width="2"/>
</g>
<text x="96" y="602" font-size="13" fill="#333">建屏障</text>
<text x="256" y="602" font-size="13" fill="#333">1 个线程发起</text>
<text x="452" y="602" font-size="13" fill="#333">A 的拷贝完成</text>
<text x="650" y="602" font-size="13" fill="#333">B 的拷贝完成</text>
<text x="840" y="602" font-size="13" fill="#333">消费者被放行</text>
<text x="20" y="602" font-size="13" fill="#666">时刻</text>

<text x="20" y="400" font-size="13.5" fill="#333">① 到达计数</text>
<text x="112" y="400" font-size="14" fill="#222">1</text>
<text x="290" y="400" font-size="14" font-weight="bold" fill="#b03030">0</text>
<text x="492" y="400" font-size="14" fill="#222">0</text>
<text x="692" y="400" font-size="14" fill="#222">0</text>
<text x="870" y="400" font-size="14" fill="#222">1（重置）</text>

<text x="20" y="440" font-size="13.5" fill="#333">② tx-count</text>
<text x="112" y="440" font-size="14" fill="#222">0</text>
<text x="272" y="440" font-size="14" font-weight="bold" fill="#b03030">32768</text>
<text x="480" y="440" font-size="14" fill="#222">16384</text>
<text x="692" y="440" font-size="14" font-weight="bold" fill="#2e7d32">0</text>
<text x="870" y="440" font-size="14" fill="#222">0</text>

<text x="20" y="480" font-size="13.5" fill="#333">③ 相位</text>
<text x="112" y="480" font-size="14" fill="#222">0</text>
<text x="290" y="480" font-size="14" fill="#222">0</text>
<text x="492" y="480" font-size="14" fill="#222">0</text>
<text x="692" y="480" font-size="14" font-weight="bold" fill="#2e7d32">1</text>
<text x="870" y="480" font-size="14" fill="#222">1</text>

<rect x="90" y="500" width="860" height="56" fill="#f7f7f7" stroke="#999" stroke-width="1.5" rx="4"/>
<text x="102" y="522" font-size="13.5" fill="#222">两条搬运指令、一个屏障：A 的 16 384 字节和 B 的 16 384 字节记在同一个字节计数上，所以消费者等的是"A 和 B 都到齐"。</text>
<text x="102" y="544" font-size="13.5" fill="#222">tx-count 允许为负。如果拷贝在 expect_tx 执行之前就完成并减去了字节数，它先变成负数，expect_tx 把 32768 加上去之后正好归零。</text>
</svg>
