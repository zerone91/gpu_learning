<text x="130" y="414" font-size="13" text-anchor="start" fill="#222222">每块数据比它被用到的时刻早三轮发出。本例中三轮计算是 3 × 512 = 1536 拍，这就是留给往返延迟的余量。</text>
<text x="130" y="436" font-size="13" text-anchor="start" fill="#222222">写进的永远是刚被腾出来的那一份：k=1 往 buf0 写块 4，而 buf0 里的块 0 是 k=0 那一轮刚算完的。</text>
