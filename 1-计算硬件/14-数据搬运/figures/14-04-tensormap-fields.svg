<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660">
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2a5c9a"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">描述符的每个字段，指的是张量上的哪一件事</text>
  <text x="20" y="52" font-family="sans-serif" font-size="14" fill="#555">例子：4096 × 4096 的 fp16 矩阵，box 64 × 64，取左上角在第 256 行、第 128 列的那一块</text>

  <!-- 左：字段表 -->
  <rect x="20" y="70" width="440" height="500" rx="6" fill="#f7f7f7" stroke="#666" stroke-width="1.8"/>
  <text x="34" y="94" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">CUtensorMap（128 字节，64 字节对齐）</text>

  <text x="34" y="128" font-family="sans-serif" font-size="14" fill="#333">tensorDataType</text>
  <text x="240" y="128" font-family="sans-serif" font-size="14" fill="#1b3f6b">FLOAT16（每元素 2 字节）</text>
  <text x="34" y="156" font-family="sans-serif" font-size="14" fill="#333">tensorRank</text>
  <text x="240" y="156" font-family="sans-serif" font-size="14" fill="#1b3f6b">2　（上限 5）</text>
  <text x="34" y="184" font-family="sans-serif" font-size="14" fill="#333">globalAddress</text>
  <text x="240" y="184" font-family="sans-serif" font-size="14" fill="#1b3f6b">矩阵首地址（16 B 对齐）</text>
  <text x="34" y="212" font-family="sans-serif" font-size="14" fill="#333">globalDim[0], [1]</text>
  <text x="240" y="212" font-family="sans-serif" font-size="14" fill="#1b3f6b">4096（列）, 4096（行）</text>
  <text x="34" y="240" font-family="sans-serif" font-size="14" fill="#333">globalStrides[0]</text>
  <text x="240" y="240" font-family="sans-serif" font-size="14" fill="#1b3f6b">8192 字节（一整行）</text>
  <text x="34" y="268" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">boxDim[0], [1]</text>
  <text x="240" y="268" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">64, 64（上限各 256）</text>
  <text x="34" y="296" font-family="sans-serif" font-size="14" fill="#333">elementStrides[0], [1]</text>
  <text x="240" y="296" font-family="sans-serif" font-size="14" fill="#1b3f6b">1, 1（不跳格）</text>
  <text x="34" y="324" font-family="sans-serif" font-size="14" fill="#333">interleave</text>
  <text x="240" y="324" font-family="sans-serif" font-size="14" fill="#1b3f6b">NONE</text>
  <text x="34" y="352" font-family="sans-serif" font-size="14" fill="#333">swizzle</text>
  <text x="240" y="352" font-family="sans-serif" font-size="14" fill="#1b3f6b">128B（配 box 内维 128 字节）</text>
  <text x="34" y="380" font-family="sans-serif" font-size="14" fill="#333">l2Promotion</text>
  <text x="240" y="380" font-family="sans-serif" font-size="14" fill="#1b3f6b">L2_128B（纯性能提示）</text>
  <text x="34" y="408" font-family="sans-serif" font-size="14" fill="#333">oobFill</text>
  <text x="240" y="408" font-family="sans-serif" font-size="14" fill="#1b3f6b">NONE（越界填 0）</text>

  <line x1="34" y1="428" x2="446" y2="428" stroke="#bbb" stroke-width="1.5"/>
  <text x="34" y="452" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">指令每次只带：坐标 {128, 256}</text>
  <text x="34" y="478" font-family="sans-serif" font-size="13.5" fill="#555">由上表直接推出的三个数：</text>
  <text x="34" y="502" font-family="sans-serif" font-size="13.5" fill="#333">· 一块的字节数 = 64 × 64 × 2 = 8192</text>
  <text x="34" y="524" font-family="sans-serif" font-size="13.5" fill="#333">· 一块 = 64 行 × 每行 128 字节</text>
  <text x="34" y="546" font-family="sans-serif" font-size="13.5" fill="#333">· 全矩阵共 64 × 64 = 4096 块（描述符用 4096 次）</text>

  <!-- 右：张量示意 -->
  <text x="540" y="94" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">显存里的张量（画成二维）</text>
  <rect x="540" y="110" width="400" height="400" fill="#eef2f7" stroke="#2a5c9a" stroke-width="2"/>
  <g stroke="#c8d4e4" stroke-width="1.5">
    <line x1="590" y1="110" x2="590" y2="510"/><line x1="640" y1="110" x2="640" y2="510"/>
    <line x1="690" y1="110" x2="690" y2="510"/><line x1="740" y1="110" x2="740" y2="510"/>
    <line x1="790" y1="110" x2="790" y2="510"/><line x1="840" y1="110" x2="840" y2="510"/>
    <line x1="890" y1="110" x2="890" y2="510"/>
    <line x1="540" y1="160" x2="940" y2="160"/><line x1="540" y1="210" x2="940" y2="210"/>
    <line x1="540" y1="260" x2="940" y2="260"/><line x1="540" y1="310" x2="940" y2="310"/>
    <line x1="540" y1="360" x2="940" y2="360"/><line x1="540" y1="410" x2="940" y2="410"/>
    <line x1="540" y1="460" x2="940" y2="460"/>
  </g>
  <rect x="552" y="135" width="14" height="14" fill="#c2691a" stroke="#8a4a10" stroke-width="2"/>
  <line x1="566" y1="142" x2="720" y2="200" stroke="#c2691a" stroke-width="1.8"/>
  <rect x="720" y="180" width="205" height="160" fill="#fdf0e2" stroke="#c2691a" stroke-width="2.2"/>
  <text x="732" y="206" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">放大看这一块（box）</text>
  <text x="732" y="230" font-family="sans-serif" font-size="13.5" fill="#333">64 列 × 64 行，每行 128 字节</text>
  <text x="732" y="254" font-family="sans-serif" font-size="13.5" fill="#333">左上角 = 坐标 {128, 256}</text>
  <text x="732" y="278" font-family="sans-serif" font-size="13.5" fill="#333">共 8192 字节</text>
  <text x="732" y="308" font-family="sans-serif" font-size="13" fill="#888">左上角那个小方块就是它在</text>
  <text x="732" y="328" font-family="sans-serif" font-size="13" fill="#888">张量里的真实大小</text>

  <!-- 轴标注 -->
  <line x1="540" y1="530" x2="940" y2="530" stroke="#2a5c9a" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="540" y="552" font-family="sans-serif" font-size="13.5" fill="#1b3f6b">globalDim[0] = 4096 列（地址连续的那一维）</text>
  <line x1="522" y1="110" x2="522" y2="510" stroke="#2a5c9a" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="516" y="320" font-family="sans-serif" font-size="13.5" fill="#1b3f6b" transform="rotate(-90 516 320)">globalDim[1] = 4096 行</text>

  <!-- 底部说明，通栏 -->
  <line x1="20" y1="586" x2="960" y2="586" stroke="#ccc" stroke-width="1.5"/>
  <text x="20" y="610" font-family="sans-serif" font-size="13.5" fill="#333">沿列走一格跳 2 字节（元素大小，隐含在类型里）；沿行走一格跳 globalStrides[0] = 8192 字节。</text>
  <text x="20" y="632" font-family="sans-serif" font-size="13.5" fill="#666">注意下标顺序：[0] 是最内层、地址连续的那一维，和 C 语言里写 A[行][列] 的顺序相反，最容易填错。</text>
  <text x="20" y="652" font-family="sans-serif" font-size="13.5" fill="#666">右图的浅色网格线每格 512 个元素，只为看清位置，不是 box 的大小。</text>
</svg>
