<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 790" width="1020" height="790" font-family="sans-serif">
  <rect width="1020" height="790" fill="#ffffff"/>
  <defs><marker id="dn" markerWidth="10" markerHeight="10" refX="4" refY="9" orient="auto"><path d="M0,0 L8,0 L4,9 z" fill="#555"/></marker></defs>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">四跳变换能力总图：数据往里走的每一跳，谁能顺手把它换个摆法</text>
  <text x="20" y="52" font-size="14" fill="#444">左边是数据要走的路，中间是 GPU 上做这一跳的部件和它能做的变换，右边是昇腾 NPU 的对应物。</text>
  <text x="150" y="86" font-size="14.5" font-weight="bold" fill="#111" text-anchor="middle">存储层级与跳数</text>
  <text x="490" y="86" font-size="14.5" font-weight="bold" fill="#2e7d32" text-anchor="middle">GPU（Hopper）：谁做、能做什么</text>
  <text x="830" y="86" font-size="14.5" font-weight="bold" fill="#1565c0" text-anchor="middle">昇腾 NPU：谁做、能做什么</text>
  <rect x="30" y="106" width="240" height="34" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="150" y="128" font-size="13" fill="#222" text-anchor="middle">主机内存 / 别的卡的显存</text>
  <line x1="150" y1="142" x2="150" y2="222" stroke="#555" stroke-width="2.5" marker-end="url(#dn)"/>
  <text x="150" y="178" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">第四跳 · 片外</text>
  <rect x="290" y="134" width="330" height="86" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="302" y="156" font-size="13" font-weight="bold" fill="#14431a">copy engine（拷贝引擎）</text>
  <text x="302" y="176" font-size="12" fill="#333">能：按行距抽子矩阵、子长方体（2D/3D 带步长）</text>
  <text x="302" y="193" font-size="12" fill="#333">不能：转置、元素级重排、改数据类型</text>
  <rect x="640" y="134" width="360" height="86" fill="#eaf1fb" stroke="#1565c0" stroke-width="1.4"/>
  <text x="652" y="156" font-size="13" font-weight="bold" fill="#0d3c6e">SDMA</text>
  <text x="652" y="176" font-size="12" fill="#333">能：同样是带步长的整块搬运</text>
  <text x="652" y="193" font-size="12" fill="#333">不能：改摆法</text>
  <rect x="30" y="234" width="240" height="34" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="150" y="256" font-size="13" fill="#222" text-anchor="middle">本卡显存（HBM）</text>
  <line x1="150" y1="270" x2="150" y2="350" stroke="#555" stroke-width="2.5" marker-end="url(#dn)"/>
  <text x="150" y="306" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">第三跳 · 显存 → 片上缓冲</text>
  <rect x="290" y="262" width="330" height="86" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="302" y="284" font-size="13" font-weight="bold" fill="#14431a">TMA（张量搬运引擎）</text>
  <text x="302" y="304" font-size="12" fill="#333">能：box 切块、元素步长、swizzle 地址置换、</text>
  <text x="302" y="321" font-size="12" fill="#333">　　im2col 展开卷积、越界填 0 或 NaN</text>
  <text x="302" y="338" font-size="12" fill="#333">不能：转置</text>
  <rect x="640" y="262" width="360" height="86" fill="#eaf1fb" stroke="#1565c0" stroke-width="1.4"/>
  <text x="652" y="284" font-size="13" font-weight="bold" fill="#0d3c6e">MTE2</text>
  <text x="652" y="304" font-size="12" fill="#333">能：整段搬入，并顺手做 ND → NZ 分形重排</text>
  <text x="652" y="321" font-size="12" fill="#333">不能：卷积展开（那是 MTE1 的活）</text>
  <rect x="30" y="362" width="240" height="34" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="150" y="377" font-size="13" fill="#222" text-anchor="middle">片上缓冲</text>
  <text x="150" y="392" font-size="11.5" fill="#222" text-anchor="middle">shared memory / L1 Buffer</text>
  <line x1="150" y1="398" x2="150" y2="478" stroke="#555" stroke-width="2.5" marker-end="url(#dn)"/>
  <text x="150" y="434" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">第二跳 · 片上缓冲 → 计算侧</text>
  <rect x="290" y="390" width="330" height="86" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="302" y="412" font-size="13" font-weight="bold" fill="#14431a">ldmatrix / stmatrix（整 warp 一条指令）</text>
  <text x="302" y="432" font-size="12" fill="#333">能：按 mma 的 fragment 分布重新分发，</text>
  <text x="302" y="449" font-size="12" fill="#333">　　带 .trans 时顺手转置 8×8 的 16 位块</text>
  <text x="302" y="466" font-size="12" fill="#333">不能：任意形状、任意元素宽度</text>
  <rect x="640" y="390" width="360" height="86" fill="#eaf1fb" stroke="#1565c0" stroke-width="1.4"/>
  <text x="652" y="412" font-size="13" font-weight="bold" fill="#0d3c6e">MTE1</text>
  <text x="652" y="432" font-size="12" fill="#333">能：img2col 卷积展开、转置</text>
  <text x="652" y="449" font-size="12" fill="#333">不能：跨块的任意重排</text>
  <rect x="30" y="490" width="240" height="34" fill="#eceff1" stroke="#555" stroke-width="1.4"/>
  <text x="150" y="505" font-size="13" fill="#222" text-anchor="middle">计算侧寄存器</text>
  <text x="150" y="520" font-size="11.5" fill="#222" text-anchor="middle">寄存器 / L0A·L0B</text>
  <line x1="150" y1="526" x2="150" y2="606" stroke="#555" stroke-width="2.5" marker-end="url(#dn)"/>
  <text x="150" y="562" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">第一跳 · 寄存器内（就地重排后进矩阵单元）</text>
  <rect x="290" y="518" width="330" height="86" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="302" y="540" font-size="13" font-weight="bold" fill="#14431a">线程自己动手：shfl / prmt / movmatrix</text>
  <text x="302" y="560" font-size="12" fill="#333">能：lane 之间换数、线程内字节重排、</text>
  <text x="302" y="577" font-size="12" fill="#333">　　8×8 的 16 位块整 warp 转置</text>
  <text x="302" y="594" font-size="12" fill="#333">代价：占指令槽，搬得越碎越贵</text>
  <rect x="640" y="518" width="360" height="86" fill="#eaf1fb" stroke="#1565c0" stroke-width="1.4"/>
  <text x="652" y="540" font-size="13" font-weight="bold" fill="#0d3c6e">向量单元（Vector）</text>
  <text x="652" y="560" font-size="12" fill="#333">能：在 UB 里做转置、重排等向量算子</text>
  <text x="652" y="577" font-size="12" fill="#333">代价：占向量流水的时间</text>
  <rect x="30" y="618" width="240" height="34" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="150" y="640" font-size="13" fill="#222" text-anchor="middle">矩阵单元 · 向量单元</text>
  <rect x="30" y="672" width="960" height="76" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/>
  <text x="46" y="696" font-size="14" font-weight="bold" fill="#111">往回走的那一趟（结果写出）在两边不对称</text>
  <text x="46" y="718" font-size="12.5" fill="#333">昇腾多一个专门的部件 FixPipe：结果从 L0C 出来时顺手做 NZ → ND、量化、随路激活，一次搬运把三件事都办了。</text>
  <text x="46" y="738" font-size="12.5" fill="#333">GPU 上没有这个部件：量化和激活要线程自己算，格式变换靠 stmatrix 加 TMA store 分两步完成。</text>
</svg>