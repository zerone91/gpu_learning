<rect x="20" y="432" width="920" height="112" fill="#fbfbfb" stroke="#666666" stroke-width="1.5" rx="4"/>
<text x="36" y="456" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">怎么读这张表：先看 k=1 这一列。</text>
<text x="36" y="480" font-size="13" text-anchor="start" fill="#222222">这一轮在算 buf1 里的块 1（橙色），同时把块 3 发往 buf0（蓝色）——buf0 里的块 0 上一轮刚算完，可以覆盖。</text>
<text x="36" y="502" font-size="13" text-anchor="start" fill="#222222">等待只写 wait_group 1：块 2 那一组允许还在飞，只要求块 1 那一组已经到货。</text>
<text x="36" y="524" font-size="13" text-anchor="start" fill="#222222">每块数据比它被用到早两轮发出，所以任何一轮里都有两块在路上，计算一刻不停；尾声没东西可搬也提交空组，让组数对齐。</text>
