<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2c7a3f"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#b34a4a"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">四级环形缓冲：full 与 empty 两组屏障怎么轮转</text>
  <text x="20" y="52" font-family="sans-serif" font-size="14" fill="#555">S = 4 格缓冲，第 k 块放进第 k mod 4 格。假设搬一块和算一块耗时相同，各占一个时间片。</text>

  <!-- 时间轴 -->
  <g font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">
    <text x="160" y="84">t0</text><text x="242" y="84">t1</text><text x="324" y="84">t2</text>
    <text x="406" y="84">t3</text><text x="488" y="84">t4</text><text x="570" y="84">t5</text>
    <text x="652" y="84">t6</text><text x="734" y="84">t7</text><text x="816" y="84">t8</text>
    <text x="898" y="84">t9</text>
  </g>

  <!-- 生产者 lane -->
  <text x="20" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">生产者</text>
  <g fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8">
    <rect x="120" y="96" width="80" height="34"/><rect x="202" y="96" width="80" height="34"/>
    <rect x="284" y="96" width="80" height="34"/><rect x="366" y="96" width="80" height="34"/>
    <rect x="448" y="96" width="80" height="34"/><rect x="530" y="96" width="80" height="34"/>
    <rect x="612" y="96" width="80" height="34"/><rect x="694" y="96" width="80" height="34"/>
    <rect x="776" y="96" width="80" height="34"/><rect x="858" y="96" width="80" height="34"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">
    <text x="160" y="118">订块0</text><text x="242" y="118">订块1</text><text x="324" y="118">订块2</text>
    <text x="406" y="118">订块3</text><text x="488" y="118">订块4</text><text x="570" y="118">订块5</text>
    <text x="652" y="118">订块6</text><text x="734" y="118">订块7</text><text x="816" y="118">订块8</text>
    <text x="898" y="118">订块9</text>
  </g>

  <!-- TMA lane -->
  <text x="20" y="176" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">TMA 引擎在搬</text>
  <g fill="#e8f4ea" stroke="#2c7a3f" stroke-width="1.8">
    <rect x="120" y="154" width="80" height="34"/><rect x="202" y="154" width="80" height="34"/>
    <rect x="284" y="154" width="80" height="34"/><rect x="366" y="154" width="80" height="34"/>
    <rect x="448" y="154" width="80" height="34"/><rect x="530" y="154" width="80" height="34"/>
    <rect x="612" y="154" width="80" height="34"/><rect x="694" y="154" width="80" height="34"/>
    <rect x="776" y="154" width="80" height="34"/><rect x="858" y="154" width="80" height="34"/>
  </g>
  <g font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="160" y="176">0→buf0</text><text x="242" y="176">1→buf1</text><text x="324" y="176">2→buf2</text>
    <text x="406" y="176">3→buf3</text><text x="488" y="176">4→buf0</text><text x="570" y="176">5→buf1</text>
    <text x="652" y="176">6→buf2</text><text x="734" y="176">7→buf3</text><text x="816" y="176">8→buf0</text>
    <text x="898" y="176">9→buf1</text>
  </g>

  <!-- 消费者 lane -->
  <text x="20" y="234" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">消费者在算</text>
  <rect x="120" y="212" width="80" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <g fill="#e6eef8" stroke="#2a5c9a" stroke-width="1.8">
    <rect x="202" y="212" width="80" height="34"/>
    <rect x="284" y="212" width="80" height="34"/><rect x="366" y="212" width="80" height="34"/>
    <rect x="448" y="212" width="80" height="34"/><rect x="530" y="212" width="80" height="34"/>
    <rect x="612" y="212" width="80" height="34"/><rect x="694" y="212" width="80" height="34"/>
    <rect x="776" y="212" width="80" height="34"/><rect x="858" y="212" width="80" height="34"/>
  </g>
  <g font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="160" y="234" fill="#777">等第一块</text>
    <text x="242" y="234">算0(buf0)</text><text x="324" y="234">算1(buf1)</text><text x="406" y="234">算2(buf2)</text>
    <text x="488" y="234">算3(buf3)</text><text x="570" y="234">算4(buf0)</text><text x="652" y="234">算5(buf1)</text>
    <text x="734" y="234">算6(buf2)</text><text x="816" y="234">算7(buf3)</text><text x="898" y="234">算8(buf0)</text>
  </g>

  <!-- full[0] 箭头：TMA t0 末 → 消费者 t1 头 -->
  <line x1="200" y1="188" x2="200" y2="208" stroke="#2c7a3f" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="206" y="204" font-family="sans-serif" font-size="12.5" fill="#1d5c2d">full[0] 相位 0→1</text>
  <!-- full[0] 第二次：TMA t4 末 → 消费者 t5 头 -->
  <line x1="528" y1="188" x2="528" y2="208" stroke="#2c7a3f" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="534" y="204" font-family="sans-serif" font-size="12.5" fill="#1d5c2d">full[0] 相位 1→0</text>

  <!-- empty[0] 箭头：消费者 t1 末 → 生产者 t4 头（生产者等 empty[0]） -->
  <path d="M282,250 L282,268 L446,268 L446,134" fill="none" stroke="#b34a4a" stroke-width="2.2" marker-end="url(#ard)"/>
  <text x="290" y="284" font-family="sans-serif" font-size="12.5" fill="#b34a4a">empty[0]：t1 末消费者用完 buf0 → t4 生产者才敢往 buf0 订块 4</text>

  <line x1="20" y1="306" x2="960" y2="306" stroke="#ccc" stroke-width="1.5"/>

  <!-- 相位表 -->
  <text x="20" y="332" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">等待方要传的相位：第 k 块用第 k mod 4 格，这是这一格的第 k/4 轮</text>
  <g font-family="sans-serif" font-size="14" fill="#333">
    <text x="20" y="362">块号 k</text>
    <text x="150" y="362">0　1　2　3</text>
    <text x="330" y="362">4　5　6　7</text>
    <text x="510" y="362">8　9　10　11</text>
    <text x="700" y="362">12　13　14　15</text>
    <text x="20" y="388">格号 k mod 4</text>
    <text x="150" y="388">0　1　2　3</text>
    <text x="330" y="388">0　1　2　3</text>
    <text x="510" y="388">0　1　2　3</text>
    <text x="700" y="388">0　1　2　3</text>
    <text x="20" y="414">这一格的第几轮</text>
    <text x="150" y="414">第 0 轮</text>
    <text x="330" y="414">第 1 轮</text>
    <text x="510" y="414">第 2 轮</text>
    <text x="700" y="414">第 3 轮</text>
  </g>
  <text x="20" y="442" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">要传的相位</text>
  <text x="20" y="464" font-family="sans-serif" font-size="12.5" fill="#8a4a10">（try_wait 的参数）</text>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a4a10">
    <text x="150" y="442">0</text><text x="330" y="442">1</text><text x="510" y="442">0</text><text x="700" y="442">1</text>
  </g>

  <line x1="20" y1="478" x2="960" y2="478" stroke="#ccc" stroke-width="1.5"/>
  <text x="20" y="490" font-family="sans-serif" font-size="14" fill="#333">从 t1 起，搬运和计算永远重叠。t0 是唯一一次纯等待，也就是流水线的填充阶段。</text>
  <text x="20" y="514" font-family="sans-serif" font-size="14" fill="#333">前四片生产者一路绿灯（四格都空）；从 t4 起它每次都要先确认那一格已被算完，所以流水线自动被慢的一方限速。</text>
  <text x="20" y="538" font-family="sans-serif" font-size="14" fill="#333">级数 S 买到的是抗抖动能力：某一块搬得特别慢时，消费者手上还有 S−1 块存货可以算。</text>
  <text x="20" y="562" font-family="sans-serif" font-size="14" fill="#666">代价是 shared memory 占用正比于 S：4 格 × 8192 字节 = 32 KB。</text>
  <text x="20" y="586" font-family="sans-serif" font-size="14" fill="#666">图中只画了 full[0] 和 empty[0] 的交接箭头，另外三格同理，全画出来会太密。每片的长度是示意，不代表真实拍数。</text>
</svg>
