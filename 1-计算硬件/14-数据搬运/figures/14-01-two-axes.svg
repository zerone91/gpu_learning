<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="bold" fill="#111">模块 14 的两根轴：横轴是"谁发起"，纵轴是"变换发生在哪一跳"</text>
  <text x="36" y="58" font-size="14" fill="#555">填了颜色的格子是真实存在的机制；左下到右上连成一条带，说明每一跳的变换只能由负责那一跳的搬运机制来做。</text>

  <!-- column headers -->
  <rect x="248" y="76" width="176" height="52" fill="#e8eef6" stroke="#2c5aa0" stroke-width="2"/>
  <text x="336" y="100" font-size="15" font-weight="bold" fill="#1a3a66" text-anchor="middle">load/store</text>
  <text x="336" y="119" font-size="13" fill="#444" text-anchor="middle">第 02 节</text>

  <rect x="432" y="76" width="176" height="52" fill="#e8eef6" stroke="#2c5aa0" stroke-width="2"/>
  <text x="520" y="100" font-size="15" font-weight="bold" fill="#1a3a66" text-anchor="middle">异步拷贝</text>
  <text x="520" y="119" font-size="13" fill="#444" text-anchor="middle">第 03 节</text>

  <rect x="616" y="76" width="176" height="52" fill="#e8eef6" stroke="#2c5aa0" stroke-width="2"/>
  <text x="704" y="100" font-size="15" font-weight="bold" fill="#1a3a66" text-anchor="middle">描述符 DMA</text>
  <text x="704" y="119" font-size="13" fill="#444" text-anchor="middle">第 04 节</text>

  <rect x="800" y="76" width="176" height="52" fill="#e8eef6" stroke="#2c5aa0" stroke-width="2"/>
  <text x="888" y="100" font-size="15" font-weight="bold" fill="#1a3a66" text-anchor="middle">片外 DMA</text>
  <text x="888" y="119" font-size="13" fill="#444" text-anchor="middle">第 05 节</text>

  <text x="336" y="146" font-size="13" fill="#666" text-anchor="middle">每线程一条</text>
  <text x="520" y="146" font-size="13" fill="#666" text-anchor="middle">每线程一条，异步</text>
  <text x="704" y="146" font-size="13" fill="#666" text-anchor="middle">一个线程下单</text>
  <text x="888" y="146" font-size="13" fill="#666" text-anchor="middle">主机 / 驱动 / 网卡</text>
  <text x="560" y="172" font-size="14" fill="#2c5aa0">越往右：参与的线程越少、地址越不用自己算　——&gt;</text>

  <!-- row 1: 片外 -->
  <rect x="36" y="186" width="200" height="84" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="136" y="220" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">片外</text>
  <text x="136" y="242" font-size="13" fill="#555" text-anchor="middle">主机↔显存、卡↔卡</text>
  <rect x="800" y="186" width="176" height="84" fill="#dfe9f5" stroke="#2c5aa0" stroke-width="2.5"/>
  <text x="888" y="212" font-size="14" fill="#1a3a66" text-anchor="middle">copy engine：</text>
  <text x="888" y="232" font-size="14" fill="#1a3a66" text-anchor="middle">2D / 3D 带步长拷贝</text>
  <text x="888" y="256" font-size="14" fill="#7a3d00" text-anchor="middle">昇腾：SDMA</text>

  <!-- row 2: 显存<->片上缓冲 -->
  <rect x="36" y="278" width="200" height="104" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="136" y="312" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">显存 ↔ 片上缓冲</text>
  <text x="136" y="334" font-size="13" fill="#555" text-anchor="middle">GPU 的 shared memory</text>
  <text x="136" y="354" font-size="13" fill="#555" text-anchor="middle">昇腾的 L1 / UB</text>
  <rect x="432" y="278" width="176" height="104" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2.5"/>
  <text x="520" y="318" font-size="14" fill="#1a3a66" text-anchor="middle">cp.async：</text>
  <text x="520" y="340" font-size="14" fill="#1a3a66" text-anchor="middle">只有越界填零</text>
  <text x="520" y="362" font-size="13" fill="#777" text-anchor="middle">（变换能力很薄）</text>
  <rect x="616" y="278" width="176" height="104" fill="#dfe9f5" stroke="#2c5aa0" stroke-width="2.5"/>
  <text x="704" y="302" font-size="14" fill="#1a3a66" text-anchor="middle">TMA：swizzle、</text>
  <text x="704" y="322" font-size="14" fill="#1a3a66" text-anchor="middle">im2col、box 切块、</text>
  <text x="704" y="342" font-size="14" fill="#1a3a66" text-anchor="middle">越界填充</text>
  <text x="704" y="366" font-size="13" fill="#7a3d00" text-anchor="middle">昇腾：MTE2 的 ND→NZ</text>

  <!-- row 3: 片上缓冲 -> 寄存器 -->
  <rect x="36" y="390" width="200" height="90" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="136" y="420" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">片上缓冲 → 寄存器</text>
  <text x="136" y="442" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">/ 计算缓冲</text>
  <rect x="248" y="390" width="176" height="90" fill="#dfe9f5" stroke="#2c5aa0" stroke-width="2.5"/>
  <text x="336" y="416" font-size="14" fill="#1a3a66" text-anchor="middle">ldmatrix / stmatrix</text>
  <text x="336" y="436" font-size="14" fill="#1a3a66" text-anchor="middle">（含 .trans 转置）</text>
  <text x="336" y="462" font-size="14" fill="#7a3d00" text-anchor="middle">昇腾：MTE1 的</text>
  <text x="336" y="478" font-size="14" fill="#7a3d00" text-anchor="middle">img2col、转置</text>

  <!-- row 4: 寄存器内 -->
  <rect x="36" y="488" width="200" height="84" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="136" y="522" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">寄存器内</text>
  <text x="136" y="544" font-size="13" fill="#555" text-anchor="middle">数据已经到手之后</text>
  <rect x="248" y="488" width="176" height="84" fill="#dfe9f5" stroke="#2c5aa0" stroke-width="2.5"/>
  <text x="336" y="516" font-size="14" fill="#1a3a66" text-anchor="middle">shfl、prmt、movmatrix</text>
  <text x="336" y="542" font-size="14" fill="#7a3d00" text-anchor="middle">昇腾：向量单元</text>
  <text x="336" y="562" font-size="13" fill="#777" text-anchor="middle">（第 06 节展开）</text>

  <!-- axis arrow on left -->
  <line x1="28" y1="186" x2="28" y2="572" stroke="#2c5aa0" stroke-width="2"/>
  <polygon points="28,186 23,198 33,198" fill="#2c5aa0"/>
  <text x="21" y="380" font-size="13" fill="#2c5aa0" text-anchor="middle" transform="rotate(-90 21 380)">越往上：离计算单元越远</text>
</svg>
