<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <defs>
    <marker id="am" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#b34a4a"/>
    </marker>
    <marker id="amg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2c7a3f"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">簇内多播：同一份数据从二级缓存只读一次，硬件在配送路上复制成多份</text>

  <!-- 左：不用多播 -->
  <text x="20" y="66" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b34a4a">不用多播：两个线程块各读各的</text>
  <rect x="20" y="80" width="440" height="230" rx="6" fill="#fdf2f2" stroke="#b34a4a" stroke-width="1.8"/>
  <rect x="40" y="100" width="130" height="66" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.8"/>
  <text x="52" y="126" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">L2 缓存</text>
  <text x="52" y="150" font-family="sans-serif" font-size="13.5" fill="#333">B tile（16 KB）</text>

  <rect x="290" y="96" width="150" height="74" rx="4" fill="#ffffff" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="302" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">SM 0 的 shared</text>
  <text x="302" y="144" font-family="sans-serif" font-size="13.5" fill="#333">线程块 0 的 B tile</text>
  <rect x="290" y="196" width="150" height="74" rx="4" fill="#ffffff" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="302" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">SM 1 的 shared</text>
  <text x="302" y="244" font-family="sans-serif" font-size="13.5" fill="#333">线程块 1 的 B tile</text>

  <line x1="174" y1="126" x2="286" y2="126" stroke="#b34a4a" stroke-width="2.5" marker-end="url(#am)"/>
  <text x="182" y="118" font-family="sans-serif" font-size="13" fill="#b34a4a">第 1 次读 16 KB</text>
  <path d="M174,150 L230,150 L230,232 L286,232" fill="none" stroke="#b34a4a" stroke-width="2.5" marker-end="url(#am)"/>
  <text x="182" y="286" font-family="sans-serif" font-size="13" fill="#b34a4a">第 2 次读同样的 16 KB</text>

  <text x="40" y="192" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b34a4a">L2 读出 32 KB</text>

  <!-- 右：多播 -->
  <text x="520" y="66" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d5c2d">用多播：读一次，硬件分发</text>
  <rect x="520" y="80" width="440" height="230" rx="6" fill="#f0f8f2" stroke="#2c7a3f" stroke-width="1.8"/>
  <rect x="540" y="100" width="130" height="66" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.8"/>
  <text x="552" y="126" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">L2 缓存</text>
  <text x="552" y="150" font-family="sans-serif" font-size="13.5" fill="#333">B tile（16 KB）</text>

  <circle cx="730" cy="184" r="24" fill="#e8f4ea" stroke="#2c7a3f" stroke-width="2"/>
  <text x="730" y="181" font-family="sans-serif" font-size="12" fill="#1d5c2d" text-anchor="middle">片上</text>
  <text x="730" y="195" font-family="sans-serif" font-size="12" fill="#1d5c2d" text-anchor="middle">分发</text>

  <rect x="790" y="96" width="150" height="74" rx="4" fill="#ffffff" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="802" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">SM 0 的 shared</text>
  <text x="802" y="144" font-family="sans-serif" font-size="13.5" fill="#333">同一个偏移处</text>
  <rect x="790" y="196" width="150" height="74" rx="4" fill="#ffffff" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="802" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">SM 1 的 shared</text>
  <text x="802" y="244" font-family="sans-serif" font-size="13.5" fill="#333">同一个偏移处</text>

  <line x1="674" y1="140" x2="704" y2="172" stroke="#2c7a3f" stroke-width="2.5" marker-end="url(#amg)"/>
  <text x="556" y="192" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">L2 只读出 16 KB</text>
  <line x1="754" y1="170" x2="786" y2="140" stroke="#2c7a3f" stroke-width="2.5" marker-end="url(#amg)"/>
  <line x1="754" y1="198" x2="786" y2="228" stroke="#2c7a3f" stroke-width="2.5" marker-end="url(#amg)"/>

  <text x="540" y="286" font-family="sans-serif" font-size="13.5" fill="#333">指令上加 .multicast::cluster，再给一个位图 ctaMask：</text>
  <text x="540" y="304" font-family="sans-serif" font-size="13.5" fill="#333">每一位对应簇里的一个线程块，置位的都收货，屏障信号也一并送到</text>

  <!-- 下半：流量账 -->
  <line x1="20" y1="330" x2="960" y2="330" stroke="#ccc" stroke-width="1.5"/>
  <text x="20" y="358" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">一笔 L2 流量的账：4096³ 的 bf16 GEMM，输出切成 128 × 128 的块（共 1024 块），每块要读 A、B 各 1 MB</text>

  <rect x="20" y="376" width="940" height="140" rx="6" fill="#f7f7f7" stroke="#666" stroke-width="1.8"/>
  <text x="36" y="402" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">方案</text>
  <text x="340" y="402" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">从 L2 读出的总流量</text>
  <text x="600" y="402" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">怎么算的</text>
  <line x1="36" y1="412" x2="944" y2="412" stroke="#bbb" stroke-width="1.5"/>

  <text x="36" y="438" font-family="sans-serif" font-size="14" fill="#333">不用簇，每块各读各的</text>
  <text x="340" y="438" font-family="sans-serif" font-size="14" fill="#b34a4a">2 GB</text>
  <text x="600" y="438" font-family="sans-serif" font-size="14" fill="#555">1024 × (1 MB + 1 MB)</text>
  <rect x="404" y="426" width="180" height="14" fill="#b34a4a"/>

  <text x="36" y="466" font-family="sans-serif" font-size="14" fill="#333">2 × 1 的簇（两块共用 B）</text>
  <text x="340" y="466" font-family="sans-serif" font-size="14" fill="#c2691a">1.5 GB</text>
  <text x="600" y="466" font-family="sans-serif" font-size="14" fill="#555">1024 × 1 MB（A）+ 512 × 1 MB（B）</text>
  <rect x="404" y="454" width="135" height="14" fill="#c2691a"/>

  <text x="36" y="494" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">2 × 2 的簇（A、B 各被两块共用）</text>
  <text x="340" y="494" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">1 GB</text>
  <text x="600" y="494" font-family="sans-serif" font-size="14" fill="#555">512 × 1 MB（A）+ 512 × 1 MB（B）</text>
  <rect x="404" y="482" width="90" height="14" fill="#2c7a3f"/>

  <text x="20" y="544" font-family="sans-serif" font-size="14" fill="#333">2 × 2 的簇把 L2 到 SM 的流量砍掉一半，而且不用改算法、不用改数据布局。</text>
  <text x="20" y="568" font-family="sans-serif" font-size="14" fill="#666">代价是簇里的线程块必须同时被调度到相邻的 SM 上，簇越大越难凑齐、尾部浪费越明显，所以实践中 2 × 2 用得最多。</text>
  <text x="20" y="592" font-family="sans-serif" font-size="14" fill="#666">条形长度按流量等比绘制（180 像素对应 2 GB）。上半图里 SM 0、SM 1 是簇里相邻的两个计算单元。</text>
</svg>
