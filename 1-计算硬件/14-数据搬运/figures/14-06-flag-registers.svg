<text x="20" y="30" font-size="19" font-weight="bold">硬件里的标志位：每一对"源流水线 → 目的流水线"各有 8 格，一格就是一次交接</text>
<text x="20" y="54" font-size="13" fill="#555">下面画出 32 种配对中的 8 种。横向 8 列是事件 ID。每一格只记一件事：那一段做完了没有。</text>
<text x="20" y="76" font-size="13" fill="#555">M 指 Cube（矩阵）流水线，V 指向量流水线，FIX 指 FixPipe，S 指标量流水线。</text>
