<text x="710" y="172" font-size="14">① MTE2 搬完数据，执行</text>
<text x="724" y="194" font-size="13" font-family="monospace">SetFlag&lt;MTE2_MTE1&gt;(0)</text>
<text x="724" y="214" font-size="14">把这一格置 1。</text>
<text x="710" y="242" font-size="14">② MTE1 执行到</text>
<text x="724" y="264" font-size="13" font-family="monospace">WaitFlag&lt;MTE2_MTE1&gt;(0)</text>
<text x="724" y="284" font-size="14">时查这一格。是 0 就停住。</text>
<rect x="696" y="322" width="302" height="120" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
<text x="710" y="346" font-size="15" font-weight="bold">③ 是 1 就放行，并把它清回 0</text>
<text x="710" y="372" font-size="13">一格只有"做完了 / 没做完"两种状态，</text>
<text x="710" y="394" font-size="13">表达不了"到了多少字节"。</text>
<text x="710" y="418" font-size="13">置位和等待分属两条流水线，必须成对。</text>
<rect x="20" y="494" width="950" height="46" fill="#f7f7f7" stroke="#999"/>
<text x="36" y="522" font-size="14">每张卡的格数不同：Atlas 训练产品每种配对 4 个事件 ID（0～3），A2 / A3 和推理产品是 8 个（0～7）。</text>
