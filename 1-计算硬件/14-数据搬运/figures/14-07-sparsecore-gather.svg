<text x="35" y="368" font-size="13" fill="#444">每个子核：自己的指令流、8～16 条通道的 SIMD、</text>
<text x="35" y="386" font-size="13" fill="#444">自己的 VMEM（v5p、Ironwood 为 512 KiB）</text>
<text x="35" y="412" font-size="13" fill="#444">芯片上有 2～4 个 SparseCore</text>
<rect x="20" y="460" width="960" height="120" rx="8" fill="#fbeeee" stroke="#a94442" stroke-width="2"/>
<text x="35" y="484" font-size="16" font-weight="bold" fill="#7f2a28">HBM</text>
<line x1="59" y1="430" x2="59" y2="458" stroke="#a94442" stroke-width="1.5"/>
<line x1="113" y1="430" x2="113" y2="458" stroke="#a94442" stroke-width="1.5"/>
<line x1="167" y1="430" x2="167" y2="458" stroke="#a94442" stroke-width="1.5"/>
<line x1="221" y1="430" x2="221" y2="458" stroke="#a94442" stroke-width="1.5"/>
