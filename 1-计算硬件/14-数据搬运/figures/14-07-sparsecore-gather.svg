<text x="35" y="506" font-size="13" fill="#7f2a28">每个子核都有通向 HBM 的路径；多个子核、多笔访问同时在途</text>
<text x="560" y="484" font-size="14" font-weight="bold" fill="#7f2a28">嵌入表：4096 行 × 512 字节 = 2 MiB</text>
<rect x="560" y="492" width="400" height="80" fill="#ffffff" stroke="#a94442" stroke-width="1.5"/>
<rect x="560" y="494" width="400" height="14" fill="#f6c89f" stroke="#555" stroke-width="1"/>
<text x="566" y="505" font-size="12" fill="#222">第 9 行</text>
<rect x="560" y="512" width="400" height="14" fill="#bcd7f0" stroke="#555" stroke-width="1"/>
<text x="566" y="523" font-size="12" fill="#222">第 17 行</text>
<rect x="560" y="544" width="400" height="14" fill="#cfe8cf" stroke="#555" stroke-width="1"/>
<text x="566" y="555" font-size="12" fill="#222">第 4022 行</text>
<text x="760" y="543" font-size="12" fill="#999" text-anchor="middle">⋮</text>
<rect x="520" y="60" width="460" height="330" rx="8" fill="#f3f6fb" stroke="#2c5aa0" stroke-width="2"/>
<text x="535" y="84" font-size="16" font-weight="bold" fill="#13335f">放大子核 2（左侧蓝框）的一步</text>
<text x="535" y="110" font-size="14" fill="#222">VMEM 中的 128 个索引（512 字节）：</text>
<rect x="535" y="120" width="58" height="28" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5"/>
<text x="564" y="140" font-size="14" fill="#13335f" text-anchor="middle">17</text>
<rect x="595" y="120" width="58" height="28" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5"/>
<text x="624" y="140" font-size="14" fill="#13335f" text-anchor="middle">4022</text>
<rect x="655" y="120" width="58" height="28" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5"/>
<text x="684" y="140" font-size="14" fill="#13335f" text-anchor="middle">9</text>
<rect x="715" y="120" width="58" height="28" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5"/>
<text x="744" y="140" font-size="14" fill="#13335f" text-anchor="middle">…</text>
<text x="782" y="140" font-size="13" fill="#444">共 128 个</text>
<text x="535" y="178" font-size="14" fill="#222">一次间接 DMA：sync_copy(x_hbm.at[索引], 目的缓冲)</text>
<text x="535" y="208" font-size="14" fill="#222">VMEM 中的目的缓冲（128 行 × 512 字节 = 64 KiB）：</text>
<rect x="535" y="220" width="250" height="24" fill="#bcd7f0" stroke="#555" stroke-width="1"/>
<text x="545" y="237" font-size="13" fill="#222">第 0 行 ← 表第 17 行</text>
<rect x="535" y="246" width="250" height="24" fill="#cfe8cf" stroke="#555" stroke-width="1"/>
<text x="545" y="263" font-size="13" fill="#222">第 1 行 ← 表第 4022 行</text>
<rect x="535" y="272" width="250" height="24" fill="#f6c89f" stroke="#555" stroke-width="1"/>
<text x="545" y="289" font-size="13" fill="#222">第 2 行 ← 表第 9 行</text>
<rect x="535" y="298" width="250" height="24" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="545" y="315" font-size="13" fill="#222">⋮</text>
<path d="M840,494 L840,284 L788,284" fill="none" stroke="#b5651d" stroke-width="2" marker-end="url(#ak)"/>
<path d="M800,512 L800,232 L788,232" fill="none" stroke="#2c5aa0" stroke-width="2" marker-end="url(#ak)"/>
<path d="M820,544 L820,258 L788,258" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ak)"/>
<rect x="860" y="210" width="110" height="96" rx="4" fill="#fff6e5" stroke="#b5651d" stroke-width="1.5"/>
<text x="868" y="232" font-size="13" fill="#7a3f0c">DMA 信号量：</text>
<text x="868" y="252" font-size="13" fill="#7a3f0c">128 行全部</text>
<text x="868" y="272" font-size="13" fill="#7a3f0c">到达后，等待</text>
<text x="868" y="292" font-size="13" fill="#7a3f0c">指令才通过</text>
<text x="535" y="346" font-size="13.5" fill="#222">然后流水把这 64 KiB 写回 HBM 中的输出，</text>
<text x="535" y="366" font-size="13.5" fill="#222">再取下一组 128 个索引。同一时刻，</text>
<text x="535" y="386" font-size="13.5" fill="#222">其余子核用各自的索引做同样的事。</text>
</svg>