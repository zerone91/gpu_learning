<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" font-family="sans-serif">
<rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>
<defs>
<marker id="dg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>

<text x="560" y="30" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">一次诊断：源码写了要用搬运引擎，为什么还是慢</text>
<text x="560" y="54" font-size="14" text-anchor="middle" fill="#555">H100 上的 bf16 矩阵乘（4096³），实测 118 微秒，同形状的厂商库是 62 微秒。读数为按机制构造的典型值，量级真实</text>

<!-- step boxes: left = reading, right = what it rules out -->
<rect x="40" y="76" width="470" height="62" rx="8" fill="#eef2f7" stroke="#222" stroke-width="2"/>
<text x="56" y="100" font-size="15" fill="#222" font-weight="bold">第一步 · 看两个总百分比（Speed Of Light 页）</text>
<text x="56" y="126" font-size="14" fill="#222">计算吞吐 39%，访存吞吐 52% —— 两面墙都没贴上</text>
<rect x="545" y="76" width="540" height="62" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
<text x="561" y="100" font-size="14" fill="#1f7a4d">排除了："算力已经用满"和"带宽已经用满"</text>
<text x="561" y="124" font-size="14" fill="#222">两个都不高不低 = 时间花在等待上，往下查</text>
<line x1="275" y1="138" x2="275" y2="164" stroke="#222" stroke-width="2" marker-end="url(#dg)"/>

<rect x="40" y="166" width="470" height="62" rx="8" fill="#eef2f7" stroke="#222" stroke-width="2"/>
<text x="56" y="190" font-size="15" fill="#222" font-weight="bold">第二步 · 线程在等什么（Warp State Statistics 页）</text>
<text x="56" y="216" font-size="14" fill="#222">Long Scoreboard 41%；平均可发射的线程组只有 0.7 个</text>
<rect x="545" y="166" width="540" height="62" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
<text x="561" y="190" font-size="14" fill="#222">Long Scoreboard = 在等显存读回来的数据</text>
<text x="561" y="214" font-size="14" fill="#1f7a4d">确定了"在等显存"，但还不知道为什么</text>
<line x1="275" y1="228" x2="275" y2="254" stroke="#222" stroke-width="2" marker-end="url(#dg)"/>

<rect x="40" y="256" width="470" height="62" rx="8" fill="#eef2f7" stroke="#222" stroke-width="2"/>
<text x="56" y="280" font-size="15" fill="#222" font-weight="bold">第三步 · 访存效率（Memory Workload Analysis 表）</text>
<text x="56" y="306" font-size="14" fill="#222">每请求 4.0 个数据段（最优值）；显存吞吐只到峰值 48%</text>
<rect x="545" y="256" width="540" height="62" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
<text x="561" y="280" font-size="14" fill="#1f7a4d">排除了："地址散乱浪费带宽"和"带宽真跑满了"</text>
<text x="561" y="304" font-size="14" fill="#222">访问模式没问题，问题在搬运的组织方式上</text>
<line x1="275" y1="318" x2="275" y2="344" stroke="#222" stroke-width="2" marker-end="url(#dg)"/>

<rect x="40" y="346" width="470" height="62" rx="8" fill="#eef2f7" stroke="#222" stroke-width="2"/>
<text x="56" y="370" font-size="15" fill="#222" font-weight="bold">第四步 · 哪条管线忙（Compute Workload Analysis 页）</text>
<text x="56" y="396" font-size="14" fill="#222">访存与地址计算管线 64%，矩阵乘管线只有 31%</text>
<rect x="545" y="346" width="540" height="62" rx="8" fill="#fff6f4" stroke="#c0392b" stroke-width="2"/>
<text x="561" y="370" font-size="14" fill="#c0392b" font-weight="bold">矩阵乘的程序里，搬运比计算还忙</text>
<text x="561" y="394" font-size="14" fill="#222">指向"搬运方式不对"——但还不是证据</text>
<line x1="275" y1="408" x2="275" y2="434" stroke="#222" stroke-width="2" marker-end="url(#dg)"/>

<rect x="40" y="436" width="470" height="84" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="56" y="460" font-size="15" fill="#c0392b" font-weight="bold">第五步 · 打开编译器的产物（这一步不能省）</text>
<text x="56" y="486" font-size="14" fill="#222">PTX 里搜 cp.async.bulk.tensor：一条都没有</text>
<text x="56" y="510" font-size="14" fill="#222">SASS 里搜 UTMALDG：没有，循环顶部全是 LDGSTS</text>
<rect x="545" y="436" width="540" height="84" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="561" y="460" font-size="15" fill="#c0392b" font-weight="bold">结论到这里才真正确定</text>
<text x="561" y="486" font-size="14" fill="#222">源码里写了描述符，但编译器静默退回了</text>
<text x="561" y="510" font-size="14" fill="#222">"每线程一条异步拷贝"的老路径，不报错、不提示</text>
<line x1="275" y1="520" x2="275" y2="546" stroke="#222" stroke-width="2" marker-end="url(#dg)"/>

<rect x="40" y="548" width="470" height="62" rx="8" fill="#eef2f7" stroke="#222" stroke-width="2"/>
<text x="56" y="572" font-size="15" fill="#222" font-weight="bold">第六步 · 回去核对引擎的使用前提</text>
<text x="56" y="598" font-size="14" fill="#222">最内层一次要搬 128 个 bf16 = 256 字节 &gt; 128 字节上限</text>
<rect x="545" y="548" width="540" height="62" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
<text x="561" y="572" font-size="14" fill="#222">选了 128 字节换座位模式时，最内层折成字节不能超过 128</text>
<text x="561" y="596" font-size="14" fill="#1f7a4d">改法：把最内层块宽减半，或改用 64 字节换座位模式</text>
<line x1="275" y1="610" x2="275" y2="636" stroke="#222" stroke-width="2" marker-end="url(#dg)"/>

<rect x="40" y="638" width="470" height="84" rx="8" fill="#e6f2ea" stroke="#1f7a4d" stroke-width="2.5"/>
<text x="56" y="662" font-size="15" fill="#1f7a4d" font-weight="bold">第七步 · 改完复诊</text>
<text x="56" y="688" font-size="14" fill="#222">SASS 里出现 UTMALDG；访存管线 64% → 19%</text>
<text x="56" y="712" font-size="14" fill="#222">矩阵管线 31% → 68%；耗时 118 → 71 微秒</text>
<rect x="545" y="638" width="540" height="84" rx="8" fill="#e6f2ea" stroke="#1f7a4d" stroke-width="2.5"/>
<text x="561" y="662" font-size="15" fill="#1f7a4d" font-weight="bold">瓶颈搬到了矩阵乘管线上</text>
<text x="561" y="688" font-size="14" fill="#222">优化不消灭瓶颈，只搬动瓶颈；</text>
<text x="561" y="712" font-size="14" fill="#222">搬到最贵的那条管线上就到头了</text>

<line x1="16" y1="740" x2="1104" y2="740" stroke="#bbb" stroke-width="1"/>
<text x="16" y="766" font-size="15" fill="#222" font-weight="bold">这条路径为什么第五步不能省：</text>
<text x="240" y="766" font-size="15" fill="#222">前四步的读数全都符合"搬运方式不对"的假设，</text>
<text x="16" y="790" font-size="15" fill="#c0392b">但没有一条能直接说明"用的到底是哪一种搬运"。源码写了什么不算数，编译出什么才算数。</text>
</svg>
