<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="bold" fill="#111">一次搬运的四笔账，分别由谁付、在什么时候付</text>
  <text x="36" y="58" font-size="14" fill="#555">横轴是拍数（示意刻度）。四条泳道分别是四种被占用的资源。</text>

  <!-- axis -->
  <line x1="200" y1="392" x2="930" y2="392" stroke="#333" stroke-width="2"/>
  <polygon points="930,392 920,387 920,397" fill="#333"/>
  <text x="930" y="412" font-size="14" fill="#333" text-anchor="end">拍数</text>
  <line x1="216" y1="388" x2="216" y2="396" stroke="#333" stroke-width="2"/>
  <text x="216" y="412" font-size="13" fill="#333" text-anchor="middle">0</text>
  <line x1="560" y1="388" x2="560" y2="396" stroke="#333" stroke-width="2"/>
  <text x="560" y="412" font-size="13" fill="#333" text-anchor="middle">250</text>
  <line x1="880" y1="388" x2="880" y2="396" stroke="#333" stroke-width="2"/>
  <text x="880" y="412" font-size="13" fill="#333" text-anchor="middle">500</text>

  <!-- lane labels -->
  <text x="190" y="110" font-size="15" fill="#111" text-anchor="end">SM 的发射口</text>
  <text x="190" y="170" font-size="15" fill="#111" text-anchor="end">整数算术通道</text>
  <text x="190" y="230" font-size="15" fill="#111" text-anchor="end">存储系统 / 搬运引擎</text>
  <text x="190" y="290" font-size="15" fill="#111" text-anchor="end">等数据的那条流水线</text>

  <!-- lane baselines -->
  <line x1="200" y1="298" x2="930" y2="298" stroke="#ddd" stroke-width="1.5"/>

  <!-- 2 address generation (before issue) -->
  <rect x="204" y="152" width="58" height="34" fill="#f5c6a5" stroke="#b5651d" stroke-width="2"/>
  <text x="270" y="148" font-size="14" fill="#8a4a10">② 地址生成：几条整数乘加，结果占住寄存器</text>

  <!-- 1 issue -->
  <rect x="262" y="92" width="18" height="34" fill="#9dc3e6" stroke="#2c5aa0" stroke-width="2"/>
  <text x="290" y="106" font-size="14" fill="#1a3a66">① 发起：一条指令占 1 次发射</text>
  <text x="290" y="126" font-size="13" fill="#555">（整个 warp 共用这一次发射；每线程各搬一份）</text>

  <!-- 3 transfer -->
  <rect x="280" y="212" width="600" height="34" fill="#c9302c" stroke="#7a1d1b" stroke-width="2"/>
  <text x="580" y="234" font-size="14" fill="#ffffff" text-anchor="middle">③ 传输：请求排队 → 过 L2 → 开 DRAM 行 → 数据回流（约 500 拍）</text>

  <!-- 4 completion -->
  <rect x="880" y="272" width="26" height="34" fill="#5cb85c" stroke="#2f6b2f" stroke-width="2"/>
  <text x="876" y="266" font-size="14" fill="#2f6b2f" text-anchor="end">④ 完成通知：记分牌销账 / mbarrier 到账 / flag 置位</text>

  <!-- waiting region on lane 4 -->
  <rect x="280" y="272" width="600" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="294" font-size="14" fill="#555" text-anchor="middle">这 500 拍里，这条流水线要么在算别的，要么干等</text>

  <!-- who pays -->
  <rect x="36" y="432" width="298" height="66" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="185" y="456" font-size="15" font-weight="bold" fill="#1a3a66" text-anchor="middle">①② 花的是计算单元的资源</text>
  <text x="185" y="478" font-size="13" fill="#444" text-anchor="middle">发射槽、整数通道、寄存器、参与的线程数</text>

  <rect x="342" y="432" width="298" height="66" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="491" y="456" font-size="15" font-weight="bold" fill="#6b1f1f" text-anchor="middle">③ 花的是存储系统的资源</text>
  <text x="491" y="478" font-size="13" fill="#444" text-anchor="middle">字节数、事务数、通道与 bank 的占用</text>

  <rect x="648" y="432" width="296" height="66" fill="#eaf5ea" stroke="#2f6b2f" stroke-width="2"/>
  <text x="796" y="456" font-size="15" font-weight="bold" fill="#1b4620" text-anchor="middle">④ 几乎不花资源，但决定成败</text>
  <text x="796" y="478" font-size="13" fill="#444" text-anchor="middle">它决定 ③ 那 500 拍能不能被别的活盖住</text>
</svg>
