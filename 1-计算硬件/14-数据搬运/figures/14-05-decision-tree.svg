<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">选哪种搬法：先问会卡死的，再问会变慢的</text>
  <text x="20" y="52" font-size="13" fill="#666">灰色菱形是会让描述符式搬运表达不出来的条件。白色菱形只影响划不划算。</text>

  <!-- 起点 -->
  <rect x="300" y="68" width="200" height="34" rx="6" fill="#eceff2" stroke="#444" stroke-width="1.5"/>
  <text x="400" y="90" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">要搬一块数据</text>
  <line x1="400" y1="102" x2="400" y2="120" stroke="#444" stroke-width="1.5"/>

  <!-- Q1 -->
  <path d="M 400 120 L 560 152 L 400 184 L 240 152 Z" fill="#e3e7ea" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="148" font-size="13" fill="#111" text-anchor="middle">① 地址是查一张运行时</text>
  <text x="400" y="166" font-size="13" fill="#111" text-anchor="middle">索引表得到的吗</text>
  <text x="222" y="146" font-size="13" fill="#8f2a26" text-anchor="end" font-weight="bold">是</text>
  <text x="578" y="146" font-size="13" fill="#1b5e35" font-weight="bold">否</text>
  <line x1="240" y1="152" x2="70" y2="152" stroke="#8f2a26" stroke-width="2"/>
  <line x1="70" y1="152" x2="70" y2="596" stroke="#8f2a26" stroke-width="2"/>
  <path d="M 64 588 L 70 598 L 76 588 Z" fill="#8f2a26"/>
  <line x1="560" y1="152" x2="610" y2="152" stroke="#555" stroke-width="1.5"/>
  <line x1="610" y1="152" x2="610" y2="186" stroke="#555" stroke-width="1.5"/>
  <line x1="610" y1="186" x2="400" y2="186" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="186" x2="400" y2="198" stroke="#555" stroke-width="1.5"/>

  <!-- gather4 虚线分支 -->
  <line x1="70" y1="200" x2="300" y2="200" stroke="#5b3a8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="300" y="186" width="300" height="30" rx="4" fill="#f3eefb" stroke="#5b3a8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="206" font-size="13" fill="#5b3a8f" text-anchor="middle">Blackwell：整行分散、行内连续时可用 gather4</text>

  <!-- Q2 -->
  <path d="M 400 226 L 570 258 L 400 290 L 230 258 Z" fill="#e3e7ea" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="254" font-size="13" fill="#111" text-anchor="middle">② 对齐和形状不满足描述符</text>
  <text x="400" y="272" font-size="13" fill="#111" text-anchor="middle">的约束吗（行步长要是 16 的倍数）</text>
  <text x="212" y="252" font-size="13" fill="#8f2a26" text-anchor="end" font-weight="bold">是</text>
  <text x="588" y="252" font-size="13" fill="#1b5e35" font-weight="bold">否</text>
  <line x1="230" y1="258" x2="196" y2="258" stroke="#9c5c13" stroke-width="2"/>
  <line x1="196" y1="258" x2="196" y2="504" stroke="#9c5c13" stroke-width="2"/>
  <path d="M 190 496 L 196 506 L 202 496 Z" fill="#9c5c13"/>
  <line x1="570" y1="258" x2="620" y2="258" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="258" x2="620" y2="292" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="292" x2="400" y2="292" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="292" x2="400" y2="304" stroke="#555" stroke-width="1.5"/>

  <!-- Q3 -->
  <path d="M 400 304 L 560 336 L 400 368 L 240 336 Z" fill="#e3e7ea" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="332" font-size="13" fill="#111" text-anchor="middle">③ 硬件有 TMA 吗</text>
  <text x="400" y="350" font-size="13" fill="#111" text-anchor="middle">（Hopper 及以后）</text>
  <text x="222" y="330" font-size="13" fill="#8f2a26" text-anchor="end" font-weight="bold">没有</text>
  <text x="578" y="330" font-size="13" fill="#1b5e35" font-weight="bold">有</text>
  <line x1="240" y1="336" x2="196" y2="336" stroke="#9c5c13" stroke-width="2"/>
  <line x1="560" y1="336" x2="620" y2="336" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="336" x2="620" y2="370" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="370" x2="400" y2="370" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="370" x2="400" y2="382" stroke="#555" stroke-width="1.5"/>

  <!-- Q4 -->
  <path d="M 400 382 L 560 414 L 400 446 L 240 414 Z" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="410" font-size="13" fill="#111" text-anchor="middle">④ 一次搬的量不到</text>
  <text x="400" y="428" font-size="13" fill="#111" text-anchor="middle">512 字节吗</text>
  <text x="222" y="408" font-size="13" fill="#8f2a26" text-anchor="end" font-weight="bold">是</text>
  <text x="578" y="408" font-size="13" fill="#1b5e35" font-weight="bold">否</text>
  <line x1="240" y1="414" x2="70" y2="414" stroke="#8f2a26" stroke-width="2"/>
  <line x1="560" y1="414" x2="620" y2="414" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="414" x2="620" y2="448" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="448" x2="400" y2="448" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="448" x2="400" y2="460" stroke="#555" stroke-width="1.5"/>

  <!-- Q5 -->
  <path d="M 400 460 L 570 492 L 400 524 L 230 492 Z" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="488" font-size="13" fill="#111" text-anchor="middle">⑤ 搬进来就逐元素算，</text>
  <text x="400" y="506" font-size="13" fill="#111" text-anchor="middle">不在片上反复取用吗</text>
  <text x="212" y="486" font-size="13" fill="#8f2a26" text-anchor="end" font-weight="bold">是</text>
  <text x="588" y="486" font-size="13" fill="#1b5e35" font-weight="bold">否</text>
  <line x1="230" y1="492" x2="70" y2="492" stroke="#8f2a26" stroke-width="2"/>
  <line x1="570" y1="492" x2="620" y2="492" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="492" x2="620" y2="560" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="560" x2="700" y2="560" stroke="#555" stroke-width="1.5"/>
  <path d="M 692 554 L 702 560 L 692 566 Z" fill="#555"/>

  <!-- 叶子 1：线程自己搬 -->
  <rect x="20" y="598" width="220" height="44" rx="22" fill="#fdeceb" stroke="#8f2a26" stroke-width="2"/>
  <text x="130" y="626" font-size="15" font-weight="bold" fill="#8f2a26" text-anchor="middle">线程自己搬（LDG）</text>

  <!-- 叶子 2：cp.async -->
  <rect x="120" y="506" width="180" height="40" rx="20" fill="#fff6e5" stroke="#9c5c13" stroke-width="2"/>
  <text x="210" y="532" font-size="15" font-weight="bold" fill="#9c5c13" text-anchor="middle">cp.async</text>

  <!-- 叶子 3：TMA -->
  <rect x="700" y="540" width="160" height="40" rx="20" fill="#eef7f1" stroke="#1b5e35" stroke-width="2"/>
  <text x="780" y="566" font-size="15" font-weight="bold" fill="#1b5e35" text-anchor="middle">TMA</text>
  <line x1="780" y1="580" x2="780" y2="598" stroke="#1b5e35" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="660" y="598" width="300" height="56" rx="4" fill="#ffffff" stroke="#1b5e35" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="672" y="618" font-size="13" fill="#111">追问一：要不要把发起单独交给一个线程</text>
  <text x="672" y="640" font-size="13" fill="#111">追问二：同一份数据会不会被相邻 SM 同用</text>

  <!-- 场景标签 -->
  <line x1="20" y1="668" x2="980" y2="668" stroke="#999" stroke-width="1.5"/>
  <text x="20" y="692" font-size="14" font-weight="bold" fill="#111">三个场景落在哪个叶子上：</text>
  <rect x="200" y="676" width="150" height="24" rx="4" fill="#fdeceb" stroke="#8f2a26" stroke-width="1.5"/>
  <text x="275" y="693" font-size="13" fill="#8f2a26" text-anchor="middle">embedding 查表</text>
  <rect x="362" y="676" width="150" height="24" rx="4" fill="#eef7f1" stroke="#1b5e35" stroke-width="1.5"/>
  <text x="437" y="693" font-size="13" fill="#1b5e35" text-anchor="middle">矩阵乘主循环</text>
  <rect x="524" y="676" width="330" height="24" rx="4" fill="#f5f0e4" stroke="#9c5c13" stroke-width="1.5"/>
  <text x="689" y="693" font-size="13" fill="#9c5c13" text-anchor="middle">MoE：重排段走左叶子，专家矩阵乘段走右叶子</text>
</svg>
