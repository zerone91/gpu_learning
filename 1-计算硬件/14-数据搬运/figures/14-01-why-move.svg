<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#111">计算单元够得到哪一级，够不到的那几级有多远</text>

  <!-- left ladder -->
  <text x="40" y="66" font-size="15" fill="#444">取一个数要等多少拍（横条为对数长度，非等比）</text>

  <!-- row 1: register -->
  <rect x="70" y="82" width="178" height="52" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="159" y="105" font-size="16" fill="#1b4620" text-anchor="middle">寄存器</text>
  <text x="159" y="125" font-size="13" fill="#3c763d" text-anchor="middle">每 SM 256 KB</text>
  <rect x="262" y="98" width="8" height="22" fill="#3c763d"/>
  <text x="280" y="115" font-size="15" fill="#222">约 1 拍</text>

  <!-- row 2: shared -->
  <rect x="70" y="152" width="178" height="52" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="159" y="175" font-size="16" fill="#1b4620" text-anchor="middle">shared memory / L1</text>
  <text x="159" y="195" font-size="13" fill="#3c763d" text-anchor="middle">每 SM 256 KB（可配比）</text>
  <rect x="262" y="168" width="126" height="22" fill="#5cb85c"/>
  <text x="400" y="185" font-size="15" fill="#222">约 30 拍</text>

  <!-- row 3: L2 -->
  <rect x="70" y="222" width="178" height="52" fill="#fcf3cf" stroke="#b8860b" stroke-width="2"/>
  <text x="159" y="245" font-size="16" fill="#6b4e00" text-anchor="middle">L2 缓存</text>
  <text x="159" y="265" font-size="13" fill="#8a6d00" text-anchor="middle">全芯片共享约 50 MB</text>
  <rect x="262" y="238" width="196" height="22" fill="#e0a800"/>
  <text x="470" y="255" font-size="15" fill="#222">约 200 拍</text>

  <!-- row 4: HBM -->
  <rect x="70" y="292" width="178" height="52" fill="#f8d7da" stroke="#a94442" stroke-width="2"/>
  <text x="159" y="315" font-size="16" fill="#6b1f1f" text-anchor="middle">显存 HBM</text>
  <text x="159" y="335" font-size="13" fill="#a94442" text-anchor="middle">H100 为 80 GB</text>
  <rect x="262" y="308" width="230" height="22" fill="#c9302c"/>
  <text x="504" y="325" font-size="15" fill="#222">约 500 拍</text>

  <!-- bracket: reachable -->
  <path d="M 60 82 L 48 82 L 48 204 L 60 204" fill="none" stroke="#3c763d" stroke-width="2.5"/>
  <text x="42" y="143" font-size="14" fill="#3c763d" text-anchor="middle" transform="rotate(-90 42 143)">只够得到这两级</text>

  <line x1="48" y1="216" x2="600" y2="216" stroke="#a94442" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="600" y="208" font-size="14" fill="#a94442" text-anchor="end">这条线以下，计算单元没有直接通路，必须有人先搬上来</text>

  <!-- right panel -->
  <rect x="620" y="82" width="300" height="262" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="770" y="108" font-size="16" font-weight="bold" fill="#1a3a66" text-anchor="middle">等一次显存往返的工夫，</text>
  <text x="770" y="130" font-size="16" font-weight="bold" fill="#1a3a66" text-anchor="middle">一个 SM 的矩阵单元能干完多少活</text>
  <line x1="640" y1="144" x2="900" y2="144" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="640" y="170" font-size="14" fill="#222">每拍能做的 bf16 乘加：2048 次</text>
  <text x="640" y="190" font-size="13" fill="#555">（989 TFLOPS ÷ 132 个 SM ÷ 1.83 GHz ÷ 2）</text>
  <text x="640" y="216" font-size="14" fill="#222">一次显存往返：约 500 拍</text>
  <text x="640" y="242" font-size="14" fill="#222">2048 × 500 = 1 024 000 次乘加</text>
  <text x="640" y="268" font-size="14" fill="#222">一个 128×128×64 分块共 1 048 576 次</text>
  <rect x="640" y="282" width="260" height="46" fill="#ffffff" stroke="#2c5aa0" stroke-width="2"/>
  <text x="770" y="312" font-size="15" font-weight="bold" fill="#1a3a66" text-anchor="middle">两者几乎相等：白等整整一个分块</text>

  <!-- bottom conclusion -->
  <rect x="40" y="392" width="880" height="132" fill="#f7f7f7" stroke="#666" stroke-width="2"/>
  <text x="60" y="420" font-size="16" font-weight="bold" fill="#111">于是必然有"搬"这件事，而搬一次的账要分四笔算：</text>
  <rect x="60" y="436" width="196" height="66" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="158" y="460" font-size="15" fill="#1a3a66" text-anchor="middle">① 发起</text>
  <text x="158" y="482" font-size="13" fill="#444" text-anchor="middle">谁发指令、占几个发射槽</text>
  <rect x="272" y="436" width="196" height="66" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="370" y="460" font-size="15" fill="#1a3a66" text-anchor="middle">② 地址生成</text>
  <text x="370" y="482" font-size="13" fill="#444" text-anchor="middle">谁算地址、占几个寄存器</text>
  <rect x="484" y="436" width="196" height="66" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="582" y="460" font-size="15" fill="#1a3a66" text-anchor="middle">③ 传输</text>
  <text x="582" y="482" font-size="13" fill="#444" text-anchor="middle">多少字节、多少事务、多久</text>
  <rect x="696" y="436" width="204" height="66" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.8"/>
  <text x="798" y="460" font-size="15" fill="#1a3a66" text-anchor="middle">④ 完成通知</text>
  <text x="798" y="482" font-size="13" fill="#444" text-anchor="middle">用数的人怎么知道到货了</text>
</svg>
