<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold">同一个 warp 要读 512 字节：拆成 4 条普通指令，还是 1 条向量指令</text>
  <text x="20" y="52" font-size="14" fill="#444">两种写法搬的数据一模一样，差别在于占用了几次发射机会、几个地址寄存器、以及一条指令能让多少数据同时在路上。</text>

  <!-- left panel -->
  <rect x="20" y="72" width="460" height="330" fill="#fdf1e6" stroke="#b5651d" stroke-width="1.5"/>
  <text x="34" y="96" font-size="16" font-weight="bold" fill="#b5651d">写法甲：每个线程读 4 次，每次 4 字节</text>
  <text x="34" y="118" font-size="13" fill="#333">源码：`float a=x[i]; float b=x[i+1024]; …` 共四个 float</text>

  <g font-size="13" font-family="monospace">
    <rect x="34" y="132" width="216" height="26" fill="#ffffff" stroke="#666"/><text x="42" y="150">IMAD.WIDE R2, Ri, 4, base</text>
    <rect x="34" y="162" width="200" height="26" fill="#ffffff" stroke="#666"/><text x="42" y="180">LDG.E R4, [R2]</text>
    <rect x="34" y="192" width="200" height="26" fill="#ffffff" stroke="#666"/><text x="42" y="210">LDG.E R5, [R2+0x1000]</text>
    <rect x="34" y="222" width="200" height="26" fill="#ffffff" stroke="#666"/><text x="42" y="240">LDG.E R6, [R2+0x2000]</text>
    <rect x="34" y="252" width="200" height="26" fill="#ffffff" stroke="#666"/><text x="42" y="270">LDG.E R7, [R2+0x3000]</text>
  </g>
  <text x="258" y="150" font-size="12" fill="#555">算一次地址</text>
  <text x="258" y="196" font-size="12" fill="#555">四条读取指令，</text>
  <text x="258" y="214" font-size="12" fill="#555">每条要占一次</text>
  <text x="258" y="232" font-size="12" fill="#555">发射机会，各自</text>
  <text x="258" y="250" font-size="12" fill="#555">登记一次屏障</text>

  <rect x="34" y="292" width="412" height="96" fill="#ffffff" stroke="#b5651d"/>
  <text x="44" y="314" font-size="13">一条指令让 32 个线程各要 4 字节 = <tspan font-weight="bold">128 字节在路上</tspan></text>
  <text x="44" y="336" font-size="13">四条指令合计：发射 <tspan font-weight="bold">4</tspan> 次、屏障用 <tspan font-weight="bold">4</tspan> 个、目标寄存器 <tspan font-weight="bold">4</tspan> 个</text>
  <text x="44" y="358" font-size="13">搬到的数据：512 字节</text>
  <text x="44" y="380" font-size="13" fill="#a33">要让显存不闲着，需要很多个这样的小请求同时挂着</text>

  <!-- right panel -->
  <rect x="500" y="72" width="460" height="330" fill="#eef4fb" stroke="#2a5d9f" stroke-width="1.5"/>
  <text x="514" y="96" font-size="16" font-weight="bold" fill="#2a5d9f">写法乙：每个线程读 1 次，一次 16 字节</text>
  <text x="514" y="118" font-size="13" fill="#333">源码：`float4 v = reinterpret_cast&lt;float4*&gt;(x)[i];`</text>

  <g font-size="13" font-family="monospace">
    <rect x="514" y="132" width="220" height="26" fill="#ffffff" stroke="#666"/><text x="522" y="150">IMAD.WIDE R2, Ri, 16, base</text>
    <rect x="514" y="162" width="220" height="26" fill="#ffffff" stroke="#666"/><text x="522" y="180">LDG.E.128 R4, [R2]</text>
  </g>
  <text x="748" y="150" font-size="12" fill="#555">算一次地址</text>
  <text x="748" y="176" font-size="12" fill="#555">一条读取指令，</text>
  <text x="748" y="194" font-size="12" fill="#555">结果直接落进</text>
  <text x="748" y="212" font-size="12" fill="#555">R4/R5/R6/R7</text>
  <text x="748" y="230" font-size="12" fill="#555">四个连号寄存器</text>

  <rect x="514" y="292" width="412" height="96" fill="#ffffff" stroke="#2a5d9f"/>
  <text x="524" y="314" font-size="13">一条指令让 32 个线程各要 16 字节 = <tspan font-weight="bold">512 字节在路上</tspan></text>
  <text x="524" y="336" font-size="13">合计：发射 <tspan font-weight="bold">1</tspan> 次、屏障用 <tspan font-weight="bold">1</tspan> 个、目标寄存器同样 <tspan font-weight="bold">4</tspan> 个</text>
  <text x="524" y="358" font-size="13">搬到的数据：512 字节，与左边一样</text>
  <text x="524" y="380" font-size="13" fill="#1a7a3c">同样多的在途字节，只要四分之一的指令去撑</text>

  <!-- bottom bar compare -->
  <text x="20" y="432" font-size="14" font-weight="bold">两种写法的在途字节（每条指令一根条，长度按 128 : 512 画）</text>
  <rect x="20" y="444" width="70" height="16" fill="#e8a44c" stroke="#b5651d"/>
  <rect x="94" y="444" width="70" height="16" fill="#e8a44c" stroke="#b5651d"/>
  <rect x="168" y="444" width="70" height="16" fill="#e8a44c" stroke="#b5651d"/>
  <rect x="242" y="444" width="70" height="16" fill="#e8a44c" stroke="#b5651d"/>
  <text x="330" y="458" font-size="13" fill="#555">写法甲：4 条指令各 128 字节</text>

  <rect x="20" y="472" width="292" height="16" fill="#7fb2e5" stroke="#2a5d9f"/>
  <text x="330" y="486" font-size="13" fill="#555">写法乙：1 条指令 512 字节</text>
  <text x="560" y="472" font-size="13" fill="#333">对齐是前提：16 字节的读取要求地址是 16 的整数倍，</text>
  <text x="560" y="490" font-size="13" fill="#333">不满足时编译器会退回成 4 条普通读取，看 SASS 才知道。</text>
</svg>
