<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="1020" height="600" font-family="sans-serif">
  <rect x="0" y="0" width="1020" height="600" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="bold" fill="#111">四代硬件，每一代把一笔账从计算单元身上挪走</text>
  <text x="36" y="58" font-size="14" fill="#555">红＝这笔账仍由计算单元付；黄＝付得少了但还要自己写同步；绿＝已经不占计算单元的资源。</text>

  <!-- headers -->
  <rect x="216" y="76" width="188" height="54" fill="#eeeeee" stroke="#444" stroke-width="2"/>
  <text x="310" y="100" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Volta</text>
  <text x="310" y="120" font-size="13" fill="#555" text-anchor="middle">2017</text>
  <rect x="412" y="76" width="188" height="54" fill="#eeeeee" stroke="#444" stroke-width="2"/>
  <text x="506" y="100" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Ampere</text>
  <text x="506" y="120" font-size="13" fill="#555" text-anchor="middle">2020</text>
  <rect x="608" y="76" width="188" height="54" fill="#eeeeee" stroke="#444" stroke-width="2"/>
  <text x="702" y="100" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Hopper</text>
  <text x="702" y="120" font-size="13" fill="#555" text-anchor="middle">2022</text>
  <rect x="804" y="76" width="188" height="54" fill="#eeeeee" stroke="#444" stroke-width="2"/>
  <text x="898" y="100" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Blackwell</text>
  <text x="898" y="120" font-size="13" fill="#555" text-anchor="middle">2024–25</text>

  <!-- row 1 -->
  <rect x="36" y="136" width="170" height="72" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="121" y="167" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">① 发起</text>
  <text x="121" y="189" font-size="13" fill="#555" text-anchor="middle">占几次发射、几个线程</text>
  <rect x="216" y="136" width="188" height="72" fill="#f8d7da" stroke="#a94442" stroke-width="2"/>
  <text x="310" y="166" font-size="14" fill="#6b1f1f" text-anchor="middle">128 个线程</text>
  <text x="310" y="188" font-size="14" fill="#6b1f1f" text-anchor="middle">各发"读"和"写"两条</text>
  <rect x="412" y="136" width="188" height="72" fill="#f8d7da" stroke="#a94442" stroke-width="2"/>
  <text x="506" y="166" font-size="14" fill="#6b1f1f" text-anchor="middle">128 个线程</text>
  <text x="506" y="188" font-size="14" fill="#6b1f1f" text-anchor="middle">各发一条（少一半）</text>
  <rect x="608" y="136" width="188" height="72" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="702" y="166" font-size="14" fill="#1b4620" text-anchor="middle">1 个线程发 1 条</text>
  <text x="702" y="188" font-size="14" fill="#1b4620" text-anchor="middle">其余 127 个一条不发</text>
  <rect x="804" y="136" width="188" height="72" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="898" y="166" font-size="14" fill="#1b4620" text-anchor="middle">同左，并且</text>
  <text x="898" y="188" font-size="14" fill="#1b4620" text-anchor="middle">多管进 TMEM 这一跳</text>

  <!-- row 2 -->
  <rect x="36" y="214" width="170" height="72" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="121" y="245" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">② 地址生成</text>
  <text x="121" y="267" font-size="13" fill="#555" text-anchor="middle">谁算、占几个寄存器</text>
  <rect x="216" y="214" width="188" height="72" fill="#f8d7da" stroke="#a94442" stroke-width="2"/>
  <text x="310" y="244" font-size="14" fill="#6b1f1f" text-anchor="middle">每线程用整数指令算</text>
  <text x="310" y="266" font-size="14" fill="#6b1f1f" text-anchor="middle">占 2～4 个寄存器</text>
  <rect x="412" y="214" width="188" height="72" fill="#f8d7da" stroke="#a94442" stroke-width="2"/>
  <text x="506" y="244" font-size="14" fill="#6b1f1f" text-anchor="middle">没变：还是</text>
  <text x="506" y="266" font-size="14" fill="#6b1f1f" text-anchor="middle">每线程自己算</text>
  <rect x="608" y="214" width="188" height="72" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="702" y="244" font-size="14" fill="#1b4620" text-anchor="middle">引擎内的地址电路算</text>
  <text x="702" y="266" font-size="14" fill="#1b4620" text-anchor="middle">软件只给一个块坐标</text>
  <rect x="804" y="214" width="188" height="72" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="898" y="244" font-size="14" fill="#1b4620" text-anchor="middle">同左，另加按索引表</text>
  <text x="898" y="266" font-size="14" fill="#1b4620" text-anchor="middle">取行的 gather 模式</text>

  <!-- row 3 -->
  <rect x="36" y="292" width="170" height="72" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="121" y="323" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">③ 传输</text>
  <text x="121" y="345" font-size="13" fill="#555" text-anchor="middle">数据过不过寄存器</text>
  <rect x="216" y="292" width="188" height="72" fill="#f8d7da" stroke="#a94442" stroke-width="2"/>
  <text x="310" y="322" font-size="14" fill="#6b1f1f" text-anchor="middle">必须过：一个 16 KB 的块</text>
  <text x="310" y="344" font-size="14" fill="#6b1f1f" text-anchor="middle">要占每线程 32 个寄存器</text>
  <rect x="412" y="292" width="188" height="72" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="506" y="322" font-size="14" fill="#1b4620" text-anchor="middle">不过了：显存直达</text>
  <text x="506" y="344" font-size="14" fill="#1b4620" text-anchor="middle">shared memory</text>
  <rect x="608" y="292" width="188" height="72" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="702" y="333" font-size="14" fill="#1b4620" text-anchor="middle">不过</text>
  <rect x="804" y="292" width="188" height="72" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="898" y="322" font-size="14" fill="#1b4620" text-anchor="middle">不过；连 shared → TMEM</text>
  <text x="898" y="344" font-size="14" fill="#1b4620" text-anchor="middle">也由引擎搬</text>

  <!-- row 4 -->
  <rect x="36" y="370" width="170" height="80" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="121" y="405" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">④ 完成通知</text>
  <text x="121" y="427" font-size="13" fill="#555" text-anchor="middle">怎么知道到货了</text>
  <rect x="216" y="370" width="188" height="80" fill="#fcf3cf" stroke="#b8860b" stroke-width="2"/>
  <text x="310" y="398" font-size="14" fill="#5a4400" text-anchor="middle">记分牌自动等</text>
  <text x="310" y="420" font-size="14" fill="#5a4400" text-anchor="middle">但挂在寄存器上：在途</text>
  <text x="310" y="440" font-size="14" fill="#5a4400" text-anchor="middle">数据占寄存器，排不深</text>
  <rect x="412" y="370" width="188" height="80" fill="#fcf3cf" stroke="#b8860b" stroke-width="2"/>
  <text x="506" y="398" font-size="14" fill="#5a4400" text-anchor="middle">自己攒组、自己等组：</text>
  <text x="506" y="420" font-size="14" fill="#5a4400" text-anchor="middle">commit_group /</text>
  <text x="506" y="440" font-size="14" fill="#5a4400" text-anchor="middle">wait_group(N)</text>
  <rect x="608" y="370" width="188" height="80" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="702" y="398" font-size="14" fill="#1b4620" text-anchor="middle">mbarrier 按字节对账：</text>
  <text x="702" y="420" font-size="14" fill="#1b4620" text-anchor="middle">先声明本轮几字节，</text>
  <text x="702" y="440" font-size="14" fill="#1b4620" text-anchor="middle">凑齐才放行</text>
  <rect x="804" y="370" width="188" height="80" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="898" y="409" font-size="14" fill="#1b4620" text-anchor="middle">同左，另配 TMEM 的</text>
  <text x="898" y="431" font-size="14" fill="#1b4620" text-anchor="middle">等待原语</text>

  <!-- new instructions row -->
  <rect x="36" y="456" width="170" height="62" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="121" y="482" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">这一代</text>
  <text x="121" y="504" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">新增的指令</text>
  <rect x="216" y="456" width="188" height="62" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="310" y="482" font-size="14" fill="#5a4400" text-anchor="middle">（只有 ld.global</text>
  <text x="310" y="502" font-size="14" fill="#5a4400" text-anchor="middle">和 st.shared）</text>
  <rect x="412" y="456" width="188" height="62" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="506" y="493" font-size="15" fill="#5a4400" text-anchor="middle">cp.async</text>
  <rect x="608" y="456" width="188" height="62" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="702" y="482" font-size="14" fill="#5a4400" text-anchor="middle">cp.async.bulk.tensor</text>
  <text x="702" y="502" font-size="14" fill="#5a4400" text-anchor="middle">（TMA）＋ mbarrier</text>
  <rect x="804" y="456" width="188" height="62" fill="#fffdf2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="898" y="482" font-size="14" fill="#5a4400" text-anchor="middle">tcgen05.cp、</text>
  <text x="898" y="502" font-size="14" fill="#5a4400" text-anchor="middle">TMA 的 gather 模式</text>

  <rect x="36" y="530" width="956" height="52" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="56" y="554" font-size="15" fill="#1a3a66">读法：横着读一行，看这笔账是哪一代被解决的；竖着读一列，看这一代手上还剩几笔红账。</text>
  <text x="56" y="574" font-size="15" fill="#1a3a66">Ampere 只解决了第 ③ 笔，所以 Hopper 还有得改；到 Hopper 四笔全绿，Blackwell 改的就只能是"再往里多管一跳"。</text>
</svg>
