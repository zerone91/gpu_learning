<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="sans-serif">
<rect x="0" y="0" width="1000" height="590" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb7"/></marker></defs>
<text x="500" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">完成记录放在哪里，决定了谁能等它</text>
<line x1="470" y1="52" x2="470" y2="504" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="26" y="70" font-size="15" text-anchor="start" fill="#2c6fb7" font-weight="bold">① 组语义：记录在每个线程自己的计数器上</text>
<rect x="30" y="86" width="410" height="146" fill="#f7faff" stroke="#2c6fb7" stroke-width="1.4" rx="5"/>
<text x="44" y="108" font-size="13" text-anchor="start" fill="#2c6fb7" font-weight="bold">warp A（既搬又算）</text>
<rect x="44" y="118" width="170" height="30" fill="#d7ede1" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="129.0" y="137.32" font-size="12" text-anchor="middle" fill="#222222">LDGSTS ×16</text>
<rect x="234" y="118" width="120" height="30" fill="#b9dcc8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="294.0" y="137.32" font-size="12" text-anchor="middle" fill="#222222">LDGDEPBAR</text>
<line x1="294" y1="148" x2="294" y2="172" stroke="#2c6fb7" stroke-width="1.8" marker-end="url(#ab)"/>
<rect x="214" y="176" width="160" height="36" fill="#eeeeee" stroke="#666666" stroke-width="1.4" rx="3"/>
<text x="294" y="199" font-size="12" text-anchor="middle" fill="#222222">这个 warp 的 SB0</text>
<text x="44" y="196" font-size="12" text-anchor="start" fill="#2c6fb7">完成记录在这里</text>
<text x="44" y="214" font-size="13" text-anchor="start" fill="#777777">它是 warp 私有的</text>
<rect x="30" y="258" width="410" height="70" fill="#fbfbfb" stroke="#999999" stroke-width="1.4" rx="5"/>
<text x="44" y="282" font-size="13" text-anchor="start" fill="#222222" font-weight="bold">warp B（只想算）</text>
<text x="44" y="306" font-size="12" text-anchor="start" fill="#c0392b">读不到 warp A 的 SB0，所以等不了 warp A 搬的数据。</text>
<line x1="235" y1="232" x2="235" y2="256" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="185" y="250" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">✕</text>
<text x="30" y="364" font-size="13" text-anchor="start" fill="#222222">wait_group 的意思是“我等我自己发的那几组”。</text>
<text x="30" y="386" font-size="13" text-anchor="start" fill="#222222">组语义没有办法表达“我等别人发的那几组”。</text>
<text x="502" y="70" font-size="15" text-anchor="start" fill="#1f7a4d" font-weight="bold">② mbarrier：记录在 shared memory 里的一个 64 位字上</text>
<rect x="500" y="86" width="470" height="96" fill="#f3faf6" stroke="#1f7a4d" stroke-width="1.4" rx="5"/>
<text x="514" y="108" font-size="13" text-anchor="start" fill="#1f7a4d" font-weight="bold">生产者 warp（只搬）</text>
<rect x="514" y="118" width="160" height="30" fill="#d7ede1" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="594.0" y="137.32" font-size="12" text-anchor="middle" fill="#222222">LDGSTS ×16</text>
<rect x="690" y="118" width="250" height="30" fill="#b9dcc8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="815.0" y="137.32" font-size="12" text-anchor="middle" fill="#222222">ARRIVES.LDGSTSBAR [mbar]</text>
<rect x="500" y="214" width="470" height="78" fill="#eaf4ee" stroke="#1f7a4d" stroke-width="1.6" rx="5"/>
<text x="514" y="236" font-size="13" text-anchor="start" fill="#1f7a4d" font-weight="bold">shared memory（线程块共用）</text>
<rect x="640" y="246" width="190" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="3"/>
<text x="735" y="268" font-size="12" text-anchor="middle" fill="#222222">mbarrier：一个 64 位字</text>
<text x="514" y="270" font-size="12" text-anchor="start" fill="#777777">谁都能读</text>
<line x1="815" y1="182" x2="815" y2="214" stroke="#1f7a4d" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="807" y="204" font-size="13" text-anchor="end" fill="#1f7a4d">拷贝完成时，硬件自动记一次到达</text>
<rect x="500" y="326" width="470" height="74" fill="#f3faf6" stroke="#1f7a4d" stroke-width="1.4" rx="5"/>
<text x="514" y="348" font-size="13" text-anchor="start" fill="#1f7a4d" font-weight="bold">消费者 warp（只算，一条拷贝也没发过）</text>
<rect x="514" y="358" width="200" height="30" fill="#fde6c8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="614.0" y="377.32" font-size="12" text-anchor="middle" fill="#222222">LDS + 测相位位（循环）</text>
<rect x="730" y="358" width="210" height="30" fill="#fde6c8" stroke="#222222" stroke-width="1.5" rx="3"/>
<text x="835.0" y="377.32" font-size="12" text-anchor="middle" fill="#222222">读整个分块做矩阵乘</text>
<line x1="614" y1="326" x2="614" y2="292" stroke="#1f7a4d" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="622" y="318" font-size="13" text-anchor="start" fill="#1f7a4d">读这个字，相位翻转就说明数据齐了</text>
<text x="500" y="444" font-size="14" text-anchor="start" fill="#222222">完成记录放进 shared memory 之后，它就不属于</text>
<text x="500" y="464" font-size="14" text-anchor="start" fill="#222222">某一个线程。块内任何 warp 用一条普通的读指令</text>
<text x="500" y="484" font-size="14" text-anchor="start" fill="#222222">就能查到它。这是 Ampere 上做生产者与消费者</text>
<text x="500" y="504" font-size="14" text-anchor="start" fill="#222222">分工的入口。Hopper 的 TMA 用的也是 mbarrier。</text>
<text x="500" y="572" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">两边的差别只有一处：完成记录是放在 warp 私有的计数器上，还是放在块内公共的 shared memory 里。</text>
</svg>
