<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="arR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b52a2a"/></marker><marker id="arG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f4e9a"/></marker><marker id="arO" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b8860b"/></marker><marker id="arP" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6a3d9a"/></marker></defs>
<rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
<text x="20" y="32" font-size="19" fill="#111" text-anchor="start" font-weight="bold">TMEM：128 条 lane × 512 列，每格 32 位，共 256 KB</text>
<text x="40" y="70" font-size="15" fill="#111" text-anchor="start" font-weight="bold">32 位 TMEM 地址</text>
<rect x="180" y="52" width="240" height="30" rx="0" fill="#fdecea" stroke="#b52a2a" stroke-width="1.8"/>
<text x="300" y="73" font-size="14" fill="#7a1f1f" text-anchor="middle">第 31～16 位：lane 编号</text>
<rect x="420" y="52" width="240" height="30" rx="0" fill="#e8f0fb" stroke="#1f4e9a" stroke-width="1.8"/>
<text x="540" y="73" font-size="14" fill="#1f4e9a" text-anchor="middle">第 15～0 位：列编号</text>
<text x="680" y="73" font-size="14" fill="#333" text-anchor="start">例：0x0028 0005 = 第 40 行、第 5 列</text>
<rect x="150" y="130" width="760" height="384" rx="0" fill="#f2f2f2" stroke="#555" stroke-width="1.8"/>
<rect x="150" y="130" width="190.0" height="384" rx="0" fill="#9ec1ea" stroke="#1f4e9a" stroke-width="1.8"/>
<rect x="340.0" y="130" width="190.0" height="384" rx="0" fill="#d6e6f8" stroke="#1f4e9a" stroke-width="1.8"/>
<text x="245.0" y="314.0" font-size="15" fill="#0d2f66" text-anchor="middle" font-weight="bold">第 0 份累加器</text>
<text x="245.0" y="336.0" font-size="14" fill="#0d2f66" text-anchor="middle">第 0～127 列</text>
<text x="435.0" y="314.0" font-size="15" fill="#1f4e9a" text-anchor="middle" font-weight="bold">第 1 份累加器</text>
<text x="435.0" y="336.0" font-size="14" fill="#1f4e9a" text-anchor="middle">第 128～255 列</text>
<text x="720.0" y="314.0" font-size="15" fill="#666" text-anchor="middle" font-weight="bold">空闲</text>
<text x="720.0" y="336.0" font-size="14" fill="#666" text-anchor="middle">第 256～511 列</text>
<path d="M138 133.0 L130 133.0 L130 223.0 L138 223.0" fill="none" stroke="#333" stroke-width="1.8"/>
<text x="122" y="176.0" font-size="14" fill="#111" text-anchor="end" font-weight="bold">warp 0</text>
<text x="122" y="194.0" font-size="12" fill="#444" text-anchor="end">lane 0～31</text>
<line x1="150" y1="226.0" x2="910" y2="226.0" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<path d="M138 229.0 L130 229.0 L130 319.0 L138 319.0" fill="none" stroke="#333" stroke-width="1.8"/>
<text x="122" y="272.0" font-size="14" fill="#111" text-anchor="end" font-weight="bold">warp 1</text>
<text x="122" y="290.0" font-size="12" fill="#444" text-anchor="end">lane 32～63</text>
<line x1="150" y1="322.0" x2="910" y2="322.0" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<path d="M138 325.0 L130 325.0 L130 415.0 L138 415.0" fill="none" stroke="#333" stroke-width="1.8"/>
<text x="122" y="368.0" font-size="14" fill="#111" text-anchor="end" font-weight="bold">warp 2</text>
<text x="122" y="386.0" font-size="12" fill="#444" text-anchor="end">lane 64～95</text>
<line x1="150" y1="418.0" x2="910" y2="418.0" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<path d="M138 421.0 L130 421.0 L130 511.0 L138 511.0" fill="none" stroke="#333" stroke-width="1.8"/>
<text x="122" y="464.0" font-size="14" fill="#111" text-anchor="end" font-weight="bold">warp 3</text>
<text x="122" y="482.0" font-size="12" fill="#444" text-anchor="end">lane 96～127</text>
<text x="150.0" y="122" font-size="12" fill="#444" text-anchor="middle">0</text>
<text x="340.0" y="122" font-size="12" fill="#444" text-anchor="middle">128</text>
<text x="530.0" y="122" font-size="12" fill="#444" text-anchor="middle">256</text>
<text x="720.0" y="122" font-size="12" fill="#444" text-anchor="middle">384</text>
<text x="910" y="122" font-size="12" fill="#444" text-anchor="middle">511</text>
<text x="530.0" y="104" font-size="13" fill="#333" text-anchor="middle">列（512 列，每列每条 lane 4 字节）</text>
<rect x="154.421875" y="247.0" width="10" height="10" rx="0" fill="#b52a2a" stroke="#b52a2a" stroke-width="1"/>
<line x1="165.421875" y1="253.0" x2="330" y2="236" stroke="#b52a2a" stroke-width="1.8" marker-end="url(#arR)"/>
<rect x="332" y="222" width="230" height="30" rx="4" fill="#fff" stroke="#b52a2a" stroke-width="1.5"/>
<text x="447" y="242" font-size="13" fill="#b52a2a" text-anchor="middle">第 40 行第 5 列：0x00280005</text>
<text x="150" y="548" font-size="14" fill="#333" text-anchor="start">第 q 个 warp 用 tcgen05.ld / st 只能访问 lane 32q～32q+31，但能访问全部 512 列。</text>
<text x="150" y="572" font-size="14" fill="#333" text-anchor="start">本例 128×128 fp32 累加器 = 128 条 lane × 128 列 = 64 KB；两份共 256 列。</text>
<text x="150" y="596" font-size="14" fill="#333" text-anchor="start">分配单位 32 列，列数必须是 2 的幂（32～512）；一列分配出去，128 条 lane 全部归它。</text>
</svg>
