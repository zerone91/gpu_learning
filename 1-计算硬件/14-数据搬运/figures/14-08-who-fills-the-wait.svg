<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" width="1000" height="592" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="592" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="bold" fill="#111">等待那段时间里，执行单元在干什么</text>
  <text x="36" y="58" font-size="14" fill="#555">三张图的横轴各有各的刻度，不能横着比长短。要比的是：红色的等待段下面有没有别的东西在跑。</text>

  <!-- GPU -->
  <rect x="36" y="76" width="928" height="140" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="52" y="100" font-size="16" font-weight="bold" fill="#1a3a66">GPU：等待的 warp 让出发射口，别的 warp 顶上</text>
  <text x="52" y="124" font-size="13" fill="#333">走查取自本模块第 1 节：一个 warp 发出一条读取后，等了 475 拍才等到数据。</text>

  <text x="52" y="152" font-size="13" fill="#333">0 号 warp</text>
  <rect x="150" y="138" width="60" height="20" fill="#2c5aa0"/>
  <text x="180" y="153" font-size="11" fill="#ffffff" text-anchor="middle">发读取</text>
  <rect x="210" y="138" width="560" height="20" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="490" y="153" font-size="12" fill="#6b1f1f" text-anchor="middle">挂起 475 拍，一条指令都发不出</text>
  <rect x="770" y="138" width="60" height="20" fill="#2f6b2f"/>
  <text x="800" y="153" font-size="11" fill="#ffffff" text-anchor="middle">算</text>

  <text x="52" y="184" font-size="13" fill="#333">同 SM 的其它 warp</text>
  <rect x="210" y="170" width="560" height="20" fill="#dff0d8" stroke="#2f6b2f" stroke-width="2"/>
  <text x="490" y="185" font-size="12" fill="#1b4620" text-anchor="middle">调度器每拍挑一个别的 warp 发射，执行单元不空</text>

  <text x="52" y="208" font-size="12.5" fill="#1a3a66">一个 SM 最多驻留 64 个 warp。代价是：这 64 个 warp 分用同一份 256 KB 的寄存器堆。</text>

  <!-- Ascend -->
  <rect x="36" y="228" width="928" height="164" fill="#fdf5f5" stroke="#a94442" stroke-width="2"/>
  <text x="52" y="252" font-size="16" font-weight="bold" fill="#6b1f1f">昇腾：几条流水线各自推进，但流水线本身停了就是真的停</text>
  <text x="52" y="276" font-size="13" fill="#333">走查取自本模块第 6 节：一轮 256 拍，前两轮是流水线的填充阶段。</text>

  <text x="52" y="304" font-size="13" fill="#333">MTE2</text>
  <rect x="190" y="290" width="96" height="20" fill="#2c5aa0"/>
  <text x="238" y="305" font-size="11" fill="#ffffff" text-anchor="middle">块 0</text>
  <rect x="384" y="290" width="96" height="20" fill="#2c5aa0"/>
  <text x="432" y="305" font-size="11" fill="#ffffff" text-anchor="middle">块 1</text>
  <rect x="578" y="290" width="96" height="20" fill="#2c5aa0"/>
  <text x="626" y="305" font-size="11" fill="#ffffff" text-anchor="middle">块 2</text>
  <rect x="772" y="290" width="96" height="20" fill="#2c5aa0"/>
  <text x="820" y="305" font-size="11" fill="#ffffff" text-anchor="middle">块 3</text>

  <text x="52" y="332" font-size="13" fill="#333">MTE1</text>
  <rect x="190" y="318" width="194" height="20" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="287" y="333" font-size="11" fill="#6b1f1f" text-anchor="middle">等 MTE2 的标志</text>
  <rect x="384" y="318" width="48" height="20" fill="#2c5aa0"/>
  <text x="408" y="333" font-size="11" fill="#ffffff" text-anchor="middle">块 0</text>
  <rect x="578" y="318" width="48" height="20" fill="#2c5aa0"/>
  <text x="602" y="333" font-size="11" fill="#ffffff" text-anchor="middle">块 1</text>
  <rect x="772" y="318" width="48" height="20" fill="#2c5aa0"/>
  <text x="796" y="333" font-size="11" fill="#ffffff" text-anchor="middle">块 2</text>

  <text x="52" y="360" font-size="13" fill="#333">Cube</text>
  <rect x="190" y="346" width="388" height="20" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="384" y="361" font-size="11" fill="#6b1f1f" text-anchor="middle">前两轮没有数据可算，真的空着</text>
  <rect x="578" y="346" width="194" height="20" fill="#2f6b2f"/>
  <text x="675" y="361" font-size="11" fill="#ffffff" text-anchor="middle">算块 0，占满 256 拍</text>
  <rect x="772" y="346" width="194" height="20" fill="#2f6b2f"/>
  <text x="869" y="361" font-size="11" fill="#ffffff" text-anchor="middle">算块 1，占满 256 拍</text>

  <text x="52" y="384" font-size="12.5" fill="#6b1f1f">没有别的线程可以填补。隐藏延迟只能靠多开几份缓冲，让搬运提前几轮发出。</text>

  <!-- TPU -->
  <rect x="36" y="404" width="928" height="140" fill="#fffdf2" stroke="#b8860b" stroke-width="2"/>
  <text x="52" y="428" font-size="16" font-weight="bold" fill="#5a4400">TPU：等待指令挡住的是整条指令流，所以全核一起停</text>
  <text x="52" y="452" font-size="13" fill="#333">走查取自本模块第 7 节：分块边长 256 时，算一步 256 拍，搬下一步要 480 拍。</text>

  <text x="52" y="480" font-size="13" fill="#333">MXU</text>
  <rect x="190" y="466" width="300" height="20" fill="#2f6b2f"/>
  <text x="340" y="481" font-size="11" fill="#ffffff" text-anchor="middle">算这一步，256 拍</text>
  <rect x="490" y="466" width="262" height="20" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="621" y="481" font-size="11" fill="#6b1f1f" text-anchor="middle">停 224 拍</text>
  <rect x="752" y="466" width="212" height="20" fill="#2f6b2f"/>
  <text x="858" y="481" font-size="11" fill="#ffffff" text-anchor="middle">算下一步</text>

  <text x="52" y="508" font-size="13" fill="#333">VPU 与标量单元</text>
  <rect x="490" y="494" width="262" height="20" fill="#fdeaea" stroke="#a94442" stroke-width="2"/>
  <text x="621" y="509" font-size="11" fill="#6b1f1f" text-anchor="middle">同样停住：标量单元不再取下一条指令字</text>

  <text x="52" y="534" font-size="12.5" fill="#5a4400">每 480 拍里 MXU 只工作 256 拍，占 53%。办法只有两个：把分块加大，或者多开一份缓冲、提前几步发出。</text>

  <!-- bottom -->
  <text x="36" y="572" font-size="14" fill="#333">三张图说明同一件事：GPU 用"换一个 warp"填等待，NPU 没有这个办法，只能靠编译期把搬运排得足够早。</text>
</svg>
