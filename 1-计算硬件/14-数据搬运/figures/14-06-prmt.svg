<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" font-family="sans-serif">
  <rect width="1020" height="560" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#c77b18"/></marker></defs>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#111">prmt.b32 走一遍：一个线程在自己的两个寄存器里挑 4 个字节，拼出一个新寄存器</text>
  <text x="20" y="52" font-size="14" fill="#444">指令：prmt.b32 d, a, b, c;　　a 和 b 各 4 个字节，合起来编号 0～7；c 的四个 4 位字段各挑一个字节。</text>
  <text x="20" y="96" font-size="13.5" font-weight="bold" fill="#111">源：{b, a} 共 8 个字节</text>
  <rect x="220" y="110" width="76" height="38" fill="#e3eefb" stroke="#555" stroke-width="1.3"/>
  <text x="258" y="135" font-size="14" fill="#111" text-anchor="middle">0x77</text>
  <text x="258" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 7</text>
  <rect x="296" y="110" width="76" height="38" fill="#e3eefb" stroke="#555" stroke-width="1.3"/>
  <text x="334" y="135" font-size="14" fill="#111" text-anchor="middle">0x66</text>
  <text x="334" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 6</text>
  <rect x="372" y="110" width="76" height="38" fill="#e3eefb" stroke="#555" stroke-width="1.3"/>
  <text x="410" y="135" font-size="14" fill="#111" text-anchor="middle">0x55</text>
  <text x="410" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 5</text>
  <rect x="448" y="110" width="76" height="38" fill="#e3eefb" stroke="#555" stroke-width="1.3"/>
  <text x="486" y="135" font-size="14" fill="#111" text-anchor="middle">0x44</text>
  <text x="486" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 4</text>
  <rect x="524" y="110" width="76" height="38" fill="#eaf6ea" stroke="#555" stroke-width="1.3"/>
  <text x="562" y="135" font-size="14" fill="#111" text-anchor="middle">0x33</text>
  <text x="562" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 3</text>
  <rect x="600" y="110" width="76" height="38" fill="#eaf6ea" stroke="#555" stroke-width="1.3"/>
  <text x="638" y="135" font-size="14" fill="#111" text-anchor="middle">0x22</text>
  <text x="638" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 2</text>
  <rect x="676" y="110" width="76" height="38" fill="#eaf6ea" stroke="#555" stroke-width="1.3"/>
  <text x="714" y="135" font-size="14" fill="#111" text-anchor="middle">0x11</text>
  <text x="714" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 1</text>
  <rect x="752" y="110" width="76" height="38" fill="#eaf6ea" stroke="#555" stroke-width="1.3"/>
  <text x="790" y="135" font-size="14" fill="#111" text-anchor="middle">0x00</text>
  <text x="790" y="106" font-size="11.5" fill="#666" text-anchor="middle">字节 0</text>
  <text x="372" y="166" font-size="12.5" fill="#1565c0" text-anchor="middle">b = 0x77665544</text>
  <text x="676" y="166" font-size="12.5" fill="#2e7d32" text-anchor="middle">a = 0x33221100</text>
  <text x="20" y="274" font-size="13.5" font-weight="bold" fill="#111">选择子 c = 0x5410</text>
  <rect x="380" y="250" width="76" height="32" fill="#fff3d6" stroke="#c77b18" stroke-width="1.3"/>
  <text x="418" y="272" font-size="14" fill="#111" text-anchor="middle">5</text>
  <text x="418" y="244" font-size="11" fill="#666" text-anchor="middle">管 d 的字节 3</text>
  <rect x="456" y="250" width="76" height="32" fill="#fff3d6" stroke="#c77b18" stroke-width="1.3"/>
  <text x="494" y="272" font-size="14" fill="#111" text-anchor="middle">4</text>
  <text x="494" y="244" font-size="11" fill="#666" text-anchor="middle">管 d 的字节 2</text>
  <rect x="532" y="250" width="76" height="32" fill="#fff3d6" stroke="#c77b18" stroke-width="1.3"/>
  <text x="570" y="272" font-size="14" fill="#111" text-anchor="middle">1</text>
  <text x="570" y="244" font-size="11" fill="#666" text-anchor="middle">管 d 的字节 1</text>
  <rect x="608" y="250" width="76" height="32" fill="#fff3d6" stroke="#c77b18" stroke-width="1.3"/>
  <text x="646" y="272" font-size="14" fill="#111" text-anchor="middle">0</text>
  <text x="646" y="244" font-size="11" fill="#666" text-anchor="middle">管 d 的字节 0</text>
  <text x="20" y="385" font-size="13.5" font-weight="bold" fill="#111">结果 d = 0x55441100</text>
  <rect x="380" y="360" width="76" height="38" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.4"/>
  <text x="418" y="385" font-size="14" fill="#111" text-anchor="middle">0x55</text>
  <text x="418" y="356" font-size="11.5" fill="#666" text-anchor="middle">d 的字节 3</text>
  <path d="M410,148 C410,218 418,290 418,354" fill="none" stroke="#c77b18" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="456" y="360" width="76" height="38" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.4"/>
  <text x="494" y="385" font-size="14" fill="#111" text-anchor="middle">0x44</text>
  <text x="494" y="356" font-size="11.5" fill="#666" text-anchor="middle">d 的字节 2</text>
  <path d="M486,148 C486,218 494,290 494,354" fill="none" stroke="#c77b18" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="532" y="360" width="76" height="38" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.4"/>
  <text x="570" y="385" font-size="14" fill="#111" text-anchor="middle">0x11</text>
  <text x="570" y="356" font-size="11.5" fill="#666" text-anchor="middle">d 的字节 1</text>
  <path d="M714,148 C714,218 570,290 570,354" fill="none" stroke="#c77b18" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="608" y="360" width="76" height="38" fill="#ffe9c9" stroke="#c77b18" stroke-width="1.4"/>
  <text x="646" y="385" font-size="14" fill="#111" text-anchor="middle">0x00</text>
  <text x="646" y="356" font-size="11.5" fill="#666" text-anchor="middle">d 的字节 0</text>
  <path d="M790,148 C790,218 646,290 646,354" fill="none" stroke="#c77b18" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="20" y="434" width="980" height="112" fill="#f7f9fc" stroke="#99a" stroke-width="1.2"/>
  <text x="36" y="458" font-size="14" font-weight="bold" fill="#111">两件要记住的事</text>
  <text x="36" y="484" font-size="12.5" fill="#333">一、这条指令只在一个线程自己的寄存器里动字节，不碰内存、不碰别的线程，一拍就出结果。它能表达任意的「8 选 4」，代价是每 4 个字节要一条指令。</text>
  <text x="36" y="506" font-size="12.5" fill="#333">二、每个 4 位字段的最高位另有用处：置 1 时不是复制那个字节，而是把它的最高位复制成 8 个相同的位（得到 0x00 或 0xFF）——这是为符号扩展准备的。</text>
  <text x="36" y="528" font-size="12.5" fill="#333">　　例：a = 0x0000F07F、c = 0x9910 时，d = 0xFFFFF07F，等于把 16 位的 0xF07F 按有符号数扩展成 32 位。</text>
</svg>