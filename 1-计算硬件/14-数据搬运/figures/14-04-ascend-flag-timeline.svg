<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="cg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2c7a3f"/>
    </marker>
    <marker id="co" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#c2691a"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">昇腾上一个矩阵乘 tile 的流水：四条流水线，靠标志位互相通知</text>
  <text x="20" y="52" font-family="sans-serif" font-size="14" fill="#555">硬件不检查流水线之间的数据依赖，先后顺序全靠 SetFlag / WaitFlag 显式钉住。拍数为示意。</text>

  <line x1="150" y1="80" x2="930" y2="80" stroke="#999" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">
    <text x="150" y="72">0</text><text x="310" y="72">200</text><text x="358" y="72">260</text>
    <text x="518" y="72">460</text><text x="566" y="72">520</text><text x="726" y="72">720</text>
    <text x="948" y="72">拍</text>
  </g>

  <!-- MTE2 -->
  <text x="20" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b3f6b">MTE2</text>
  <text x="20" y="136" font-family="sans-serif" font-size="12" fill="#666">GM → L1</text>
  <rect x="150" y="96" width="160" height="40" fill="#e6eef8" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="230" y="121" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">A0、B0 → L1 甲</text>
  <rect x="310" y="96" width="208" height="40" fill="#efe6f8" stroke="#7a3f9a" stroke-width="1.8"/>
  <text x="414" y="121" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">A1、B1 → L1 乙</text>
  <rect x="518" y="96" width="208" height="40" fill="#e6eef8" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="622" y="121" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">A2、B2 → L1 甲（覆盖）</text>
  <rect x="726" y="96" width="204" height="40" fill="#efe6f8" stroke="#7a3f9a" stroke-width="1.8"/>
  <text x="828" y="121" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">A3、B3 → L1 乙</text>

  <!-- 橙：MTE1 → MTE2 -->
  <path d="M352,162 L352,152 L514,152 L514,140" fill="none" stroke="#c2691a" stroke-width="2.2" marker-end="url(#co)"/>
  <text x="360" y="146" font-family="sans-serif" font-size="12.5" fill="#8a4a10">SetFlag(MTE1_MTE2)：L1 甲被读完了，MTE2 才敢覆盖它</text>

  <!-- MTE1 -->
  <text x="20" y="188" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5c2d">MTE1</text>
  <text x="20" y="206" font-family="sans-serif" font-size="12" fill="#666">L1 → L0A/L0B</text>
  <rect x="150" y="166" width="160" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="230" y="191" font-family="sans-serif" font-size="12.5" fill="#777" text-anchor="middle">WaitFlag(MTE2_MTE1)</text>
  <rect x="310" y="166" width="48" height="40" fill="#e8f4ea" stroke="#2c7a3f" stroke-width="1.8"/>
  <text x="334" y="191" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">送 L0</text>
  <rect x="358" y="166" width="160" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="438" y="191" font-family="sans-serif" font-size="12.5" fill="#777" text-anchor="middle">WaitFlag(M_MTE1)</text>
  <rect x="518" y="166" width="48" height="40" fill="#e8f4ea" stroke="#2c7a3f" stroke-width="1.8"/>
  <text x="542" y="191" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">送 L0</text>
  <rect x="566" y="166" width="160" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="646" y="191" font-family="sans-serif" font-size="12.5" fill="#777" text-anchor="middle">再等</text>

  <!-- 绿：MTE2 → MTE1 -->
  <line x1="310" y1="140" x2="310" y2="162" stroke="#2c7a3f" stroke-width="2.2" marker-end="url(#cg)"/>
  <text x="304" y="157" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#1d5c2d">SetFlag(MTE2_MTE1)：L1 甲装好了</text>
  <!-- 橙：Cube → MTE1 -->
  <line x1="518" y1="232" x2="518" y2="210" stroke="#c2691a" stroke-width="2.2" marker-end="url(#co)"/>
  <text x="526" y="226" font-family="sans-serif" font-size="12.5" fill="#8a4a10">SetFlag(M_MTE1)：L0 我用完了，可以重装</text>

  <!-- Cube -->
  <text x="20" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">Cube</text>
  <text x="20" y="276" font-family="sans-serif" font-size="12" fill="#666">矩阵乘</text>
  <rect x="150" y="236" width="208" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="254" y="261" font-family="sans-serif" font-size="12.5" fill="#777" text-anchor="middle">WaitFlag(MTE1_M)</text>
  <rect x="358" y="236" width="160" height="40" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="438" y="261" font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">算 A0 × B0 → L0C</text>
  <rect x="518" y="236" width="48" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <rect x="566" y="236" width="160" height="40" fill="#fdf0e2" stroke="#c2691a" stroke-width="1.8"/>
  <text x="646" y="261" font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">算 A1 × B1 → L0C</text>

  <!-- 绿：MTE1 → Cube -->
  <line x1="358" y1="210" x2="358" y2="232" stroke="#2c7a3f" stroke-width="2.2" marker-end="url(#cg)"/>
  <text x="366" y="226" font-family="sans-serif" font-size="12.5" fill="#1d5c2d">SetFlag(MTE1_M)</text>

  <!-- FixPipe -->
  <text x="20" y="328" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5c2d7a">FixPipe</text>
  <text x="20" y="346" font-family="sans-serif" font-size="12" fill="#666">L0C → GM</text>
  <rect x="150" y="306" width="576" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="438" y="331" font-family="sans-serif" font-size="12.5" fill="#777" text-anchor="middle">WaitFlag(M_FIX)：等 L0C 把这一路 K 累加完</text>
  <rect x="726" y="306" width="204" height="40" fill="#efe6f8" stroke="#7a3f9a" stroke-width="1.8"/>
  <text x="828" y="331" font-family="sans-serif" font-size="12.5" fill="#333" text-anchor="middle">L0C → GM，随路量化</text>
  <line x1="726" y1="280" x2="726" y2="302" stroke="#2c7a3f" stroke-width="2.2" marker-end="url(#cg)"/>
  <text x="734" y="296" font-family="sans-serif" font-size="12.5" fill="#1d5c2d">SetFlag(M_FIX)</text>

  <line x1="20" y1="374" x2="960" y2="374" stroke="#ccc" stroke-width="1.5"/>

  <text x="20" y="402" font-family="sans-serif" font-size="14" fill="#333">绿色箭头是"数据到了"方向，橙色箭头是"缓冲空了"方向。每一跳、每一轮都要这两个方向各一个，缺一个就会静默算错。</text>
  <text x="20" y="428" font-family="sans-serif" font-size="14" fill="#333">路径比 GPU 长一级：GM → L1 → L0A/L0B → Cube 是三跳，而 GPU 上 TMA 一步就把数据送进 shared memory。</text>
  <text x="20" y="454" font-family="sans-serif" font-size="14" fill="#333">多出来的 L1 是复用层：同一份 A 在 L1 里被多次送进 L0 去配不同的 B，省的是 GM 的流量。</text>
  <text x="20" y="484" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">写 Ascend C 时看不到这些标志：EnQue 内嵌 SetFlag，DeQue 内嵌对应的 WaitFlag，由队列代管。</text>
  <text x="20" y="512" font-family="sans-serif" font-size="14" fill="#666">少写一对不报错，只是偶发算错且极难复现；多写一对不出错，但会把本可并行的两条流水线串起来。</text>
  <text x="20" y="538" font-family="sans-serif" font-size="14" fill="#666">事件类型按"源流水线_目的流水线"命名。图中 M 指 Cube（矩阵）流水线，FIX 指 FixPipe；L1 甲、乙是乒乓使用的两半缓冲（蓝色用甲、紫色用乙）。</text>
  <text x="20" y="564" font-family="sans-serif" font-size="14" fill="#666">灰色虚线框表示这条流水线停在 WaitFlag 上。本图假设 L0A/L0B 不做乒乓，所以 MTE1 每轮都要等 Cube 释放。</text>
  <text x="20" y="590" font-family="sans-serif" font-size="14" fill="#666">Ascend C 里的 SetFlag / WaitFlag 拼法与事件枚举据昇腾社区文档；拍数为示意值，不是实测。</text>
</svg>
