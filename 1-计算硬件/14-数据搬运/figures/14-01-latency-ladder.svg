<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#111">乘加电路够得到哪几级存储，够不到的那几级有多远</text>
  <text x="40" y="62" font-size="15" fill="#444">取一个数要等多少拍（Hopper 微基准实测；横条按对数长度画，读旁边的数字）</text>

  <!-- bracket: reachable -->
  <path d="M58 86 L50 86 L50 204 L58 204" fill="none" stroke="#3c763d" stroke-width="2"/>
  <text x="38" y="145" font-size="14" fill="#3c763d" text-anchor="middle" transform="rotate(-90 38 145)">操作数从这里取</text>

  <!-- row 1: register -->
  <rect x="70" y="84" width="200" height="52" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="170" y="107" font-size="16" fill="#1b4620" text-anchor="middle">寄存器</text>
  <text x="170" y="127" font-size="13" fill="#3c763d" text-anchor="middle">每 SM 256 KB</text>
  <rect x="284" y="100" width="8" height="22" fill="#3c763d"/>
  <text x="302" y="117" font-size="15" fill="#222">读操作数是流水线的一部分，不另计</text>

  <!-- row 2: shared -->
  <rect x="70" y="152" width="200" height="52" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="170" y="175" font-size="16" fill="#1b4620" text-anchor="middle">shared memory</text>
  <text x="170" y="195" font-size="13" fill="#3c763d" text-anchor="middle">每 SM 最多 228 KB</text>
  <rect x="284" y="168" width="125" height="22" fill="#5cb85c"/>
  <text x="421" y="185" font-size="15" fill="#222">约 29 拍（L1 命中约 40 拍）</text>

  <!-- divider -->
  <line x1="40" y1="220" x2="640" y2="220" stroke="#a94442" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="284" y="238" font-size="14" fill="#a94442">线以下：乘加电路没有通路，必须先把数搬上来</text>

  <!-- row 3: L2 -->
  <rect x="70" y="250" width="200" height="52" fill="#fcf3cf" stroke="#b8860b" stroke-width="2"/>
  <text x="170" y="273" font-size="16" fill="#6b4e00" text-anchor="middle">L2 缓存</text>
  <text x="170" y="293" font-size="13" fill="#8a6d00" text-anchor="middle">全芯片共享 50 MB</text>
  <rect x="284" y="266" width="202" height="22" fill="#e0a800"/>
  <text x="498" y="283" font-size="15" fill="#222">约 260～470 拍</text>

  <!-- row 4: HBM -->
  <rect x="70" y="318" width="200" height="52" fill="#f8d7da" stroke="#a94442" stroke-width="2"/>
  <text x="170" y="341" font-size="16" fill="#7a1f1f" text-anchor="middle">显存（HBM）</text>
  <text x="170" y="361" font-size="13" fill="#a94442" text-anchor="middle">芯片外，80 GB</text>
  <rect x="284" y="334" width="236" height="22" fill="#c9302c"/>
  <text x="532" y="351" font-size="15" fill="#222">约 480～730 拍</text>

  <!-- right box -->
  <rect x="660" y="84" width="270" height="286" fill="#eef4fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="795" y="112" font-size="16" font-weight="bold" fill="#1a3d70" text-anchor="middle">等一次显存往返的工夫，</text>
  <text x="795" y="134" font-size="16" font-weight="bold" fill="#1a3d70" text-anchor="middle">一个 SM 本来能做多少乘加</text>
  <line x1="680" y1="148" x2="910" y2="148" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="678" y="174" font-size="14" fill="#222">矩阵单元每拍：2048 次 bf16 乘加</text>
  <text x="678" y="200" font-size="14" fill="#222">一次往返：约 500～700 拍</text>
  <text x="678" y="226" font-size="14" fill="#222">相乘：约 100 万～140 万次乘加</text>
  <text x="678" y="260" font-size="14" fill="#222">一个 128×128×64 的矩阵乘分块：</text>
  <text x="678" y="282" font-size="14" fill="#222">128 × 128 × 64 ≈ 105 万次乘加</text>
  <rect x="678" y="300" width="234" height="52" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="795" y="322" font-size="15" font-weight="bold" fill="#1a3d70" text-anchor="middle">干等一次 ≈ 白扔</text>
  <text x="795" y="342" font-size="15" font-weight="bold" fill="#1a3d70" text-anchor="middle">一整个分块的计算</text>

  <text x="40" y="412" font-size="14" fill="#444">注：范围来自两篇微基准论文：H800 上 L2 263 拍、显存 479 拍；H100 上请求落在本侧 L2 分区 295 / 554 拍，对侧分区 470 / 728 拍。</text>
  <text x="40" y="436" font-size="14" fill="#444">"拍"是一个 GPU 时钟周期，H100 约 0.55 纳秒。</text>
</svg>
