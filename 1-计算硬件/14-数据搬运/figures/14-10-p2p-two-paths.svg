<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b3e"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9771e"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <!-- host -->
  <rect x="330" y="10" width="300" height="44" rx="6" fill="#fde7cf" stroke="#d9771e" stroke-width="1.5"/>
  <text x="480" y="38" font-size="15" text-anchor="middle">主机：CUDA 驱动（只参与路一）</text>

  <!-- NVLink band -->
  <rect x="425" y="80" width="110" height="340" fill="#e0e0e0"/>
  <text x="480" y="410" font-size="16" text-anchor="middle" font-weight="bold" fill="#444">NVLink</text>

  <!-- GPU A -->
  <rect x="20" y="70" width="405" height="360" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
  <text x="36" y="94" font-size="16" font-weight="bold">GPU A（发送方）</text>
  <rect x="40" y="110" width="150" height="70" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text x="115" y="140" font-size="15" text-anchor="middle">显存 A</text>
  <text x="115" y="162" font-size="14" text-anchor="middle">（源数据）</text>
  <rect x="225" y="110" width="170" height="70" rx="6" fill="#e3edfb" stroke="#1f5fbf" stroke-width="2"/>
  <text x="310" y="150" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f5fbf">copy engine</text>
  <rect x="40" y="296" width="150" height="78" rx="6" fill="#e6f4e8" stroke="#2e8b3e" stroke-width="2"/>
  <text x="115" y="320" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b3e">SM</text>
  <text x="115" y="342" font-size="13.5" text-anchor="middle">线程执行 STG，</text>
  <text x="115" y="362" font-size="13.5" text-anchor="middle">或一个线程发 TMA</text>
  <rect x="225" y="300" width="110" height="70" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.5"/>
  <text x="280" y="330" font-size="15" text-anchor="middle">MMU</text>
  <text x="280" y="352" font-size="14" text-anchor="middle">查页表</text>

  <!-- GPU B -->
  <rect x="535" y="70" width="405" height="360" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
  <text x="551" y="94" font-size="16" font-weight="bold">GPU B（接收方）</text>
  <rect x="740" y="110" width="180" height="70" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text x="830" y="140" font-size="15" text-anchor="middle">显存 B</text>
  <text x="830" y="162" font-size="14" text-anchor="middle">（目的缓冲）</text>
  <rect x="740" y="300" width="180" height="70" rx="6" fill="#fff6d6" stroke="#b58900" stroke-width="1.5"/>
  <text x="830" y="330" font-size="15" text-anchor="middle">标志位（在显存 B）</text>
  <text x="830" y="352" font-size="14" text-anchor="middle">B 上的 kernel 轮询它</text>

  <!-- path 1 -->
  <line x1="400" y1="54" x2="330" y2="106" stroke="#d9771e" stroke-width="2" marker-end="url(#ao)"/>
  <text x="380" y="100" font-size="14" fill="#d9771e">① 写命令</text>
  <line x1="190" y1="145" x2="222" y2="145" stroke="#1f5fbf" stroke-width="4" marker-end="url(#ab)"/>
  <text x="110" y="200" font-size="14" fill="#1f5fbf" text-anchor="middle">② 读本卡显存</text>
  <line x1="395" y1="145" x2="736" y2="145" stroke="#1f5fbf" stroke-width="4" marker-end="url(#ab)"/>
  <text x="620" y="134" font-size="14" fill="#1f5fbf" text-anchor="middle">③ 经 NVLink 写对端</text>
  <text x="320" y="200" font-size="14" fill="#c0392b" text-anchor="middle">④ 写信号量报完成</text>
  <text x="36" y="236" font-size="15" font-weight="bold" fill="#1f5fbf">路一：copy engine（主机下单）</text>

  <!-- path 2 -->
  <text x="36" y="286" font-size="15" font-weight="bold" fill="#2e8b3e">路二：SM 上的线程发起（逐条 store，或一条 TMA 指令）</text>
  <line x1="190" y1="335" x2="222" y2="335" stroke="#2e8b3e" stroke-width="4" marker-end="url(#ag)"/>
  <text x="206" y="392" font-size="14" fill="#2e8b3e" text-anchor="middle">① 存储到对端地址</text>
  <path d="M335,318 L660,318 L660,184" stroke="#2e8b3e" stroke-width="4" fill="none" marker-end="url(#ag)"/>
  <text x="500" y="310" font-size="14" fill="#2e8b3e" text-anchor="middle">② 识别为对端 → ③ 数据写入</text>
  <line x1="335" y1="350" x2="736" y2="350" stroke="#2e8b3e" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#ag)"/>
  <text x="600" y="370" font-size="14" fill="#2e8b3e" text-anchor="middle">④ 再写标志位</text>

  <!-- bottom comparison -->
  <g font-size="14">
    <rect x="20" y="448" width="920" height="84" rx="6" fill="#f7f7f7" stroke="#ccc"/>
    <text x="36" y="474" fill="#1f5fbf">路一：不占 SM。下单要几微秒。一次至少搬 256 MB 才跑到 80% 带宽。只搬不算。</text>
    <text x="36" y="500" fill="#2e8b3e">路二：占 SM。下单是一条指令。2 KB 的消息就跑到 74% 带宽。读来的数据可以直接加。</text>
    <text x="36" y="522" fill="#555">H100 实测搬 1 GB：路一 369 GB/s，TMA 350 GB/s，逐条 store 343 GB/s（上限 450 GB/s）。</text>
  </g>
</svg>
