<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86a0c"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
</defs>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">两个都被叫作“DMA 引擎”的部件：位置不同，管的路段不同</text>
<!-- host -->
<rect x="20" y="70" width="170" height="110" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
<text x="105" y="100" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">CPU 主机</text>
<text x="105" y="126" font-size="14" text-anchor="middle" fill="#222">主机内存</text>
<text x="105" y="148" font-size="14" text-anchor="middle" fill="#555">（训练数据在这）</text>
<rect x="20" y="380" width="170" height="110" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
<text x="105" y="412" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">另一块 GPU</text>
<text x="105" y="438" font-size="14" text-anchor="middle" fill="#222">它的显存</text>
<!-- GPU chip -->
<rect x="260" y="50" width="680" height="480" rx="10" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<text x="600" y="76" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">这块 GPU</text>
<!-- copy engines at edge -->
<rect x="275" y="150" width="120" height="70" rx="6" fill="#fbe3c4" stroke="#b86a0c" stroke-width="2"/>
<text x="335" y="178" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">copy engine</text>
<text x="335" y="200" font-size="14" text-anchor="middle" fill="#222">芯片边缘</text>
<rect x="275" y="340" width="120" height="70" rx="6" fill="#fbe3c4" stroke="#b86a0c" stroke-width="2"/>
<text x="335" y="368" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">copy engine</text>
<text x="335" y="390" font-size="14" text-anchor="middle" fill="#222">芯片边缘</text>
<!-- HBM -->
<rect x="440" y="230" width="120" height="100" rx="6" fill="#fbe3c4" stroke="#222" stroke-width="2"/>
<text x="500" y="268" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">显存</text>
<text x="500" y="292" font-size="14" text-anchor="middle" fill="#222">HBM</text>
<text x="500" y="312" font-size="14" text-anchor="middle" fill="#222">（经 L2）</text>
<!-- boundary -->
<rect x="425" y="100" width="150" height="360" rx="8" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="500" y="122" font-size="14" text-anchor="middle" fill="#c0392b">“显存”这条边界</text>
<!-- SMs -->
<g>
<rect x="620" y="110" width="300" height="100" rx="6" fill="#dbe8f6" stroke="#222" stroke-width="2"/>
<text x="770" y="134" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">SM 0</text>
<rect x="636" y="146" width="100" height="50" rx="4" fill="#d4eddc" stroke="#2e8b57" stroke-width="2"/>
<text x="686" y="176" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">TMA</text>
<rect x="780" y="146" width="126" height="50" rx="4" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="843" y="176" font-size="14" text-anchor="middle" fill="#222">shared memory</text>
<rect x="620" y="230" width="300" height="100" rx="6" fill="#dbe8f6" stroke="#222" stroke-width="2"/>
<text x="770" y="254" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">SM 1</text>
<rect x="636" y="266" width="100" height="50" rx="4" fill="#d4eddc" stroke="#2e8b57" stroke-width="2"/>
<text x="686" y="296" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">TMA</text>
<rect x="780" y="266" width="126" height="50" rx="4" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="843" y="296" font-size="14" text-anchor="middle" fill="#222">shared memory</text>
<text x="770" y="364" font-size="15" text-anchor="middle" fill="#222">……（H100 共 132 个 SM，每个都有 TMA）</text>
</g>
<!-- arrows: copy engine paths -->
<line x1="192" y1="125" x2="272" y2="175" stroke="#b86a0c" stroke-width="2.5" marker-start="url(#o)" marker-end="url(#o)"/>
<text x="206" y="112" font-size="14" fill="#b86a0c">PCIe</text>
<line x1="397" y1="190" x2="444" y2="244" stroke="#b86a0c" stroke-width="2.5" marker-start="url(#o)" marker-end="url(#o)"/>
<line x1="192" y1="435" x2="272" y2="385" stroke="#b86a0c" stroke-width="2.5" marker-start="url(#o)" marker-end="url(#o)"/>
<text x="200" y="468" font-size="14" fill="#b86a0c">NVLink</text>
<line x1="397" y1="370" x2="444" y2="318" stroke="#b86a0c" stroke-width="2.5" marker-start="url(#o)" marker-end="url(#o)"/>
<!-- TMA paths -->
<line x1="562" y1="260" x2="634" y2="180" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="562" y1="290" x2="634" y2="290" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="738" y1="171" x2="778" y2="171" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="738" y1="291" x2="778" y2="291" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#g)"/>
<!-- legend -->
<line x1="280" y1="488" x2="330" y2="488" stroke="#b86a0c" stroke-width="2.5"/>
<text x="340" y="493" font-size="15" fill="#222">copy engine：跨过芯片边界，把数据搬进 / 搬出显存（cudaMemcpyAsync）</text>
<line x1="280" y1="514" x2="330" y2="514" stroke="#2e8b57" stroke-width="2.5"/>
<text x="340" y="519" font-size="15" fill="#222">TMA：芯片内部，从显存搬进 SM 的 shared memory（也可反向写回）</text>
</svg>
