<text x="235.0" y="346" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">A:C1</text>
<rect x="270" y="324" width="70" height="32" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="305.0" y="346" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">A:C2</text>
<rect x="340" y="324" width="70" height="32" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="375.0" y="346" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">A:L</text>
<rect x="410" y="324" width="70" height="32" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="445.0" y="346" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">B:C1</text>
