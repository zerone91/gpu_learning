<rect x="550" y="324" width="70" height="32" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="585.0" y="346" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">B:L</text>
<rect x="620" y="324" width="70" height="32" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="655.0" y="346" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">A:C3</text>
<rect x="690" y="324" width="70" height="32" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<rect x="705" y="330" width="40" height="20" fill="#ffffff"/>
