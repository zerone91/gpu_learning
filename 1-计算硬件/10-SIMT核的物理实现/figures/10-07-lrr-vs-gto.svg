<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="sans-serif">
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f4f4f4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern></defs>
<text x="480" y="26" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">两个 warp 跑同一段程序：轮流发射 vs 贪心-最老优先</text>
<text x="480" y="50" font-size="14" text-anchor="middle" fill="#555">程序：C1、C2 两条算术 → L 读显存（4 拍后数据回来）→ C3 用读回的数据收尾；调度器每拍发一条</text>
<text x="30" y="82" font-size="16" fill="#c0392b" font-weight="bold">轮流（LRR）：A、B 一人一拍</text>
<text x="235.0" y="106" font-size="14" text-anchor="middle" fill="#555">1</text>
<text x="305.0" y="106" font-size="14" text-anchor="middle" fill="#555">2</text>
