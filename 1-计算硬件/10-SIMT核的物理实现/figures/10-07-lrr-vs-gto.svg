<rect x="270" y="116" width="70" height="32" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="305.0" y="138" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">B:C1</text>
<rect x="340" y="116" width="70" height="32" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
