<text x="865.0" y="138" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">B:C3</text>
<text x="30" y="174" font-size="14" fill="#555">A 的读取在路上</text>
<rect x="515.0" y="162" width="280" height="14" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5"/>
