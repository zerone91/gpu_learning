<text x="30" y="290" font-size="16" fill="#2e8b57" font-weight="bold">贪心-最老优先（GTO）：A 一直发到卡住，再换 B</text>
<text x="235.0" y="314" font-size="14" text-anchor="middle" fill="#555">1</text>
<text x="305.0" y="314" font-size="14" text-anchor="middle" fill="#555">2</text>
<text x="375.0" y="314" font-size="14" text-anchor="middle" fill="#555">3</text>
<text x="445.0" y="314" font-size="14" text-anchor="middle" fill="#555">4</text>
<text x="515.0" y="314" font-size="14" text-anchor="middle" fill="#555">5</text>
<text x="585.0" y="314" font-size="14" text-anchor="middle" fill="#555">6</text>
<text x="655.0" y="314" font-size="14" text-anchor="middle" fill="#555">7</text>
<text x="725.0" y="314" font-size="14" text-anchor="middle" fill="#555">8</text>
<text x="795.0" y="314" font-size="14" text-anchor="middle" fill="#555">9</text>
<text x="865.0" y="314" font-size="14" text-anchor="middle" fill="#555">10</text>
<text x="30" y="344" font-size="15" fill="#222">发射</text>
