<rect x="775" y="330" width="40" height="20" fill="#ffffff"/>
<text x="795.0" y="346" font-size="14" text-anchor="middle" fill="#c0392b">空转</text>
<rect x="830" y="324" width="70" height="32" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="865.0" y="346" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">B:C3</text>
<text x="30" y="382" font-size="14" fill="#555">A 的读取在路上</text>
<rect x="375.0" y="370" width="280" height="14" fill="#dbe8f6" stroke="#2c6fb7" stroke-width="1.5"/>
<text x="30" y="406" font-size="14" fill="#555">B 的读取在路上</text>
<rect x="585.0" y="394" width="280" height="14" fill="#fbe3c4" stroke="#b86a0c" stroke-width="1.5"/>
<text x="30" y="436" font-size="14" fill="#222">两笔读取错开到第 3、6 拍；A 等数据的第 4～6 拍由 B 填上。A 第 7 拍完成，B 仍是第 10 拍完成。</text>
<rect x="30" y="468" width="16" height="16" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/><text x="52" y="481" font-size="14" fill="#222">warp A 的指令</text>
<rect x="180" y="468" width="16" height="16" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/><text x="202" y="481" font-size="14" fill="#222">warp B 的指令</text>
<text x="330" y="481" font-size="14" fill="#222">两种排法总时间都是 10 拍；差别在读取什么时候发出、谁先做完</text>
</svg>