<line x1="878" y1="372" x2="878" y2="378" stroke="#222" stroke-width="1.5"/>
<text x="878" y="396" font-size="14" text-anchor="middle" fill="#222">412</text>
<text x="190" y="396" font-size="14" text-anchor="end" fill="#222">拍</text>
<rect x="30" y="416" width="18" height="18" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="56" y="430" font-size="14" fill="#222">算术指令：发出后控制位要求停 4 拍，下一条才能用它的结果</text>
<rect x="30" y="442" width="18" height="18" fill="#fbe3c4" stroke="#b86a0c" stroke-width="1.5"/>
<text x="56" y="456" font-size="14" fill="#222">读显存：发出后不停，靠记分牌登记；最后那条乘法要等它回来才能发</text>
