<rect x="252" y="48" width="100" height="28" rx="4" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
<text x="302" y="67" font-size="14" text-anchor="middle" fill="#222">%f2 → R3</text>
<rect x="364" y="48" width="100" height="28" rx="4" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
<text x="414" y="67" font-size="14" text-anchor="middle" fill="#222">%f3 → R4</text>
<rect x="476" y="48" width="100" height="28" rx="4" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
<text x="526" y="67" font-size="14" text-anchor="middle" fill="#222">%f4 → R5</text>
<rect x="588" y="48" width="100" height="28" rx="4" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
<text x="638" y="67" font-size="14" text-anchor="middle" fill="#222">%f5 → R6</text>
<rect x="700" y="48" width="100" height="28" rx="4" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
<text x="750" y="67" font-size="14" text-anchor="middle" fill="#222">%f6 → R7</text>
<rect x="812" y="48" width="100" height="28" rx="4" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
<text x="862" y="67" font-size="14" text-anchor="middle" fill="#222">%rd1 → R8</text>
<text x="140" y="98" font-size="14" fill="#555">左边是 PTX 里随便编号的虚拟寄存器，右边是 ptxas 分配的物理寄存器（每线程最多 255 个）</text>
<text x="30" y="170" font-size="15" fill="#222" font-weight="bold">按 PTX 的顺序</text>
<rect x="200" y="150" width="88" height="30" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
