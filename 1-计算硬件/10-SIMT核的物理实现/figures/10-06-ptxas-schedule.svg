<line x1="614" y1="372" x2="614" y2="378" stroke="#222" stroke-width="1.5"/>
<text x="614" y="396" font-size="14" text-anchor="middle" fill="#222">400</text>
<line x1="702" y1="372" x2="702" y2="378" stroke="#222" stroke-width="1.5"/>
<text x="702" y="396" font-size="14" text-anchor="middle" fill="#222">404</text>
<line x1="790" y1="372" x2="790" y2="378" stroke="#222" stroke-width="1.5"/>
