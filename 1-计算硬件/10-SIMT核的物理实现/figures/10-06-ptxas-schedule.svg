<rect x="506" y="186" width="284" height="12" fill="#fbe3c4" stroke="#b86a0c" stroke-width="1.5"/>
<text x="398" y="216" font-size="14" fill="#b86a0c">读取在路上</text><text x="548" y="216" font-size="14" fill="#b86a0c">共约 400 拍</text>
