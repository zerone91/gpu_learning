<text x="211.0" y="264" font-size="14" text-anchor="middle" fill="#b86a0c" font-weight="bold">LDG</text>
<rect x="222" y="270" width="88" height="30" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
