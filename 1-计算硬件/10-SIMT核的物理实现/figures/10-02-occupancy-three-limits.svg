<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="alg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bbb"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9770e"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d3c98"/></marker></defs>
<text x="480.0" y="30.0" font-family="sans-serif" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">理论占用率 = 三条资源约束各算一个上限，取最紧的那条（H100，一个示例 kernel）</text>
<rect x="40.0" y="50.0" width="880.0" height="48.0" rx="4" fill="#eeeeee" stroke="none" stroke-width="0"/>
<text x="480.0" y="80.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle">示例：每个线程块 256 线程（= 8 个 warp），每线程 64 个寄存器，每块申请 100 KB shared memory</text>
<text x="330.0" y="128.0" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">0</text>
<text x="810.0" y="128.0" font-family="sans-serif" font-size="14" fill="#777" text-anchor="end">64 个 warp（上限）</text>
<line x1="330.0" y1="134.0" x2="330.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="390.0" y1="134.0" x2="390.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="450.0" y1="134.0" x2="450.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="510.0" y1="134.0" x2="510.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="570.0" y1="134.0" x2="570.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="630.0" y1="134.0" x2="630.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="690.0" y1="134.0" x2="690.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="750.0" y1="134.0" x2="750.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<line x1="810.0" y1="134.0" x2="810.0" y2="380.0" stroke="#e3e3e3" stroke-width="1"/>
<text x="40.0" y="170.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="bold">约束一：寄存器</text>
<text x="40.0" y="192.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="start">65536 ÷ (64 × 256) = 4 块</text>
<rect x="330.0" y="150.0" width="240.0" height="44.0" rx="0" fill="#dbe9f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="580.0" y="178.0" font-family="sans-serif" font-size="15" fill="#1f5fa8" text-anchor="start" font-weight="bold">32 个 warp</text>
<text x="40.0" y="244.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="bold">约束二：shared memory</text>
<text x="40.0" y="266.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="start">228 KB ÷ 100 KB = 2 块（取整）</text>
<rect x="330.0" y="224.0" width="120.0" height="44.0" rx="0" fill="#f6d5d0" stroke="#c0392b" stroke-width="2"/>
<text x="460.0" y="252.0" font-family="sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">16 个 warp</text>
<text x="40.0" y="318.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="bold">约束三：槽位</text>
<text x="40.0" y="340.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="start">每 SM ≤64 warp：64 ÷ 8 = 8 块</text>
<rect x="330.0" y="298.0" width="480.0" height="44.0" rx="0" fill="#eeeeee" stroke="#777" stroke-width="2"/>
<text x="820.0" y="326.0" font-family="sans-serif" font-size="15" fill="#777" text-anchor="start" font-weight="bold">64 个 warp</text>
<line x1="450.0" y1="140.0" x2="450.0" y2="384.0" stroke="#c0392b" stroke-width="3" stroke-dasharray="8,5"/>
<text x="456.0" y="398.0" font-family="sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">取最小值：16 个 warp</text>
<rect x="40.0" y="412.0" width="880.0" height="44.0" rx="4" fill="#f6d5d0" stroke="none" stroke-width="0"/>
<text x="480.0" y="440.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle">理论占用率 = 16 ÷ 64 = 25%。此时寄存器还够住 32 个 warp，但 shared memory 先卡住了</text>
</svg>
