<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="sans-serif">
<rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">每条约束各自允许驻留多少 warp？最短的那根决定占用率（H100，每块 256 线程）</text>
<line x1="524.4" y1="78" x2="524.4" y2="508" stroke="#555" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="30" y="70" font-size="16" fill="#222" font-weight="bold">例 1 · y = 2x：资源用量很轻</text>
<text x="218" y="101" font-size="15" text-anchor="end" fill="#222">寄存器</text>
<text x="218" y="119" font-size="14" text-anchor="end" fill="#555">每线程 20 个</text>
<rect x="230" y="90" width="441.59999999999997" height="26" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="681.5999999999999" y="108" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#222">65536 ÷ (20×256) = 12 块 = 96 warp</text>
<text x="218" y="145" font-size="15" text-anchor="end" fill="#222">shared memory</text>
<text x="218" y="163" font-size="14" text-anchor="end" fill="#555">每块 0 KB</text>
<rect x="230" y="134" width="588.8" height="26" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="240" y="152" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#222">不用 shared，这条不设限</text>
<text x="218" y="189" font-size="15" text-anchor="end" fill="#222">线程槽位</text>
<text x="218" y="207" font-size="14" text-anchor="end" fill="#555">每 SM 2048 线程</text>
<rect x="230" y="178" width="294.4" height="26" fill="#f5c6c0" stroke="#c0392b" stroke-width="2.5"/>
<text x="534.4" y="196" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#c0392b" font-weight="bold">2048 ÷ 256 = 8 块 = 64 warp ← 最紧</text>
<text x="218" y="233" font-size="15" text-anchor="end" fill="#222">块槽位</text>
<text x="218" y="251" font-size="14" text-anchor="end" fill="#555">每 SM 32 块</text>
<rect x="230" y="222" width="588.8" height="26" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<path d="M808.8,218 l6,8 l-6,8 l6,8 l-6,8 l6,6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="240" y="240" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#222">32 块 = 256 warp（超出画幅）</text>
<text x="230" y="274" font-size="15" fill="#c0392b" font-weight="bold">理论占用率 = 64 ÷ 64 = 100%</text>
<text x="30" y="316" font-size="16" fill="#222" font-weight="bold">例 2 · FP32 分块 GEMM：每线程 64 个累加器</text>
<text x="218" y="347" font-size="15" text-anchor="end" fill="#222">寄存器</text>
<text x="218" y="365" font-size="14" text-anchor="end" fill="#555">每线程 128 个</text>
<rect x="230" y="336" width="73.6" height="26" fill="#f5c6c0" stroke="#c0392b" stroke-width="2.5"/>
<text x="313.6" y="354" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#c0392b" font-weight="bold">65536 ÷ (128×256) = 2 块 = 16 warp ← 最紧</text>
<text x="218" y="391" font-size="15" text-anchor="end" fill="#222">shared memory</text>
<text x="218" y="409" font-size="14" text-anchor="end" fill="#555">每块 16 KB</text>
<rect x="230" y="380" width="515.1999999999999" height="26" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="755.1999999999999" y="398" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#222">228 ÷ 16 = 14 块 = 112 warp</text>
<text x="218" y="435" font-size="15" text-anchor="end" fill="#222">线程槽位</text>
<text x="218" y="453" font-size="14" text-anchor="end" fill="#555">每 SM 2048 线程</text>
<rect x="230" y="424" width="294.4" height="26" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="534.4" y="442" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#222">8 块 = 64 warp</text>
<text x="218" y="479" font-size="15" text-anchor="end" fill="#222">块槽位</text>
<text x="218" y="497" font-size="14" text-anchor="end" fill="#555">每 SM 32 块</text>
<rect x="230" y="468" width="588.8" height="26" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<path d="M808.8,464 l6,8 l-6,8 l6,8 l-6,8 l6,6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="240" y="486" font-size="14" stroke="#fff" stroke-width="4" paint-order="stroke" fill="#222">32 块 = 256 warp（超出画幅）</text>
<text x="230" y="520" font-size="15" fill="#c0392b" font-weight="bold">理论占用率 = 16 ÷ 64 = 25%</text>
<line x1="230" y1="546" x2="818.8" y2="546" stroke="#222" stroke-width="1.5"/>
<line x1="230.0" y1="546" x2="230.0" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="230.0" y="568" font-size="14" text-anchor="middle" fill="#222">0</text>
<line x1="303.6" y1="546" x2="303.6" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="303.6" y="568" font-size="14" text-anchor="middle" fill="#222">16</text>
<line x1="377.2" y1="546" x2="377.2" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="377.2" y="568" font-size="14" text-anchor="middle" fill="#222">32</text>
<line x1="450.79999999999995" y1="546" x2="450.79999999999995" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="450.79999999999995" y="568" font-size="14" text-anchor="middle" fill="#222">48</text>
<line x1="524.4" y1="546" x2="524.4" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="524.4" y="568" font-size="14" text-anchor="middle" fill="#222">64</text>
<line x1="598.0" y1="546" x2="598.0" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="598.0" y="568" font-size="14" text-anchor="middle" fill="#222">80</text>
<line x1="671.5999999999999" y1="546" x2="671.5999999999999" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="671.5999999999999" y="568" font-size="14" text-anchor="middle" fill="#222">96</text>
<line x1="745.1999999999999" y1="546" x2="745.1999999999999" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="745.1999999999999" y="568" font-size="14" text-anchor="middle" fill="#222">112</text>
<line x1="818.8" y1="546" x2="818.8" y2="552" stroke="#222" stroke-width="1.5"/>
<text x="818.8" y="568" font-size="14" text-anchor="middle" fill="#222">128</text>
<text x="218" y="568" font-size="14" text-anchor="end" fill="#555">可驻留 warp 数</text>
<text x="524.4" y="590" font-size="14" text-anchor="middle" fill="#555">虚线：H100 每 SM 最多 64 个 warp</text>
</svg>