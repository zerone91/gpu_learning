<text x="567.4" y="390.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">矩阵乘 块2</text>
<rect x="634.0" y="368" width="44.40000000000009" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>
<text x="656.2" y="390.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal"></text>
<rect x="678.4000000000001" y="368" width="88.79999999999995" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
<text x="722.8000000000001" y="390.0" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">空等</text>
<rect x="367.6" y="424" width="88.80000000000001" height="34" fill="#d6e4f5" stroke="#2a5d9c" stroke-width="1.5"/>
<text x="412.0" y="446.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">softmax 块1</text>
<rect x="678.4000000000001" y="424" width="88.79999999999995" height="34" fill="#d6e4f5" stroke="#2a5d9c" stroke-width="1.5"/>
<text x="722.8000000000001" y="446.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">softmax 块2</text>
<rect x="323.20000000000005" y="470" width="44.39999999999998" height="24" fill="#fff3d6" stroke="#b07d00" stroke-width="1.5"/>
<text x="345.40000000000003" y="487.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">→</text>
<rect x="456.40000000000003" y="470" width="44.39999999999998" height="24" fill="#fff3d6" stroke="#b07d00" stroke-width="1.5"/>
<text x="478.6" y="487.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">←</text>
<rect x="634.0" y="470" width="44.40000000000009" height="24" fill="#fff3d6" stroke="#b07d00" stroke-width="1.5"/>
<text x="656.2" y="487.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">→</text>
<text x="794.0" y="390" font-size="14" fill="#2a5d9c" text-anchor="start" font-weight="normal">同样四块，</text>
<text x="794.0" y="410" font-size="14" fill="#2a5d9c" text-anchor="start" font-weight="normal">只算完两块</text>
</g></svg>