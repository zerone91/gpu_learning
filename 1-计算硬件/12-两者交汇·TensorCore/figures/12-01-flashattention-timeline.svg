<text x="552.6" y="180.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">矩阵乘 块3</text>
<rect x="634.0" y="158" width="133.20000000000005" height="34" fill="#f6c1b6" stroke="#c23b22" stroke-width="1.5"/>
<text x="700.6" y="180.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">矩阵乘 块4</text>
<rect x="323.20000000000005" y="214" width="88.79999999999995" height="34" fill="#d6e4f5" stroke="#2a5d9c" stroke-width="1.5"/>
<text x="367.6" y="236.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">softmax 块1</text>
<rect x="471.2" y="214" width="88.80000000000001" height="34" fill="#d6e4f5" stroke="#2a5d9c" stroke-width="1.5"/>
<text x="515.6" y="236.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">softmax 块2</text>
<rect x="619.2" y="214" width="88.79999999999995" height="34" fill="#d6e4f5" stroke="#2a5d9c" stroke-width="1.5"/>
<text x="663.6" y="236.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">softmax 块3</text>
<text x="794.0" y="180" font-size="14" fill="#c23b22" text-anchor="start" font-weight="normal">一直在算</text>
<text x="190" y="276" font-size="14" fill="#333" text-anchor="start" font-weight="normal">矩阵乘块 2 在算的同时，块 1 的 softmax 也在算：两条管道并行，中间值一直留在寄存器里。</text>
<text x="30" y="330" font-size="16" fill="#2a5d9c" text-anchor="start" font-weight="bold">独立大阵列：矩阵和向量是两个单元</text>
<text x="30" y="354" font-size="14" fill="#333" text-anchor="start" font-weight="normal">每块结果要倒手一次</text>
<text x="30" y="386" font-size="14" fill="#111" text-anchor="start" font-weight="normal">大阵列</text>
<text x="30" y="442" font-size="14" fill="#111" text-anchor="start" font-weight="normal">向量单元</text>
<text x="30" y="488" font-size="14" fill="#111" text-anchor="start" font-weight="normal">倒手（搬中间值）</text>
<rect x="190.0" y="368" width="133.20000000000005" height="34" fill="#f6c1b6" stroke="#c23b22" stroke-width="1.5"/>
<text x="256.6" y="390.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">矩阵乘 块1</text>
