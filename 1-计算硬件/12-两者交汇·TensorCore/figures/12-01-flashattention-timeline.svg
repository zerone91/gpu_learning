<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
<g font-family="sans-serif">
<text x="30" y="34" font-size="20" fill="#111" text-anchor="start" font-weight="bold">矩阵乘和 softmax 逐块交替时，两种硬件的时间线（示意）</text>
<text x="30" y="58" font-size="15" fill="#333" text-anchor="start" font-weight="normal">横轴是时间。softmax：把一行数变成一组和为 1 的概率，逐元素算指数再归一化，不是矩阵乘。</text>
<text x="30" y="100" font-size="16" fill="#c23b22" text-anchor="start" font-weight="bold">GPU：矩阵引擎在 SM 里</text>
<text x="30" y="124" font-size="14" fill="#333" text-anchor="start" font-weight="normal">两类指令在同一个 kernel 里</text>
<text x="30" y="144" font-size="14" fill="#333" text-anchor="start" font-weight="normal">交错发射，中间值不出 SM</text>
<text x="30" y="176" font-size="14" fill="#111" text-anchor="start" font-weight="normal">矩阵管道</text>
<text x="30" y="232" font-size="14" fill="#111" text-anchor="start" font-weight="normal">普通算术管道</text>
<rect x="190.0" y="158" width="133.20000000000005" height="34" fill="#f6c1b6" stroke="#c23b22" stroke-width="1.5"/>
<text x="256.6" y="180.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">矩阵乘 块1</text>
<rect x="338.0" y="158" width="133.2" height="34" fill="#f6c1b6" stroke="#c23b22" stroke-width="1.5"/>
<text x="404.6" y="180.0" font-size="13" fill="#111" text-anchor="middle" font-weight="normal">矩阵乘 块2</text>
