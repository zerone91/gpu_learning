<text x="42" y="298" font-size="14" fill="#111" text-anchor="start" font-weight="normal">warp 的寄存器里</text>
<text x="42" y="320" font-size="14" fill="#111" text-anchor="start" font-weight="normal">（就是 fragment）</text>
<rect x="30" y="368" width="232" height="168" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="42" y="394" font-size="14" fill="#111" text-anchor="start" font-weight="normal">1 个子分区</text>
<text x="42" y="416" font-size="14" fill="#111" text-anchor="start" font-weight="normal">（SM 的四分之一）</text>
