<text x="398.0" y="101" font-size="16" fill="#555" text-anchor="middle" font-weight="bold">Ampere（2020）</text>
<rect x="282" y="122" width="232" height="118" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="294" y="148" font-size="14" fill="#111" text-anchor="start" font-weight="normal">仍是 1 个 warp</text>
<text x="294" y="170" font-size="14" fill="#111" text-anchor="start" font-weight="normal">一起发、原地等</text>
<text x="294" y="192" font-size="14" fill="#111" text-anchor="start" font-weight="normal">（块形状可选更多）</text>
<text x="294" y="228" font-size="14" fill="#555" text-anchor="start" font-weight="normal">发起者：32 个线程</text>
