<text x="546" y="192" font-size="14" fill="#111" text-anchor="start" font-weight="normal">发完先干别的</text>
<text x="546" y="228" font-size="14" fill="#c23b22" text-anchor="start" font-weight="normal">发起者：128 个线程</text>
<rect x="534" y="250" width="232" height="108" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="546" y="276" font-size="14" fill="#111" text-anchor="start" font-weight="normal">操作数可直接读</text>
<text x="546" y="298" font-size="14" fill="#111" text-anchor="start" font-weight="normal">共享内存；累加器</text>
<text x="546" y="320" font-size="14" fill="#111" text-anchor="start" font-weight="normal">仍占着寄存器</text>
