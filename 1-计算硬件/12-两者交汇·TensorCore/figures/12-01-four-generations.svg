<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560">
<rect x="0" y="0" width="1020" height="560" fill="#ffffff"/>
<g font-family="sans-serif">
<text x="30" y="34" font-size="20" fill="#111" text-anchor="start" font-weight="bold">四代 Tensor Core：谁发起、操作数住哪、能叫上几个 SM</text>
<text x="30" y="58" font-size="15" fill="#333" text-anchor="start" font-weight="normal">每一代都在给矩阵引擎松绑：发起的人越来越少，操作数越搬越近，协作范围越来越大</text>
<rect x="30" y="78" width="232" height="34" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
<text x="146.0" y="101" font-size="16" fill="#555" text-anchor="middle" font-weight="bold">Volta（2017）</text>
<rect x="30" y="122" width="232" height="118" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="42" y="148" font-size="14" fill="#111" text-anchor="start" font-weight="normal">1 个 warp 的 32 个</text>
<text x="42" y="170" font-size="14" fill="#111" text-anchor="start" font-weight="normal">线程一起发出，</text>
<text x="42" y="192" font-size="14" fill="#111" text-anchor="start" font-weight="normal">发完原地等结果</text>
<text x="42" y="228" font-size="14" fill="#555" text-anchor="start" font-weight="normal">发起者：32 个线程</text>
<rect x="30" y="250" width="232" height="108" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
