<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="sans-serif">
<rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
<text x="490" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">NRZ 与 PAM4：每秒发同样多个符号，PAM4 每个符号多带 1 位，代价是眼睛变小</text>
<text x="30" y="68" font-size="15" font-weight="bold" fill="#111">① NRZ：两个电压档，一个符号 = 1 位</text>
<text x="100" y="100" font-size="14" text-anchor="end" fill="#111">高 = 1</text>
<text x="100" y="180" font-size="14" text-anchor="end" fill="#111">低 = 0</text>
<line x1="110" y1="87" x2="110" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="170" y1="87" x2="170" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="230" y1="87" x2="230" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="290" y1="87" x2="290" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="350" y1="87" x2="350" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="410" y1="87" x2="410" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="470" y1="87" x2="470" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="530" y1="87" x2="530" y2="183" stroke="#ddd" stroke-width="1"/>
<line x1="590" y1="87" x2="590" y2="183" stroke="#ddd" stroke-width="1"/>
<polyline points="110,95 170,95 170,175 230,175 230,95 290,95 290,95 350,95 350,175 410,175 410,95 470,95 470,175 530,175 530,175 590,175" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
<text x="140.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">1</text>
<text x="200.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">0</text>
<text x="260.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">1</text>
<text x="320.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">1</text>
<text x="380.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">0</text>
<text x="440.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">1</text>
<text x="500.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">0</text>
<text x="560.0" y="205" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">0</text>
<text x="602" y="125" font-size="14" fill="#111">8 个符号</text>
<text x="602" y="145" font-size="14" fill="#1f5fa8">= 8 位</text>
<text x="30" y="258" font-size="15" font-weight="bold" fill="#111">② PAM4：四个电压档，一个符号 = 2 位（同样的时间里 8 个符号）</text>
<text x="100" y="290.0" font-size="14" text-anchor="end" fill="#111">10</text>
<line x1="110" y1="285.0" x2="590" y2="285.0" stroke="#eee" stroke-width="1"/>
<text x="100" y="326.6666666666667" font-size="14" text-anchor="end" fill="#111">11</text>
<line x1="110" y1="321.6666666666667" x2="590" y2="321.6666666666667" stroke="#eee" stroke-width="1"/>
<text x="100" y="363.3333333333333" font-size="14" text-anchor="end" fill="#111">01</text>
<line x1="110" y1="358.3333333333333" x2="590" y2="358.3333333333333" stroke="#eee" stroke-width="1"/>
<text x="100" y="400.0" font-size="14" text-anchor="end" fill="#111">00</text>
<line x1="110" y1="395.0" x2="590" y2="395.0" stroke="#eee" stroke-width="1"/>
<line x1="110" y1="277" x2="110" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="170" y1="277" x2="170" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="230" y1="277" x2="230" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="290" y1="277" x2="290" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="350" y1="277" x2="350" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="410" y1="277" x2="410" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="470" y1="277" x2="470" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="530" y1="277" x2="530" y2="403" stroke="#ddd" stroke-width="1"/>
<line x1="590" y1="277" x2="590" y2="403" stroke="#ddd" stroke-width="1"/>
<polyline points="110,285.0 170,285.0 170,321.6666666666667 230,321.6666666666667 230,358.3333333333333 290,358.3333333333333 290,395.0 350,395.0 350,285.0 410,285.0 410,358.3333333333333 470,358.3333333333333 470,321.6666666666667 530,321.6666666666667 530,395.0 590,395.0" fill="none" stroke="#b5451b" stroke-width="2.5"/>
<text x="140.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">10</text>
<text x="200.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">11</text>
<text x="260.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">01</text>
<text x="320.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">00</text>
<text x="380.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">10</text>
<text x="440.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">01</text>
<text x="500.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">11</text>
<text x="560.0" y="425" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold">00</text>
<text x="602" y="325" font-size="14" fill="#111">8 个符号</text>
<text x="602" y="345" font-size="14" fill="#b5451b">= 16 位</text>
<text x="30" y="457" font-size="14" fill="#111">档位编号用格雷码（00、01、11、10）：相邻两档只差 1 位，读错一档只错 1 位。</text>
<line x1="680" y1="50" x2="680" y2="470" stroke="#ccc" stroke-width="1.5"/>
<text x="830" y="68" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">③ 眼图（示意）</text>
<rect x="740" y="85" width="180" height="100" fill="#dfe8f5" stroke="#1f5fa8" stroke-width="1.2"/>
<path d="M755.0,135.0 Q830,59.0 905.0,135.0 Q830,211.0 755.0,135.0 Z" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
<text x="830" y="140.0" font-size="14" text-anchor="middle" fill="#1f5fa8">一只大眼</text>
<rect x="740" y="275" width="180" height="130" fill="#f7ddd0" stroke="#b5451b" stroke-width="1.2"/>
<path d="M755.0,376.66666666666663 Q830,341.83333333333326 905.0,376.66666666666663 Q830,411.5 755.0,376.66666666666663 Z" fill="#fff" stroke="#b5451b" stroke-width="2"/>
<path d="M755.0,340.0 Q830,305.1666666666667 905.0,340.0 Q830,374.8333333333333 755.0,340.0 Z" fill="#fff" stroke="#b5451b" stroke-width="2"/>
<path d="M755.0,303.33333333333337 Q830,268.5 905.0,303.33333333333337 Q830,338.16666666666674 755.0,303.33333333333337 Z" fill="#fff" stroke="#b5451b" stroke-width="2"/>
<text x="830" y="425" font-size="14" text-anchor="middle" fill="#b5451b">三只小眼，每只高度约 1/3</text>
<text x="830" y="447" font-size="14" text-anchor="middle" fill="#111">同样的噪声更容易判错</text>
<text x="830" y="467" font-size="14" text-anchor="middle" fill="#111">所以 PAM4 链路要配 FEC</text>
<text x="490" y="508" font-size="14" text-anchor="middle" fill="#555">眼图：把很多个符号的波形按符号边界叠在一起，中间留出的空白就是接收端可以放心判决的区域。</text>
<text x="490" y="528" font-size="14" text-anchor="middle" fill="#555">符号率（每秒多少个符号，单位 GBd）相同，PAM4 的比特率是 NRZ 的两倍</text>
</svg>