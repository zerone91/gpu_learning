<text x="345.0" y="341.9" text-anchor="middle" fill="#222222" font-size="14" >参数更新</text>
<line x1="300.0" y1="289.0" x2="465.0" y2="317.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420.0" y="319.0" width="90.0" height="36.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="1.5" />
<text x="465.0" y="341.9" text-anchor="middle" fill="#222222" font-size="14" >参数更新</text>
<text x="560.0" y="145.0" text-anchor="start" fill="#222222" font-size="14" >卡 2 这一步算错了（比如一个乘法结果</text>
<text x="560.0" y="167.0" text-anchor="start" fill="#222222" font-size="14" >错了一位），但没有任何报错。</text>
<text x="560.0" y="205.0" text-anchor="start" fill="#222222" font-size="14" >all-reduce 把 4 张卡的梯度加起来平均，</text>
<text x="560.0" y="227.0" text-anchor="start" fill="#222222" font-size="14" >错误的那一份也被加了进去。</text>
<text x="560.0" y="265.0" text-anchor="start" fill="#c0392b" font-size="14" >结果：4 个副本拿到同一个带错的平均梯度，</text>
<text x="560.0" y="287.0" text-anchor="start" fill="#c0392b" font-size="14" >用它更新参数。从这一步起，</text>
<text x="560.0" y="309.0" text-anchor="start" fill="#c0392b" font-size="14" >每张卡上的模型都和“正确的模型”不一样了。</text>
<text x="20.0" y="440.0" text-anchor="start" fill="#222222" font-size="15" font-weight="bold" >② 之后几天</text>
<line x1="70.0" y1="480.0" x2="898.0" y2="480.0" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="70.0" y1="475.0" x2="70.0" y2="485.0" stroke="#444" stroke-width="1.5"/>
<text x="70.0" y="504.0" text-anchor="middle" fill="#222222" font-size="14" >第 0 天</text>
<line x1="250.0" y1="475.0" x2="250.0" y2="485.0" stroke="#444" stroke-width="1.5"/>
<text x="250.0" y="504.0" text-anchor="middle" fill="#222222" font-size="14" >第 1 天</text>
<line x1="430.0" y1="475.0" x2="430.0" y2="485.0" stroke="#444" stroke-width="1.5"/>
<text x="430.0" y="504.0" text-anchor="middle" fill="#222222" font-size="14" >第 2 天</text>
<line x1="610.0" y1="475.0" x2="610.0" y2="485.0" stroke="#444" stroke-width="1.5"/>
<text x="610.0" y="504.0" text-anchor="middle" fill="#222222" font-size="14" >第 3 天</text>
<line x1="790.0" y1="475.0" x2="790.0" y2="485.0" stroke="#444" stroke-width="1.5"/>
<text x="790.0" y="504.0" text-anchor="middle" fill="#222222" font-size="14" >第 4 天</text>
<line x1="304.0" y1="420.0" x2="304.0" y2="485.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<text x="304.0" y="414.0" text-anchor="middle" fill="#c0392b" font-size="14" >SDC 发生（当时没人知道）</text>
<line x1="790.0" y1="420.0" x2="790.0" y2="485.0" stroke="#222222" stroke-width="2" stroke-dasharray="5,3"/>
<text x="790.0" y="414.0" text-anchor="middle" fill="#222222" font-size="14" >发现 loss 不对劲</text>
<rect x="62.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#d4ecd4" stroke="#2e7d32" stroke-width="2" />
<rect x="152.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#d4ecd4" stroke="#2e7d32" stroke-width="2" />
<rect x="242.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#d4ecd4" stroke="#2e7d32" stroke-width="2" />
<rect x="332.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="2" />
<rect x="422.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="2" />
<rect x="512.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="2" />
<rect x="602.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="2" />
<rect x="692.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="2" />
<rect x="782.0" y="450.0" width="16.0" height="16.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="2" />
<text x="70.0" y="540.0" text-anchor="start" fill="#222222" font-size="14" >方块是每半天一个检查点：绿色是干净的，红色是 SDC 之后存的，已经带着错。</text>
<text x="70.0" y="564.0" text-anchor="start" fill="#222222" font-size="14" >难点：发现时并不知道错误是哪一天混进来的，也就不知道该退回哪个绿色存档，</text>
<text x="70.0" y="588.0" text-anchor="start" fill="#222222" font-size="14" >只能靠精确重放逐步比对，找到第一次算错的那一步和那张卡。</text>
</svg>
