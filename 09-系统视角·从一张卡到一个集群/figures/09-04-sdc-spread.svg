<text x="225.0" y="197.9" text-anchor="middle" fill="#222222" font-size="14" >梯度 g1</text>
<line x1="225.0" y1="213.0" x2="300.0" y2="245.0" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="300.0" y="120.0" width="90.0" height="40.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="1.5" />
<text x="345.0" y="144.9" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" >卡 2</text>
<rect x="300.0" y="175.0" width="90.0" height="36.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="1.5" />
<text x="345.0" y="197.9" text-anchor="middle" fill="#222222" font-size="14" >梯度 g2 ✗</text>
<line x1="345.0" y1="213.0" x2="300.0" y2="245.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="420.0" y="120.0" width="90.0" height="40.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="465.0" y="144.9" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" >卡 3</text>
<rect x="420.0" y="175.0" width="90.0" height="36.0" rx="0" fill="#fff" stroke="#1f5fa8" stroke-width="1.5" />
<text x="465.0" y="197.9" text-anchor="middle" fill="#222222" font-size="14" >梯度 g3</text>
<line x1="465.0" y1="213.0" x2="300.0" y2="245.0" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="210.0" y="247.0" width="180.0" height="40.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="300.0" y="271.9" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" >all-reduce 求平均</text>
<line x1="300.0" y1="289.0" x2="105.0" y2="317.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60.0" y="319.0" width="90.0" height="36.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="1.5" />
<text x="105.0" y="341.9" text-anchor="middle" fill="#222222" font-size="14" >参数更新</text>
<line x1="300.0" y1="289.0" x2="225.0" y2="317.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<rect x="180.0" y="319.0" width="90.0" height="36.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="1.5" />
<text x="225.0" y="341.9" text-anchor="middle" fill="#222222" font-size="14" >参数更新</text>
<line x1="300.0" y1="289.0" x2="345.0" y2="317.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
