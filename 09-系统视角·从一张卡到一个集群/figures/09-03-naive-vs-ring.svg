<text x="342.8" y="157.8" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" >7</text>
<text x="410.0" y="214.0" text-anchor="middle" fill="#2e7d32" font-size="14" >8 条链路</text>
<text x="410.0" y="234.0" text-anchor="middle" fill="#2e7d32" font-size="14" >同时在传</text>
<text x="410.0" y="362.0" text-anchor="middle" fill="#2e7d32" font-size="14" >每步每卡只发 S/8，</text>
<text x="410.0" y="382.0" text-anchor="middle" fill="#2e7d32" font-size="14" >共 14 步：2 × 7 × S/8 = 1.75S</text>
<text x="410.0" y="402.0" text-anchor="middle" fill="#2e7d32" font-size="14" >N 再大也不超过 2S</text>
