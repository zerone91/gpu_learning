<text x="20.0" y="455.0" text-anchor="start" fill="#222222" font-size="14" >代价：环形要走 2(N−1) 步。每步都有固定的启动延迟，所以卡很多、</text>
<text x="20.0" y="477.0" text-anchor="start" fill="#222222" font-size="14" >消息又很小时，延迟项会占上风（1024 卡是 2046 步）。</text>
