<text x="150.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" >0</text>
<text x="150.0" y="362.0" text-anchor="middle" fill="#c0392b" font-size="14" >卡 0 收 7S、再发 7S</text>
<text x="150.0" y="382.0" text-anchor="middle" fill="#c0392b" font-size="14" >N 张卡时是 (N−1)S，</text>
<text x="150.0" y="402.0" text-anchor="middle" fill="#c0392b" font-size="14" >随 N 线性增长</text>
<text x="410.0" y="100.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold" >环形：每人只传给右边邻居</text>
