<text x="20.0" y="32.0" text-anchor="start" fill="#222222" font-size="19" font-weight="bold" >为什么环形算法的每卡流量不随卡数增长</text>
<text x="20.0" y="58.0" text-anchor="start" fill="#555" font-size="14" >S 是每张卡要参与归约的数据量；左边以 8 张卡为例画流量路径，右边是每张（最忙的）卡要发送的字节数随卡数的变化</text>
<text x="150.0" y="100.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold" >朴素：都交给卡 0 汇总</text>
