<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f4f4f4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern></defs>
<text x="20.0" y="32.0" text-anchor="start" fill="#222222" font-size="19" font-weight="bold" >算法级校验（ABFT）：给矩阵乘多带一行一列“和”，算完一对就知道错没错、错在哪</text>
<text x="20.0" y="58.0" text-anchor="start" fill="#555" font-size="15" >2×2 的小例子；灰色格是额外加的校验行/列，白色格是原来的数据</text>
<text x="90.0" y="98.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold" >A（加一行：各列之和）</text>
<rect x="40.0" y="110.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="65.0" y="141.0" text-anchor="middle" fill="#222222" font-size="16" >1</text>
<rect x="90.0" y="110.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="115.0" y="141.0" text-anchor="middle" fill="#222222" font-size="16" >2</text>
<rect x="40.0" y="160.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="65.0" y="191.0" text-anchor="middle" fill="#222222" font-size="16" >3</text>
<rect x="90.0" y="160.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="115.0" y="191.0" text-anchor="middle" fill="#222222" font-size="16" >4</text>
<rect x="40.0" y="210.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="65.0" y="241.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >4</text>
<rect x="90.0" y="210.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="115.0" y="241.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >6</text>
<text x="160.0" y="190.0" text-anchor="middle" fill="#222222" font-size="22" >×</text>
<text x="265.0" y="123.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold" >B（加一列：各行之和）</text>
<rect x="190.0" y="135.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="215.0" y="166.0" text-anchor="middle" fill="#222222" font-size="16" >5</text>
<rect x="240.0" y="135.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="265.0" y="166.0" text-anchor="middle" fill="#222222" font-size="16" >6</text>
<rect x="290.0" y="135.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="315.0" y="166.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >11</text>
<rect x="190.0" y="185.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="215.0" y="216.0" text-anchor="middle" fill="#222222" font-size="16" >7</text>
<rect x="240.0" y="185.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="265.0" y="216.0" text-anchor="middle" fill="#222222" font-size="16" >8</text>
<rect x="290.0" y="185.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="315.0" y="216.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >15</text>
<text x="365.0" y="190.0" text-anchor="middle" fill="#222222" font-size="22" >=</text>
<text x="475.0" y="98.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold" >算出的结果（正确时）</text>
<rect x="400.0" y="110.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="425.0" y="141.0" text-anchor="middle" fill="#222222" font-size="16" >19</text>
<rect x="450.0" y="110.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="475.0" y="141.0" text-anchor="middle" fill="#222222" font-size="16" >22</text>
<rect x="500.0" y="110.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="525.0" y="141.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >41</text>
<rect x="400.0" y="160.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="425.0" y="191.0" text-anchor="middle" fill="#222222" font-size="16" >43</text>
<rect x="450.0" y="160.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="475.0" y="191.0" text-anchor="middle" fill="#222222" font-size="16" >50</text>
<rect x="500.0" y="160.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="525.0" y="191.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >93</text>
<rect x="400.0" y="210.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="425.0" y="241.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >62</text>
<rect x="450.0" y="210.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="475.0" y="241.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >72</text>
<rect x="500.0" y="210.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="525.0" y="241.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >134</text>
<text x="400.0" y="285.0" text-anchor="start" fill="#222222" font-size="14" >白色 2×2 是真正要的 A·B。</text>
<text x="400.0" y="307.0" text-anchor="start" fill="#222222" font-size="14" >灰色最后一行 62、72 恰好是上面两行对应列之和（19+43、22+50），</text>
<text x="400.0" y="329.0" text-anchor="start" fill="#222222" font-size="14" >灰色最后一列 41、93 恰好是左边两列对应行之和（19+22、43+50）。</text>
<text x="400.0" y="351.0" text-anchor="start" fill="#555" font-size="14" >多算的只有一行一列，矩阵越大，这部分占比越小。</text>
<text x="20.0" y="370.0" text-anchor="start" fill="#222222" font-size="16" font-weight="bold" >如果某个数算错了：50 变成 51</text>
<rect x="40.0" y="400.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="65.0" y="431.0" text-anchor="middle" fill="#222222" font-size="16" >19</text>
<rect x="90.0" y="400.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="115.0" y="431.0" text-anchor="middle" fill="#222222" font-size="16" >22</text>
<rect x="140.0" y="400.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="165.0" y="431.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >41</text>
<rect x="40.0" y="450.0" width="50.0" height="50.0" rx="0" fill="#fff" stroke="#444" stroke-width="1.5" />
<text x="65.0" y="481.0" text-anchor="middle" fill="#222222" font-size="16" >43</text>
<rect x="90.0" y="450.0" width="50.0" height="50.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="1.5" />
<text x="115.0" y="481.0" text-anchor="middle" fill="#222222" font-size="16" >51</text>
<rect x="140.0" y="450.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="165.0" y="481.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >93</text>
<rect x="40.0" y="500.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="65.0" y="531.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >62</text>
<rect x="90.0" y="500.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="115.0" y="531.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >72</text>
<rect x="140.0" y="500.0" width="50.0" height="50.0" rx="0" fill="#e8e8e8" stroke="#444" stroke-width="1.5" />
<text x="165.0" y="531.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >134</text>
<text x="210.0" y="435.0" text-anchor="start" fill="#c0392b" font-size="15" >按行核对：43 + 51 = 94 ≠ 93</text>
<text x="210.0" y="460.0" text-anchor="start" fill="#c0392b" font-size="15" >  → 第 2 行有错</text>
<text x="210.0" y="495.0" text-anchor="start" fill="#c0392b" font-size="15" >按列核对：22 + 51 = 73 ≠ 72</text>
<text x="210.0" y="520.0" text-anchor="start" fill="#c0392b" font-size="15" >  → 第 2 列有错</text>
<text x="520.0" y="435.0" text-anchor="start" fill="#222222" font-size="15" >两个“对不上”的交叉点就是出错的格子。</text>
<text x="520.0" y="460.0" text-anchor="start" fill="#222222" font-size="15" >其余行列都对得上，说明别处没错。</text>
<text x="520.0" y="495.0" text-anchor="start" fill="#555" font-size="14" >局限：只对矩阵乘这类有“和可以</text>
<text x="520.0" y="517.0" text-anchor="start" fill="#555" font-size="14" >提前算好”性质的运算管用。</text>
</svg>
