<text x="480" y="30" font-size="19" text-anchor="middle" fill="#222222" font-weight="bold" >Swizzle&lt;B,M,S&gt; 在字节偏移的二进制位上做什么：把行号的几位异或进 chunk 列</text>
<text x="40" y="70" font-size="16" text-anchor="start" fill="#222222" font-weight="bold" >A. Swizzle&lt;3,4,3&gt;（128B 模式），用正文的例子走一遍：第 5 行第 2 个 chunk</text>
