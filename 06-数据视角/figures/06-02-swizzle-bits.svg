<text x="484.0" y="309" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="normal" >2 XOR 5 = 7 → 111</text>
<text x="785" y="145" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" >M = 4：最低 4 位不动</text>
<text x="785" y="165" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" >（16 字节一个 chunk）</text>
<text x="785" y="185" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" >B = 3：取 3 位行号</text>
<text x="785" y="205" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" >（8 种错位）</text>
<text x="785" y="225" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" >S = 3：行号位在 chunk</text>
<text x="785" y="245" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" >列位上方 3 位处</text>
<text x="785" y="265" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" >（行宽 2^7 = 128 字节）</text>
<text x="40" y="345" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >验算：5 × 128 + 7 × 16 = 640 + 112 = 752。行号不变，只有 chunk 列从 2 换到了 7。</text>
<line x1="30" y1="375" x2="930" y2="375" stroke="#cccccc" stroke-width="1"/>
<text x="40" y="405" font-size="16" text-anchor="start" fill="#222222" font-weight="bold" >B. 行宽仍是 128 字节，却配了 64B 模式 Swizzle&lt;2,4,3&gt;：只取 2 位行号</text>
