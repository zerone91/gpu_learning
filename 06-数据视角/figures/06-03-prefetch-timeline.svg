<text x="30" y="180" font-size="15" text-anchor="start" fill="#c0392b" font-weight="normal" >每步 340 ms，GPU 只忙 150 ms（约 44%）。时间线上每步开头都有一段固定的空白。</text>
<text x="30" y="240" font-size="16" text-anchor="start" fill="#c8650a" font-weight="bold" >B. 预取（num_workers &gt; 0 且 pin_memory=True）：算第 k 批时，后台已在准备第 k+1 批</text>
