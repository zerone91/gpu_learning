<text x="480" y="30" font-size="19" text-anchor="middle" fill="#222222" font-weight="bold" >数据加载与计算重叠不重叠：用正文的视频训练例子（准备 190 ms，计算 150 ms）</text>
<text x="30" y="70" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold" >A. 不预取：准备完一批才算，算完才准备下一批</text>
<text x="205" y="101" font-size="14" text-anchor="end" fill="#222222" font-weight="normal" >数据准备（CPU）</text>
