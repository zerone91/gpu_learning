<defs><marker id="ah-1f6fb2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker><marker id="ahs-1f6fb2" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker><marker id="ah-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahs-c0392b" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ah-cccccc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cccccc"/></marker><marker id="ahs-cccccc" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cccccc"/></marker><marker id="ah-dddddd" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dddddd"/></marker><marker id="ahs-dddddd" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dddddd"/></marker></defs>
<text x="480" y="30" font-size="19" text-anchor="middle" fill="#222222" font-weight="bold" >可分页内存与锁页内存：H2D 拷贝的路径和时间线</text>
<text x="30" y="70" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold" >A. 可分页内存（普通 malloc）：拷两次</text>
<rect x="30" y="85" width="200" height="56" rx="4" fill="#fff6cc" stroke="#444444" stroke-width="1.5" />
<text x="130.0" y="109" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold" >你的缓冲</text>
<text x="130.0" y="130" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >可分页，物理页会变</text>
<rect x="380" y="85" width="220" height="56" rx="4" fill="#e0f2e7" stroke="#444444" stroke-width="1.5" />
<text x="490.0" y="109" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold" >驱动内部的锁页中转缓冲</text>
<text x="490.0" y="130" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >物理页固定</text>
<rect x="750" y="85" width="180" height="56" rx="4" fill="#e3eef9" stroke="#444444" stroke-width="1.5" />
<text x="840.0" y="109" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold" >显存</text>
<text x="840.0" y="130" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >HBM</text>
<line x1="232" y1="113" x2="378" y2="113" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ah-c0392b)"/>
<text x="305" y="104" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" >CPU 拷贝</text>
<text x="305" y="134" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="normal" >占 CPU，同步</text>
<line x1="602" y1="113" x2="748" y2="113" stroke="#1f6fb2" stroke-width="3.5" marker-end="url(#ah-1f6fb2)"/>
<text x="675" y="104" font-size="14" text-anchor="middle" fill="#1f6fb2" font-weight="bold" >copy engine</text>
<text x="675" y="134" font-size="14" text-anchor="middle" fill="#1f6fb2" font-weight="normal" >DMA，经 PCIe</text>
<text x="30" y="185" font-size="16" text-anchor="start" fill="#2e7d4f" font-weight="bold" >B. 锁页内存（cudaHostAlloc / pin_memory=True）：拷一次</text>
<rect x="30" y="200" width="200" height="56" rx="4" fill="#e0f2e7" stroke="#444444" stroke-width="1.5" />
<text x="130.0" y="224" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold" >你的缓冲</text>
<text x="130.0" y="245" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >锁页，物理页固定</text>
<rect x="750" y="200" width="180" height="56" rx="4" fill="#e3eef9" stroke="#444444" stroke-width="1.5" />
<text x="840.0" y="224" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold" >显存</text>
<text x="840.0" y="245" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >HBM</text>
<line x1="232" y1="228" x2="748" y2="228" stroke="#1f6fb2" stroke-width="3.5" marker-end="url(#ah-1f6fb2)"/>
<text x="490" y="219" font-size="14" text-anchor="middle" fill="#1f6fb2" font-weight="bold" >copy engine 直接 DMA，经 PCIe</text>
<line x1="30" y1="288" x2="930" y2="288" stroke="#cccccc" stroke-width="1"/>
<text x="30" y="314" font-size="16" text-anchor="start" fill="#222222" font-weight="bold" >时间线（示意：搬 1 GB；按正文实测范围取可分页约 20 GB/s、锁页约 50 GB/s）</text>
<text x="30" y="361" font-size="15" text-anchor="start" fill="#c0392b" font-weight="bold" >A 可分页</text>
<text x="178" y="361" font-size="14" text-anchor="end" fill="#222222" font-weight="normal" >CPU</text>
