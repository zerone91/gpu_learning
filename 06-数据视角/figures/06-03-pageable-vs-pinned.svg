<text x="482.5" y="361" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="normal" >拷</text>
<rect x="515.0" y="378" width="65.0" height="30" rx="0" fill="#e3eef9" stroke="#1f6fb2" stroke-width="1.2" />
