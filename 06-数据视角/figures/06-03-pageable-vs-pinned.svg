<text x="677.5" y="399" font-size="14" text-anchor="middle" fill="#1f6fb2" font-weight="normal" >DMA</text>
<rect x="710.0" y="340" width="65.0" height="30" rx="0" fill="#f9e0dd" stroke="#c0392b" stroke-width="1.2" />
<text x="742.5" y="361" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="normal" >拷</text>
<rect x="775.0" y="378" width="65.0" height="30" rx="0" fill="#e3eef9" stroke="#1f6fb2" stroke-width="1.2" />
<text x="807.5" y="399" font-size="14" text-anchor="middle" fill="#1f6fb2" font-weight="normal" >DMA</text>
<rect x="190.0" y="416" width="650.0" height="30" rx="0" fill="#f4f4f4" stroke="#666666" stroke-width="1.2" />
<text x="515.0" y="437" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >这段拷贝夹着同步的 CPU 拷贝，没法与计算重叠：GPU 在等</text>
<text x="848.0" y="399" font-size="15" text-anchor="start" fill="#c0392b" font-weight="bold" >约 50 ms</text>
<text x="30" y="491" font-size="15" text-anchor="start" fill="#2e7d4f" font-weight="bold" >B 锁页</text>
