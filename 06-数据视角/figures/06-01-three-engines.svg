<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="sans-serif">
<rect x="0" y="0" width="960" height="800" fill="#ffffff"/>
<defs><marker id="ah-1f6fb2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker><marker id="ahs-1f6fb2" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker><marker id="ah-666666" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ahs-666666" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ah-6a4c93" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4c93"/></marker><marker id="ahs-6a4c93" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4c93"/></marker><marker id="ah-c8650a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8650a"/></marker><marker id="ahs-c8650a" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8650a"/></marker></defs>
<text x="480" y="30" font-size="19" text-anchor="middle" fill="#222222" font-weight="bold" >三个搬运引擎按“半径”分工：搬运跨过的边界越远，用的引擎越外层</text>
<rect x="20" y="55" width="700" height="525" rx="4" fill="#fcfcfc" stroke="#666666" stroke-width="1.5" stroke-dasharray="8 4" />
<text x="35" y="78" font-size="15" text-anchor="start" fill="#666666" font-weight="normal" >本节点（一台服务器）</text>
<rect x="40" y="100" width="200" height="70" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="140" y="128" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold" >CPU + 主机内存</text>
<text x="140" y="152" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >（训练数据在这里）</text>
<rect x="40" y="300" width="200" height="60" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="140" y="336" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal" >机内另一块 GPU</text>
<rect x="40" y="480" width="200" height="60" rx="4" fill="#ece6f5" stroke="#6a4c93" stroke-width="1.5" />
<text x="140" y="516" font-size="16" text-anchor="middle" fill="#6a4c93" font-weight="bold" >RDMA 网卡</text>
<rect x="300" y="95" width="400" height="455" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2" />
<text x="690" y="118" font-size="16" text-anchor="end" fill="#222222" font-weight="bold" >GPU 芯片</text>
<rect x="290" y="150" width="100" height="50" rx="4" fill="#fdeedd" stroke="#c8650a" stroke-width="1.5" />
<text x="340" y="171" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="bold" >copy</text>
<text x="340" y="190" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="bold" >engine</text>
<rect x="290" y="310" width="100" height="50" rx="4" fill="#fdeedd" stroke="#c8650a" stroke-width="1.5" />
<text x="340" y="331" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="bold" >copy</text>
<text x="340" y="350" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="bold" >engine</text>
<text x="345" y="390" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="normal" >（芯片边缘，</text>
<text x="345" y="408" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="normal" >每卡数个）</text>
<rect x="420" y="135" width="260" height="250" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="435" y="158" font-size="15" text-anchor="start" fill="#222222" font-weight="bold" >SM（H100 有 132 个）</text>
<rect x="440" y="172" width="90" height="46" rx="4" fill="#e3eef9" stroke="#1f6fb2" stroke-width="1.5" />
<text x="485" y="201" font-size="16" text-anchor="middle" fill="#1f6fb2" font-weight="bold" >TMA</text>
<rect x="440" y="290" width="220" height="44" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.5" />
<text x="550" y="317" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal" >shared memory</text>
<text x="545" y="190" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >线程自己搬：</text>
<text x="545" y="209" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" >ld / st、cp.async</text>
<text x="550" y="364" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >（半径最小：数据不出 SM）</text>
<rect x="420" y="450" width="260" height="70" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="550" y="482" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold" >HBM 显存</text>
<text x="550" y="504" font-size="14" text-anchor="middle" fill="#666666" font-weight="normal" >（与芯片同封装）</text>
<path d="M 500 448 V 336" fill="none" stroke="#1f6fb2" stroke-width="3" marker-end="url(#ah-1f6fb2)"/>
<path d="M 485 220 V 288" fill="none" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="512" y="425" font-size="14" text-anchor="start" fill="#1f6fb2" font-weight="normal" >TMA 搬 tile</text>
<path d="M 242 135 H 288 V 148" fill="none" stroke="#c8650a" stroke-width="3" marker-end="url(#ah-c8650a)"/>
<text x="262" y="128" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="normal" >PCIe</text>
<path d="M 392 175 H 405 V 470 H 418" fill="none" stroke="#c8650a" stroke-width="3" marker-end="url(#ah-c8650a)"/>
<path d="M 392 335 H 405" fill="none" stroke="#c8650a" stroke-width="3"/>
<path d="M 242 335 H 288" fill="none" stroke="#c8650a" stroke-width="3" marker-end="url(#ah-c8650a)"/>
<text x="264" y="326" font-size="14" text-anchor="middle" fill="#c8650a" font-weight="normal" >NVLink</text>
<path d="M 418 505 H 242" fill="none" stroke="#6a4c93" stroke-width="3" marker-end="url(#ah-6a4c93)"/>
<text x="340" y="498" font-size="14" text-anchor="middle" fill="#6a4c93" font-weight="normal" >GPUDirect RDMA</text>
<path d="M 140 542 V 600 H 840 V 548" fill="none" stroke="#6a4c93" stroke-width="3" marker-end="url(#ah-6a4c93)"/>
<text x="480" y="620" font-size="14" text-anchor="middle" fill="#6a4c93" font-weight="normal" >网络（InfiniBand 等）</text>
<rect x="750" y="380" width="190" height="168" rx="4" fill="#fcfcfc" stroke="#666666" stroke-width="1.5" stroke-dasharray="8 4" />
<text x="845" y="403" font-size="15" text-anchor="middle" fill="#666666" font-weight="normal" >远端节点</text>
<rect x="770" y="418" width="150" height="44" rx="4" fill="#f0f0f0" stroke="#444444" stroke-width="1.5" />
<text x="845" y="446" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal" >远端 GPU 显存</text>
<rect x="770" y="490" width="150" height="46" rx="4" fill="#ece6f5" stroke="#6a4c93" stroke-width="1.5" />
<text x="845" y="518" font-size="15" text-anchor="middle" fill="#6a4c93" font-weight="normal" >网卡</text>
<line x1="845" y1="488" x2="845" y2="464" stroke="#6a4c93" stroke-width="2.5" marker-end="url(#ah-6a4c93)"/>
<text x="740" y="120" font-size="15" text-anchor="start" fill="#1f6fb2" font-weight="bold" >半径 1（蓝）：芯片内部</text>
<text x="740" y="144" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >显存 ↔ shared memory</text>
<text x="740" y="168" font-size="15" text-anchor="start" fill="#c8650a" font-weight="bold" >半径 2（橙）：跨出芯片</text>
<text x="740" y="192" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >主机内存 ↔ 显存、卡 ↔ 卡</text>
<text x="740" y="216" font-size="15" text-anchor="start" fill="#6a4c93" font-weight="bold" >半径 3（紫）：跨出节点</text>
<text x="740" y="240" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >显存 ↔ 远端显存</text>
<text x="30" y="660" font-size="15" text-anchor="start" fill="#222222" font-weight="bold" >引擎</text>
<text x="160" y="660" font-size="15" text-anchor="start" fill="#222222" font-weight="bold" >谁下单</text>
<text x="560" y="660" font-size="15" text-anchor="start" fill="#222222" font-weight="bold" >搬完怎么通知</text>
<text x="760" y="660" font-size="15" text-anchor="start" fill="#222222" font-weight="bold" >典型场景</text>
<line x1="30" y1="668" x2="940" y2="668" stroke="#666666" stroke-width="1"/>
<text x="30" y="692" font-size="15" text-anchor="start" fill="#1f6fb2" font-weight="bold" >TMA</text>
<text x="160" y="692" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >kernel 里 1 个线程下单</text>
<text x="560" y="692" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >mbarrier 记账</text>
<text x="760" y="692" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >kernel 内的 tile 流水</text>
<text x="30" y="720" font-size="15" text-anchor="start" fill="#c8650a" font-weight="bold" >copy engine</text>
<text x="160" y="720" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >主机侧 API（cudaMemcpyAsync，在 stream 上排队）</text>
<text x="560" y="720" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >stream / event</text>
<text x="760" y="720" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >预取训练数据、P2P</text>
<text x="30" y="748" font-size="15" text-anchor="start" fill="#6a4c93" font-weight="bold" >RDMA 网卡</text>
<text x="160" y="748" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >通信库，或 GPU 自己写门铃（IBGDA）</text>
<text x="560" y="748" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >完成队列，GPU 可轮询</text>
<text x="760" y="748" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" >EP all-to-all</text>
</svg>
