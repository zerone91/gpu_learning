<text x="420.0" y="384.0" text-anchor="start" fill="#1f5fa8" font-size="14" >蓝色斜箭头跟踪 KV₀ 这一块：第 0 步在卡 0，然后依次交给卡 1、卡 2、卡 3。</text>
<text x="420.0" y="408.0" text-anchor="start" fill="#222222" font-size="14" >看任意一行：四步里颜色各不相同，说明这张卡用自己的 Q 见过了全部 4 块 KV；</text>
