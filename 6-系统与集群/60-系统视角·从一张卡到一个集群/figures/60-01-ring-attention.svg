<text x="20.0" y="32.0" text-anchor="start" fill="#222222" font-size="19" font-weight="bold" >环形注意力：Q 留在原地，KV 分块沿环接力一圈</text>
<text x="20.0" y="58.0" text-anchor="start" fill="#555" font-size="15" >上下文并行 4 张卡，序列切成 4 段；卡 i 持有第 i 段的查询 Q 和第 i 段的键值 KV</text>
