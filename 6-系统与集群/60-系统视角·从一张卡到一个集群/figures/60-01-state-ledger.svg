<text x="20.0" y="32.0" text-anchor="start" fill="#222222" font-size="19" font-weight="bold" >训练时每个参数要占 16 字节，真正参与计算的只有 2 字节</text>
<text x="20.0" y="58.0" text-anchor="start" fill="#555" font-size="15" >bf16 混合精度 + Adam 优化器；上半部分是一个参数的账，下半部分乘上 70B 个参数</text>
