<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f4f4f4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern></defs>
<text x="20.0" y="32.0" text-anchor="start" fill="#222222" font-size="19" font-weight="bold" >分离式部署：prefill 和 decode 在不同的机器上跑，中间传一次 KV cache</text>
<text x="20.0" y="58.0" text-anchor="start" fill="#555" font-size="15" >以一个 4096 token 输入的请求为例（70B 级、GQA）；两边的机器按各自的瓶颈选配置</text>
<rect x="20.0" y="150.0" width="110.0" height="70.0" rx="6" fill="#e8e8e8" stroke="#666666" stroke-width="1.5" />
<text x="75.0" y="180.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold" >请求</text>
<text x="75.0" y="200.0" text-anchor="middle" fill="#222222" font-size="14" >4096 token</text>
<line x1="132.0" y1="185.0" x2="178.0" y2="185.0" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="180.0" y="100.0" width="250.0" height="170.0" rx="8" fill="#fde2c4" stroke="#d9822b" stroke-width="2" />
<text x="305.0" y="128.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >prefill 机器</text>
<rect x="200.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#d9822b" stroke-width="1.5" />
<text x="222.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<rect x="255.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#d9822b" stroke-width="1.5" />
<text x="277.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<rect x="310.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#d9822b" stroke-width="1.5" />
<text x="332.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<rect x="365.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#d9822b" stroke-width="1.5" />
<text x="387.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<text x="305.0" y="218.0" text-anchor="middle" fill="#222222" font-size="14" >瓶颈：算力</text>
<text x="305.0" y="240.0" text-anchor="middle" fill="#222222" font-size="14" >4096 个 token 一次算完</text>
<text x="305.0" y="260.0" text-anchor="middle" fill="#222222" font-size="14" >小批就能把算力用满</text>
<line x1="432.0" y1="185.0" x2="598.0" y2="185.0" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
<text x="515.0" y="160.0" text-anchor="middle" fill="#c0392b" font-size="15" font-weight="bold" >KV cache 1.34 GB</text>
<text x="515.0" y="212.0" text-anchor="middle" fill="#c0392b" font-size="14" >NVLink：&lt; 1 毫秒</text>
<text x="515.0" y="232.0" text-anchor="middle" fill="#c0392b" font-size="14" >InfiniBand：约 13 毫秒</text>
<rect x="600.0" y="100.0" width="250.0" height="170.0" rx="8" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2" />
<text x="725.0" y="128.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold" >decode 机器</text>
<rect x="620.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#1f5fa8" stroke-width="1.5" />
<text x="642.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<rect x="675.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#1f5fa8" stroke-width="1.5" />
<text x="697.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<rect x="730.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#1f5fa8" stroke-width="1.5" />
<text x="752.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<rect x="785.0" y="145.0" width="45.0" height="45.0" rx="0" fill="#fff" stroke="#1f5fa8" stroke-width="1.5" />
<text x="807.5" y="172.4" text-anchor="middle" fill="#222222" font-size="14" >GPU</text>
<text x="725.0" y="218.0" text-anchor="middle" fill="#222222" font-size="14" >瓶颈：显存带宽和容量</text>
<text x="725.0" y="240.0" text-anchor="middle" fill="#222222" font-size="14" >每步 1 个 token</text>
<text x="725.0" y="260.0" text-anchor="middle" fill="#222222" font-size="14" >批越大越能摊薄读权重</text>
<line x1="852.0" y1="185.0" x2="900.0" y2="185.0" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="905.0" y="180.0" text-anchor="start" fill="#222222" font-size="14" >逐字</text>
<text x="905.0" y="198.0" text-anchor="start" fill="#222222" font-size="14" >返回</text>
<text x="305.0" y="292.0" text-anchor="middle" fill="#555" font-size="14" >prefill 顺带算出第 1 个 token</text>
<line x1="20.0" y1="320.0" x2="940.0" y2="320.0" stroke="#bbb" stroke-width="1"/>
<text x="20.0" y="350.0" text-anchor="start" fill="#222222" font-size="15" font-weight="bold" >2026 年这条分界线落到了芯片上（Vera Rubin NVL144 CPX 机架，两种芯片各 144 颗）</text>
<rect x="180.0" y="370.0" width="250.0" height="120.0" rx="8" fill="#fff" stroke="#d9822b" stroke-width="2" />
<text x="305.0" y="398.0" text-anchor="middle" fill="#d9822b" font-size="16" font-weight="bold" >Rubin CPX</text>
<text x="305.0" y="424.0" text-anchor="middle" fill="#222222" font-size="14" >30 PFLOPS（NVFP4）</text>
<text x="305.0" y="446.0" text-anchor="middle" fill="#222222" font-size="14" >128 GB GDDR7</text>
<text x="305.0" y="468.0" text-anchor="middle" fill="#222222" font-size="14" >不配 HBM：带宽用不上</text>
<rect x="600.0" y="370.0" width="250.0" height="120.0" rx="8" fill="#fff" stroke="#1f5fa8" stroke-width="2" />
<text x="725.0" y="398.0" text-anchor="middle" fill="#1f5fa8" font-size="16" font-weight="bold" >Rubin</text>
<text x="725.0" y="424.0" text-anchor="middle" fill="#222222" font-size="14" >配 HBM4</text>
<text x="725.0" y="446.0" text-anchor="middle" fill="#222222" font-size="14" >带宽和容量优先</text>
<text x="725.0" y="468.0" text-anchor="middle" fill="#222222" font-size="14" >负责 decode</text>
<line x1="432.0" y1="430.0" x2="598.0" y2="430.0" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
<text x="515.0" y="420.0" text-anchor="middle" fill="#c0392b" font-size="14" >机架内高速互连</text>
<text x="20.0" y="525.0" text-anchor="start" fill="#555" font-size="14" >KV 传输时间 = 1.34 GB ÷ 带宽：NVLink 按 1.8 TB/s、InfiniBand 按约 100 GB/s 算</text>
</svg>
