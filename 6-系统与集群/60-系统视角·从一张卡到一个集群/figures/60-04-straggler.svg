<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f4f4f4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern></defs>
<text x="20.0" y="32.0" text-anchor="start" fill="#222222" font-size="19" font-weight="bold" >落后者：一张卡慢 10%，每一步所有卡都陪它多等 10%</text>
<text x="20.0" y="58.0" text-anchor="start" fill="#555" font-size="14" >8 张卡的一步（示意数值）：先各自计算，再在同步点（屏障）等齐，一起做梯度 all-reduce；横轴按毫秒比例画</text>
<text x="100.0" y="114.0" text-anchor="end" fill="#222222" font-size="14" >卡 0</text>
<rect x="110.0" y="90.0" width="560.0" height="36.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="390.0" y="114.0" text-anchor="middle" fill="#222222" font-size="14" >计算 100 ms</text>
<rect x="670.0" y="90.0" width="56.0" height="36.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="798.0" y="114.0" text-anchor="start" fill="#222222" font-size="14" >等了 10 ms</text>
<rect x="726.0" y="90.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="100.0" y="158.0" text-anchor="end" fill="#222222" font-size="14" >卡 1</text>
<rect x="110.0" y="134.0" width="548.8" height="36.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="384.4" y="158.0" text-anchor="middle" fill="#222222" font-size="14" >计算 98 ms</text>
<rect x="658.8" y="134.0" width="67.2" height="36.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="798.0" y="158.0" text-anchor="start" fill="#222222" font-size="14" >等了 12 ms</text>
<rect x="726.0" y="134.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="100.0" y="202.0" text-anchor="end" fill="#222222" font-size="14" >卡 2</text>
<rect x="110.0" y="178.0" width="565.6" height="36.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="392.8" y="202.0" text-anchor="middle" fill="#222222" font-size="14" >计算 101 ms</text>
<rect x="675.6" y="178.0" width="50.4" height="36.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="798.0" y="202.0" text-anchor="start" fill="#222222" font-size="14" >等了 9 ms</text>
<rect x="726.0" y="178.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="100.0" y="246.0" text-anchor="end" fill="#222222" font-size="14" >卡 3</text>
<rect x="110.0" y="222.0" width="554.4" height="36.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="387.2" y="246.0" text-anchor="middle" fill="#222222" font-size="14" >计算 99 ms</text>
<rect x="664.4" y="222.0" width="61.6" height="36.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="798.0" y="246.0" text-anchor="start" fill="#222222" font-size="14" >等了 11 ms</text>
<rect x="726.0" y="222.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="100.0" y="290.0" text-anchor="end" fill="#222222" font-size="14" >卡 4</text>
<rect x="110.0" y="266.0" width="560.0" height="36.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="390.0" y="290.0" text-anchor="middle" fill="#222222" font-size="14" >计算 100 ms</text>
<rect x="670.0" y="266.0" width="56.0" height="36.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="798.0" y="290.0" text-anchor="start" fill="#222222" font-size="14" >等了 10 ms</text>
<rect x="726.0" y="266.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="100.0" y="334.0" text-anchor="end" fill="#c0392b" font-size="14" font-weight="bold" >卡 5</text>
<rect x="110.0" y="310.0" width="616.0" height="36.0" rx="0" fill="#f6c6c0" stroke="#c0392b" stroke-width="1.5" />
<text x="418.0" y="334.0" text-anchor="middle" fill="#222222" font-size="14" >计算 110 ms</text>
<text x="798.0" y="334.0" text-anchor="start" fill="#c0392b" font-size="14" font-weight="bold" >等了 0 ms ← 落后者</text>
<rect x="726.0" y="310.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="100.0" y="378.0" text-anchor="end" fill="#222222" font-size="14" >卡 6</text>
<rect x="110.0" y="354.0" width="543.2" height="36.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="381.6" y="378.0" text-anchor="middle" fill="#222222" font-size="14" >计算 97 ms</text>
<rect x="653.2" y="354.0" width="72.8" height="36.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="798.0" y="378.0" text-anchor="start" fill="#222222" font-size="14" >等了 13 ms</text>
<rect x="726.0" y="354.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="100.0" y="422.0" text-anchor="end" fill="#222222" font-size="14" >卡 7</text>
<rect x="110.0" y="398.0" width="560.0" height="36.0" rx="0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="390.0" y="422.0" text-anchor="middle" fill="#222222" font-size="14" >计算 100 ms</text>
<rect x="670.0" y="398.0" width="56.0" height="36.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="798.0" y="422.0" text-anchor="start" fill="#222222" font-size="14" >等了 10 ms</text>
<rect x="726.0" y="398.0" width="56.0" height="36.0" rx="0" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5" />
<text x="754.0" y="82.0" text-anchor="middle" fill="#d9822b" font-size="14" >all-reduce</text>
<line x1="726.0" y1="86.0" x2="726.0" y2="442.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<text x="726.0" y="460.0" text-anchor="middle" fill="#c0392b" font-size="14" >屏障：110 ms</text>
<line x1="670.0" y1="86.0" x2="670.0" y2="442.0" stroke="#777" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="670.0" y="478.0" text-anchor="middle" fill="#555" font-size="14" >其它卡大多在 100 ms 左右就算完了</text>
<rect x="110.0" y="502.0" width="24.0" height="16.0" rx="0" fill="url(#h)" stroke="#999" stroke-width="1" />
<text x="142.0" y="516.0" text-anchor="start" fill="#222222" font-size="14" >斜线：到了屏障在空等</text>
<text x="110.0" y="546.0" text-anchor="start" fill="#222222" font-size="14" >卡 5 没报任何错，只是慢了 10%；但一步的长度由它决定，整个任务也就慢了约 10%。</text>
<text x="110.0" y="570.0" text-anchor="start" fill="#c0392b" font-size="14" >找它的办法：看每张卡在屏障上等了多久，等得最短的就是最慢的那张。</text>
</svg>
