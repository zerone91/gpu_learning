<text x="583.8" y="209.5" text-anchor="end" fill="#d9822b" font-size="14" >这 15 分钟的活白做了</text>
<text x="639.2" y="294.1" text-anchor="start" fill="#c0392b" font-size="14" >退回上一个存档</text>
<line x1="624.5" y1="247.5" x2="771.5" y2="247.5" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="634.3" y="214.6" text-anchor="start" fill="#555" font-size="14" >从故障算起要 30 分钟，</text>
<text x="634.3" y="234.6" text-anchor="start" fill="#555" font-size="14" >进度才回到故障时的位置</text>
<rect x="110.0" y="478.0" width="14.0" height="14.0" rx="0" fill="#d4ecd4" stroke="#2e7d32" stroke-width="2" />
<text x="132.0" y="490.0" text-anchor="start" fill="#222222" font-size="14" >绿方块：检查点（存档）</text>
<text x="110.0" y="520.0" text-anchor="start" fill="#c0392b" font-size="14" >可用率 = MTBF ÷ (MTBF + 恢复 + 重做) = 6 ÷ (6 + 0.25 + 0.25) ≈ 92.3%：每 6 小时一次故障，就有 7.7% 的时间没在往前走</text>
<text x="110.0" y="544.0" text-anchor="start" fill="#555" font-size="14" >存档越密，重做越少，但存档本身也要花时间：这正是 §5.2 最优间隔要平衡的两件事</text>
