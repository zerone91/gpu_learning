<text x="20.0" y="32.0" text-anchor="start" fill="#222222" font-size="19" font-weight="bold" >一次故障让训练付出两笔时间：恢复本身，和重做上次存档之后的进度</text>
<text x="20.0" y="58.0" text-anchor="start" fill="#555" font-size="14" >8192 卡任务，每 30 分钟存一次检查点；故障发生在上次存档后 15 分钟（平均情况）；横轴按分钟比例画</text>
<text x="100.0" y="127.0" text-anchor="end" fill="#222222" font-size="14" font-weight="bold" >集群在做</text>
