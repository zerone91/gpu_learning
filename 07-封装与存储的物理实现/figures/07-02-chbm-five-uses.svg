<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">可定制 HBM（cHBM）：基底裸片换成逻辑工艺、接口换小之后，空出的面积可以放什么</text>
<rect x="40" y="60" width="700" height="18" fill="#c9b3dd" stroke="#555" stroke-width="1"/>
<rect x="40" y="82" width="700" height="18" fill="#c9b3dd" stroke="#555" stroke-width="1"/>
<rect x="40" y="104" width="700" height="18" fill="#c9b3dd" stroke="#555" stroke-width="1"/>
<rect x="40" y="126" width="700" height="18" fill="#c9b3dd" stroke="#555" stroke-width="1"/>
<text x="390.0" y="140" font-size="13" text-anchor="middle">核心裸片（DRAM，不变）</text>
<rect x="40" y="160" width="700" height="250" fill="#f7efe6" stroke="#222" stroke-width="2"/>
<text x="52" y="182" font-size="14" font-weight="bold">基底裸片（逻辑工艺）</text>
<rect x="52" y="196" width="120" height="150" fill="#dbe6f3" stroke="#222" stroke-width="1.5" rx="4"/>
<text x="112.0" y="224" font-size="18" text-anchor="middle" font-weight="bold">①</text>
<text x="112.0" y="250" font-size="15" text-anchor="middle" font-weight="bold">内存控制器</text>
<text x="112.0" y="280" font-size="12" text-anchor="middle">地址映射、调度、</text>
<text x="112.0" y="299" font-size="13" text-anchor="middle">刷新管理，</text>
<text x="112.0" y="318" font-size="12" text-anchor="middle">从 GPU 搬来</text>
<rect x="180" y="196" width="120" height="150" fill="#dbe6f3" stroke="#222" stroke-width="1.5" rx="4"/>
<text x="240.0" y="224" font-size="18" text-anchor="middle" font-weight="bold">②</text>
<text x="240.0" y="250" font-size="15" text-anchor="middle" font-weight="bold">SRAM 修复</text>
<text x="240.0" y="280" font-size="12" text-anchor="middle">坏的 DRAM 地址</text>
<text x="240.0" y="299" font-size="13" text-anchor="middle">改映射到</text>
<text x="240.0" y="318" font-size="13" text-anchor="middle">这块 SRAM</text>
<rect x="308" y="196" width="120" height="150" fill="#dbe6f3" stroke="#222" stroke-width="1.5" rx="4"/>
<text x="368.0" y="224" font-size="18" text-anchor="middle" font-weight="bold">③</text>
<text x="368.0" y="250" font-size="15" text-anchor="middle" font-weight="bold">可靠性</text>
<text x="368.0" y="280" font-size="13" text-anchor="middle">更强的纠错、</text>
<text x="368.0" y="299" font-size="13" text-anchor="middle">错误统计、</text>
<text x="368.0" y="318" font-size="13" text-anchor="middle">坏块隔离</text>
<rect x="436" y="196" width="120" height="150" fill="#e6f2de" stroke="#222" stroke-width="1.5" rx="4"/>
<text x="496.0" y="224" font-size="18" text-anchor="middle" font-weight="bold">④</text>
<text x="496.0" y="250" font-size="15" text-anchor="middle" font-weight="bold">级联接口</text>
<text x="496.0" y="280" font-size="12" text-anchor="middle">再挂 DDR 或</text>
<text x="496.0" y="299" font-size="12" text-anchor="middle">闪存（HBF），</text>
<text x="496.0" y="318" font-size="13" text-anchor="middle">换更大容量</text>
<rect x="564" y="196" width="120" height="150" fill="#fbe3e0" stroke="#222" stroke-width="1.5" rx="4"/>
<text x="624.0" y="224" font-size="18" text-anchor="middle" font-weight="bold">⑤</text>
<text x="624.0" y="250" font-size="15" text-anchor="middle" font-weight="bold">近存计算</text>
<text x="624.0" y="280" font-size="12" text-anchor="middle">归约、洗牌、置换</text>
<text x="624.0" y="299" font-size="13" text-anchor="middle">这类数据多、</text>
<text x="624.0" y="318" font-size="13" text-anchor="middle">运算少的算子</text>
<rect x="700" y="210" width="34" height="110" fill="#e79a8f" stroke="#8b2f24" stroke-width="1.5"/>
<text x="717" y="265" font-size="12" text-anchor="middle" transform="rotate(-90 717 265)">D2D 接口</text>
