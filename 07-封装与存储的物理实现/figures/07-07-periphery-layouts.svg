<text x="480" y="410" font-size="13" text-anchor="middle" fill="#222">厂商叫法：② CuA（美光）、PUC（SK 海力士）、COP（三星）；③ Xtacking（长江存储）、CBA（铠侠与闪迪）、BV-NAND（三星 V10）</text>
