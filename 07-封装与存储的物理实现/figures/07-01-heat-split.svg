<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif">
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">一颗 250 瓦裸片的热往哪走：两条路并联，按热阻反比分配（量级估算）</text>

<!-- stack -->
<rect x="130" y="60" width="340" height="60" fill="#d5d5d5" stroke="#222" stroke-width="1.5"/>
<g stroke="#999" stroke-width="3"><line x1="150" y1="60" x2="150" y2="40"/><line x1="180" y1="60" x2="180" y2="40"/><line x1="210" y1="60" x2="210" y2="40"/><line x1="240" y1="60" x2="240" y2="40"/><line x1="270" y1="60" x2="270" y2="40"/><line x1="330" y1="60" x2="330" y2="40"/><line x1="360" y1="60" x2="360" y2="40"/><line x1="390" y1="60" x2="390" y2="40"/><line x1="420" y1="60" x2="420" y2="40"/><line x1="450" y1="60" x2="450" y2="40"/></g>
<text x="300" y="95" font-size="15" text-anchor="middle" fill="#222">散热器 / 冷板</text>
<rect x="190" y="120" width="220" height="14" fill="#f4d58d" stroke="#222" stroke-width="1.2"/>
<text x="420" y="132" font-size="13" fill="#222">导热界面材料</text>
<rect x="190" y="134" width="220" height="56" fill="#9bb7d4" stroke="#222" stroke-width="2"/>
<rect x="190" y="180" width="220" height="10" fill="#1f4e79"/>
<text x="300" y="166" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">裸片（发热 250 瓦）</text>
<rect x="186" y="190" width="228" height="14" fill="#efe6c8"/>
<g fill="#b8860b"><circle cx="200" cy="197" r="5"/><circle cx="220" cy="197" r="5"/><circle cx="240" cy="197" r="5"/><circle cx="260" cy="197" r="5"/><circle cx="280" cy="197" r="5"/><circle cx="300" cy="197" r="5"/><circle cx="320" cy="197" r="5"/><circle cx="340" cy="197" r="5"/><circle cx="360" cy="197" r="5"/><circle cx="380" cy="197" r="5"/><circle cx="400" cy="197" r="5"/></g>
<rect x="130" y="204" width="340" height="50" fill="#cfe3c4" stroke="#222" stroke-width="1.5"/>
<text x="300" y="234" font-size="14" text-anchor="middle" fill="#222">封装基板（有机树脂）</text>
<g fill="#b8860b"><circle cx="150" cy="264" r="10"/><circle cx="190" cy="264" r="10"/><circle cx="230" cy="264" r="10"/><circle cx="270" cy="264" r="10"/><circle cx="310" cy="264" r="10"/><circle cx="350" cy="264" r="10"/><circle cx="390" cy="264" r="10"/><circle cx="430" cy="264" r="10"/></g>
<rect x="80" y="274" width="440" height="40" fill="#6f9a6a" stroke="#222" stroke-width="1.5"/>
<text x="300" y="300" font-size="14" text-anchor="middle" fill="#fff">主板</text>

<!-- up arrow thick -->
<path d="M515,190 L515,90" stroke="#c0392b" stroke-width="26" fill="none"/>
<path d="M490,96 L515,56 L540,96 z" fill="#c0392b"/>
<text x="555" y="80" font-size="16" fill="#c0392b" font-weight="bold">向上：约 245 瓦（98%）</text>
<text x="555" y="102" font-size="14" fill="#222">裸片 → 界面材料 → 散热器 → 空气</text>
<text x="555" y="124" font-size="14" fill="#222">热阻约 0.2 °C/W</text>
<!-- down arrow thin -->
<path d="M515,200 L515,300" stroke="#c0392b" stroke-width="3" fill="none"/>
<path d="M508,296 L515,312 L522,296 z" fill="#c0392b"/>
<text x="555" y="230" font-size="16" fill="#c0392b" font-weight="bold">向下：约 5 瓦（2%）</text>
<text x="555" y="252" font-size="14" fill="#222">凸块与底填料 → 基板 → 焊球 → 主板</text>
<text x="555" y="274" font-size="14" fill="#222">热阻约 10 °C/W，高出约五十倍</text>

<!-- calc box -->
<rect x="40" y="340" width="430" height="150" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
<text x="255" y="366" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">算一遍</text>
<text x="60" y="394" font-size="14" fill="#222">向下的份额 = 0.2 ÷ (0.2 + 10) ≈ 2%</text>
<text x="60" y="418" font-size="14" fill="#222">250 瓦 × 2% ≈ 5 瓦往下，其余约 245 瓦往上</text>
<text x="60" y="446" font-size="14" fill="#222">反过来验证：若 250 瓦全走下面，温差要</text>
<text x="60" y="468" font-size="14" fill="#222">250 × 10 = 2500 度——不可能，所以热不走那边</text>

<rect x="500" y="340" width="420" height="150" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.5"/>
<text x="710" y="366" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">向下那条路为什么改不了</text>
<text x="520" y="394" font-size="14" fill="#222">① 底面挤满了几千个供电、接地和信号凸块</text>
<text x="520" y="420" font-size="14" fill="#222">② 这些凸块之间必须绝缘，而好的绝缘体</text>
<text x="520" y="442" font-size="14" fill="#222">    导热都差</text>
<text x="520" y="468" font-size="14" fill="#222">③ 要用软材料吸收硅与基板六倍的热膨胀差</text>

<text x="480" y="530" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">推论：堆叠时，功耗最大的那一层必须放在最上面，离散热器最近</text>
<text x="480" y="556" font-size="14" text-anchor="middle" fill="#555">箭头粗细按热流比例示意；0.2 与 10 °C/W 都是量级估算值</text>
</svg>
