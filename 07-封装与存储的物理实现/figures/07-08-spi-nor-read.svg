<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <g font-size="16" font-weight="bold"><text x="20" y="82">片选 CS#</text><text x="20" y="152">时钟 SCK</text><text x="20" y="222">主机→闪存</text><text x="20" y="292">闪存→主机</text></g>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="5 5"><line x1="140" y1="36" x2="140" y2="320"/><line x1="300" y1="36" x2="300" y2="320"/><line x1="620" y1="36" x2="620" y2="320"/><line x1="780" y1="36" x2="780" y2="320"/><line x1="940" y1="36" x2="940" y2="320"/></g>
  <g text-anchor="middle" font-weight="bold"><text x="220" y="28">8 个周期</text><text x="460" y="28">24 个周期</text><text x="700" y="28">8 个周期</text><text x="860" y="28">8 个周期</text></g>
  <!-- CS -->
  <polyline fill="none" stroke="#222" stroke-width="2" points="110,60 128,60 134,90 946,90 952,60 980,60"/>
  <!-- SCK: draw pulses -->
  <path fill="none" stroke="#222" stroke-width="1.8" d="M110,160 H140
   M140,160 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10
   M300,160 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10
   M620,160 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10
   M780,160 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10 v-30 h10 v30 h10
   M940,160 H980"/>
  <text x="460" y="182" text-anchor="middle" font-size="13" fill="#555">（24 个周期，图中只画出 16 个）</text>
  <!-- MOSI -->
  <g stroke="#222" stroke-width="2">
    <polygon points="140,215 150,199 290,199 300,215 290,231 150,231" fill="#cfe3f7"/>
    <polygon points="300,215 310,199 610,199 620,215 610,231 310,231" fill="#f5f5f5"/>
    <line x1="110" y1="215" x2="140" y2="215"/><line x1="620" y1="215" x2="980" y2="215" stroke-dasharray="3 4"/>
  </g>
  <g text-anchor="middle"><text x="220" y="220">操作码 03h（读）</text><text x="460" y="220">地址 00h 10h 00h</text><text x="800" y="206" font-size="13" fill="#555">（不再使用）</text></g>
  <!-- MISO -->
  <g stroke="#222" stroke-width="2">
    <line x1="110" y1="285" x2="620" y2="285" stroke-dasharray="3 4"/>
    <polygon points="620,285 630,269 770,269 780,285 770,301 630,301" fill="#fbe3c6"/>
    <polygon points="780,285 790,269 930,269 940,285 930,301 790,301" fill="#fbe3c6"/>
    <line x1="940" y1="285" x2="980" y2="285" stroke-dasharray="3 4"/>
  </g>
  <g text-anchor="middle"><text x="700" y="290">0x001000 处的字节</text><text x="860" y="290">0x001001 处的字节</text><text x="360" y="276" font-size="13" fill="#555">（高阻）</text></g>
  <g font-size="14">
    <text x="20" y="352">读图要点：片选拉低后，主机用 32 个时钟周期送出操作码和地址（每周期 1 位，高位在前）；</text>
    <text x="20" y="375">紧接着的下一个周期闪存就开始送数据，中间没有等待、没有就绪信号。只要片选保持为低，地址自动加一连续输出。</text>
    <text x="20" y="398">图中为单线模式；四线模式下数据阶段改用 4 根线，每周期 4 位。“快速读”命令会在地址和数据之间插入若干空闲周期。</text>
  </g>
</svg>
