<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <g font-size="16" font-weight="bold">
    <text x="20" y="76">CLE</text><text x="20" y="146">ALE</text><text x="20" y="216">WE#</text><text x="20" y="286">RE#</text><text x="20" y="356">DQ[7:0]</text><text x="20" y="426">R/B#</text>
  </g>
  <!-- phase separators -->
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="110" y1="30" x2="110" y2="450"/><line x1="190" y1="30" x2="190" y2="450"/><line x1="490" y1="30" x2="490" y2="450"/><line x1="570" y1="30" x2="570" y2="450"/><line x1="730" y1="30" x2="730" y2="450"/><line x1="980" y1="30" x2="980" y2="450"/>
  </g>
  <!-- CLE: high during 110-190 and 490-570 -->
  <polyline fill="none" stroke="#222" stroke-width="2" points="100,85 115,85 120,55 180,55 185,85 495,85 500,55 560,55 565,85 980,85"/>
  <!-- ALE: high during 190-490 -->
  <polyline fill="none" stroke="#222" stroke-width="2" points="100,155 195,155 200,125 480,125 485,155 980,155"/>
  <!-- WE#: idle high; low pulses, one per byte (1 cmd, 5 addr, 1 cmd) -->
  <polyline fill="none" stroke="#222" stroke-width="2" points="100,195 130,195 133,225 160,225 163,195 215,195 218,225 245,225 248,195 275,195 278,225 305,225 308,195 335,195 338,225 365,225 368,195 395,195 398,225 425,225 428,195 455,195 458,225 480,225 483,195 510,195 513,225 540,225 543,195 980,195"/>
  <!-- RE#: idle high, toggles during data out -->
  <polyline fill="none" stroke="#222" stroke-width="2" points="100,265 745,265 748,295 775,295 778,265 805,265 808,295 835,295 838,265 865,265 868,295 895,295 898,265 925,265 928,295 955,295 958,265 980,265"/>
  <!-- DQ bus -->
  <g fill="#f5f5f5" stroke="#222" stroke-width="2">
    <polygon points="118,350 126,334 174,334 182,350 174,366 126,366" fill="#cfe3f7"/>
    <polygon points="198,350 206,334 252,334 260,350 252,366 206,366"/>
    <polygon points="260,350 268,334 312,334 320,350 312,366 268,366"/>
    <polygon points="320,350 328,334 372,334 380,350 372,366 328,366"/>
    <polygon points="380,350 388,334 432,334 440,350 432,366 388,366"/>
    <polygon points="440,350 448,334 476,334 484,350 476,366 448,366"/>
    <polygon points="498,350 506,334 554,334 562,350 554,366 506,366" fill="#cfe3f7"/>
    <polygon points="750,350 758,334 802,334 810,350 802,366 758,366" fill="#fbe3c6"/>
    <polygon points="810,350 818,334 862,334 870,350 862,366 818,366" fill="#fbe3c6"/>
    <polygon points="870,350 878,334 922,334 930,350 922,366 878,366" fill="#fbe3c6"/>
    <polygon points="930,350 938,334 966,334 974,350 966,366 938,366" fill="#fbe3c6"/>
  </g>
  <line x1="100" y1="350" x2="118" y2="350" stroke="#222" stroke-width="2"/><line x1="182" y1="350" x2="198" y2="350" stroke="#222" stroke-width="2"/><line x1="484" y1="350" x2="498" y2="350" stroke="#222" stroke-width="2"/><line x1="562" y1="350" x2="750" y2="350" stroke="#222" stroke-width="2" stroke-dasharray="3 4"/>
  <g text-anchor="middle" font-size="14">
    <text x="150" y="355">00h</text><text x="229" y="355">列1</text><text x="290" y="355">列2</text><text x="350" y="355">行1</text><text x="410" y="355">行2</text><text x="462" y="355">行3</text><text x="530" y="355">30h</text>
    <text x="780" y="355">D0</text><text x="840" y="355">D1</text><text x="900" y="355">D2</text><text x="952" y="355">…</text>
  </g>
  <text x="656" y="340" text-anchor="middle" font-size="14">（高阻）</text>
  <!-- R/B# -->
  <polyline fill="none" stroke="#222" stroke-width="2" points="100,405 572,405 578,435 722,435 728,405 980,405"/>
  <line x1="580" y1="448" x2="720" y2="448" stroke="#b35a00" stroke-width="2"/>
  <line x1="580" y1="442" x2="580" y2="454" stroke="#b35a00" stroke-width="2"/><line x1="720" y1="442" x2="720" y2="454" stroke="#b35a00" stroke-width="2"/>
  <text x="650" y="470" text-anchor="middle" fill="#b35a00" font-weight="bold">tR：几十微秒</text>
  <!-- phase labels -->
  <g text-anchor="middle" font-size="15" font-weight="bold">
    <text x="150" y="24">命令</text><text x="340" y="24">5 个地址字节</text><text x="530" y="24">确认</text><text x="650" y="24">阵列内部读</text><text x="855" y="24">数据输出</text>
  </g>
  <g font-size="14">
    <text x="20" y="505">读图要点：CLE 为高时 DQ 上是命令（蓝色），ALE 为高时是地址（灰色）；每个字节在 WE# 的上升沿被 NAND 锁存。</text>
    <text x="20" y="528">收到确认字节 30h 后 R/B# 拉低，NAND 在阵列里读一页；R/B# 回高后控制器翻转 RE#，每翻一次取一个数据字节（橙色）。</text>
    <text x="20" y="551">本图按异步模式画，未按比例：tR 实际远长于命令和地址阶段。高速模式下数据阶段还有 DQS 随数据翻转，图中未画。</text>
  </g>
</svg>
