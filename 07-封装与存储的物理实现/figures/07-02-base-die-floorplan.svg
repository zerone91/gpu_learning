<text x="150.2" y="286.4" font-size="12" text-anchor="middle">TSV 区：向上</text>
<text x="150.2" y="301.4" font-size="12" text-anchor="middle">接核心裸片，</text>
<text x="150.2" y="316.4" font-size="12" text-anchor="middle">另有供电 TSV</text>
<rect x="214" y="132.8" width="88" height="176" fill="#e79a8f" stroke="#8b2f24" stroke-width="1.5"/>
<text x="258" y="212.8" font-size="14" text-anchor="middle" font-weight="bold">HBM PHY</text>
<text x="258" y="232.8" font-size="13" text-anchor="middle">&gt; 8 × 4 毫米</text>
<text x="258" y="250.8" font-size="12" text-anchor="middle">驱动 2048 根</text>
<text x="258" y="266.8" font-size="12" text-anchor="middle">微凸块引脚</text>
<line x1="308" y1="220.8" x2="358" y2="220.8" stroke="#222" stroke-width="2"/><path d="M352,214.8 L362,220.8 L352,226.8 z" fill="#222"/>
<text x="335" y="210.8" font-size="12" text-anchor="middle">朝向</text>
<text x="335" y="242.8" font-size="12" text-anchor="middle">GPU</text>
<text x="181.0" y="423.6" font-size="14" text-anchor="middle">整片 11 × 12.8 毫米 ≈ 141 平方毫米</text>
<text x="181.0" y="443.6" font-size="13" text-anchor="middle" fill="#555">除 PHY 外，大部分面积只是被动走线</text>
<text x="480" y="66" font-size="15" font-weight="bold">（b）计算芯片那一侧也要付同样的 PHY</text>
<text x="480" y="120" font-size="14">通信是双方的：HBM 这头有一套 32 平方毫米的 PHY，</text>
<text x="480" y="142" font-size="14">计算芯片那头也要有一套对称的来接。</text>
<text x="480" y="164" font-size="14">一张加速器贴 8 颗 HBM：</text>
<rect x="480" y="210" width="440" height="46" fill="#9bb7d4" stroke="#222" stroke-width="1.5"/>
<rect x="480.0" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<rect x="498.7733333333333" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<rect x="517.5466666666666" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<rect x="536.32" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<rect x="555.0933333333334" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<rect x="573.8666666666667" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<rect x="592.64" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<rect x="611.4133333333333" y="210" width="18.773333333333333" height="46" fill="#e79a8f" stroke="#8b2f24" stroke-width="1"/>
<text x="555.0933333333334" y="238" font-size="13" text-anchor="middle" font-weight="bold">8 × 32 = 256</text>
<text x="775.0933333333334" y="238" font-size="13" text-anchor="middle">其余约 494：计算、缓存、其他接口</text>
<text x="480" y="280" font-size="14">整条代表一颗约 750 平方毫米的计算裸片（按面积比例）</text>
<text x="480" y="310" font-size="16" font-weight="bold" fill="#8b2f24">256 ÷ 750 ≈ 34%：约三分之一的硅只在驱动通往 HBM 的导线</text>
<text x="480" y="356" font-size="14" fill="#222">cHBM 的出发点：把两侧的大 PHY 换成短距 D2D 接口，</text>
<text x="480" y="378" font-size="14" fill="#222">计算芯片省下的面积（Samsung 给的量级 10%～20%）</text>
<text x="480" y="400" font-size="14" fill="#222">可以换成计算核心；基底裸片上空出的逻辑面积，</text>
<text x="480" y="422" font-size="14" fill="#222">可以放别的功能（下一节五类用法）。</text>
</svg>