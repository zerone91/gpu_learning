<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5451b"/></marker><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="470" fill="#ffffff"/>
<text x="490" y="30" font-size="17" text-anchor="middle" fill="#111" font-weight="bold" >判决反馈均衡器：用刚判出的前 4 个比特算出干扰，再从输入里减掉</text>
<line x1="20" y1="110" x2="122" y2="110" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="20" y="82" font-size="14" text-anchor="start" fill="#111" font-weight="normal" >收到的电压</text>
<text x="20" y="102" font-size="14" text-anchor="start" fill="#b5451b" font-weight="bold" >−25 mV</text>
<circle cx="150" cy="110" r="26" fill="#fdf3e3" stroke="#222" stroke-width="1.5"/>
<text x="150" y="118" font-size="22" text-anchor="middle" fill="#111" font-weight="normal" >Σ</text>
<text x="150" y="74" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >求和点</text>
<line x1="176" y1="110" x2="560" y2="110" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="368" y="98" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="bold" >减掉干扰后：−80 mV</text>
<polyline points="560,70 560,150 650,110 560,70" stroke="#222" stroke-width="2" fill="#eef3fb" stroke-linejoin="round"/>
<text x="588" y="116" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >判决器</text>
<text x="605" y="172" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >高于 0 判 1，低于 0 判 0</text>
<line x1="650" y1="110" x2="900" y2="110" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="900" y="98" font-size="14" text-anchor="end" fill="#111" font-weight="normal" >判出的比特</text>
<circle cx="760" cy="110" r="4" fill="#222" stroke="#222" stroke-width="1.5"/>
<line x1="760" y1="110" x2="760" y2="196" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="690" y="198" width="140" height="96" rx="4" fill="#eaf5e9" stroke="#222" stroke-width="1.8" />
<text x="760" y="224" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >前 1 个比特 = 1</text>
<text x="760" y="250" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >× 系数 30</text>
<text x="760" y="278" font-size="14" text-anchor="middle" fill="#b5451b" font-weight="bold" >= +30 mV</text>
<line x1="760" y1="294" x2="760" y2="340" stroke="#222" stroke-width="1.8"/>
<rect x="520" y="198" width="140" height="96" rx="4" fill="#eaf5e9" stroke="#222" stroke-width="1.8" />
<text x="590" y="224" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >前 2 个比特 = 1</text>
<text x="590" y="250" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >× 系数 12</text>
<text x="590" y="278" font-size="14" text-anchor="middle" fill="#b5451b" font-weight="bold" >= +12 mV</text>
<line x1="590" y1="294" x2="590" y2="340" stroke="#222" stroke-width="1.8"/>
<rect x="350" y="198" width="140" height="96" rx="4" fill="#eaf5e9" stroke="#222" stroke-width="1.8" />
<text x="420" y="224" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >前 3 个比特 = 0</text>
<text x="420" y="250" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >× 系数 −8</text>
<text x="420" y="278" font-size="14" text-anchor="middle" fill="#b5451b" font-weight="bold" >= +8 mV</text>
<line x1="420" y1="294" x2="420" y2="340" stroke="#222" stroke-width="1.8"/>
<rect x="180" y="198" width="140" height="96" rx="4" fill="#eaf5e9" stroke="#222" stroke-width="1.8" />
<text x="250" y="224" font-size="14" text-anchor="middle" fill="#111" font-weight="bold" >前 4 个比特 = 1</text>
<text x="250" y="250" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >× 系数 5</text>
<text x="250" y="278" font-size="14" text-anchor="middle" fill="#b5451b" font-weight="bold" >= +5 mV</text>
<line x1="250" y1="294" x2="250" y2="340" stroke="#222" stroke-width="1.8"/>
<line x1="690" y1="246" x2="662" y2="246" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="520" y1="246" x2="492" y2="246" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="350" y1="246" x2="322" y2="246" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="180" y="186" font-size="13" text-anchor="start" fill="#555" font-weight="normal" >← 每过一个比特时间，记录向左移一格</text>
<line x1="760" y1="340" x2="150" y2="340" stroke="#222" stroke-width="2"/>
<line x1="150" y1="340" x2="150" y2="138" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="162" y="160" font-size="14" text-anchor="start" fill="#111" font-weight="bold" >−（减去）</text>
<text x="250" y="365" font-size="14" text-anchor="start" fill="#b5451b" font-weight="normal" >四项相加：+55 mV，这就是前面几个比特留下的干扰</text>
<text x="490" y="410" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >比特为 1 时取 +系数，为 0 时取 −系数（前 3 个比特是 0，所以 −(−8) = +8）</text>
<text x="490" y="438" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >从判决器出来、经“前 1 个比特”回到 Σ 的这一圈，必须在一个比特的时间（DDR5-6400 下 156 皮秒）内走完</text>
</svg>
