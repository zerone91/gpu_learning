<text x="480" y="664" font-size="14" text-anchor="middle" fill="#222">引脚数一直是 1024，HBM4 一次性翻倍后又停住；此后带宽增长全靠每引脚速率，而跑得更快的电路要靠逻辑工艺的基底裸片</text>
