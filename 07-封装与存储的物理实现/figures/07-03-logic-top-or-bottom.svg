<text x="330" y="365" font-size="13" fill="#1f5fa8" font-weight="bold">电：直接进来，最短</text>
<text x="30" y="400" font-size="14" fill="#1f5fa8">✓ 供电最优：电流不用穿过 DRAM</text>
<text x="30" y="422" font-size="14" fill="#c0392b">✗ 散热最差：唯一向上的散热路被 DRAM 堵住，</text>
<text x="30" y="444" font-size="14" fill="#c0392b">   而 DRAM 超过约 85～95 °C 就出错，</text>
<text x="30" y="466" font-size="14" fill="#c0392b">   这条路的温度上限还被卡死</text>
