<text x="700" y="330" font-size="13" fill="#1f5fa8" font-weight="bold">电：几百安培穿过 DRAM 的 TSV</text>
<text x="500" y="400" font-size="14" fill="#c0392b">✓ 散热最优：逻辑裸片直接贴散热器</text>
<text x="500" y="422" font-size="14" fill="#1f5fa8">✗ 供电难：电流要挤过 DRAM 裸片里的 TSV，</text>
<text x="500" y="444" font-size="14" fill="#1f5fa8">   供电 TSV 越多，留给信号和存储的面积越少</text>
<text x="500" y="466" font-size="14" fill="#222">→ Raptor 只堆 1 层 DRAM，容量因此只有 32 GB</text>
<text x="480" y="520" font-size="14" text-anchor="middle" fill="#555">红色箭头 = 热往外走的路；蓝色箭头 = 供电电流进来的路；橙色竖条 = TSV（在硅里竖着打穿、填铜的孔）</text>
<text x="480" y="545" font-size="14" text-anchor="middle" fill="#555">左图画了 3 层 DRAM 只为示意“多层会更糟”；两图厚度都不按比例</text>
