<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">流式分块：每条通道只有 3 个 bank，用 4 次访问凑出 3 个 128 字节的 flit</text>
<text x="480" y="56" font-size="14" text-anchor="middle" fill="#555">一次列访问每个 bank 吐 32 字节；凑一个 128 字节的 flit 本需 4 个 bank，而 768 ÷ 256 = 每通道只有 3 个</text>
<text x="205.0" y="100" font-size="14" text-anchor="middle" font-weight="bold">bank 0</text>
<text x="315.0" y="100" font-size="14" text-anchor="middle" font-weight="bold">bank 1</text>
<text x="425.0" y="100" font-size="14" text-anchor="middle" font-weight="bold">bank 2</text>
<text x="136" y="139.0" font-size="14" text-anchor="end">第 1 次访问</text>
<rect x="152" y="110" width="106" height="48" fill="#9bb7d4" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="205.0" y="139.0" font-size="13" text-anchor="middle">F0 的 32B</text>
<rect x="262" y="110" width="106" height="48" fill="#9bb7d4" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="315.0" y="139.0" font-size="13" text-anchor="middle">F0 的 32B</text>
<rect x="372" y="110" width="106" height="48" fill="#9bb7d4" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="425.0" y="139.0" font-size="13" text-anchor="middle">F0 的 32B</text>
<text x="492" y="139.0" font-size="13" fill="#555">= 96 字节</text>
<text x="136" y="201.0" font-size="14" text-anchor="end">第 2 次访问</text>
<rect x="152" y="172" width="106" height="48" fill="#9fd3a8" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="205.0" y="201.0" font-size="13" text-anchor="middle">F1 的 32B</text>
<rect x="262" y="172" width="106" height="48" fill="#9fd3a8" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="315.0" y="201.0" font-size="13" text-anchor="middle">F1 的 32B</text>
<rect x="372" y="172" width="106" height="48" fill="#9fd3a8" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="425.0" y="201.0" font-size="13" text-anchor="middle">F1 的 32B</text>
<text x="492" y="201.0" font-size="13" fill="#555">= 96 字节</text>
<text x="136" y="263.0" font-size="14" text-anchor="end">第 3 次访问</text>
<rect x="152" y="234" width="106" height="48" fill="#f4c48d" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="205.0" y="263.0" font-size="13" text-anchor="middle">F2 的 32B</text>
<rect x="262" y="234" width="106" height="48" fill="#f4c48d" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="315.0" y="263.0" font-size="13" text-anchor="middle">F2 的 32B</text>
<rect x="372" y="234" width="106" height="48" fill="#f4c48d" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="425.0" y="263.0" font-size="13" text-anchor="middle">F2 的 32B</text>
<text x="492" y="263.0" font-size="13" fill="#555">= 96 字节</text>
<text x="136" y="325.0" font-size="14" text-anchor="end">第 4 次访问</text>
<rect x="152" y="296" width="106" height="48" fill="#9bb7d4" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="205.0" y="325.0" font-size="13" text-anchor="middle">P0 → F0</text>
<rect x="262" y="296" width="106" height="48" fill="#9fd3a8" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="315.0" y="325.0" font-size="13" text-anchor="middle">P1 → F1</text>
<rect x="372" y="296" width="106" height="48" fill="#f4c48d" stroke="#222" stroke-width="1.5" rx="3"/>
<text x="425.0" y="325.0" font-size="13" text-anchor="middle">P2 → F2</text>
<text x="492" y="325.0" font-size="13" fill="#555">= 96 字节</text>
<rect x="146" y="291" width="338" height="58" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
<text x="315.0" y="372" font-size="13" text-anchor="middle" fill="#c0392b">共享的第 4 次：三段分给三个 flit 当尾巴</text>
<text x="760" y="100" font-size="15" text-anchor="middle" font-weight="bold">拼出的 3 个 flit（各 128 字节）</text>
<text x="630" y="149.0" font-size="14" text-anchor="end" font-weight="bold">F0</text>
<rect x="640" y="120" width="184" height="48" fill="#9bb7d4" stroke="#222" stroke-width="1.2"/>
<line x1="701.3" y1="124" x2="701.3" y2="164" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="762.6" y1="124" x2="762.6" y2="164" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
<text x="732" y="149.0" font-size="13" text-anchor="middle" stroke="#9bb7d4" stroke-width="5" paint-order="stroke">第 1 次访问的 96 字节</text>
<rect x="826" y="120" width="60" height="48" fill="#9bb7d4" stroke="#c0392b" stroke-width="2.5"/>
<text x="856" y="149.0" font-size="13" text-anchor="middle">P0</text>
<text x="630" y="231.0" font-size="14" text-anchor="end" font-weight="bold">F1</text>
<rect x="640" y="202" width="184" height="48" fill="#9fd3a8" stroke="#222" stroke-width="1.2"/>
<line x1="701.3" y1="206" x2="701.3" y2="246" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="762.6" y1="206" x2="762.6" y2="246" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
<text x="732" y="231.0" font-size="13" text-anchor="middle" stroke="#9fd3a8" stroke-width="5" paint-order="stroke">第 2 次访问的 96 字节</text>
<rect x="826" y="202" width="60" height="48" fill="#9fd3a8" stroke="#c0392b" stroke-width="2.5"/>
<text x="856" y="231.0" font-size="13" text-anchor="middle">P1</text>
<text x="630" y="313.0" font-size="14" text-anchor="end" font-weight="bold">F2</text>
<rect x="640" y="284" width="184" height="48" fill="#f4c48d" stroke="#222" stroke-width="1.2"/>
<line x1="701.3" y1="288" x2="701.3" y2="328" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="762.6" y1="288" x2="762.6" y2="328" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
<text x="732" y="313.0" font-size="13" text-anchor="middle" stroke="#f4c48d" stroke-width="5" paint-order="stroke">第 3 次访问的 96 字节</text>
<rect x="826" y="284" width="60" height="48" fill="#f4c48d" stroke="#c0392b" stroke-width="2.5"/>
<text x="856" y="313.0" font-size="13" text-anchor="middle">P2</text>
<text x="760" y="382" font-size="13" text-anchor="middle" fill="#555">红框那 32 字节来自第 4 次访问（颜色相同 = 同一个 flit）</text>
<rect x="40" y="430" width="880" height="100" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="60" y="456" font-size="14">对账：4 次访问 × 96 字节 = 384 字节 = 3 个 flit × 128 字节，一个字节不多取、不少取，768 个 bank 一个不闲置。</text>
<text x="60" y="482" font-size="14">若坚持“一次访问凑一个 flit”：每通道要 4 个 bank，768 个 bank 只够 192 条通道满配，三个数里总有一个要让步。</text>
<text x="60" y="508" font-size="14">代价：控制器要按 3 个 flit 一组调度，把第 4 次的结果拆成三份分别拼接，缓冲和记账更复杂。</text>
</svg>