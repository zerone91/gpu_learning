<text x="480" y="532" font-size="13" text-anchor="middle" fill="#555">基底裸片里有两级 PHY（把数字信号变成能在导线上跑的电信号的电路）：TSV PHY 朝上对着核心裸片，微凸块 PHY 朝外对着 GPU</text>
