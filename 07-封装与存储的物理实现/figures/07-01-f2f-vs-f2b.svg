<text x="220.0" y="275" font-size="14" text-anchor="middle">封装 / 中介层</text>
<text x="380" y="176" font-size="13" fill="#222">两个面</text>
<text x="380" y="193" font-size="13" fill="#222">直接对接</text>
<g font-size="14" fill="#222">
<text x="30" y="320">• 两侧金属层直连，中间不经过 TSV：</text>
<text x="30" y="342">  间距只受键合工艺限制，混合键合可到几微米</text>
<text x="30" y="372">• 下层裸片仍要靠 TSV（橙色竖条）把信号</text>
<text x="30" y="394">  和电源送到封装，但那是另一件事</text>
<text x="30" y="424" font-weight="bold" fill="#c0392b">• 每颗裸片只有一个面，两个面都用掉了：</text>
<text x="30" y="446" font-weight="bold" fill="#c0392b">  想加第三层，只能改用面对背</text>
<text x="30" y="484" fill="#555">例：英特尔 Foveros、Foveros Direct，</text>
<text x="30" y="506" fill="#555">台积电 SoIC 的 F2F 版本</text>
</g>
