<text x="670.0" y="356" font-size="14" text-anchor="middle">封装 / 中介层</text>
<text x="828" y="160" font-size="13" fill="#222">上层的面</text>
<text x="828" y="177" font-size="13" fill="#222">贴下层的背</text>
<g font-size="14" fill="#222">
<text x="470" y="400">• 下层的背上原本什么电路都没有，信号必须</text>
<text x="470" y="422">  先经它的 TSV 从面穿到背，才能接上上层</text>
<text x="470" y="452" font-weight="bold" fill="#c0392b">• 连接间距被 TSV 间距卡住（粗一个数量级），</text>
<text x="470" y="474" font-weight="bold" fill="#c0392b">  但每一层都是同样的姿势，可以一直往上叠</text>
<text x="470" y="506" fill="#555">例：HBM 的 8 / 12 / 16 层存储裸片</text>
</g>
<text x="480" y="545" font-size="14" text-anchor="middle" fill="#555">深蓝细条 = 裸片的“面”（晶体管和金属层）；橙色竖条 = TSV；小圆点和小方块 = 层间连接点</text>
</svg>