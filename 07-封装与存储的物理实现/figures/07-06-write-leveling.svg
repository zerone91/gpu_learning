<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5451b"/></marker><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
<text x="500" y="30" font-size="18" text-anchor="middle" fill="#111" font-weight="bold" >写均衡：用 DQS 上升沿去采样，找 0 变 1 的位置</text>
<text x="30" y="70" font-size="15" text-anchor="start" fill="#111" font-weight="bold" >（上）早期做法：被采样的是时钟 CK 本身，它每 312.5 皮秒重复一次</text>
<text x="135" y="140" font-size="14" text-anchor="end" fill="#111" font-weight="normal" >颗粒处的 CK</text>
<polyline points="150.0,160 281.25,160 281.25,110 515.625,110 515.625,160 750.0,160 750.0,110 930.0,110" stroke="#1f5fa8" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
<text x="281.25" y="100" font-size="13" text-anchor="middle" fill="#1f5fa8" font-weight="normal" >87.5</text>
<text x="750.0" y="100" font-size="13" text-anchor="middle" fill="#1f5fa8" font-weight="normal" >400（应对齐的沿）</text>
<line x1="150.0" y1="235" x2="150.0" y2="168" stroke="#b5451b" stroke-width="1.8" marker-end="url(#ar)"/>
