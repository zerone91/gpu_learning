<line x1="750.0" y1="270" x2="750.0" y2="280" stroke="#222" stroke-width="1.5"/>
<text x="750.0" y="297" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >400</text>
<line x1="900.0" y1="270" x2="900.0" y2="280" stroke="#222" stroke-width="1.5"/>
<text x="900.0" y="297" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >500</text>
<text x="938.0" y="297" font-size="13" text-anchor="start" fill="#111" font-weight="normal" >皮秒</text>
<text x="345.0" y="215" font-size="14" text-anchor="start" fill="#b5451b" font-weight="normal" >← 在 87.5 处就出现 0→1，PHY 被引到了早一个周期的沿上</text>
<line x1="20" y1="325" x2="980" y2="325" stroke="#bbb" stroke-width="1.5"/>
<text x="30" y="358" font-size="15" text-anchor="start" fill="#111" font-weight="bold" >（下）DDR5 的做法：被采样的是每条写命令只产生一次的内部脉冲</text>
<text x="135" y="430" font-size="14" text-anchor="end" fill="#111" font-weight="normal" >内部脉冲</text>
<polyline points="150.0,450 750.0,450 750.0,400 930.0,400" stroke="#1f5fa8" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
<text x="750.0" y="390" font-size="13" text-anchor="middle" fill="#1f5fa8" font-weight="normal" >400</text>
<line x1="150.0" y1="525" x2="150.0" y2="458" stroke="#b5451b" stroke-width="1.8" marker-end="url(#ar)"/>
