<line x1="618.75" y1="525" x2="618.75" y2="458" stroke="#b5451b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="618.75" y="542" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold" >0</text>
<line x1="853.125" y1="525" x2="853.125" y2="458" stroke="#b5451b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="853.125" y="542" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold" >1</text>
<text x="135" y="515" font-size="14" text-anchor="end" fill="#111" font-weight="normal" >DQS 上升沿</text>
<text x="135" y="535" font-size="14" text-anchor="end" fill="#111" font-weight="normal" >采到的值</text>
<line x1="150.0" y1="565" x2="930.0" y2="565" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="150.0" y1="560" x2="150.0" y2="570" stroke="#222" stroke-width="1.5"/>
<text x="150.0" y="587" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >0</text>
<line x1="300.0" y1="560" x2="300.0" y2="570" stroke="#222" stroke-width="1.5"/>
<text x="300.0" y="587" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >100</text>
<line x1="450.0" y1="560" x2="450.0" y2="570" stroke="#222" stroke-width="1.5"/>
<text x="450.0" y="587" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >200</text>
<line x1="600.0" y1="560" x2="600.0" y2="570" stroke="#222" stroke-width="1.5"/>
<text x="600.0" y="587" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >300</text>
<line x1="750.0" y1="560" x2="750.0" y2="570" stroke="#222" stroke-width="1.5"/>
<text x="750.0" y="587" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >400</text>
<line x1="900.0" y1="560" x2="900.0" y2="570" stroke="#222" stroke-width="1.5"/>
<text x="900.0" y="587" font-size="13" text-anchor="middle" fill="#111" font-weight="normal" >500</text>
<text x="938.0" y="587" font-size="13" text-anchor="start" fill="#111" font-weight="normal" >皮秒</text>
<text x="180.0" y="425" font-size="14" text-anchor="start" fill="#b5451b" font-weight="normal" >87.5 附近仍采到 0；唯一的 0→1 在 400 处</text>
<text x="500" y="620" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" >横轴是 DQS 的发送延迟；每个红色箭头是一次试探，箭头下的数字是颗粒从 DQ 送回的值</text>
</svg>
