<text x="135" y="245" font-size="14" text-anchor="end" fill="#111" font-weight="normal" >采到的值</text>
<line x1="150.0" y1="275" x2="930.0" y2="275" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="150.0" y1="270" x2="150.0" y2="280" stroke="#222" stroke-width="1.5"/>
