<text x="225.0" y="252" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold" >0</text>
<line x1="262.5" y1="235" x2="262.5" y2="168" stroke="#b5451b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="262.5" y="252" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold" >0</text>
<line x1="300.0" y1="235" x2="300.0" y2="168" stroke="#b5451b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="300.0" y="252" font-size="15" text-anchor="middle" fill="#b5451b" font-weight="bold" >1</text>
