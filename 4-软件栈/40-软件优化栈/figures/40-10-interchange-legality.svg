<text x="238" y="440" font-size="15" text-anchor="middle" fill="#2e8b57" font-weight="bold">第 6 步读第 5、第 2 步的结果：交换合法</text>
<text x="238" y="466" font-size="14" text-anchor="middle" fill="#444444">依赖方向 (1,0)、(0,1)，交换后仍都朝前</text>
<text x="718" y="70" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">读“右上格”</text>
<text x="718" y="96" font-size="15" text-anchor="middle" fill="#222222" font-family="monospace">A[i][j] = A[i-1][j+1] + A[i][j-1]</text>
