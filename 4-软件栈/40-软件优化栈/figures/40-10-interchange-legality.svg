<text x="718" y="440" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">第 6 步要读第 9 步才写的值：交换非法</text>
<text x="718" y="466" font-size="14" text-anchor="middle" fill="#444444">依赖方向 (1,−1)，交换后变成 (−1,1)，朝后了</text>
<text x="40" y="540" font-size="14" text-anchor="start" fill="#444444">格子里的数：交换成 j 在外、i 在内（一列一列地走）之后，这一格第几个被算。黄格是 (2,2)，箭头从它要读的格子指向它。</text>
<text x="40" y="564" font-size="14" text-anchor="start" fill="#444444">原来 i 在外、j 在内（一行一行地走）时，两边都合法：上一行和本行左边的格子总是先算完。</text>
<text x="40" y="596" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">判据：把依赖写成（i 的差, j 的差），交换就是把两个分量对调；对调后第一个非零分量仍为正，交换才合法。</text>
