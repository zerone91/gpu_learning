<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="sans-serif">
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">y = relu(x @ W + b) 的前向链与自动微分挂上的反向节点</text>
<rect x="40" y="64" width="96" height="52" rx="6" fill="#d5ecdc" stroke="#2e8b57" stroke-width="2.5"/>
<text x="88" y="88" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">x</text>
<text x="88" y="107" font-size="12" text-anchor="middle" fill="#444">64 MB</text>
<rect x="40" y="130" width="96" height="52" rx="6" fill="#d5ecdc" stroke="#2e8b57" stroke-width="2.5"/>
<text x="88" y="154" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">W</text>
<text x="88" y="173" font-size="12" text-anchor="middle" fill="#444">参数</text>
<circle cx="210" cy="126" r="30" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="210" y="131" font-size="14" text-anchor="middle" fill="#222222">矩阵乘</text>
<rect x="290" y="100" width="96" height="52" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="338" y="124" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">t1</text>
<text x="338" y="143" font-size="12" text-anchor="middle" fill="#444">64 MB</text>
<circle cx="460" cy="126" r="30" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="460" y="131" font-size="14" text-anchor="middle" fill="#222222">+ b</text>
<rect x="540" y="100" width="96" height="52" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="588" y="124" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">t2</text>
<text x="588" y="143" font-size="12" text-anchor="middle" fill="#444">64 MB</text>
<circle cx="710" cy="126" r="30" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="710" y="131" font-size="14" text-anchor="middle" fill="#222222">relu</text>
<rect x="790" y="100" width="96" height="52" rx="6" fill="#d5ecdc" stroke="#2e8b57" stroke-width="2.5"/>
<text x="838" y="124" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">y</text>
<text x="838" y="143" font-size="12" text-anchor="middle" fill="#444">64 MB</text>
<line x1="136" y1="90" x2="180" y2="114" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="136" y1="156" x2="180" y2="140" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="240" y1="126" x2="288" y2="126" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="386" y1="126" x2="428" y2="126" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="636" y1="126" x2="678" y2="126" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="126" x2="538" y2="126" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="740" y1="126" x2="788" y2="126" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="200" font-size="14" text-anchor="middle" fill="#444">前向（向右）：每个圆圈是一次算子调用，方框是它产出的张量</text>
<rect x="160" y="290" width="190" height="66" rx="6" fill="#f8e3c4" stroke="#c77a12" stroke-width="2"/>
<text x="255" y="318" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">矩阵乘的反向</text>
<text x="255" y="340" font-size="13" text-anchor="middle" fill="#222222">保存 x、W</text>
<rect x="410" y="290" width="190" height="66" rx="6" fill="#f8e3c4" stroke="#c77a12" stroke-width="2"/>
<text x="505" y="318" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">加法的反向</text>
<text x="505" y="340" font-size="13" text-anchor="middle" fill="#222222">什么也不保存</text>
<rect x="660" y="290" width="190" height="66" rx="6" fill="#f8e3c4" stroke="#c77a12" stroke-width="2"/>
<text x="755" y="318" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">relu 的反向</text>
<text x="755" y="340" font-size="13" text-anchor="middle" fill="#222222">保存 y</text>
<line x1="660" y1="323" x2="354" y2="323" stroke="#c77a12" stroke-width="0.01"/>
<line x1="658" y1="323" x2="604" y2="323" stroke="#c77a12" stroke-width="2.5" marker-end="url(#o)"/>
<line x1="408" y1="323" x2="354" y2="323" stroke="#c77a12" stroke-width="2.5" marker-end="url(#o)"/>
<text x="480" y="386" font-size="14" text-anchor="middle" fill="#c77a12">反向图（向左）：loss.backward() 从 y 的节点出发，沿箭头往回走</text>
<line x1="812" y1="154" x2="772" y2="288" stroke="#c77a12" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#o)"/>
<text x="730" y="246" font-size="13" text-anchor="end" fill="#c77a12">y.grad_fn</text>
<text x="730" y="264" font-size="12" text-anchor="end" fill="#c77a12">（y 身上挂的反向节点）</text>
<path d="M 160 312 C 30 312, 14 120, 38 92" stroke="#2e8b57" stroke-width="2" fill="none" stroke-dasharray="3,4" marker-end="url(#n)"/>
<path d="M 160 334 C 50 334, 20 180, 38 158" stroke="#2e8b57" stroke-width="2" fill="none" stroke-dasharray="3,4" marker-end="url(#n)"/>
<path d="M 850 310 C 930 300, 930 180, 888 138" stroke="#2e8b57" stroke-width="2" fill="none" stroke-dasharray="3,4" marker-end="url(#n)"/>
<text x="898" y="246" font-size="13" text-anchor="end" fill="#2e8b57">引用</text>
<text x="56" y="246" font-size="13" text-anchor="start" fill="#2e8b57">引用</text>
<rect x="60" y="430" width="40" height="26" rx="6" fill="#d5ecdc" stroke="#2e8b57" stroke-width="2.5"/>
<text x="110" y="449" font-size="14" text-anchor="start" fill="#222222">被反向节点保留，一直占着显存到反向传播结束：x、y 共 128 MB（W 是参数，本来就常驻）</text>
<rect x="60" y="468" width="40" height="26" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="110" y="487" font-size="14" text-anchor="start" fill="#222222">没人保留：Python 变量不再引用后显存立即归还（t1、t2）</text>
</svg>
