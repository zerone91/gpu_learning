<text x="150.0" y="326.0" font-size="14" text-anchor="start" fill="#777777">A 的通信都落在 B 的计算里，反之亦然；代价：两份激活同时驻留，显存约翻倍</text>
<text x="30.0" y="382.0" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">③ SBO：不切批，dispatch 期间先算不依赖路由结果的共享专家</text>
