<text x="150.0" y="166.0" font-size="14" text-anchor="start" fill="#777777">网络在传时计算单元没事做，6 个单位白白等过去</text>
<text x="30.0" y="222.0" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">② TBO：切成两个微批 A、B（每段时长减半）</text>
