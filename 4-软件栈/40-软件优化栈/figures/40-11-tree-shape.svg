<text x="30" y="500" font-size="14" text-anchor="start" fill="#444444">真实的和是 14。两种配置里，每一步加法都是确定的，没有任何随机性：换成同样的配置再跑，结果逐位相同。</text>
<text x="30" y="526" font-size="14" text-anchor="start" fill="#444444">差别只在哪些数先碰到一起：3 先和 10⁸ 相加就被吃掉（fp32 在 10⁸ 附近的间隔是 8），先和另一个 3 相加就能凑成 6 保留下来。</text>
<text x="30" y="552" font-size="14" text-anchor="start" fill="#444444">块数、每块线程数常随输入尺寸自动选择，所以“换了批大小，结果变了”也是这个原因。</text>
<text x="30" y="588" font-size="13" text-anchor="start" fill="#777777">图例：叶子的颜色表示它被分到哪个块；红字表示这一步的结果经过了舍入（小的数被吃掉，或被凑到 8 的倍数）。</text>
