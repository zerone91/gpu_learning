<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="sans-serif">
<rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480" y="32" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">同一段 y = relu(x @ w + b) 的三种表示：每种优化只在其中一层好做</text>
<rect x="20" y="56" width="290" height="440" rx="8" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1.5"/>
<text x="165.0" y="84" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">图层 IR</text>
<text x="165.0" y="106" font-size="14" text-anchor="middle" fill="#444444">一个算子 = 一个节点</text>
<rect x="335" y="56" width="290" height="440" rx="8" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1.5"/>
<text x="480.0" y="84" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">循环层 IR</text>
<text x="480.0" y="106" font-size="14" text-anchor="middle" fill="#444444">一个算子 = 一组嵌套循环</text>
<rect x="650" y="56" width="290" height="440" rx="8" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1.5"/>
<text x="795.0" y="84" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">指令层 IR</text>
<text x="795.0" y="106" font-size="14" text-anchor="middle" fill="#444444">只剩指令、标签和跳转</text>
<rect x="105.0" y="150" width="120" height="40" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="165.0" y="175.25" font-size="15" text-anchor="middle" fill="#222222">matmul</text>
<rect x="105.0" y="240" width="120" height="40" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="165.0" y="265.25" font-size="15" text-anchor="middle" fill="#222222">add（+ b）</text>
<rect x="105.0" y="330" width="120" height="40" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="165.0" y="355.25" font-size="15" text-anchor="middle" fill="#222222">relu</text>
<line x1="165.0" y1="190" x2="165.0" y2="238" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="165.0" y1="280" x2="165.0" y2="328" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="173.0" y="220" font-size="13" text-anchor="start" fill="#2e8b57">只被 add 用</text>
<text x="173.0" y="310" font-size="13" text-anchor="start" fill="#2e8b57">只被 relu 用</text>
<rect x="89.0" y="136" width="152" height="250" rx="10" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="6 4"/>
<text x="165.0" y="420" font-size="13" text-anchor="middle" fill="#2e8b57">绿虚框：一眼看出三者可以合成一个 kernel</text>
<text x="165.0" y="446" font-size="13" text-anchor="middle" fill="#c0392b">但节点里看不见循环，无从切块</text>
<rect x="355" y="124" width="250" height="140" rx="4" fill="#ffffff" stroke="#2f6db5" stroke-width="1.8"/>
<text x="363" y="144" font-size="14" text-anchor="start" fill="#2f6db5" font-weight="bold">for m, for n：</text>
<rect x="371" y="156" width="224" height="56" rx="4" fill="#ffffff" stroke="#2f6db5" stroke-width="1.8"/>
<text x="379" y="176" font-size="14" text-anchor="start" fill="#2f6db5" font-weight="bold">for k：</text>
<text x="385" y="198" font-size="13" text-anchor="start" fill="#222222" font-family="monospace">acc += x[m][k]·w[k][n]</text>
<text x="375" y="244" font-size="13" text-anchor="start" fill="#222222" font-family="monospace">t[m][n] = acc</text>
<rect x="355" y="276" width="250" height="56" rx="4" fill="#ffffff" stroke="#2f6db5" stroke-width="1.8"/>
<text x="363" y="296" font-size="14" text-anchor="start" fill="#2f6db5" font-weight="bold">for m, for n：</text>
<text x="375" y="320" font-size="13" text-anchor="start" fill="#222222" font-family="monospace">u[m][n] = t[m][n] + b[n]</text>
<rect x="355" y="344" width="250" height="56" rx="4" fill="#ffffff" stroke="#2f6db5" stroke-width="1.8"/>
<text x="363" y="364" font-size="14" text-anchor="start" fill="#2f6db5" font-weight="bold">for m, for n：</text>
<text x="375" y="388" font-size="13" text-anchor="start" fill="#222222" font-family="monospace">y[m][n] = max(u[m][n], 0)</text>
<text x="480.0" y="426" font-size="13" text-anchor="middle" fill="#2e8b57">循环结构清楚：切块、交换、展开都好做</text>
<text x="480.0" y="450" font-size="13" text-anchor="middle" fill="#c0392b">但“这三段原本是三个相邻算子”已不明显，</text>
<text x="480.0" y="468" font-size="13" text-anchor="middle" fill="#c0392b">要靠模式匹配重新认出来才能融合</text>
<rect x="670" y="124" width="240" height="36" rx="4" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="680" y="148" font-size="14" text-anchor="start" fill="#222222">L1：设 k = 0，acc = 0</text>
<rect x="670" y="172" width="240" height="90" rx="4" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="680" y="196" font-size="14" text-anchor="start" fill="#222222">L2：读 x、读 w</text>
<text x="680" y="220" font-size="14" text-anchor="start" fill="#222222">      乘加进 acc</text>
<text x="680" y="244" font-size="14" text-anchor="start" fill="#222222">      k 加 1；k &lt; K 就跳到 L2</text>
<rect x="670" y="274" width="240" height="64" rx="4" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="680" y="298" font-size="14" text-anchor="start" fill="#222222">L3：写回 t</text>
<text x="680" y="322" font-size="14" text-anchor="start" fill="#222222">      n 加 1；n &lt; N 就跳到 L1</text>
<text x="790" y="366" font-size="13" text-anchor="middle" fill="#444444">……（add、relu 同样拆成跳转）</text>
<path d="M910,244 C938,236 938,186 912,182" fill="none" stroke="#7a4fb0" stroke-width="1.5" marker-end="url(#p)"/>
<text x="795.0" y="420" font-size="13" text-anchor="middle" fill="#2e8b57">只有这一层知道每个值占哪个寄存器：</text>
<text x="795.0" y="438" font-size="13" text-anchor="middle" fill="#2e8b57">寄存器分配只能在这里做</text>
<text x="795.0" y="464" font-size="13" text-anchor="middle" fill="#c0392b">“这是个循环”要靠控制流分析重新认</text>
<line x1="312" y1="270" x2="332" y2="270" stroke="#444444" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="627" y1="270" x2="647" y2="270" stroke="#444444" stroke-width="2.5" marker-end="url(#a)"/>
<text x="20" y="530" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">哪种优化在哪层最好做（箭头方向是下沉）：</text>
<text x="30" y="562" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">融合</text>
<text x="205.0" y="562" font-size="14" text-anchor="middle" fill="#2e8b57">✓ 容易</text>
<text x="480.0" y="562" font-size="14" text-anchor="middle" fill="#c77a12">△ 要模式匹配</text>
<text x="795.0" y="562" font-size="14" text-anchor="middle" fill="#c0392b">✗ 几乎不可能</text>
<text x="30" y="592" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">切块</text>
<text x="205.0" y="592" font-size="14" text-anchor="middle" fill="#c0392b">✗ 看不见循环</text>
<text x="480.0" y="592" font-size="14" text-anchor="middle" fill="#2e8b57">✓ 容易</text>
<text x="795.0" y="592" font-size="14" text-anchor="middle" fill="#c0392b">✗ 循环已拆成跳转</text>
<text x="30" y="622" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">寄存器分配</text>
<text x="205.0" y="622" font-size="14" text-anchor="middle" fill="#c0392b">✗ 没有寄存器概念</text>
<text x="480.0" y="622" font-size="14" text-anchor="middle" fill="#c0392b">✗ 还没到那一步</text>
<text x="795.0" y="622" font-size="14" text-anchor="middle" fill="#2e8b57">✓ 只能在这里</text>
</svg>
