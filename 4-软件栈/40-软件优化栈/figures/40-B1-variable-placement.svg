<text x="200.0" y="520.0" font-size="14" text-anchor="start" fill="#222222">acc 一项就是 128×128 = 16384 个 32 位寄存器，是这个 program 用寄存器的大户。</text>
<text x="200.0" y="544.0" font-size="14" text-anchor="start" fill="#222222">qk / p 就是 S 的一个 128×64 小块：算出来、用完，下一轮被新块覆盖。</text>
