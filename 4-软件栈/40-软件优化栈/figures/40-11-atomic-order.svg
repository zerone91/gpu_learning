<text x="334" y="492" font-size="13" text-anchor="middle" fill="#444444">6</text>
<line x1="378" y1="453" x2="442" y2="453" stroke="#777777" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="444" y="438" width="84" height="30" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="486.0" y="457.55" font-size="13" text-anchor="middle" fill="#222222">加块 0</text>
<text x="486" y="492" font-size="13" text-anchor="middle" fill="#444444">100000008</text>
<line x1="530" y1="453" x2="594" y2="453" stroke="#777777" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="596" y="438" width="84" height="30" rx="6" fill="#e9e0f4" stroke="#7a4fb0" stroke-width="2"/>
<text x="638.0" y="457.55" font-size="13" text-anchor="middle" fill="#222222">加块 2</text>
<text x="638" y="492" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">8</text>
<text x="728" y="460" font-size="17" text-anchor="start" fill="#c0392b" font-weight="bold">总和 = 8</text>
<text x="140" y="518" font-size="13" text-anchor="start" fill="#777777">每格下方是加完这一块之后全局变量的值（fp32）</text>
<text x="30" y="556" font-size="14" text-anchor="start" fill="#444444">真实的和是 6。fp32 在 10⁸ 附近相邻两个数相距 8：10⁸ + 3 离 10⁸ 更近，被舍回 10⁸；10⁸ + 6 离 100000008 更近，被舍到它。</text>
<text x="30" y="580" font-size="14" text-anchor="start" fill="#444444">三次运行的代码、输入、硬件完全相同，唯一的差别是四个块到达的先后。</text>
