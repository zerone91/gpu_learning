<text x="638" y="400" font-size="13" text-anchor="middle" fill="#2e8b57" font-weight="bold">6</text>
<text x="728" y="368" font-size="17" text-anchor="start" fill="#2e8b57" font-weight="bold">总和 = 6</text>
