<text x="910.0" y="652" font-size="12" text-anchor="middle" fill="#444444">10⁶</text>
<text x="30" y="680" font-size="14" text-anchor="start" fill="#444444">乘 1024 等于整条分布右移约 3 个数量级（log₁₀1024 ≈ 3），大部分梯度进入 fp16 能正常表示的区域；更新参数前再除以 1024。</text>
<text x="30" y="704" font-size="14" text-anchor="start" fill="#444444">bf16 的范围与 fp32 相同，这些梯度原本就在它的范围内，不需要这一步。</text>
