<text x="150" y="226" font-size="14" text-anchor="start" fill="#444444">绿色（指数位数）决定范围，红色（尾数位数）决定精度。bf16 就是把 fp32 的尾数砍掉 16 位，指数原样保留。</text>
<text x="30" y="274" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">能表示的正数范围（横轴是 10 的几次方，对数刻度）：</text>
