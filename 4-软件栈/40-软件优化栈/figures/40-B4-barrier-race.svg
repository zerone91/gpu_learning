<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="sans-serif">
<rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480.0" y="30.0" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">删掉屏障 ② 会怎样：快的 warp 提前覆盖 As，慢的 warp 读到下一轮的数据（示意）</text>
<text x="30.0" y="70.0" font-size="16" text-anchor="start" fill="#2f6db5" font-weight="bold">① 有屏障 ②：快的 warp 先停下等</text>
<text x="160.0" y="106.0" font-size="14" text-anchor="end" fill="#222222">warp 0（快）</text>
<text x="160.0" y="150.0" font-size="14" text-anchor="end" fill="#222222">warp 7（慢）</text>
<rect x="170.0" y="84.0" width="270.0" height="34.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="305.0" y="106.0" font-size="14" text-anchor="middle" fill="#222222">乘加 第 k 轮</text>
<rect x="170.0" y="128.0" width="405.0" height="34.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="372.5" y="150.0" font-size="14" text-anchor="middle" fill="#222222">乘加 第 k 轮（还在读 As）</text>
<rect x="440.0" y="84.0" width="135.0" height="34.0" rx="3" fill="#ffffff" stroke="#777777" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="507.5" y="106.0" font-size="14" text-anchor="middle" fill="#777777">等 ②</text>
<line x1="575.0" y1="76.0" x2="575.0" y2="170.0" stroke="#222222" stroke-width="2.5"/>
<text x="581.0" y="182.0" font-size="14" text-anchor="start" fill="#222222">屏障 ②：全员到齐才放行</text>
<rect x="575.0" y="84.0" width="180.0" height="34.0" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="665.0" y="106.0" font-size="14" text-anchor="middle" fill="#222222">搬第 k+1 轮 → As</text>
<rect x="575.0" y="128.0" width="180.0" height="34.0" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="665.0" y="150.0" font-size="14" text-anchor="middle" fill="#222222">搬第 k+1 轮 → As</text>
<text x="30.0" y="250.0" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">② 删掉屏障 ②：快的 warp 直接开始搬下一轮</text>
<text x="160.0" y="286.0" font-size="14" text-anchor="end" fill="#222222">warp 0（快）</text>
<text x="160.0" y="330.0" font-size="14" text-anchor="end" fill="#222222">warp 7（慢）</text>
<rect x="170.0" y="264.0" width="270.0" height="34.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="305.0" y="286.0" font-size="14" text-anchor="middle" fill="#222222">乘加 第 k 轮</text>
<rect x="170.0" y="308.0" width="405.0" height="34.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="372.5" y="330.0" font-size="14" text-anchor="middle" fill="#222222">乘加 第 k 轮（还在读 As）</text>
<rect x="440.0" y="264.0" width="180.0" height="34.0" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="530.0" y="286.0" font-size="14" text-anchor="middle" fill="#222222">搬第 k+1 轮 → As</text>
<rect x="440.0" y="308.0" width="135.0" height="34.0" rx="3" fill="none" stroke="#c0392b" stroke-width="3"/>
<line x1="494.0" y1="298.0" x2="494.0" y2="308.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="593.0" y="330.0" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold">← 这段读到的 As 已被 warp 0 改写：结果静默出错</text>
<text x="30.0" y="420.0" font-size="14" text-anchor="start" fill="#222222">As 是整个线程块共用的一块 shared memory。第 k 轮的乘加要从头读到尾，屏障 ② 保证所有 warp 都读完了，才有人往里写第 k+1 轮。</text>
<text x="30.0" y="446.0" font-size="14" text-anchor="start" fill="#777777">被改写的只是部分元素、只在部分轮次，多数输入下误差不大，这正是它难查的原因。</text>
</svg>
