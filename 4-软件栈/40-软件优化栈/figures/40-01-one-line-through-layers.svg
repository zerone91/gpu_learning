<text x="610" y="524" font-size="14" text-anchor="start" fill="#444"><tspan x="610" dy="0">分配到真实的物理寄存器，</tspan><tspan x="610" dy="18.900000000000002">排好指令顺序，产出机器码。</tspan></text>
