<text x="310" y="376" font-size="14" text-anchor="start" fill="#c77a12"><tspan x="310" dy="0">← 一个线程块负责</tspan><tspan x="310" dy="18.900000000000002">    其中一块（如 128×128）</tspan></text>
<text x="610" y="362" font-size="14" text-anchor="start" fill="#222222">决定块切多大、数据放哪一级存储、</text>
<text x="610" y="384" font-size="14" text-anchor="start" fill="#444"><tspan x="610" dy="0">怎样用上 Tensor Core，</tspan><tspan x="610" dy="18.900000000000002">产出一份 kernel 程序（Triton → PTX）。</tspan></text>
