<rect x="470" y="94" width="100" height="44" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="520" y="122" font-size="15" text-anchor="middle" fill="#222222">relu</text>
<text x="610" y="106" font-size="14" text-anchor="start" fill="#222222">三个算子连成的计算图。</text>
<text x="610" y="128" font-size="14" text-anchor="start" fill="#444"><tspan x="610" dy="0">框架还知道：这是训练还是推理、</tspan><tspan x="610" dy="18.900000000000002">要不要为反向传播保留中间结果。</tspan></text>
<rect x="190" y="220" width="380" height="56" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2.5"/>
<text x="380" y="244" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">一个融合组：矩阵乘 + 加偏置 + relu</text>
<text x="380" y="266" font-size="13" text-anchor="middle" fill="#444">加偏置和 relu 在矩阵乘写回结果前顺带完成</text>
<text x="610" y="238" font-size="14" text-anchor="start" fill="#222222">三个节点变成一个。</text>
<text x="610" y="260" font-size="14" text-anchor="start" fill="#444"><tspan x="610" dy="0">两个中间结果不再写进显存，</tspan><tspan x="610" dy="18.900000000000002">也就不用再读回来。</tspan></text>
