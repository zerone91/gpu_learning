<rect x="260" y="100" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="280" y="100" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="300" y="100" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="320" y="100" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="340" y="100" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="200" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="220" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="240" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="260" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="280" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="300" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="320" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="340" y="114" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="200" y="128" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="220" y="128" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="240" y="128" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="260" y="128" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="280" y="128" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
