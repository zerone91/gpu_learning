<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="720" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold">4096³ 矩阵乘（bf16，H100）从整卡到单条指令：每一层的循环对上哪一级硬件</text>
<text x="20" y="62" font-size="14" font-weight="bold" fill="#555">层次</text>
<text x="200" y="62" font-size="14" font-weight="bold" fill="#555">这一层切出了什么（简图）</text>
<text x="420" y="62" font-size="14" font-weight="bold" fill="#555">对上的硬件与数字</text>
<text x="800" y="62" font-size="14" font-weight="bold" fill="#555">动了哪几维</text>
<rect x="10" y="76" width="940" height="92" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
<text x="20" y="124" font-size="15" font-weight="bold">① 整卡 → 线程块</text>
<text x="420" y="112" font-size="14">32 × 16 = 512 块；分给 132 个 SM，</text>
<text x="420" y="134" font-size="14">约 3.9 轮；相邻块尽量同期，多命中 L2</text>
<rect x="800" y="106" width="44" height="24" rx="12" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="822" y="123" text-anchor="middle" font-size="13">切分</text>
<rect x="848" y="106" width="44" height="24" rx="12" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="870" y="123" text-anchor="middle" font-size="13">绑定</text>
<rect x="896" y="106" width="44" height="24" rx="12" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="918" y="123" text-anchor="middle" font-size="13">顺序</text>
<rect x="200" y="86" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
<rect x="220" y="86" width="20" height="14" fill="#fff" stroke="#888" stroke-width="1"/>
