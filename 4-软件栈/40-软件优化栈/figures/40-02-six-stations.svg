<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="sans-serif">
<rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">一次 t1 = x @ W 在框架里经过的六站（都在 CPU 上）</text>
<rect x="120" y="56" width="620" height="62" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="140" y="80" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">第 1 站　Python 绑定</text>
<text x="140" y="104" font-size="13" text-anchor="start" fill="#333">@ 被翻译成 torch.matmul；参数从 Python 对象解析成 C++ 张量</text>
<line x1="430" y1="118" x2="430" y2="136" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="138" width="620" height="78" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="140" y="162" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">第 2 站　分发器算出处理环节</text>
<text x="140" y="186" font-size="13" text-anchor="start" fill="#333"><tspan x="140" dy="0">张量标记（在 CUDA 上、需要梯度）+ 上下文标记（混合精度已开启）</tspan><tspan x="140" dy="18">→ 本次要依次经过：混合精度 → 自动微分 → CUDA 后端</tspan></text>
<line x1="430" y1="216" x2="430" y2="234" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="236" width="620" height="62" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="140" y="260" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">第 3 站　混合精度环节</text>
<text x="140" y="284" font-size="13" text-anchor="start" fill="#333">矩阵乘适合用 bf16；输入已是 bf16，什么也不做，转给下一环</text>
<line x1="430" y1="298" x2="430" y2="316" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="318" width="620" height="78" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="140" y="342" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">第 4 站　自动微分环节</text>
<text x="140" y="366" font-size="13" text-anchor="start" fill="#333"><tspan x="140" dy="0">先转给下一环拿到结果，再给结果挂一个反向节点</tspan><tspan x="140" dy="18">（记下梯度公式，以及要用到的 x、W）</tspan></text>
<line x1="430" y1="396" x2="430" y2="414" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="416" width="620" height="62" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="140" y="440" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">第 5 站　CUDA 后端环节</text>
<text x="140" y="464" font-size="13" text-anchor="start" fill="#333">算输出形状 → 向显存分配器申请输出显存 → 调用 cuBLAS</text>
<line x1="430" y1="478" x2="430" y2="496" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="498" width="620" height="62" rx="6" fill="#f8e3c4" stroke="#c77a12" stroke-width="2"/>
<text x="140" y="522" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">第 6 站　cuBLAS 提交 kernel</text>
<text x="140" y="546" font-size="13" text-anchor="start" fill="#333">挑一个内部实现，经运行时把启动命令放进 GPU 的队列，立即返回</text>
<path d="M 108 58 L 96 58 L 96 560 L 108 560" stroke="#777777" stroke-width="2" fill="none"/>
<text x="84" y="287.0" font-size="15" text-anchor="end" fill="#777777" font-weight="bold">CPU</text>
<text x="84" y="311.0" font-size="13" text-anchor="end" fill="#777777">合计</text>
<text x="84" y="329.0" font-size="13" text-anchor="end" fill="#777777">几到</text>
<text x="84" y="347.0" font-size="13" text-anchor="end" fill="#777777">十几</text>
<text x="84" y="365.0" font-size="13" text-anchor="end" fill="#777777">微秒</text>
<rect x="790" y="450" width="140" height="110" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="2.5"/>
<text x="860" y="480" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">GPU</text>
<text x="860" y="504" font-size="13" text-anchor="middle" fill="#222222">队列里的</text>
<text x="860" y="522" font-size="13" text-anchor="middle" fill="#222222">矩阵乘 kernel</text>
<text x="860" y="544" font-size="13" text-anchor="middle" fill="#c77a12">稍后才开始算</text>
<line x1="740" y1="520" x2="786" y2="510" stroke="#c77a12" stroke-width="2.5" marker-end="url(#o)"/>
<line x1="430" y1="560" x2="430" y2="590" stroke="#2f6db5" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#b)"/>
<text x="430" y="612" font-size="14" text-anchor="middle" fill="#2f6db5">控制权立即回到 Python：t1 已是一个张量对象，但它的数据可能还没算出来</text>
</svg>
