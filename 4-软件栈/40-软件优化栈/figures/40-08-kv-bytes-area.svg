<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="bold">解码一步要读的 KV 字节 = 读多少个 token × 每个 token 多少字节：两个因子分别被谁砍</text>
<line x1="150" y1="350" x2="820" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="150" y1="350" x2="150" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="790" y="394" text-anchor="end" font-size="14">要读多少个 token（横向按比例画）</text>
<text x="138" y="90" text-anchor="end" font-size="14">每个 token</text>
<text x="138" y="110" text-anchor="end" font-size="14">多少字节</text>
<rect x="150" y="120" width="640" height="230" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
<text x="780" y="144" text-anchor="end" font-size="14">多头注意力：32 个 KV 头</text>
<rect x="150" y="292.5" width="640" height="57.5" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="780" y="314.5" text-anchor="end" font-size="14" fill="#1f5fa8">GQA：8 个 KV 头，高度 ÷ 4</text>
<rect x="150" y="334" width="640" height="16" fill="#9fc3ea" stroke="#1f5fa8" stroke-width="2"/>
<text x="170" y="326" font-size="13" fill="#123f73">MLA：低秩压缩，每个 token 存得更少（最下面的矮条，高度示意）</text>
<rect x="150" y="334" width="10.0" height="16" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="450" y1="160" x2="450" y2="286.5" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#a)"/>
<text x="460" y="220" font-size="14" fill="#1f5fa8">GQA、MLA 砍的是高度：</text>
<text x="460" y="240" font-size="14" fill="#1f5fa8">每个 token 存得更省</text>
<line x1="770" y1="416" x2="166.0" y2="416" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="210" y="442" font-size="14" fill="#c0392b">DSA 砍的是宽度：128K 个 token 里只读得分最高的 2048 个（1.6%，左下角那一小条红色）</text>
<text x="150" y="374" font-size="12" fill="#555">0</text>
<text x="790" y="372" text-anchor="end" font-size="12" fill="#555">131072（128K 上下文）</text>
<text x="20" y="504" font-size="13" fill="#555">面积就是要读的字节数。两个方向互不干扰，可以叠乘：DeepSeek-V3.2 在 MLA 的矮条上再用 DSA 只取一小段。</text>
</svg>