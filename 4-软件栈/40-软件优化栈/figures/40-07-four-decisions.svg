<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="bold">矩阵乘 C = A × B 的映射：四个决策各管一件事</text>
<text x="320" y="72" text-anchor="middle" font-size="14">B（K 行 × N 列）</text>
<rect x="200" y="80" width="240" height="96" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<rect x="320" y="80" width="60" height="96" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<line x1="320" y1="104" x2="380" y2="104" stroke="#1f5fa8" stroke-width="1.5"/>
<line x1="320" y1="128" x2="380" y2="128" stroke="#1f5fa8" stroke-width="1.5"/>
<line x1="320" y1="152" x2="380" y2="152" stroke="#1f5fa8" stroke-width="1.5"/>
<rect x="320" y="104" width="60" height="24" fill="#6fa3db" stroke="#1f5fa8" stroke-width="2"/>
<text x="140" y="192" text-anchor="middle" font-size="14">A（M × K）</text>
<rect x="92" y="200" width="96" height="240" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<rect x="92" y="260" width="96" height="60" fill="#fde2c4" stroke="#d9822b" stroke-width="2"/>
<line x1="116" y1="260" x2="116" y2="320" stroke="#d9822b" stroke-width="1.5"/>
<line x1="140" y1="260" x2="140" y2="320" stroke="#d9822b" stroke-width="1.5"/>
<line x1="164" y1="260" x2="164" y2="320" stroke="#d9822b" stroke-width="1.5"/>
<rect x="116" y="260" width="24" height="60" fill="#e8a868" stroke="#d9822b" stroke-width="2"/>
<text x="320" y="462" text-anchor="middle" font-size="14">C（M × N），切成 4 × 4 个输出块</text>
<rect x="200" y="200" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="206" y="217" font-size="12" fill="#888">1</text>
<rect x="260" y="200" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="266" y="217" font-size="12" fill="#888">2</text>
<rect x="320" y="200" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="326" y="217" font-size="12" fill="#888">3</text>
<rect x="380" y="200" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="386" y="217" font-size="12" fill="#888">4</text>
<rect x="200" y="260" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="206" y="277" font-size="12" fill="#888">5</text>
<rect x="260" y="260" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="266" y="277" font-size="12" fill="#888">6</text>
<rect x="320" y="260" width="60" height="60" fill="#d8efd8" stroke="#2e8b57" stroke-width="3"/>
<text x="326" y="277" font-size="12" fill="#888">7</text>
<rect x="380" y="260" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="386" y="277" font-size="12" fill="#888">8</text>
<rect x="200" y="320" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="206" y="337" font-size="12" fill="#888">9</text>
<rect x="260" y="320" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="266" y="337" font-size="12" fill="#888">10</text>
<rect x="320" y="320" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="326" y="337" font-size="12" fill="#888">11</text>
<rect x="380" y="320" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="386" y="337" font-size="12" fill="#888">12</text>
<rect x="200" y="380" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="206" y="397" font-size="12" fill="#888">13</text>
<rect x="260" y="380" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="266" y="397" font-size="12" fill="#888">14</text>
<rect x="320" y="380" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="326" y="397" font-size="12" fill="#888">15</text>
<rect x="380" y="380" width="60" height="60" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="386" y="397" font-size="12" fill="#888">16</text>
<circle cx="458" cy="230" r="13" fill="#333"/><text x="458" y="235" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
<text x="476" y="226" font-size="14" font-weight="bold">切分</text>
<text x="476" y="244" font-size="13">每块多大</text>
<circle cx="458" cy="310" r="13" fill="#333"/><text x="458" y="315" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
<text x="476" y="306" font-size="14" font-weight="bold">顺序</text>
<text x="476" y="324" font-size="13">块按编号先后发放；</text>
<text x="476" y="342" font-size="13">块内沿 K 一段段累加</text>
<line x1="96" y1="336" x2="184" y2="336" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="140" y="356" text-anchor="middle" font-size="12" fill="#555">沿 K 分段</text>
<circle cx="640" cy="70" r="13" fill="#333"/><text x="640" y="75" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
<text x="660" y="75" font-size="14" font-weight="bold">放置：数据待在哪一级存储</text>
<rect x="660" y="92" width="280" height="50" fill="#f5f5f5" stroke="#555" stroke-width="1.5" rx="3"/>
<text x="670" y="113" font-size="14" font-weight="bold">显存（HBM）</text>
<text x="670" y="133" font-size="13">A、B、C 的全部数据</text>
<rect x="660" y="150" width="264" height="50" fill="#f5f5f5" stroke="#555" stroke-width="1.5" rx="3"/>
<text x="670" y="171" font-size="14" font-weight="bold">L2 缓存</text>
<text x="670" y="191" font-size="13">相邻块共用的 A、B 在这里被再次命中</text>
<rect x="660" y="208" width="248" height="50" fill="#f5f5f5" stroke="#555" stroke-width="1.5" rx="3"/>
<text x="670" y="229" font-size="14" font-weight="bold">shared memory（SM 内）</text>
<text x="670" y="249" font-size="13">当前这一段 K 的 A 片和 B 片</text>
<rect x="864" y="216" width="14" height="34" fill="#e8a868" stroke="#d9822b" stroke-width="1.5"/>
<rect x="884" y="226" width="18" height="14" fill="#6fa3db" stroke="#1f5fa8" stroke-width="1.5"/>
<rect x="660" y="266" width="232" height="50" fill="#f5f5f5" stroke="#555" stroke-width="1.5" rx="3"/>
<text x="670" y="287" font-size="14" font-weight="bold">寄存器</text>
<text x="670" y="307" font-size="13">C 块的累加值，从头到尾不离开</text>
<rect x="862" y="276" width="24" height="30" fill="#d8efd8" stroke="#2e8b57" stroke-width="2"/>
<circle cx="640" cy="350" r="13" fill="#333"/><text x="640" y="355" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
<text x="660" y="355" font-size="14" font-weight="bold">绑定：哪个单元负责哪块</text>
<rect x="660" y="370" width="62" height="54" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="3"/>
<rect x="666" y="376" width="50" height="20" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="691" y="391" text-anchor="middle" font-size="12">块 1</text>
<text x="691" y="415" text-anchor="middle" font-size="13">SM 0</text>
<rect x="730" y="370" width="62" height="54" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="3"/>
<rect x="736" y="376" width="50" height="20" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="761" y="391" text-anchor="middle" font-size="12">块 2</text>
<text x="761" y="415" text-anchor="middle" font-size="13">SM 1</text>
<rect x="800" y="370" width="62" height="54" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="3"/>
<rect x="806" y="376" width="50" height="20" fill="#d8efd8" stroke="#2e8b57" stroke-width="1.5"/>
<text x="831" y="391" text-anchor="middle" font-size="12">块 7</text>
<text x="831" y="415" text-anchor="middle" font-size="13">SM 6</text>
<rect x="870" y="370" width="62" height="54" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="3"/>
<rect x="876" y="376" width="50" height="20" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="901" y="391" text-anchor="middle" font-size="12">……</text>
<text x="901" y="415" text-anchor="middle" font-size="13">……</text>
<text x="40" y="550" font-size="13" fill="#555">左图：绿色是第 7 号输出块；算它要用 A 中同一行的橙色条和 B 中同一列的蓝色条；深色小片是正在处理的那一段 K。</text>
<text x="40" y="572" font-size="13" fill="#555">右图：同一组数据在各级存储中的位置（3），以及输出块被交给哪个 SM（4）。块数、SM 编号均为示意。</text>
</svg>