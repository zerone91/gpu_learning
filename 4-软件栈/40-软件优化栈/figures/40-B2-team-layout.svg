<text x="770.0" y="490.0" font-size="14" text-anchor="middle" fill="#222222"></text>
<text x="30.0" y="490.0" font-size="14" text-anchor="start" fill="#222222">屏障：</text>
<text x="30.0" y="530.0" font-size="14" text-anchor="start" fill="#222222">full[s]：“第 s 格装满了”，生产者 → 消费者；empty[s]：“第 s 格用完了”，消费者 → 生产者。</text>
