<text x="480.0" y="30.0" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">FA-3 一个线程块的编制：3 个 warpgroup 分工，寄存器在组间重新分配</text>
<rect x="30.0" y="70.0" width="250.0" height="60.0" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="155.0" y="97.0" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">WG0 生产者</text>
<text x="155.0" y="115.0" font-size="14" text-anchor="middle" fill="#777777">128 线程，选 1 个发 TMA 订单</text>
<rect x="30.0" y="144.0" width="250.0" height="60.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="155.0" y="171.0" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">WG1 消费者甲</text>
<text x="155.0" y="189.0" font-size="14" text-anchor="middle" fill="#777777">矩阵乘 + softmax</text>
<rect x="30.0" y="218.0" width="250.0" height="60.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="155.0" y="245.0" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">WG2 消费者乙</text>
<text x="155.0" y="263.0" font-size="14" text-anchor="middle" fill="#777777">与甲同工，错开半拍</text>
<text x="320.0" y="66.0" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">每个线程的寄存器数（启动时平分 → setmaxnreg 之后）</text>
<rect x="320.0" y="84.0" width="235.2" height="18.0" rx="3" fill="#ffffff" stroke="#777777" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="563.2" y="99.0" font-size="14" text-anchor="start" fill="#777777">168（平分）</text>
<rect x="320.0" y="108.0" width="33.6" height="20.0" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="361.6" y="124.0" font-size="14" text-anchor="start" fill="#c77a12" font-weight="bold">24：交出（dealloc）</text>
<rect x="320.0" y="158.0" width="235.2" height="18.0" rx="3" fill="#ffffff" stroke="#777777" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="563.2" y="173.0" font-size="14" text-anchor="start" fill="#777777">168（平分）</text>
<rect x="320.0" y="182.0" width="336.0" height="20.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="664.0" y="198.0" font-size="14" text-anchor="start" fill="#2f6db5" font-weight="bold">240：扩容（alloc）</text>
<rect x="320.0" y="232.0" width="235.2" height="18.0" rx="3" fill="#ffffff" stroke="#777777" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="563.2" y="247.0" font-size="14" text-anchor="start" fill="#777777">168（平分）</text>
<rect x="320.0" y="256.0" width="336.0" height="20.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="664.0" y="272.0" font-size="14" text-anchor="start" fill="#2f6db5" font-weight="bold">240：扩容（alloc）</text>
<text x="320.0" y="312.0" font-size="14" text-anchor="start" fill="#222222">合计：128×24 + 256×240 = 64512 个，没超过每个 SM 的 65536 个</text>
<text x="320.0" y="334.0" font-size="14" text-anchor="start" fill="#777777">消费者多出的寄存器用来装输出累加器 acc</text>
<text x="30.0" y="378.0" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">shared memory 布局（S = 3 级流水）</text>
<rect x="30.0" y="392.0" width="110.0" height="44.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
