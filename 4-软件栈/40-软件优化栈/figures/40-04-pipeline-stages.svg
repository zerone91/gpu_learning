<line x1="832.0" y1="78" x2="832.0" y2="186" stroke="#c77a12" stroke-width="2" stroke-dasharray="5,4"/>
<text x="838.0" y="184" font-size="13" text-anchor="start" fill="#c77a12" font-weight="bold">共 1900 拍</text>
<text x="20" y="238" font-size="15" text-anchor="start" fill="#2f6db5" font-weight="bold">N=3：每块的搬运提前两轮发出，等待消失</text>
<text x="100" y="272" font-size="13" text-anchor="end" fill="#444">搬→缓冲甲</text>
<text x="100" y="306" font-size="13" text-anchor="end" fill="#444">搬→缓冲乙</text>
