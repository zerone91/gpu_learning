<line x1="490.0" y1="420" x2="490.0" y2="426" stroke="#777777" stroke-width="1.5"/>
<text x="490.0" y="444" font-size="12" text-anchor="middle" fill="#777777">1000</text>
<line x1="680.0" y1="420" x2="680.0" y2="426" stroke="#777777" stroke-width="1.5"/>
