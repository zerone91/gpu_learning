<line x1="870.0" y1="420" x2="870.0" y2="426" stroke="#777777" stroke-width="1.5"/>
<text x="870.0" y="444" font-size="12" text-anchor="middle" fill="#777777">2000</text>
<line x1="110" y1="420" x2="870.0" y2="420" stroke="#777777" stroke-width="1.5"/>
<text x="96" y="444" font-size="12" text-anchor="end" fill="#777777">时间（拍）</text>
<text x="480" y="470" font-size="13" text-anchor="middle" fill="#777777">假设多笔搬运可以同时在路上、互不拖慢；代价是每多一级，shared memory 多占一份缓冲</text>
