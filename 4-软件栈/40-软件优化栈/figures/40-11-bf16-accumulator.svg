<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="sans-serif">
<rect x="0" y="0" width="960" height="590" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480" y="32" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">把 1024 个 1 依次加起来：fp32 累加器得 1024，bf16 累加器停在 256</text>
<line x1="110" y1="470" x2="680" y2="470" stroke="#444444" stroke-width="1.5"/>
<line x1="110" y1="470" x2="110" y2="80" stroke="#444444" stroke-width="1.5"/>
<line x1="110.0" y1="470" x2="110.0" y2="476" stroke="#444444" stroke-width="1.5"/>
<text x="110.0" y="494" font-size="13" text-anchor="middle" fill="#222222">0</text>
<line x1="104" y1="470.0" x2="110" y2="470.0" stroke="#444444" stroke-width="1.5"/>
<text x="100" y="475.0" font-size="13" text-anchor="end" fill="#222222">0</text>
<line x1="250.0" y1="470" x2="250.0" y2="476" stroke="#444444" stroke-width="1.5"/>
<text x="250.0" y="494" font-size="13" text-anchor="middle" fill="#222222">256</text>
<line x1="104" y1="375.0" x2="110" y2="375.0" stroke="#444444" stroke-width="1.5"/>
<text x="100" y="380.0" font-size="13" text-anchor="end" fill="#222222">256</text>
<line x1="110" y1="375.0" x2="670" y2="375.0" stroke="#eeeeee" stroke-width="1.5"/>
<line x1="390.0" y1="470" x2="390.0" y2="476" stroke="#444444" stroke-width="1.5"/>
<text x="390.0" y="494" font-size="13" text-anchor="middle" fill="#222222">512</text>
<line x1="104" y1="280.0" x2="110" y2="280.0" stroke="#444444" stroke-width="1.5"/>
<text x="100" y="285.0" font-size="13" text-anchor="end" fill="#222222">512</text>
<line x1="110" y1="280.0" x2="670" y2="280.0" stroke="#eeeeee" stroke-width="1.5"/>
<line x1="530.0" y1="470" x2="530.0" y2="476" stroke="#444444" stroke-width="1.5"/>
<text x="530.0" y="494" font-size="13" text-anchor="middle" fill="#222222">768</text>
<line x1="104" y1="185.0" x2="110" y2="185.0" stroke="#444444" stroke-width="1.5"/>
<text x="100" y="190.0" font-size="13" text-anchor="end" fill="#222222">768</text>
<line x1="110" y1="185.0" x2="670" y2="185.0" stroke="#eeeeee" stroke-width="1.5"/>
<line x1="670.0" y1="470" x2="670.0" y2="476" stroke="#444444" stroke-width="1.5"/>
<text x="670.0" y="494" font-size="13" text-anchor="middle" fill="#222222">1024</text>
<line x1="104" y1="90.0" x2="110" y2="90.0" stroke="#444444" stroke-width="1.5"/>
<text x="100" y="95.0" font-size="13" text-anchor="end" fill="#222222">1024</text>
<line x1="110" y1="90.0" x2="670" y2="90.0" stroke="#eeeeee" stroke-width="1.5"/>
<text x="390.0" y="520" font-size="14" text-anchor="middle" fill="#444444">已经加进去的 1 的个数</text>
<text x="40" y="260.0" font-size="14" text-anchor="middle" fill="#444444">累加器</text>
<text x="40" y="280.0" font-size="14" text-anchor="middle" fill="#444444">当前的值</text>
<line x1="110.0" y1="470.0" x2="670.0" y2="90.0" stroke="#2e8b57" stroke-width="3"/>
<text x="678.0" y="95.0" font-size="14" text-anchor="start" fill="#2e8b57" font-weight="bold">fp32 累加器：1024</text>
<path d="M110.0,470.0 L250.0,375.0 L670.0,375.0" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="678.0" y="380.0" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold">bf16 累加器：256</text>
<circle cx="250.0" cy="375.0" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="390.0" y1="311.0" x2="258.0" y2="369.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="396.0" y="299.0" font-size="13" text-anchor="start" fill="#c0392b">到 256 时，相邻两个 bf16 数</text>
<text x="396.0" y="317.0" font-size="13" text-anchor="start" fill="#c0392b">相距 2（256、258）；256 + 1</text>
<text x="396.0" y="335.0" font-size="13" text-anchor="start" fill="#c0392b">正好在中间，按“取偶数”舍回 256</text>
<text x="294.0" y="405.0" font-size="13" text-anchor="start" fill="#c0392b">之后每加一个 1 都被舍掉：后面 768 个数白加了</text>
<text x="720" y="150" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">为什么是 256：</text>
<text x="720" y="176" font-size="13" text-anchor="start" fill="#444444">bf16 有 7 位尾数，加上</text>
<text x="720" y="198" font-size="13" text-anchor="start" fill="#444444">隐含的最高位共 8 位有效</text>
<text x="720" y="220" font-size="13" text-anchor="start" fill="#444444">位，能精确表示的整数</text>
<text x="720" y="242" font-size="13" text-anchor="start" fill="#444444">只到 2⁸ = 256。</text>
<text x="720" y="264" font-size="13" text-anchor="start" fill="#444444"></text>
<text x="720" y="286" font-size="13" text-anchor="start" fill="#444444">fp32 有 24 位有效位，</text>
<text x="720" y="308" font-size="13" text-anchor="start" fill="#444444">到 2²⁴ ≈ 1677 万才会</text>
<text x="720" y="330" font-size="13" text-anchor="start" fill="#444444">出现同样的停滞。</text>
<text x="30" y="572" font-size="14" text-anchor="start" fill="#444444">这就是硬件“输入低精度、累加器高精度”的原因：Tensor Core 读 bf16 的输入，但在 fp32 里累加。</text>
</svg>
