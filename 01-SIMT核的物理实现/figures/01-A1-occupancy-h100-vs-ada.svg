<text x="90" y="116" font-size="15" text-anchor="end" fill="#222">寄存器堆</text>
<text x="100" y="154" font-size="14" fill="#555">每块需要 48 × 256 = 12288 个寄存器；65536 ÷ 12288 = 5.33，只能放下 5 个整块。</text>
