<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">同一个 kernel（每线程 48 个寄存器、每块 256 线程）在 H100 和 Ada 上的驻留账</text>
<text x="30" y="72" font-size="16" fill="#222" font-weight="bold">第一步：寄存器堆能放下几个线程块？（两种卡都是每 SM 65536 个寄存器）</text>
