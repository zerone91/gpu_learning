<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="sans-serif">
<rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f4f4f4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern>
</defs>
<text x="480" y="26" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">屏障管“到齐”，栅栏管“看见”：两个独立的保证</text>
<!-- barrier -->
<text x="30" y="62" font-size="16" fill="#222" font-weight="bold">上：屏障（barrier）—— 先到的停下来，等最后一个到了一起走</text>
<text x="30" y="100" font-size="15" fill="#222">warp 0</text>
<rect x="120" y="84" width="220" height="24" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<rect x="340" y="84" width="240" height="24" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<rect x="590" y="84" width="200" height="24" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="30" y="136" font-size="15" fill="#222">warp 1</text>
<rect x="120" y="120" width="340" height="24" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<rect x="460" y="120" width="120" height="24" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<rect x="590" y="120" width="200" height="24" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="30" y="172" font-size="15" fill="#222">warp 2</text>
<rect x="120" y="156" width="460" height="24" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<rect x="590" y="156" width="200" height="24" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<line x1="585" y1="74" x2="585" y2="192" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="585" y="210" font-size="14" text-anchor="middle" fill="#c0392b">屏障</text>
<text x="230" y="101" font-size="14" text-anchor="middle" fill="#222">干活</text>
<text x="460" y="101" font-size="14" text-anchor="middle" fill="#555">等</text>
<text x="520" y="137" font-size="14" text-anchor="middle" fill="#555">等</text>
<text x="690" y="137" font-size="14" text-anchor="middle" fill="#222">一起继续</text>
<rect x="805" y="84" width="16" height="16" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="828" y="98" font-size="14" fill="#222">在执行</text>
<rect x="805" y="110" width="16" height="16" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<text x="828" y="124" font-size="14" fill="#222">停下等</text>
<text x="30" y="236" font-size="15" fill="#222">保证的是“进度”：过了这条线，每个成员都已执行完线前的代码。</text>
<line x1="20" y1="256" x2="940" y2="256" stroke="#ddd" stroke-width="1.5"/>
<!-- fence -->
<text x="30" y="288" font-size="16" fill="#222" font-weight="bold">下：栅栏（fence）—— 线程 A 按顺序写 data = 42、flag = 1；线程 B 看到 flag 为 1 就去读 data</text>
<!-- left case -->
<text x="240" y="324" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">没有栅栏</text>
<text x="30" y="360" font-size="14" fill="#222">A 的代码</text>
<rect x="110" y="342" width="110" height="28" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="165" y="361" font-size="14" text-anchor="middle" fill="#222">data = 42</text>
<rect x="240" y="342" width="100" height="28" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="290" y="361" font-size="14" text-anchor="middle" fill="#222">flag = 1</text>
<text x="30" y="424" font-size="14" fill="#222">B 看到</text>
<line x1="110" y1="418" x2="450" y2="418" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="440" font-size="14" text-anchor="end" fill="#555">时间</text>
<circle cx="200" cy="418" r="6" fill="#e08a1e"/>
<text x="200" y="404" font-size="14" text-anchor="middle" fill="#222">flag 变 1</text>
<circle cx="380" cy="418" r="6" fill="#e08a1e"/>
<text x="380" y="404" font-size="14" text-anchor="middle" fill="#222">data 变 42</text>
<line x1="280" y1="428" x2="280" y2="460" stroke="#c0392b" stroke-width="2"/>
<text x="280" y="480" font-size="14" text-anchor="middle" fill="#c0392b">B 在此刻读：flag = 1，data 仍是 0 ✘</text>
<text x="30" y="516" font-size="14" fill="#222">硬件为了快，可以让后写的 flag 先被别人看到。</text>
<!-- divider -->
<line x1="480" y1="310" x2="480" y2="540" stroke="#ddd" stroke-width="1.5"/>
<!-- right case -->
<text x="720" y="324" font-size="16" text-anchor="middle" fill="#2e8b57" font-weight="bold">中间加栅栏 __threadfence()</text>
<text x="500" y="360" font-size="14" fill="#222">A 的代码</text>
<rect x="570" y="342" width="100" height="28" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="620" y="361" font-size="14" text-anchor="middle" fill="#222">data = 42</text>
<rect x="680" y="342" width="70" height="28" fill="#f5cccc" stroke="#c0392b" stroke-width="2"/>
<text x="715" y="361" font-size="14" text-anchor="middle" fill="#222">栅栏</text>
<rect x="760" y="342" width="100" height="28" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="810" y="361" font-size="14" text-anchor="middle" fill="#222">flag = 1</text>
<text x="500" y="424" font-size="14" fill="#222">B 看到</text>
<line x1="570" y1="418" x2="930" y2="418" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="930" y="440" font-size="14" text-anchor="end" fill="#555">时间</text>
<circle cx="650" cy="418" r="6" fill="#e08a1e"/>
<text x="650" y="404" font-size="14" text-anchor="middle" fill="#222">data 变 42</text>
<circle cx="820" cy="418" r="6" fill="#e08a1e"/>
<text x="820" y="404" font-size="14" text-anchor="middle" fill="#222">flag 变 1</text>
<line x1="870" y1="428" x2="870" y2="460" stroke="#2e8b57" stroke-width="2"/>
<text x="870" y="480" font-size="14" text-anchor="end" fill="#2e8b57">B 一旦看到 flag = 1，data 必是 42 ✔</text>
<text x="500" y="516" font-size="14" fill="#222">栅栏只规定先后，不让任何人停下来等。</text>
<text x="480" y="568" font-size="15" text-anchor="middle" fill="#222">__syncthreads() 两样都给：既等全块到齐，又保证块内写入互相可见。</text>
<text x="480" y="594" font-size="14" text-anchor="middle" fill="#555">（下半部分的可见时刻为示意）</text>
</svg>
