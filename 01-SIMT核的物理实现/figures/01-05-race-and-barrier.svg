<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f4f4f4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern>
</defs>
<text x="480" y="26" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">线程 0 写 sh_val、其他线程读它：同一段代码，有没有屏障</text>
<!-- panel 1 -->
<text x="30" y="62" font-size="16" fill="#c0392b" font-weight="bold">① 没有同步：warp 1 先被调度，抢在写入之前读了</text>
<text x="30" y="98" font-size="15" fill="#222">warp 0（含线程 0）</text>
<rect x="240" y="80" width="150" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
<text x="315" y="99" font-size="14" text-anchor="middle" fill="#555">还没轮到它</text>
<rect x="390" y="80" width="200" height="28" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="490" y="99" font-size="14" text-anchor="middle" fill="#222">compute()</text>
<rect x="590" y="80" width="90" height="28" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="635" y="99" font-size="14" text-anchor="middle" fill="#222">写 sh_val</text>
<rect x="680" y="80" width="90" height="28" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="725" y="99" font-size="14" text-anchor="middle" fill="#222">读 sh_val</text>
<text x="30" y="138" font-size="15" fill="#222">warp 1（线程 32–63）</text>
<rect x="260" y="120" width="90" height="28" fill="#f5cccc" stroke="#c0392b" stroke-width="2"/>
<text x="305" y="139" font-size="14" text-anchor="middle" fill="#222">读 sh_val</text>
<text x="362" y="139" font-size="14" fill="#c0392b">→ 读到的是旧值，result 算错 ✘</text>
<text x="30" y="178" font-size="15" fill="#555">sh_val 里的值</text>
<rect x="240" y="162" width="440" height="24" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
<text x="460" y="179" font-size="14" text-anchor="middle" fill="#555">旧值（上一轮留下的，或垃圾）</text>
<rect x="680" y="162" width="240" height="24" fill="#d4eddc" stroke="#2e8b57" stroke-width="1.5"/>
<text x="800" y="179" font-size="14" text-anchor="middle" fill="#222">新值</text>
<line x1="20" y1="210" x2="940" y2="210" stroke="#ddd" stroke-width="1.5"/>
<!-- panel 2 -->
<text x="30" y="244" font-size="16" fill="#2e8b57" font-weight="bold">② 写和读之间加一行 __syncthreads()：先到的等后到的</text>
<text x="30" y="280" font-size="15" fill="#222">warp 0（含线程 0）</text>
<rect x="240" y="262" width="150" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
<text x="315" y="281" font-size="14" text-anchor="middle" fill="#555">还没轮到它</text>
<rect x="390" y="262" width="200" height="28" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="490" y="281" font-size="14" text-anchor="middle" fill="#222">compute()</text>
<rect x="590" y="262" width="90" height="28" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="635" y="281" font-size="14" text-anchor="middle" fill="#222">写 sh_val</text>
<rect x="700" y="262" width="90" height="28" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="745" y="281" font-size="14" text-anchor="middle" fill="#222">读 sh_val</text>
<text x="30" y="320" font-size="15" fill="#222">warp 1（线程 32–63）</text>
<rect x="260" y="302" width="430" height="28" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<rect x="400" y="305" width="180" height="22" fill="#ffffff" stroke="none"/>
<text x="490" y="321" font-size="14" text-anchor="middle" fill="#222">到了屏障，停下等 warp 0</text>
<rect x="700" y="302" width="90" height="28" fill="#d4eddc" stroke="#2e8b57" stroke-width="2"/>
<text x="745" y="321" font-size="14" text-anchor="middle" fill="#222">读 sh_val</text>
<text x="800" y="321" font-size="14" fill="#2e8b57">→ 新值 ✔</text>
<line x1="692" y1="252" x2="692" y2="372" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="692" y="390" font-size="14" text-anchor="middle" fill="#c0392b">屏障：全块到齐才放行</text>
<text x="30" y="360" font-size="15" fill="#555">sh_val 里的值</text>
<rect x="240" y="344" width="440" height="24" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
<text x="460" y="361" font-size="14" text-anchor="middle" fill="#555">旧值</text>
<rect x="680" y="344" width="240" height="24" fill="#d4eddc" stroke="#2e8b57" stroke-width="1.5"/>
<text x="800" y="361" font-size="14" text-anchor="middle" fill="#222">新值</text>
<!-- time axis -->
<line x1="240" y1="420" x2="930" y2="420" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="930" y="444" font-size="15" text-anchor="end" fill="#222">时间</text>
<text x="240" y="444" font-size="14" fill="#555">两个 warp 谁先被调度，每次运行都可能不同（示意）</text>
</svg>
