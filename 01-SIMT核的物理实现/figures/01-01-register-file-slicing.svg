<text x="480.0" y="30.0" font-family="sans-serif" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">寄存器堆是按线程切分的“容量”：每线程要的越多，同时住得下的 warp 越少</text>
<text x="40.0" y="68.0" font-family="sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="bold">情况一：每线程 32 个寄存器 → 一个 warp 占 32×32 = 1024 个 → 65536 ÷ 1024 = 64 个 warp（满员）</text>
