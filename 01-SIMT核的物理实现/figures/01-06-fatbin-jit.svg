<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86a0c"/></marker>
</defs>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">胖二进制：2020 年打的包，怎样在 2025 年的新卡上跑起来</text>
<!-- developer side -->
<rect x="20" y="50" width="380" height="490" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="210" y="76" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">2020 年 · 开发者的机器</text>
<rect x="110" y="92" width="200" height="40" rx="6" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="210" y="118" font-size="15" text-anchor="middle" fill="#222">CUDA 源码</text>
<line x1="210" y1="134" x2="210" y2="160" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="222" y="152" font-size="14" fill="#555">前端编译器</text>
<rect x="110" y="162" width="200" height="40" rx="6" fill="#fbe3c4" stroke="#222" stroke-width="2"/>
<text x="210" y="188" font-size="15" text-anchor="middle" fill="#222">PTX（虚拟指令）</text>
<line x1="170" y1="204" x2="110" y2="250" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="250" y1="204" x2="310" y2="250" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="92" y="228" font-size="14" text-anchor="middle" fill="#555">ptxas</text>
<text x="330" y="228" font-size="14" text-anchor="middle" fill="#555">ptxas</text>
<rect x="40" y="252" width="150" height="40" rx="6" fill="#dbe8f6" stroke="#222" stroke-width="2"/>
<text x="115" y="278" font-size="15" text-anchor="middle" fill="#222">Volta 的 SASS</text>
<rect x="230" y="252" width="150" height="40" rx="6" fill="#dbe8f6" stroke="#222" stroke-width="2"/>
<text x="305" y="278" font-size="15" text-anchor="middle" fill="#222">Ampere 的 SASS</text>
<line x1="115" y1="294" x2="130" y2="344" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="305" y1="294" x2="290" y2="344" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="210" y1="204" x2="210" y2="342" stroke="#222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="180" y="306" width="60" height="22" fill="#fafafa"/>
<text x="210" y="322" font-size="14" text-anchor="middle" fill="#555">原样带上</text>
<rect x="50" y="346" width="320" height="130" rx="8" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<text x="210" y="368" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">可执行文件（胖二进制）</text>
<rect x="66" y="378" width="140" height="36" rx="4" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="136" y="402" font-size="14" text-anchor="middle" fill="#222">Volta 的 SASS</text>
<rect x="214" y="378" width="140" height="36" rx="4" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="284" y="402" font-size="14" text-anchor="middle" fill="#222">Ampere 的 SASS</text>
<rect x="66" y="422" width="288" height="40" rx="4" fill="#fbe3c4" stroke="#222" stroke-width="1.5"/>
<text x="210" y="447" font-size="14" text-anchor="middle" fill="#222">一份 PTX（给未来的卡兜底）</text>
<text x="210" y="508" font-size="14" text-anchor="middle" fill="#555">发布给用户</text>
<line x1="372" y1="410" x2="440" y2="410" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
<!-- user side -->
<rect x="440" y="50" width="500" height="490" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="690" y="76" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">2025 年 · 用户的机器（Blackwell 卡）</text>
<rect x="540" y="96" width="300" height="60" rx="30" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="690" y="122" font-size="15" text-anchor="middle" fill="#222">驱动加载程序时先问：</text>
<text x="690" y="144" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">包里有 Blackwell 的 SASS 吗？</text>
<line x1="600" y1="158" x2="530" y2="210" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#g)"/>
<text x="540" y="186" font-size="14" fill="#2e8b57" text-anchor="end">有</text>
<line x1="780" y1="158" x2="830" y2="210" stroke="#b86a0c" stroke-width="2.5" marker-end="url(#o)"/>
<text x="822" y="186" font-size="14" fill="#b86a0c">没有（本例）</text>
<rect x="455" y="212" width="170" height="64" rx="6" fill="#d4eddc" stroke="#2e8b57" stroke-width="2"/>
<text x="540" y="238" font-size="14" text-anchor="middle" fill="#222">直接加载运行</text>
<text x="540" y="260" font-size="14" text-anchor="middle" fill="#222">启动最快</text>
<rect x="690" y="212" width="236" height="64" rx="6" fill="#fbe3c4" stroke="#b86a0c" stroke-width="2"/>
<text x="808" y="238" font-size="14" text-anchor="middle" fill="#222">取出包里那份 PTX</text>
<text x="808" y="260" font-size="14" text-anchor="middle" fill="#222">交给驱动内置的 ptxas</text>
<line x1="808" y1="278" x2="808" y2="306" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="690" y="308" width="236" height="64" rx="6" fill="#fbe3c4" stroke="#b86a0c" stroke-width="2"/>
<text x="808" y="334" font-size="14" text-anchor="middle" fill="#222">当场编出 Blackwell 的 SASS</text>
<text x="808" y="356" font-size="14" text-anchor="middle" fill="#c0392b">（JIT，首次运行慢几秒）</text>
<line x1="808" y1="374" x2="808" y2="402" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="690" y="404" width="236" height="64" rx="6" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="808" y="430" font-size="14" text-anchor="middle" fill="#222">结果写进磁盘缓存</text>
<text x="808" y="452" font-size="14" text-anchor="middle" fill="#222">然后运行</text>
<path d="M690,436 C 600,436 560,380 555,280" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<text x="600" y="470" font-size="14" text-anchor="middle" fill="#2e8b57">第二次运行起：</text>
<text x="600" y="490" font-size="14" text-anchor="middle" fill="#2e8b57">缓存里已有 SASS，</text>
<text x="600" y="510" font-size="14" text-anchor="middle" fill="#2e8b57">和“有”那条一样快</text>
</svg>
