<text x="160" y="414" font-size="14" text-anchor="end" fill="#555">时间（示意单位）</text>
<text x="20" y="440" font-size="14" fill="#555">假设每块搬运 2 个单位、计算 2 个单位。黑色箭头：这一轮的 wait 等到了本轮要算的那一块；</text>
<text x="20" y="462" font-size="14" fill="#555">红色箭头：wait_group 0 还要多等刚发出去的下一块，计算被推迟。buf0、buf1 是 shared memory 里轮流使用的两块缓冲区。</text>
