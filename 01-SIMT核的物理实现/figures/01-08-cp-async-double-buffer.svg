<text x="20" y="236" font-size="16" fill="#222" font-weight="bold">下：cp.async.wait_group 0 —— 要求“在途 = 0 组”，每轮都等全部到货才开算</text>
<text x="160" y="271" font-size="15" text-anchor="end" fill="#2c6fb7">搬运（LDGSTS）</text>
