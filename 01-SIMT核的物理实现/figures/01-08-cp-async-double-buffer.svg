<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">双缓冲下，wait_group 的参数决定搬运和计算能不能重叠（4 块数据，示意）</text>
<text x="20" y="70" font-size="16" fill="#222" font-weight="bold">上：cp.async.wait_group 1 —— 只要求“在途 ≤ 1 组”，所以下一块可以边飞边算</text>
<text x="160" y="105" font-size="15" text-anchor="end" fill="#2c6fb7">搬运（LDGSTS）</text>
<text x="160" y="163" font-size="15" text-anchor="end" fill="#b86a0c">计算（HMMA 等）</text>
