<text x="112" y="425.0" font-size="14" text-anchor="end" fill="#222">1</text>
<line x1="120" y1="320.1" x2="860" y2="320.1" stroke="#eee" stroke-width="1.5"/>
<text x="112" y="325.1" font-size="14" text-anchor="end" fill="#222">10</text>
<line x1="120" y1="220.1" x2="860" y2="220.1" stroke="#eee" stroke-width="1.5"/>
<text x="112" y="225.1" font-size="14" text-anchor="end" fill="#222">100</text>
<line x1="120" y1="120.2" x2="860" y2="120.2" stroke="#eee" stroke-width="1.5"/>
