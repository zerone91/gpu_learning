<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="sans-serif">
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb7"/></marker></defs>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">FlashAttention 的分块扫描（左）与在线 softmax 的一个数字例子（右）</text>
<text x="30" y="62" font-size="16" fill="#222" font-weight="bold">左：一个 Q 块留在片上，K、V 一块一块流过</text>
<rect x="30" y="80" width="120" height="440" fill="#fbe3c4" stroke="#b86a0c" stroke-width="2" rx="6"/>
<text x="90" y="104" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">显存 HBM</text>
<rect x="46" y="120" width="88" height="42" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="90" y="138" font-size="14" text-anchor="middle" fill="#222">K0、V0</text>
<text x="90" y="155" font-size="14" text-anchor="middle" fill="#555">128 行</text>
<rect x="46" y="172" width="88" height="42" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="90" y="190" font-size="14" text-anchor="middle" fill="#222">K1、V1</text>
<text x="90" y="207" font-size="14" text-anchor="middle" fill="#555">128 行</text>
<rect x="46" y="224" width="88" height="42" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="90" y="242" font-size="14" text-anchor="middle" fill="#222">K2、V2</text>
<text x="90" y="259" font-size="14" text-anchor="middle" fill="#555">128 行</text>
<text x="90" y="300" font-size="20" text-anchor="middle" fill="#222">⋮</text>
<rect x="46" y="316" width="88" height="42" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="90" y="334" font-size="14" text-anchor="middle" fill="#222">K31、V31</text>
<text x="90" y="351" font-size="14" text-anchor="middle" fill="#555">128 行</text>
<rect x="46" y="384" width="88" height="42" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="90" y="410" font-size="14" text-anchor="middle" fill="#222">Q 的各块</text>
<rect x="46" y="440" width="88" height="42" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="90" y="466" font-size="14" text-anchor="middle" fill="#222">输出 O</text>
<rect x="200" y="80" width="250" height="440" fill="#f3f7fc" stroke="#2c6fb7" stroke-width="2" rx="6"/>
<text x="325" y="104" font-size="15" text-anchor="middle" fill="#2c6fb7" font-weight="bold">一个 SM 的片上存储</text>
<rect x="216" y="120" width="218" height="48" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="325.0" y="141.0" font-size="14" text-anchor="middle" fill="#222">Q 块（128 行）</text>
<text x="325.0" y="159.0" font-size="14" text-anchor="middle" fill="#555">整个扫描期间不动</text>
<rect x="216" y="188" width="218" height="48" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="325.0" y="209.0" font-size="14" text-anchor="middle" fill="#222">当前这一对 K、V 块</text>
<text x="325.0" y="227.0" font-size="14" text-anchor="middle" fill="#555">j = 0, 1, …, 31 轮流进来</text>
<rect x="216" y="256" width="218" height="62" fill="#fdf2e3" stroke="#222" stroke-width="1.5"/>
<text x="325.0" y="284.0" font-size="14" text-anchor="middle" fill="#222">分数块 S = Q·Kᵀ（仅当前块）</text>
<text x="325.0" y="302.0" font-size="14" text-anchor="middle" fill="#555">128×128×2 字节 = 32 KB</text>
<text x="325" y="334" font-size="14" text-anchor="middle" fill="#b86a0c">用完即丢，从不写回显存</text>
<rect x="216" y="350" width="218" height="48" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="325.0" y="371.0" font-size="14" text-anchor="middle" fill="#222">每行的 m、l</text>
<text x="325.0" y="389.0" font-size="14" text-anchor="middle" fill="#555">到目前为止的最大值、总和</text>
<rect x="216" y="414" width="218" height="48" fill="#dbe8f6" stroke="#222" stroke-width="1.5"/>
<text x="325.0" y="435.0" font-size="14" text-anchor="middle" fill="#222">输出累加器 O</text>
<text x="325.0" y="453.0" font-size="14" text-anchor="middle" fill="#555">每轮先乘修正系数再累加</text>
<line x1="134" y1="141" x2="214" y2="205" stroke="#2c6fb7" stroke-width="2" marker-end="url(#b)"/>
<line x1="134" y1="193" x2="214" y2="210" stroke="#2c6fb7" stroke-width="2" marker-end="url(#b)"/>
<line x1="134" y1="337" x2="214" y2="220" stroke="#2c6fb7" stroke-width="2" marker-end="url(#b)"/>
<line x1="134" y1="405" x2="214" y2="150" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="216" y1="455" x2="136" y2="461" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="325" y="488" font-size="14" text-anchor="middle" fill="#222">虚线：开头读一次 Q 块，</text>
<text x="325" y="506" font-size="14" text-anchor="middle" fill="#222">结尾写一次 O</text>
<text x="480" y="62" font-size="16" fill="#222" font-weight="bold">右：一行分数分两块到达，边到边算</text>
<text x="480" y="88" font-size="14" fill="#222">玩具例子（d = 1）：分数 s = [1, 3 | 2, 5]，对应的值 v = [10, 20 | 30, 40]</text>
<text x="480" y="108" font-size="14" fill="#555">m 是到目前为止的最大值，l 是 e^(s−m) 之和，acc 是 e^(s−m)·v 之和</text>
<rect x="480" y="122" width="460" height="112" fill="#f3f7fc" stroke="#2c6fb7" stroke-width="1.5" rx="4"/>
<text x="492" y="144" font-size="15" fill="#222" font-weight="bold">第 1 块到达：分数 1、3</text>
<text x="492" y="166" font-size="14" fill="#222">m = 3</text>
<text x="492" y="186" font-size="14" fill="#222">权重 e^(1−3) = 0.1353，e^(3−3) = 1</text>
<text x="492" y="206" font-size="14" fill="#222">l = 0.1353 + 1 = 1.1353，acc = 0.1353×10 + 1×20 = 21.353</text>
<rect x="480" y="246" width="460" height="176" fill="#f3f7fc" stroke="#2c6fb7" stroke-width="1.5" rx="4"/>
<text x="492" y="268" font-size="15" fill="#222" font-weight="bold">第 2 块到达：分数 2、5</text>
<text x="492" y="290" font-size="14" fill="#222">新的最大值 m = 5，比旧的 3 大，旧结果要按新基准重算：</text>
<text x="492" y="310" font-size="14" fill="#222">修正系数 e^(3−5) = 0.1353：l → 1.1353×0.1353 = 0.1536，</text>
<text x="492" y="330" font-size="14" fill="#222">　　　　　　　　　　　　　 acc → 21.353×0.1353 = 2.889</text>
<text x="492" y="350" font-size="14" fill="#222">新权重 e^(2−5) = 0.0498，e^(5−5) = 1</text>
<text x="492" y="370" font-size="14" fill="#222">l = 0.1536 + 0.0498 + 1 = 1.2034</text>
<text x="492" y="390" font-size="14" fill="#222">acc = 2.889 + 0.0498×30 + 1×40 = 44.383</text>
<rect x="480" y="434" width="460" height="52" fill="#fdf2e3" stroke="#b86a0c" stroke-width="1.5" rx="4"/>
<text x="492" y="456" font-size="15" fill="#222" font-weight="bold">扫完：输出 = acc ÷ l = 44.383 ÷ 1.2034 = 36.88</text>
<text x="480" y="510" font-size="14" fill="#222">对照：先拿到整行 [1, 3, 2, 5] 再做普通 softmax，</text>
<text x="480" y="530" font-size="14" fill="#222">加权求和的结果同样是 36.88。分块不改变结果，</text>
<text x="480" y="550" font-size="14" fill="#222">只是每块多做一次“乘修正系数”。</text>
<text x="30" y="580" font-size="14" fill="#555">左图按 N = 4096、d = 128、每块 128 行画：K、V 共 32 块依次流过同一个 SM；右图把“一行”缩小到 4 个数，展示 m、l、acc 怎样随块更新。</text>
</svg>