<text x="826.0" y="320.0" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="start">重新聚齐？</text>
<text x="826.0" y="340.0" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="start">硬件不保证</text>
<text x="368.0" y="380.0" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">调度器在两组之间切换推进</text>
<rect x="40.0" y="430.0" width="880.0" height="96.0" rx="4" fill="#eeeeee" stroke="none" stroke-width="0"/>
<text x="60.0" y="456.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="start">改变的是正确性规则：死锁消失；但需要全员对齐的地方必须显式写 __syncwarp() 或带 _sync 的函数。</text>
<text x="60.0" y="482.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="start">没变的是性能账：任何一拍里，这 32 条通道仍只执行一条指令——两组交替推进，</text>
<text x="60.0" y="504.0" font-family="sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="bold">每一拍照样只有一组在干活，另一组陪跑。</text>
