<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="480" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">softmax（8192×8192，FP16）融合前后的两次 profile：瓶颈换了位置</text>
<rect x="20" y="46" width="420" height="340" fill="#fafafa" stroke="#222" stroke-width="1.5" rx="6"/>
<text x="230" y="72" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">第一次：softmax 单独成一个 kernel</text>
<text x="34" y="100" font-size="14" fill="#555">第一级 · SOL</text>
<text x="142" y="126" font-size="14" text-anchor="end" fill="#222">Compute</text>
<rect x="150" y="110" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="150" y="110" width="39.6" height="22" fill="#fbe3c4" stroke="#222" stroke-width="1"/>
<text x="378" y="126" font-size="14" fill="#222">18%</text>
<text x="142" y="156" font-size="14" text-anchor="end" fill="#222">Memory</text>
<rect x="150" y="140" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="150" y="140" width="191.4" height="22" fill="#dbe8f6" stroke="#c0392b" stroke-width="2.5"/>
<text x="378" y="156" font-size="14" fill="#c0392b" font-weight="bold">87%</text>
<text x="34" y="188" font-size="14" fill="#555">第二级 · Memory Workload</text>
<text x="142" y="214" font-size="14" text-anchor="end" fill="#222">DRAM</text>
<rect x="150" y="198" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="150" y="198" width="200.2" height="22" fill="#dbe8f6" stroke="#c0392b" stroke-width="2.5"/>
<text x="378" y="214" font-size="14" fill="#c0392b" font-weight="bold">91%</text>
<text x="142" y="244" font-size="14" text-anchor="end" fill="#222">L2</text>
<rect x="150" y="228" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="150" y="228" width="99.0" height="22" fill="#dbe8f6" stroke="#222" stroke-width="1"/>
<text x="378" y="244" font-size="14" fill="#222">45%</text>
<rect x="34" y="264" width="392" height="116" fill="#ffffff" stroke="#2c6fb7" stroke-width="2" rx="4"/>
<text x="44" y="286" font-size="14" fill="#2c6fb7" font-weight="bold">结论：HBM 带宽受限</text>
<text x="44" y="306" font-size="14" fill="#222">读 128 MB + 写 128 MB = 256 MB，</text>
<text x="44" y="326" font-size="14" fill="#222">256 MB ÷ 3.35 TB/s ≈ 76 µs，与实测时长相当：</text>
<text x="44" y="346" font-size="14" fill="#222">时间几乎全花在搬数据上</text>
<rect x="520" y="46" width="420" height="340" fill="#fafafa" stroke="#222" stroke-width="1.5" rx="6"/>
<text x="730" y="72" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">融合之后：softmax 并进矩阵乘</text>
<text x="534" y="100" font-size="14" fill="#555">第一级 · SOL</text>
<text x="642" y="126" font-size="14" text-anchor="end" fill="#222">Compute</text>
<rect x="650" y="110" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="650" y="110" width="156.2" height="22" fill="#fbe3c4" stroke="#c0392b" stroke-width="2.5"/>
<text x="878" y="126" font-size="14" fill="#c0392b" font-weight="bold">71%</text>
<text x="642" y="156" font-size="14" text-anchor="end" fill="#222">Memory</text>
<rect x="650" y="140" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="650" y="140" width="83.6" height="22" fill="#dbe8f6" stroke="#222" stroke-width="1"/>
<text x="878" y="156" font-size="14" fill="#222">38%</text>
<text x="534" y="188" font-size="14" fill="#555">第二级 · Compute Workload</text>
<text x="642" y="214" font-size="14" text-anchor="end" fill="#222">Tensor 管线</text>
<rect x="650" y="198" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="650" y="198" width="143.0" height="22" fill="#fbe3c4" stroke="#222" stroke-width="1"/>
<text x="878" y="214" font-size="14" fill="#222">65%</text>
<text x="642" y="244" font-size="14" text-anchor="end" fill="#222">XU（MUFU）</text>
<rect x="650" y="228" width="220" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<rect x="650" y="228" width="193.6" height="22" fill="#fbe3c4" stroke="#c0392b" stroke-width="2.5"/>
<text x="878" y="244" font-size="14" fill="#c0392b" font-weight="bold">88%</text>
<rect x="534" y="264" width="392" height="116" fill="#ffffff" stroke="#b86a0c" stroke-width="2" rx="4"/>
<text x="544" y="286" font-size="14" fill="#b86a0c" font-weight="bold">结论：MUFU（超越函数单元）受限</text>
<text x="544" y="306" font-size="14" fill="#222">不再搬 256 MB，但 8192×8192 ≈ 6700 万次</text>
<text x="544" y="326" font-size="14" fill="#222">exp 一次都没少，全在 MUFU 上排队；</text>
<text x="544" y="346" font-size="14" fill="#222">MUFU 每 SM 每拍只做 16 次，是 FMA 的 1/8</text>
<line x1="444" y1="216" x2="514" y2="216" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="479" y="206" font-size="14" text-anchor="middle" fill="#222">融合</text>
<rect x="20" y="404" width="920" height="50" fill="#f6f6f6" stroke="#222" stroke-width="1.5" rx="6"/>
<text x="480" y="435" font-size="16" text-anchor="middle" fill="#222">优化没有消灭瓶颈，只是把它从 HBM 带宽搬到了 MUFU；下一步是把 exp 藏进 Tensor Core 干活的时间里</text>
</svg>