<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
<g font-family="sans-serif">
<text x="30" y="34" font-size="20" fill="#111" text-anchor="start" font-weight="bold">把很多个点连起来的三种画法</text>
<text x="30" y="58" font-size="15" fill="#333" text-anchor="start" font-weight="normal">圆圈是一个计算单元（芯片内是一个核，机柜里是一张卡）；线是它们之间的直连通道</text>
<rect x="30" y="80" width="290" height="300" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
<text x="175" y="106" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">网格（mesh）</text>
<rect x="355" y="80" width="290" height="300" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
<text x="500" y="106" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">环（ring）</text>
<rect x="680" y="80" width="290" height="300" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
<text x="825" y="106" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">全互通（交换芯片）</text>
<line x1="60" y1="140" x2="120" y2="140" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="140" x2="60" y2="200" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="140" x2="180" y2="140" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="140" x2="120" y2="200" stroke="#555" stroke-width="1.5"/>
<line x1="180" y1="140" x2="240" y2="140" stroke="#555" stroke-width="1.5"/>
<line x1="180" y1="140" x2="180" y2="200" stroke="#555" stroke-width="1.5"/>
<line x1="240" y1="140" x2="240" y2="200" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="200" x2="120" y2="200" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="200" x2="60" y2="260" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="200" x2="180" y2="200" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="200" x2="120" y2="260" stroke="#555" stroke-width="1.5"/>
<line x1="180" y1="200" x2="240" y2="200" stroke="#555" stroke-width="1.5"/>
<line x1="180" y1="200" x2="180" y2="260" stroke="#555" stroke-width="1.5"/>
<line x1="240" y1="200" x2="240" y2="260" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="260" x2="120" y2="260" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="260" x2="60" y2="320" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="260" x2="180" y2="260" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="260" x2="120" y2="320" stroke="#555" stroke-width="1.5"/>
<line x1="180" y1="260" x2="240" y2="260" stroke="#555" stroke-width="1.5"/>
<line x1="180" y1="260" x2="180" y2="320" stroke="#555" stroke-width="1.5"/>
<line x1="240" y1="260" x2="240" y2="320" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="320" x2="120" y2="320" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="320" x2="180" y2="320" stroke="#555" stroke-width="1.5"/>
<line x1="180" y1="320" x2="240" y2="320" stroke="#555" stroke-width="1.5"/>
<circle cx="60" cy="140" r="11" fill="#f6c1b6" stroke="#c23b22" stroke-width="2"/>
<circle cx="120" cy="140" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="180" cy="140" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="240" cy="140" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="60" cy="200" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="120" cy="200" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="180" cy="200" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="240" cy="200" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="60" cy="260" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="120" cy="260" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="180" cy="260" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="240" cy="260" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="60" cy="320" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="120" cy="320" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="180" cy="320" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="240" cy="320" r="11" fill="#f6c1b6" stroke="#c23b22" stroke-width="2"/>
<line x1="60" y1="140" x2="120" y2="140" stroke="#c23b22" stroke-width="3"/>
<line x1="120" y1="140" x2="180" y2="140" stroke="#c23b22" stroke-width="3"/>
<line x1="180" y1="140" x2="240" y2="140" stroke="#c23b22" stroke-width="3"/>
<line x1="240" y1="140" x2="240" y2="200" stroke="#c23b22" stroke-width="3"/>
<line x1="240" y1="200" x2="240" y2="260" stroke="#c23b22" stroke-width="3"/>
<line x1="240" y1="260" x2="240" y2="320" stroke="#c23b22" stroke-width="3"/>
<text x="45" y="352" font-size="13" fill="#333" text-anchor="start" font-weight="normal">只连上下左右的邻居。左上角要把数据送到</text>
<text x="45" y="370" font-size="13" fill="#c23b22" text-anchor="start" font-weight="normal">右下角，得让中间的核接力转发 6 次。</text>
<line x1="500.0" y1="144.0" x2="560.8" y2="169.2" stroke="#555" stroke-width="1.5"/>
<line x1="560.8" y1="169.2" x2="586.0" y2="230.0" stroke="#555" stroke-width="1.5"/>
<line x1="586.0" y1="230.0" x2="560.8" y2="290.8" stroke="#555" stroke-width="1.5"/>
<line x1="560.8" y1="290.8" x2="500.0" y2="316.0" stroke="#555" stroke-width="1.5"/>
<line x1="500.0" y1="316.0" x2="439.2" y2="290.8" stroke="#555" stroke-width="1.5"/>
<line x1="439.2" y1="290.8" x2="414.0" y2="230.0" stroke="#555" stroke-width="1.5"/>
<line x1="414.0" y1="230.0" x2="439.2" y2="169.2" stroke="#555" stroke-width="1.5"/>
<line x1="439.2" y1="169.2" x2="500.0" y2="144.0" stroke="#555" stroke-width="1.5"/>
<circle cx="500.0" cy="144.0" r="11" fill="#f6c1b6" stroke="#c23b22" stroke-width="2"/>
<circle cx="560.8" cy="169.2" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="586.0" cy="230.0" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="560.8" cy="290.8" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="500.0" cy="316.0" r="11" fill="#f6c1b6" stroke="#c23b22" stroke-width="2"/>
<circle cx="439.2" cy="290.8" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="414.0" cy="230.0" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<circle cx="439.2" cy="169.2" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="500.0" y1="144.0" x2="560.8" y2="169.2" stroke="#c23b22" stroke-width="3"/>
<line x1="560.8" y1="169.2" x2="586.0" y2="230.0" stroke="#c23b22" stroke-width="3"/>
<line x1="586.0" y1="230.0" x2="560.8" y2="290.8" stroke="#c23b22" stroke-width="3"/>
<line x1="560.8" y1="290.8" x2="500.0" y2="316.0" stroke="#c23b22" stroke-width="3"/>
<text x="370" y="352" font-size="13" fill="#333" text-anchor="start" font-weight="normal">每个点只连左右两个邻居，线最少。对面的点</text>
<text x="370" y="370" font-size="13" fill="#c23b22" text-anchor="start" font-weight="normal">要转发 4 次；全归约正是沿着这个圈转一整轮。</text>
<rect x="755" y="204" width="140" height="52" fill="#fdeeea" stroke="#c23b22" stroke-width="2"/>
<text x="825" y="235" font-size="15" fill="#c23b22" text-anchor="middle" font-weight="bold">交换芯片</text>
<line x1="825.0" y1="130.0" x2="825.0" y2="204.0" stroke="#555" stroke-width="1.5"/>
<circle cx="825.0" cy="130.0" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="908.4" y1="159.3" x2="853.3" y2="211.6" stroke="#555" stroke-width="1.5"/>
<circle cx="908.4" cy="159.3" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="943.0" y1="230.0" x2="865.0" y2="230.0" stroke="#555" stroke-width="1.5"/>
<circle cx="943.0" cy="230.0" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="908.4" y1="300.7" x2="853.3" y2="248.4" stroke="#555" stroke-width="1.5"/>
<circle cx="908.4" cy="300.7" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="825.0" y1="330.0" x2="825.0" y2="256.0" stroke="#555" stroke-width="1.5"/>
<circle cx="825.0" cy="330.0" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="741.6" y1="300.7" x2="796.7" y2="248.4" stroke="#555" stroke-width="1.5"/>
<circle cx="741.6" cy="300.7" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="707.0" y1="230.0" x2="785.0" y2="230.0" stroke="#555" stroke-width="1.5"/>
<circle cx="707.0" cy="230.0" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<line x1="741.6" y1="159.3" x2="796.7" y2="211.6" stroke="#555" stroke-width="1.5"/>
<circle cx="741.6" cy="159.3" r="11" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="695" y="352" font-size="13" fill="#333" text-anchor="start" font-weight="normal">每个点只接交换芯片，任意两点一跳到达，谁也</text>
<text x="695" y="370" font-size="13" fill="#c23b22" text-anchor="start" font-weight="normal">不比谁远；代价是交换芯片内部的开销随点数平方涨。</text>
<text x="30" y="410" font-size="15" fill="#111" text-anchor="start" font-weight="normal">GPU 芯片内部用的是第三种的变体：一百多个 SM 全都接到 L2 缓存上，甲写进去、乙读出来，谁离谁都一样远。</text>
<text x="30" y="434" font-size="15" fill="#111" text-anchor="start" font-weight="normal">多核 NPU（Tenstorrent、Cerebras）用第一种：线便宜、能一直加核，但"邻居近、对角远"要由编译器自己规划。</text>
<text x="30" y="458" font-size="15" fill="#111" text-anchor="start" font-weight="normal">机柜里的 NVSwitch 是第三种；很多集合通信算法（如全归约）则在第二种的次序上做。</text>
</g></svg>