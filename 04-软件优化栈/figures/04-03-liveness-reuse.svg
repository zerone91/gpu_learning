<text x="130" y="215" font-size="16" text-anchor="end" fill="#222222" font-weight="bold">C</text>
<rect x="424" y="190" width="262" height="34" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
