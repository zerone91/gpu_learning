<text x="110" y="520" font-size="13" fill="#555">每条曲线达到 100% 的位置，就是"要多大批量才能喂饱"。平衡点翻倍，但全部读写字节也减半时，曲线不动；</text>
<text x="110" y="542" font-size="13" fill="#555">只有没跟着减半的字节（这里是 bf16 的输出）会把门槛往右推，从约 345 推到约 377。</text>
