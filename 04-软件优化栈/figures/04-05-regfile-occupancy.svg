<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern></defs>
<text x="20" y="30" font-size="17" font-weight="bold">一个 SM 的 65536 个寄存器，按每线程用量切给线程块（每块 256 个线程）</text>
<text x="80" y="78" font-weight="bold">每线程 64 个寄存器：65536 ÷ 16384 = 4，正好放下 4 块</text>
<rect x="80.0" y="90" width="200.0" height="54" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="180.0" y="113" text-anchor="middle">线程块 1</text>
<text x="180.0" y="133" text-anchor="middle" font-size="13">256 × 64 = 16384</text>
<rect x="280.0" y="90" width="200.0" height="54" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="380.0" y="113" text-anchor="middle">线程块 2</text>
<text x="380.0" y="133" text-anchor="middle" font-size="13">256 × 64 = 16384</text>
<rect x="480.0" y="90" width="200.0" height="54" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="580.0" y="113" text-anchor="middle">线程块 3</text>
<text x="580.0" y="133" text-anchor="middle" font-size="13">256 × 64 = 16384</text>
<rect x="680.0" y="90" width="200.0" height="54" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="780.0" y="113" text-anchor="middle">线程块 4</text>
<text x="780.0" y="133" text-anchor="middle" font-size="13">256 × 64 = 16384</text>
<text x="80" y="168" font-size="14">能驻留 4 块 = 1024 个线程 = 32 个 warp</text>
<text x="80" y="218" font-weight="bold">每线程 72 个寄存器：65536 ÷ 18432 = 3.55，只能放下 3 块</text>
<rect x="80.0" y="230" width="225.0" height="54" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="192.5" y="253" text-anchor="middle">线程块 1</text>
<text x="192.5" y="273" text-anchor="middle" font-size="13">256 × 72 = 18432</text>
<rect x="305.0" y="230" width="225.0" height="54" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="417.5" y="253" text-anchor="middle">线程块 2</text>
<text x="417.5" y="273" text-anchor="middle" font-size="13">256 × 72 = 18432</text>
<rect x="530.0" y="230" width="225.0" height="54" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="642.5" y="253" text-anchor="middle">线程块 3</text>
<text x="642.5" y="273" text-anchor="middle" font-size="13">256 × 72 = 18432</text>
<rect x="755.0" y="230" width="125.0" height="54" fill="url(#h)" stroke="#c0392b" stroke-width="2"/>
<rect x="767.5" y="238" width="100" height="40" fill="#ffffff" opacity="0.9"/>
<text x="817.5" y="253" text-anchor="middle" font-size="13" fill="#c0392b">剩 10240 个</text>
<text x="817.5" y="273" text-anchor="middle" font-size="13" fill="#c0392b">不够再放一块</text>
<text x="80" y="308" font-size="14">能驻留 3 块 = 768 个线程 = 24 个 warp</text>
<text x="80" y="376" font-size="14" fill="#555">每线程只多用 8 个寄存器，驻留的线程从 1024 个降到 768 个，少了四分之一；右侧斜线部分的寄存器闲置</text>
</svg>