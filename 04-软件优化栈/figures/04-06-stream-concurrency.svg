<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold">两个互不相关的小 kernel：放进同一条 stream 还是两条 stream</text>
<text x="20" y="66" font-weight="bold">提交方式一：甲、乙放进同一条 stream</text>
<text x="190" y="139.0" text-anchor="end" font-size="14">GPU 上的</text>
<text x="190" y="159.0" text-anchor="end" font-size="14">全部 SM</text>
<rect x="200" y="80" width="636.3636363636364" height="130" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
<rect x="200.0" y="158.0" width="318.2" height="52.0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="359.1" y="189.0" text-anchor="middle">甲</text>
<rect x="518.2" y="158.0" width="318.2" height="52.0" fill="#fde2c4" stroke="#d9822b" stroke-width="2"/>
<text x="677.3" y="189.0" text-anchor="middle">乙</text>
<text x="844.3636363636364" y="145.0" font-size="14"></text>
<text x="844.3636363636364" y="140" font-size="14" font-weight="bold">20 毫秒</text>
<text x="518.2" y="116" text-anchor="middle" font-size="14" fill="#777">上面这六成的 SM 一直空着</text>
<text x="20" y="276" font-weight="bold">提交方式二：甲、乙放进两条不同的 stream</text>
<text x="190" y="349.0" text-anchor="end" font-size="14">GPU 上的</text>
<text x="190" y="369.0" text-anchor="end" font-size="14">全部 SM</text>
<rect x="200" y="290" width="636.3636363636364" height="130" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
<rect x="200.0" y="368.0" width="318.2" height="52.0" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="359.1" y="399.0" text-anchor="middle">甲</text>
<rect x="200.0" y="309.5" width="318.2" height="52.0" fill="#fde2c4" stroke="#d9822b" stroke-width="2"/>
<text x="359.1" y="340.5" text-anchor="middle">乙</text>
<text x="844.3636363636364" y="355.0" font-size="14"></text>
<text x="526.1818181818182" y="350" font-size="14" font-weight="bold">约 10 毫秒</text>
<text x="677.3" y="366" text-anchor="middle" font-size="14" fill="#777">已经做完</text>
<line x1="200" y1="440" x2="900.0" y2="440" stroke="#333" stroke-width="1.5"/>
<line x1="200.0" y1="440" x2="200.0" y2="446" stroke="#333" stroke-width="1.5"/>
<text x="200.0" y="462" text-anchor="middle" font-size="13">0</text>
<line x1="359.1" y1="440" x2="359.1" y2="446" stroke="#333" stroke-width="1.5"/>
<text x="359.1" y="462" text-anchor="middle" font-size="13">5</text>
<line x1="518.2" y1="440" x2="518.2" y2="446" stroke="#333" stroke-width="1.5"/>
<text x="518.2" y="462" text-anchor="middle" font-size="13">10</text>
<line x1="677.3" y1="440" x2="677.3" y2="446" stroke="#333" stroke-width="1.5"/>
<text x="677.3" y="462" text-anchor="middle" font-size="13">15</text>
<line x1="836.4" y1="440" x2="836.4" y2="446" stroke="#333" stroke-width="1.5"/>
<text x="836.4" y="462" text-anchor="middle" font-size="13">20</text>
<text x="900.0" y="484" text-anchor="end" font-size="14">时间（毫秒）</text>
<text x="20" y="484" font-size="13" fill="#555">纵向高度表示占用了多少 SM（示意：甲、乙各占约四成）</text>
</svg>