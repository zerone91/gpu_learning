<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="bold">逐个启动小 kernel：CPU 每 15 微秒送来一个，GPU 每个只算 8 微秒（解码一步的前三个 kernel）</text>
<text x="98" y="110" text-anchor="end" font-weight="bold">CPU</text>
<text x="98" y="220" text-anchor="end" font-weight="bold">GPU</text>
<rect x="110.0" y="80" width="202.5" height="50" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="211.2" y="110.0" text-anchor="middle" font-size="13" fill="#222">准备并提交第 1 个</text>
<rect x="312.5" y="80" width="202.5" height="50" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="413.8" y="110.0" text-anchor="middle" font-size="13" fill="#222">准备并提交第 2 个</text>
<rect x="515.0" y="80" width="202.5" height="50" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="616.2" y="110.0" text-anchor="middle" font-size="13" fill="#222">准备并提交第 3 个</text>
<rect x="717.5" y="80" width="202.5" height="50" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="818.8" y="110.0" text-anchor="middle" font-size="13" fill="#222">准备并提交第 4 个</text>
<rect x="110.0" y="190" width="202.5" height="50" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<text x="211.2" y="220.0" text-anchor="middle" font-size="13" fill="#777">空闲</text>
<rect x="312.5" y="190" width="108.0" height="50" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="366.5" y="220.0" text-anchor="middle" font-size="13" fill="#222">执行第 1 个</text>
<rect x="420.5" y="190" width="94.5" height="50" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<text x="467.8" y="220.0" text-anchor="middle" font-size="13" fill="#777">空闲</text>
<rect x="515.0" y="190" width="108.0" height="50" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="569.0" y="220.0" text-anchor="middle" font-size="13" fill="#222">执行第 2 个</text>
<rect x="623.0" y="190" width="94.5" height="50" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<text x="670.2" y="220.0" text-anchor="middle" font-size="13" fill="#777">空闲</text>
<rect x="717.5" y="190" width="108.0" height="50" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="771.5" y="220.0" text-anchor="middle" font-size="13" fill="#222">执行第 3 个</text>
<rect x="825.5" y="190" width="94.5" height="50" fill="url(#h)" stroke="#999" stroke-width="1.5"/>
<text x="872.8" y="220.0" text-anchor="middle" font-size="13" fill="#777">空闲</text>
<line x1="312.5" y1="130" x2="312.5" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="515.0" y1="130" x2="515.0" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="717.5" y1="130" x2="717.5" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M312.5,254 L312.5,262 L515.0,262 L515.0,254" stroke="#333" stroke-width="1.5" fill="none"/>
<text x="413.8" y="282" text-anchor="middle" font-size="14">一个周期 15 微秒：算 8、等 7</text>
<line x1="110" y1="320" x2="920" y2="320" stroke="#333" stroke-width="1.5"/>
<line x1="110.0" y1="320" x2="110.0" y2="326" stroke="#333" stroke-width="1.5"/>
<text x="110.0" y="342" text-anchor="middle" font-size="13">0</text>
<line x1="312.5" y1="320" x2="312.5" y2="326" stroke="#333" stroke-width="1.5"/>
<text x="312.5" y="342" text-anchor="middle" font-size="13">15</text>
<line x1="515.0" y1="320" x2="515.0" y2="326" stroke="#333" stroke-width="1.5"/>
<text x="515.0" y="342" text-anchor="middle" font-size="13">30</text>
<line x1="717.5" y1="320" x2="717.5" y2="326" stroke="#333" stroke-width="1.5"/>
<text x="717.5" y="342" text-anchor="middle" font-size="13">45</text>
<line x1="920.0" y1="320" x2="920.0" y2="326" stroke="#333" stroke-width="1.5"/>
<text x="920.0" y="342" text-anchor="middle" font-size="13">60</text>
<text x="920" y="364" text-anchor="end" font-size="14">时间（微秒）</text>
<text x="110" y="364" font-size="13" fill="#555">竖箭头：CPU 刚提交完，GPU 才开始执行。数字是量级示意。</text>
</svg>