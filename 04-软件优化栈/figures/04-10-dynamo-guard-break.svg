<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="sans-serif">
<rect x="0" y="0" width="960" height="700" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480" y="32" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">Dynamo：边执行边抓图，用 guard 决定能否复用；抓不下去的地方把图切断</text>
<text x="30" y="70" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">① 第一次调用：追踪、记下假设、编译、缓存</text>
<rect x="30" y="88" width="170" height="70" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="2"/>
<text x="115.0" y="118.80000000000001" font-size="14" text-anchor="middle" fill="#222222"><tspan x="115.0" dy="0">逐条解释</tspan><tspan x="115.0" dy="18.2">函数的字节码</tspan></text>
<rect x="250" y="84" width="210" height="36" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="355.0" y="106.9" font-size="14" text-anchor="middle" fill="#222222">张量操作 → 往图里加节点</text>
<rect x="250" y="128" width="210" height="36" rx="6" fill="#ffffff" stroke="#777777" stroke-width="2"/>
<text x="355.0" y="150.9" font-size="14" text-anchor="middle" fill="#222222">普通 Python → 真的执行</text>
<line x1="200" y1="112" x2="248" y2="102" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="200" y1="134" x2="248" y2="146" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510" y="84" width="200" height="80" rx="6" fill="#fff4c2" stroke="#c77a12" stroke-width="2"/>
<text x="610.0" y="111.64999999999999" font-size="13" text-anchor="middle" fill="#222222"><tspan x="610.0" dy="0">guard（本次的假设）：</tspan><tspan x="610.0" dy="16.9">x.shape == (8, 512)</tspan><tspan x="610.0" dy="16.9">x.dtype == fp16</tspan></text>
<line x1="460" y1="124" x2="508" y2="124" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="760" y="84" width="170" height="80" rx="6" fill="#d9efe2" stroke="#2e8b57" stroke-width="2"/>
<text x="845.0" y="110.7" font-size="14" text-anchor="middle" fill="#222222"><tspan x="845.0" dy="0">缓存：</tspan><tspan x="845.0" dy="18.2">编译好的 kernel</tspan><tspan x="845.0" dy="18.2">+ 这组 guard</tspan></text>
<line x1="710" y1="124" x2="758" y2="124" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="30" y="200" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">② 之后每次调用：先查 guard</text>
<rect x="30" y="218" width="170" height="44" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="2"/>
<text x="115.0" y="244.9" font-size="14" text-anchor="middle" fill="#222222">新调用进来</text>
<rect x="250" y="218" width="210" height="44" rx="6" fill="#fff4c2" stroke="#c77a12" stroke-width="2"/>
<text x="355.0" y="244.9" font-size="14" text-anchor="middle" fill="#222222">逐条检查 guard</text>
<line x1="200" y1="240" x2="248" y2="240" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520" y="206" width="410" height="34" rx="6" fill="#d9efe2" stroke="#2e8b57" stroke-width="2"/>
<text x="725.0" y="227.9" font-size="14" text-anchor="middle" fill="#222222">全部满足 → 直接跑缓存里的 kernel</text>
<rect x="520" y="250" width="410" height="34" rx="6" fill="#f6dcd8" stroke="#c0392b" stroke-width="2"/>
<text x="725.0" y="271.9" font-size="14" text-anchor="middle" fill="#222222">有一条不满足（如形状变成 (16, 512)）→ 重新追踪、编译</text>
<line x1="460" y1="234" x2="518" y2="223" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#n)"/>
<line x1="460" y1="246" x2="518" y2="267" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
<text x="250" y="306" font-size="13" text-anchor="start" fill="#c0392b">形状写在 guard 里，所以“形状一变就卡顿几秒”：那几秒花在重新追踪和编译上</text>
<line x1="20" y1="326" x2="940" y2="326" stroke="#eeeeee" stroke-width="2"/>
<text x="30" y="356" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">③ graph break：函数里夹了一个 print(b)</text>
<rect x="30" y="410" width="170" height="40" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="434.9" font-size="14" text-anchor="middle" fill="#222222">a = x @ w</text>
<rect x="212" y="410" width="170" height="40" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="297.0" y="434.9" font-size="14" text-anchor="middle" fill="#222222">b = a + 1</text>
<rect x="394" y="410" width="170" height="40" rx="6" fill="#f6dcd8" stroke="#c0392b" stroke-width="2"/>
<text x="479.0" y="434.9" font-size="14" text-anchor="middle" fill="#222222">print(b)</text>
<rect x="576" y="410" width="170" height="40" rx="6" fill="#e9e0f4" stroke="#7a4fb0" stroke-width="2"/>
<text x="661.0" y="434.9" font-size="14" text-anchor="middle" fill="#222222">c = relu(b)</text>
<rect x="758" y="410" width="170" height="40" rx="6" fill="#e9e0f4" stroke="#7a4fb0" stroke-width="2"/>
<text x="843.0" y="434.9" font-size="14" text-anchor="middle" fill="#222222">d = c * 2</text>
<text x="30" y="476" font-size="13" text-anchor="start" fill="#444444">（函数体里的 5 行，从左到右依次执行）</text>
<path d="M30,490 L30,500 L382,500 L382,490" fill="none" stroke="#2f6db5" stroke-width="2"/>
<text x="206.0" y="522" font-size="14" text-anchor="middle" fill="#2f6db5" font-weight="bold">图 1 → 编译成 kernel</text>
<path d="M394,490 L394,500 L564,500 L564,490" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="479.0" y="522" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">交回 Python 原样执行</text>
<path d="M576,490 L576,500 L928,500 L928,490" fill="none" stroke="#7a4fb0" stroke-width="2"/>
<text x="752.0" y="522" font-size="14" text-anchor="middle" fill="#7a4fb0" font-weight="bold">图 2 → 另编译成 kernel</text>
<path d="M297.0,408 C297.0,376 661.0,376 661.0,408" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="6 4"/>
<text x="529.0" y="370" font-size="13" text-anchor="middle" fill="#777777">add 与 relu 本可融合成一个 kernel，现在被切在两张图里</text>
<text x="30" y="570" font-size="14" text-anchor="start" fill="#444444">为什么要切：print 必须在真实执行时把 b 的数值打印出来，这个副作用不能被编译器删掉或挪位置，</text>
<text x="30" y="592" font-size="14" text-anchor="start" fill="#444444">所以 b 必须真的算出来、落到显存里，交给 Python 去打印。</text>
<text x="30" y="624" font-size="14" text-anchor="start" fill="#c0392b">代价：本来一张图、可以全部融合；现在两张图 + 一段 Python，断点两侧的融合机会丢失，中间结果 b 多一次落地。</text>
<text x="30" y="656" font-size="14" text-anchor="start" fill="#444444">五类触发者：依赖张量值的分支（if x.sum() &gt; 0）、有副作用的调用（print、写文件）、不认识的自定义算子、</text>
<text x="30" y="678" font-size="14" text-anchor="start" fill="#444444">输出形状取决于数据（x[x &gt; 0]）、复杂的 Python 对象操作。torch._dynamo.explain() 能列出每个断点和原因。</text>
</svg>
