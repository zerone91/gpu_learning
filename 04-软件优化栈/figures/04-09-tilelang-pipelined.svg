<path d="M714,62 L714,56 L922,56 L922,62" fill="none" stroke="#777777" stroke-width="1.5"/>
<text x="818" y="50" font-size="14" text-anchor="middle" fill="#777777">收尾：只算不搬</text>
<text x="24" y="122" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">拷贝引擎</text>
<text x="24" y="142" font-size="13" text-anchor="start" fill="#444444">（cp.async / TMA）</text>
<line x1="170" y1="164" x2="926" y2="164" stroke="#eeeeee" stroke-width="1.5"/>
<text x="24" y="202" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">Tensor Core</text>
<text x="24" y="222" font-size="13" text-anchor="start" fill="#444444">（T.gemm）</text>
<line x1="170" y1="244" x2="926" y2="244" stroke="#eeeeee" stroke-width="1.5"/>
<rect x="174" y="100" width="100" height="26" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
