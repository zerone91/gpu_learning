<text x="480" y="32" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">T.Pipelined(num_stages=3) 生成的流水：K 方向 6 块、3 个 shared 缓冲槽轮转</text>
<g transform="translate(0,30)">
<text x="224.0" y="78" font-size="15" text-anchor="middle" fill="#c77a12" font-weight="bold">序幕</text>
<text x="332.0" y="78" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">第 0 轮</text>
<text x="440.0" y="78" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">第 1 轮</text>
<text x="548.0" y="78" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">第 2 轮</text>
<text x="656.0" y="78" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">第 3 轮</text>
