<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480.0" y="30.0" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">两种模式怎样占用 GPU：划出 SM 跑通信，还是把传输整个交给网卡（H800，132 个 SM，示意）</text>
<text x="30.0" y="72.0" font-size="16" text-anchor="start" fill="#c77a12" font-weight="bold">① normal 模式（prefill）：通信 kernel 与计算 kernel 分 SM 并排跑</text>
<text x="190.0" y="108.0" font-size="14" text-anchor="end" fill="#222222">112 个 SM</text>
<text x="190.0" y="152.0" font-size="14" text-anchor="end" fill="#222222">20 个 SM</text>
<rect x="200.0" y="86.0" width="720.0" height="34.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="560.0" y="108.0" font-size="14" text-anchor="middle" fill="#222222">计算 kernel（注意力、专家 FFN……）</text>
<rect x="200.0" y="130.0" width="720.0" height="34.0" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="560.0" y="152.0" font-size="14" text-anchor="middle" fill="#222222">通信 kernel：打包、按目标卡分 warp 发送、NVLink 转发</text>
<text x="200.0" y="190.0" font-size="14" text-anchor="start" fill="#777777">通信占的 20 个 SM 整段时间都不能用来计算；换来的是两层带宽都被榨满的吞吐。</text>
<text x="30.0" y="238.0" font-size="16" text-anchor="start" fill="#2f6db5" font-weight="bold">② low-latency 模式（decode）：发出即返回，传输期间 SM 全部留给计算</text>
<text x="190.0" y="274.0" font-size="14" text-anchor="end" fill="#222222">132 个 SM</text>
<text x="190.0" y="318.0" font-size="14" text-anchor="end" fill="#222222">网卡</text>
<rect x="200.0" y="252.0" width="70.0" height="34.0" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="235.0" y="274.0" font-size="14" text-anchor="middle" fill="#222222">发起</text>
<rect x="270.0" y="252.0" width="400.0" height="34.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="470.0" y="274.0" font-size="14" text-anchor="middle" fill="#222222">其它计算（例如共享专家）</text>
<rect x="670.0" y="252.0" width="80.0" height="34.0" rx="3" fill="#d5eddf" stroke="#2e8b57" stroke-width="1.5"/>
<text x="710.0" y="274.0" font-size="14" text-anchor="middle" fill="#222222">钩子</text>
<rect x="750.0" y="252.0" width="170.0" height="34.0" rx="3" fill="#dbe7f5" stroke="#2f6db5" stroke-width="1.5"/>
<text x="835.0" y="274.0" font-size="14" text-anchor="middle" fill="#222222">专家 FFN</text>
<rect x="270.0" y="296.0" width="370.0" height="34.0" rx="3" fill="#ffffff" stroke="#c77a12" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="455.0" y="318.0" font-size="14" text-anchor="middle" fill="#c77a12">RDMA 传输（不占 SM）</text>
<line x1="270.0" y1="288.0" x2="270.0" y2="296.0" stroke="#c77a12" stroke-width="1.5"/>
<text x="235.0" y="358.0" font-size="14" text-anchor="middle" fill="#c77a12">dispatch 调用：打包、</text>
<text x="235.0" y="378.0" font-size="14" text-anchor="middle" fill="#c77a12">按门铃，立即返回</text>
<text x="710.0" y="358.0" font-size="14" text-anchor="middle" fill="#2e8b57">轮询完成标志，</text>
<text x="710.0" y="378.0" font-size="14" text-anchor="middle" fill="#2e8b57">货已齐，马上返回</text>
<line x1="235.0" y1="342.0" x2="235.0" y2="290.0" stroke="#c77a12" stroke-width="1.5"/>
<line x1="710.0" y1="342.0" x2="710.0" y2="290.0" stroke="#2e8b57" stroke-width="1.5"/>
<rect x="30.0" y="400.0" width="900.0" height="54.0" rx="3" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="46.0" y="424.0" font-size="14" text-anchor="start" fill="#222222">重叠要靠调用方安排：发起与钩子之间必须塞进不依赖这批 token 的计算。塞不满，钩子就会停下来等网络。</text>
<text x="46.0" y="444.0" font-size="14" text-anchor="start" fill="#222222">这也是为什么 TBO / SBO 这类上层调度策略要和 low-latency kernel 配合使用。</text>
</svg>
