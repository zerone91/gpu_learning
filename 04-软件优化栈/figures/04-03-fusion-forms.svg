<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480" y="30" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">三种融合形态：融合前（上）与融合后（下）</text>
<text x="160" y="64" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">纵向融合</text>
<text x="160" y="84" font-size="13" text-anchor="middle" fill="#444">生产者 → 消费者直连</text>
<line x1="20" y1="290" x2="300" y2="290" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="480" y="64" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">横向融合</text>
<text x="480" y="84" font-size="13" text-anchor="middle" fill="#444">互不依赖、共享输入</text>
<line x1="340" y1="290" x2="620" y2="290" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="800" y="64" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">epilogue 融合</text>
<text x="800" y="84" font-size="13" text-anchor="middle" fill="#444">零碎运算并入矩阵乘的收尾</text>
<line x1="660" y1="290" x2="940" y2="290" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="320" y1="50" x2="320" y2="540" stroke="#bbbbbb" stroke-width="1.5"/>
<line x1="640" y1="50" x2="640" y2="540" stroke="#bbbbbb" stroke-width="1.5"/>
<rect x="40" y="110" width="100" height="44" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="90.0" y="137.0" font-size="14" text-anchor="middle" fill="#222222">加法</text>
<rect x="180" y="110" width="100" height="44" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="230.0" y="137.0" font-size="14" text-anchor="middle" fill="#222222">relu</text>
<line x1="140" y1="132" x2="178" y2="132" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<text x="160" y="180" font-size="13" text-anchor="middle" fill="#c0392b">中间结果要写进显存</text>
<text x="160" y="198" font-size="13" text-anchor="middle" fill="#c0392b">再读出来</text>
<text x="160" y="240" font-size="14" text-anchor="middle" fill="#444">2 个 kernel</text>
<rect x="60" y="320" width="200" height="50" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="160.0" y="350.0" font-size="14" text-anchor="middle" fill="#222222">加法 + relu</text>
<text x="160" y="400" font-size="13" text-anchor="middle" fill="#2e8b57">中间结果只在寄存器里</text>
<text x="160" y="440" font-size="14" text-anchor="middle" fill="#444">1 个 kernel，</text>
<text x="160" y="460" font-size="14" text-anchor="middle" fill="#444">省掉中间结果的一写一读</text>
<rect x="450" y="100" width="60" height="34" rx="6" fill="#eeeeee" stroke="#222222" stroke-width="2"/>
<text x="480.0" y="122.0" font-size="14" text-anchor="middle" fill="#222222">x</text>
<rect x="350" y="180" width="80" height="40" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="390.0" y="205.0" font-size="13" text-anchor="middle" fill="#222222">x @ Wq</text>
<line x1="480" y1="134" x2="390" y2="178" stroke="#222222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="440" y="180" width="80" height="40" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="480.0" y="205.0" font-size="13" text-anchor="middle" fill="#222222">x @ Wk</text>
<line x1="480" y1="134" x2="480" y2="178" stroke="#222222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="530" y="180" width="80" height="40" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="570.0" y="205.0" font-size="13" text-anchor="middle" fill="#222222">x @ Wv</text>
<line x1="480" y1="134" x2="570" y2="178" stroke="#222222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="480" y="250" font-size="14" text-anchor="middle" fill="#444">3 个 kernel，x 被读 3 遍</text>
<rect x="450" y="310" width="60" height="34" rx="6" fill="#eeeeee" stroke="#222222" stroke-width="2"/>
<text x="480.0" y="332.0" font-size="14" text-anchor="middle" fill="#222222">x</text>
<rect x="380" y="380" width="200" height="44" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="480.0" y="407.0" font-size="14" text-anchor="middle" fill="#222222">x @ [Wq | Wk | Wv]</text>
<line x1="480" y1="344" x2="480" y2="378" stroke="#222222" stroke-width="1.8" marker-end="url(#a)"/>
<text x="480" y="452" font-size="14" text-anchor="middle" fill="#444">1 个大矩阵乘，x 只读 1 遍，</text>
<text x="480" y="472" font-size="14" text-anchor="middle" fill="#444">再按列切开得到 Q、K、V</text>
<rect x="670" y="110" width="90" height="44" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="715.0" y="137.0" font-size="14" text-anchor="middle" fill="#222222">矩阵乘</text>
<rect x="790" y="110" width="60" height="44" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="820.0" y="137.0" font-size="13" text-anchor="middle" fill="#222222">+偏置</text>
<rect x="874" y="110" width="56" height="44" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="902.0" y="137.0" font-size="13" text-anchor="middle" fill="#222222">激活</text>
<line x1="760" y1="132" x2="788" y2="132" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="850" y1="132" x2="872" y2="132" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<text x="800" y="190" font-size="13" text-anchor="middle" fill="#c0392b">矩阵乘写出整张结果，</text>
<text x="800" y="208" font-size="13" text-anchor="middle" fill="#c0392b">后两个 kernel 再读写各一遍</text>
<text x="800" y="250" font-size="14" text-anchor="middle" fill="#444">3 个 kernel</text>
<rect x="680" y="310" width="240" height="110" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="800" y="334" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">一个矩阵乘 kernel</text>
<rect x="696" y="346" width="208" height="30" rx="3" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
<text x="800" y="366" font-size="13" text-anchor="middle" fill="#222222">主循环：Tensor Core 满负荷</text>
<rect x="696" y="382" width="208" height="30" rx="3" fill="#f8e3c4" stroke="#c77a12" stroke-width="1.5"/>
<text x="800" y="402" font-size="13" text-anchor="middle" fill="#222222">收尾：+偏置、激活，再写回</text>
<text x="800" y="452" font-size="14" text-anchor="middle" fill="#444">零碎运算在寄存器里顺带做完，</text>
<text x="800" y="472" font-size="14" text-anchor="middle" fill="#444">不增加任何显存读写</text>
</svg>
