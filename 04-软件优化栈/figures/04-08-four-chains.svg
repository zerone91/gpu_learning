<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="bold">四条传导链：算法侧的一个决定，往下每一层变成了什么</text>
<rect x="20" y="42" width="150" height="30" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
<text x="95.0" y="62" text-anchor="middle" font-size="14" font-weight="bold">算法侧的决定</text>
<rect x="190" y="42" width="175" height="30" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
<text x="277.5" y="62" text-anchor="middle" font-size="14" font-weight="bold">图编译层</text>
<rect x="385" y="42" width="175" height="30" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
<text x="472.5" y="62" text-anchor="middle" font-size="14" font-weight="bold">kernel 层</text>
<rect x="580" y="42" width="190" height="30" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
<text x="675.0" y="62" text-anchor="middle" font-size="14" font-weight="bold">硬件层</text>
<rect x="790" y="42" width="150" height="30" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
<text x="865.0" y="62" text-anchor="middle" font-size="14" font-weight="bold">最终定下了</text>
<rect x="20" y="84" width="150" height="92" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2" rx="4"/>
<text x="28" y="108" font-size="13" font-weight="bold">链一 形状</text>
<text x="28" y="129" font-size="13">d_model 取 4100</text>
<text x="28" y="150" font-size="13">而不是 4096</text>
<line x1="172" y1="130.0" x2="187" y2="130.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="84" width="175" height="92" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.2" rx="4"/>
<text x="198" y="108" font-size="13">不整除硬件粒度：</text>
<text x="198" y="129" font-size="13">到处填充，或插入</text>
<text x="198" y="150" font-size="13">整形操作</text>
<line x1="367" y1="130.0" x2="382" y2="130.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="385" y="84" width="175" height="92" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.2" rx="4"/>
<text x="393" y="108" font-size="13">候选块尺寸都按 2 的</text>
<text x="393" y="129" font-size="13">幂设计：出现边界</text>
<text x="393" y="150" font-size="13">分支，调优失准</text>
<line x1="562" y1="130.0" x2="577" y2="130.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="580" y="84" width="190" height="92" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.2" rx="4"/>
<text x="588" y="108" font-size="13">按 128 取整，形状税</text>
<text x="588" y="129" font-size="13">约 3%；16 对齐也破了，</text>
<text x="588" y="150" font-size="13">部分计算回落普通通道</text>
<line x1="772" y1="130.0" x2="787" y2="130.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="790" y="84" width="150" height="92" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="2" rx="4"/>
<text x="865.0" y="135.0" font-size="13" font-weight="bold" text-anchor="middle">实际利用率</text>
<rect x="20" y="188" width="150" height="92" fill="#fde2c4" stroke="#d9822b" stroke-width="2" rx="4"/>
<text x="28" y="212" font-size="13" font-weight="bold">链二 精度</text>
<text x="28" y="233" font-size="13">bf16 换成 fp8</text>
<line x1="172" y1="234.0" x2="187" y2="234.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="188" width="175" height="92" fill="#ffffff" stroke="#d9822b" stroke-width="1.2" rx="4"/>
<text x="198" y="212" font-size="13">缩放因子的读写要</text>
<text x="198" y="233" font-size="13">融合进矩阵乘的收尾，</text>
<text x="198" y="254" font-size="13">否则吃回省下的带宽</text>
<line x1="367" y1="234.0" x2="382" y2="234.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="385" y="188" width="175" height="92" fill="#ffffff" stroke="#d9822b" stroke-width="1.2" rx="4"/>
<text x="393" y="212" font-size="13">每块数据带一个缩放</text>
<text x="393" y="233" font-size="13">因子；矩阵指令对形状</text>
<text x="393" y="254" font-size="13">的对齐要求更严</text>
<line x1="562" y1="234.0" x2="577" y2="234.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="580" y="188" width="190" height="92" fill="#ffffff" stroke="#d9822b" stroke-width="1.2" rx="4"/>
<text x="588" y="212" font-size="13">平衡点 295 → 590；</text>
<text x="588" y="233" font-size="13">读写没全部减半时，</text>
<text x="588" y="254" font-size="13">要更大的批量才喂饱</text>
<line x1="772" y1="234.0" x2="787" y2="234.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="790" y="188" width="150" height="92" fill="#fde2c4" stroke="#d9822b" stroke-width="2" rx="4"/>
<text x="865.0" y="239.0" font-size="13" font-weight="bold" text-anchor="middle">平衡点的位置</text>
<rect x="20" y="292" width="150" height="92" fill="#d8efd8" stroke="#2e8b57" stroke-width="2" rx="4"/>
<text x="28" y="316" font-size="13" font-weight="bold">链三 结构</text>
<text x="28" y="337" font-size="13">32 个 KV 头</text>
<text x="28" y="358" font-size="13">改成 8 个（GQA）</text>
<line x1="172" y1="338.0" x2="187" y2="338.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="292" width="175" height="92" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2" rx="4"/>
<text x="198" y="316" font-size="13">算子怎么连，决定</text>
<text x="198" y="337" font-size="13">哪些能融合；中间插</text>
<text x="198" y="358" font-size="13">数据相关分支就断开</text>
<line x1="367" y1="338.0" x2="382" y2="338.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="385" y="292" width="175" height="92" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2" rx="4"/>
<text x="393" y="316" font-size="13">每个数被复用几次由</text>
<text x="393" y="337" font-size="13">结构决定，kernel 只能</text>
<text x="393" y="358" font-size="13">逼近、不能突破</text>
<line x1="562" y1="338.0" x2="577" y2="338.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="580" y="292" width="190" height="92" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2" rx="4"/>
<text x="588" y="316" font-size="13">解码每步要读的 KV</text>
<text x="588" y="337" font-size="13">字节 ÷ 4，</text>
<text x="588" y="358" font-size="13">延迟约 ÷ 4</text>
<line x1="772" y1="338.0" x2="787" y2="338.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="790" y="292" width="150" height="92" fill="#d8efd8" stroke="#2e8b57" stroke-width="2" rx="4"/>
<text x="865.0" y="343.0" font-size="13" font-weight="bold" text-anchor="middle">性能上限</text>
<rect x="20" y="396" width="150" height="92" fill="#e6dcf2" stroke="#7d4ea8" stroke-width="2" rx="4"/>
<text x="28" y="420" font-size="13" font-weight="bold">链四 动态性</text>
<text x="28" y="441" font-size="13">每个 token</text>
<text x="28" y="462" font-size="13">按置信度提前退出</text>
<line x1="172" y1="442.0" x2="187" y2="442.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="396" width="175" height="92" fill="#ffffff" stroke="#7d4ea8" stroke-width="1.2" rx="4"/>
<text x="198" y="420" font-size="13">形状每步都变：反复</text>
<text x="198" y="441" font-size="13">重编译，或干脆放弃</text>
<text x="198" y="462" font-size="13">抓图</text>
<line x1="367" y1="442.0" x2="382" y2="442.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="385" y="396" width="175" height="92" fill="#ffffff" stroke="#7d4ea8" stroke-width="1.2" rx="4"/>
<text x="393" y="420" font-size="13">自动调优的缓存按形</text>
<text x="393" y="441" font-size="13">状记录，形状一多就</text>
<text x="393" y="462" font-size="13">爆炸</text>
<line x1="562" y1="442.0" x2="577" y2="442.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="580" y="396" width="190" height="92" fill="#ffffff" stroke="#7d4ea8" stroke-width="1.2" rx="4"/>
<text x="588" y="420" font-size="13">分支发散；同批 token</text>
<text x="588" y="441" font-size="13">走不同深度，批量凑</text>
<text x="588" y="462" font-size="13">不齐</text>
<line x1="772" y1="442.0" x2="787" y2="442.0" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="790" y="396" width="150" height="92" fill="#e6dcf2" stroke="#7d4ea8" stroke-width="2" rx="4"/>
<text x="865.0" y="447.0" font-size="13" font-weight="bold" text-anchor="middle">全栈的折损系数</text>
<text x="20" y="542" font-size="13" fill="#555">杠杆从大到小：结构 &gt; 形状 &gt; 精度 &gt; 动态性。越靠上游的一行字，下游越要花大力气补救。</text>
</svg>