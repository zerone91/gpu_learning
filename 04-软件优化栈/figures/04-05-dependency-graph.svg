<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aaa"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<text x="20" y="30" font-size="17" font-weight="bold">dot4_relu 的数据依赖图：箭头表示"后者要用前者的结果"</text>
<rect x="300" y="55" width="360" height="44" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="480" y="83" text-anchor="middle">地址计算：i → 4i → a、b 的起始地址</text>
<line x1="480" y1="99" x2="90" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="480" y1="99" x2="170" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="480" y1="99" x2="290" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="480" y1="99" x2="370" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="480" y1="99" x2="490" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="480" y1="99" x2="570" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="480" y1="99" x2="690" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="480" y1="99" x2="770" y2="169" stroke="#aaa" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="56" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="90" y="196" text-anchor="middle">读 a0</text>
<rect x="136" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="170" y="196" text-anchor="middle">读 b0</text>
<rect x="256" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="290" y="196" text-anchor="middle">读 a1</text>
<rect x="336" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="370" y="196" text-anchor="middle">读 b1</text>
<rect x="456" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="490" y="196" text-anchor="middle">读 a2</text>
<rect x="536" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="570" y="196" text-anchor="middle">读 b2</text>
<rect x="656" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="690" y="196" text-anchor="middle">读 a3</text>
<rect x="736" y="170" width="68" height="40" rx="4" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="770" y="196" text-anchor="middle">读 b3</text>
<rect x="44" y="163" width="780" height="54" rx="8" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="7,4"/>
<text x="836" y="186" fill="#2e8b57" font-size="14">8 次读取</text>
<text x="836" y="206" fill="#2e8b57" font-size="14">彼此无连线</text>
<rect x="78" y="308" width="104" height="44" rx="4" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="130" y="328" text-anchor="middle" font-size="14">乘</text>
<text x="130" y="345" text-anchor="middle" font-size="13">a0×b0</text>
<line x1="90" y1="210" x2="112" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="170" y1="210" x2="148" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="278" y="308" width="104" height="44" rx="4" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="330" y="328" text-anchor="middle" font-size="14">乘加</text>
<text x="330" y="345" text-anchor="middle" font-size="13">+a1×b1</text>
<line x1="290" y1="210" x2="312" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="370" y1="210" x2="348" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="182" y1="330" x2="276" y2="330" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<rect x="478" y="308" width="104" height="44" rx="4" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="530" y="328" text-anchor="middle" font-size="14">乘加</text>
<text x="530" y="345" text-anchor="middle" font-size="13">+a2×b2</text>
<line x1="490" y1="210" x2="512" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="570" y1="210" x2="548" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="382" y1="330" x2="476" y2="330" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<rect x="678" y="308" width="104" height="44" rx="4" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="730" y="328" text-anchor="middle" font-size="14">乘加</text>
<text x="730" y="345" text-anchor="middle" font-size="13">+a3×b3</text>
<line x1="690" y1="210" x2="712" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="770" y1="210" x2="748" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="582" y1="330" x2="676" y2="330" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<rect x="678" y="400" width="104" height="40" rx="4" fill="#fde2c4" stroke="#d9822b" stroke-width="1.5"/>
<text x="730" y="426" text-anchor="middle" font-size="14">max(·, 0)</text>
<line x1="730" y1="352" x2="730" y2="398" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<rect x="678" y="470" width="104" height="40" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="730" y="496" text-anchor="middle" font-size="14">写 y[i]</text>
<line x1="730" y1="440" x2="730" y2="468" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<text x="60" y="410" fill="#c0392b" font-size="14">红色是一条串行链：每一步都要用上一步的累加结果，</text>
<text x="60" y="430" fill="#c0392b" font-size="14">它们的先后次序不能调换</text>
<text x="60" y="470" fill="#2e8b57" font-size="14">绿框里的 8 次读取只依赖地址，互相之间没有箭头：</text>
<text x="60" y="490" fill="#2e8b57" font-size="14">谁先谁后都不影响结果，所以编译器可以把它们全部提前</text>
<text x="60" y="520" fill="#555" font-size="14">唯一的约束：每个读取必须排在用到它的那个乘加之前</text>
</svg>