<text x="235" y="66" font-size="16" text-anchor="middle" fill="#c77a12" font-weight="bold">调度一：朴素三重循环，不切块</text>
<text x="715" y="66" font-size="16" text-anchor="middle" fill="#2f6db5" font-weight="bold">调度二：切成 512×512 的块</text>
