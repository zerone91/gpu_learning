<rect x="174.0" y="370" width="38" height="44" rx="0" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
<text x="193.0" y="397" font-size="14" text-anchor="middle" fill="#222222">t3</text>
<text x="327.0" y="397" font-size="16" text-anchor="middle" fill="#222222">…</text>
<rect x="426.8" y="370" width="53.199999999999996" height="44" rx="0" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
<text x="453.40000000000003" y="397" font-size="14" text-anchor="middle" fill="#222222">t127</text>
<text x="270.0" y="434" font-size="14" text-anchor="middle" fill="#444444">元素 0 … 511：每格 4 个相邻元素</text>
<rect x="480.0" y="370" width="420.0" height="44" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<rect x="480.0" y="370" width="38" height="44" rx="0" fill="#f8e8cf" stroke="#c77a12" stroke-width="1.5"/>
<text x="499.0" y="397" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">t0</text>
<rect x="518.0" y="370" width="38" height="44" rx="0" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
<text x="537.0" y="397" font-size="14" text-anchor="middle" fill="#222222">t1</text>
<rect x="556.0" y="370" width="38" height="44" rx="0" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
<text x="575.0" y="397" font-size="14" text-anchor="middle" fill="#222222">t2</text>
<rect x="594.0" y="370" width="38" height="44" rx="0" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
<text x="613.0" y="397" font-size="14" text-anchor="middle" fill="#222222">t3</text>
<text x="747.0" y="397" font-size="16" text-anchor="middle" fill="#222222">…</text>
<rect x="846.8" y="370" width="53.199999999999996" height="44" rx="0" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
<text x="873.4" y="397" font-size="14" text-anchor="middle" fill="#222222">t127</text>
<text x="690.0" y="434" font-size="14" text-anchor="middle" fill="#444444">元素 512 … 1023：每格 4 个相邻元素</text>
<line x1="79" y1="414" x2="79" y2="470" stroke="#c77a12" stroke-width="1.5"/>
<line x1="499.0" y1="414" x2="499.0" y2="470" stroke="#c77a12" stroke-width="1.5"/>
<line x1="79" y1="470" x2="499.0" y2="470" stroke="#c77a12" stroke-width="1.5"/>
<text x="90" y="492" font-size="14" text-anchor="start" fill="#c77a12">线程 t0 拿到元素 0～3 和 512～515 两段：每段 4 个 fp32 = 16 字节，用一条 128 位宽的加载指令一次读完</text>
<text x="40" y="540" font-size="14" text-anchor="start" fill="#444444">对照 CUDA 版：同样的 1024 个元素，那里要你写 threadIdx、自己决定每线程几个元素、自己写 if 防越界；</text>
<text x="40" y="562" font-size="14" text-anchor="start" fill="#444444">这里三件事都不出现在源码里。代价是你也无法指定它们——换个 Triton 版本，分法可能变。</text>
</svg>
