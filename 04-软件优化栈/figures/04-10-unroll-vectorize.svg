<text x="30" y="276" font-size="14" text-anchor="start" fill="#444444">不展开：每次迭代都要从头等一遍 L，4 次共 96 个单位。展开后 4 个读背靠背发出，一起等一次，共 30 个单位；</text>
<text x="30" y="298" font-size="14" text-anchor="start" fill="#444444">判断跳转也从 4 次减到 1 次。前提是这 4 次迭代之间没有依赖——第 2 个读不需要等第 1 个的结果。</text>
