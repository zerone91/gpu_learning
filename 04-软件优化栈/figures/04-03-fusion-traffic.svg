<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77a12"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker></defs>
<text x="480" y="30" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">y = relu(x + b)：融合前后的显存流量（x 有一亿个 bf16 元素，约 200 MB）</text>
<text x="240" y="66" font-size="16" text-anchor="middle" fill="#c77a12" font-weight="bold">融合前：两个 kernel</text>
<rect x="30" y="90" width="420" height="110" rx="6" fill="#fbfbfb" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="40" y="108" font-size="13" text-anchor="start" fill="#777777">GPU 芯片（计算单元、寄存器）</text>
<rect x="30" y="300" width="420" height="70" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="240" y="320" font-size="13" text-anchor="middle" fill="#444">显存（HBM）</text>
<rect x="60" y="124" width="150" height="56" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="135.0" y="157" font-size="14" text-anchor="middle" fill="#222222">加法 kernel</text>
<rect x="270" y="124" width="150" height="56" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="345.0" y="157" font-size="14" text-anchor="middle" fill="#222222">relu kernel</text>
<rect x="56.0" y="332" width="68" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="90" y="352" font-size="13" text-anchor="middle" fill="#222222">x</text>
<rect x="165.0" y="332" width="150" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="240" y="352" font-size="13" text-anchor="middle" fill="#222222">tmp</text>
<rect x="356.0" y="332" width="68" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="390" y="352" font-size="13" text-anchor="middle" fill="#222222">y</text>
<line x1="90" y1="330" x2="90" y2="184" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<text x="98" y="256" font-size="12" text-anchor="start" fill="#c0392b">读 x</text>
<line x1="180" y1="180" x2="180" y2="328" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<text x="172" y="256" font-size="12" text-anchor="end" fill="#c0392b">写 tmp</text>
<line x1="300" y1="330" x2="300" y2="184" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<text x="308" y="256" font-size="12" text-anchor="start" fill="#c0392b">读 tmp</text>
<line x1="390" y1="180" x2="390" y2="328" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<text x="382" y="256" font-size="12" text-anchor="end" fill="#c0392b">写 y</text>
<text x="240" y="402" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">4 × 200 MB = 800 MB</text>
<text x="720" y="66" font-size="16" text-anchor="middle" fill="#2f6db5" font-weight="bold">融合后：一个 kernel</text>
<rect x="510" y="90" width="420" height="110" rx="6" fill="#fbfbfb" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="520" y="108" font-size="13" text-anchor="start" fill="#777777">GPU 芯片（计算单元、寄存器）</text>
<rect x="510" y="300" width="420" height="70" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="720" y="320" font-size="13" text-anchor="middle" fill="#444">显存（HBM）</text>
<rect x="570" y="124" width="300" height="56" rx="6" fill="#dbe7f5" stroke="#2f6db5" stroke-width="2"/>
<text x="720.0" y="157" font-size="14" text-anchor="middle" fill="#222222">加法 + relu（中间值留在寄存器）</text>
<rect x="566.0" y="332" width="68" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="600" y="352" font-size="13" text-anchor="middle" fill="#222222">x</text>
<rect x="806.0" y="332" width="68" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="840" y="352" font-size="13" text-anchor="middle" fill="#222222">y</text>
<line x1="600" y1="330" x2="600" y2="184" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<text x="608" y="256" font-size="12" text-anchor="start" fill="#c0392b">读 x</text>
<line x1="840" y1="180" x2="840" y2="328" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
<text x="832" y="256" font-size="12" text-anchor="end" fill="#c0392b">写 y</text>
<text x="720" y="402" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">2 × 200 MB = 400 MB</text>
<text x="480" y="445" font-size="14" text-anchor="middle" fill="#444">红色箭头是每一次整张量在显存与芯片之间的往返；融合删掉的正是中间结果 tmp 那一写一读</text>
</svg>
